<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess the Image</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg-0:#0d0d14;
    --bg-1:#15151f;
    --bg-2:#1c1c29;
    --accent:#7c5cff;
    --accent-2:#4fd1c5;
    --correct:#39d98a;
    --wrong:#ff5c7c;
    --text:#e8e8f0;
    --text-dim:#9494a8;
    --border:#2a2a3a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
      var(--bg-0);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:520px;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  h1{
    font-size:1.4rem;
    margin:0;
    letter-spacing:0.5px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .stats{
    font-size:0.85rem;
    color:var(--text-dim);
    text-align:right;
  }
  .stats span{color:var(--accent-2); font-weight:600;}
  .timer-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }
  .timer-bar{
    flex:1;
    height:8px;
    background:var(--bg-2);
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .timer-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg, var(--accent-2), var(--accent));
    transition:width 1s linear, background 0.3s ease;
  }
  .timer-fill.low{
    background:var(--wrong);
  }
  .timer-num{
    font-size:0.85rem;
    color:var(--text-dim);
    min-width:28px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .timer-num.low{
    color:var(--wrong);
    font-weight:700;
  }
  .progress-bar{
    height:6px;
    width:100%;
    background:var(--bg-2);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:20px;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    width:0%;
    transition:width 0.4s ease;
  }
  .card{
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .image-frame{
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    height:280px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .image-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .question{
    text-align:center;
    color:var(--text-dim);
    margin:0 0 16px;
    font-size:0.95rem;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .choice-btn{
    background:var(--bg-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 10px;
    border-radius:10px;
    font-size:0.95rem;
    cursor:pointer;
    transition:all 0.15s ease;
    text-align:center;
  }
  .choice-btn:hover:not(:disabled){
    border-color:var(--accent);
    background:#22223280;
    transform:translateY(-1px);
  }
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{
    background:rgba(57,217,138,0.15);
    border-color:var(--correct);
    color:var(--correct);
  }
  .choice-btn.wrong{
    background:rgba(255,92,124,0.15);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .feedback{
    min-height:22px;
    text-align:center;
    margin-top:16px;
    font-weight:600;
    font-size:0.95rem;
  }
  .feedback.correct-text{color:var(--correct);}
  .feedback.wrong-text{color:var(--wrong);}
  .next-btn{
    margin-top:14px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#0d0d14;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    display:none;
  }
  .next-btn:hover{filter:brightness(1.08);}
  .result-screen{
    text-align:center;
    padding:30px 10px;
  }
  .result-screen h2{
    font-size:1.6rem;
    margin-bottom:6px;
  }
  .result-screen p{
    color:var(--text-dim);
    margin-bottom:20px;
  }
  .restart-btn{
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#0d0d14;
    font-weight:700;
    cursor:pointer;
    font-size:0.95rem;
  }
  .big-score{
    font-size:2.6rem;
    font-weight:800;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:6px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Guess the Image</h1>
    <div class="stats">Round <span id="roundNum">1</span>/<span id="totalRounds">4</span><br>Score: <span id="scoreNum">0</span></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="gameCard">
    <div class="timer-wrap" id="timerWrap">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="timer-num" id="timerNum">10</div>
    </div>
    <div class="image-frame" id="imageFrame"></div>
    <p class="question">What does this image show?</p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next →</button>
  </div>
</div>

<script>
// --- Round data: each has a real embedded photo + correct label + distractors ---
const rounds = [
  {
    label: "Birthday Dog",
    distractors: ["Party Cat", "Sunglasses Bunny", "Costume Hamster"],
    image: "images/dog.jpg"
  },
  {
    label: "Happy Leaf",
    distractors: ["Smiling Pumpkin", "Autumn Acorn", "Painted Pinecone"],
    image: "images/leaf.jpg"
  },
  {
    label: "Cool Sunflower",
    distractors: ["Shady Daisy", "Rose with Shades", "Tulip in Sunglasses"],
    image: "images/flower.jpg"
  },
  {
    label: "Doctor Duck",
    distractors: ["Scientist Swan", "Professor Penguin", "Nurse Goose"],
    image: "images/duck.jpg"
  },
]

let order = [];
let current = 0;
let score = 0;

const TIME_LIMIT = 10; // seconds per round
let timeLeft = TIME_LIMIT;
let timerInterval = null;

// Original in-game card markup, saved so we can restore it after the results screen replaces it
const GAME_CARD_TEMPLATE = `
    <div class="timer-wrap" id="timerWrap">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="timer-num" id="timerNum">10</div>
    </div>
    <div class="image-frame" id="imageFrame"></div>
    <p class="question">What does this image show?</p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next →</button>
`;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function init(){
  // Restore the original game layout in case we're coming from the results screen
  document.getElementById('gameCard').innerHTML = GAME_CARD_TEMPLATE;
  document.getElementById('nextBtn').addEventListener('click', goToNextRound);

  order = shuffle(rounds);
  current = 0;
  score = 0;
  document.getElementById('totalRounds').textContent = order.length;
  renderRound();
}

function goToNextRound(){
  current++;
  if(current >= order.length){
    showResults();
  } else {
    renderRound();
  }
}

function renderRound(){
  const round = order[current];
  document.getElementById('roundNum').textContent = current + 1;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('progressFill').style.width = ((current)/order.length*100) + '%';

  document.getElementById('imageFrame').innerHTML = '<img src="' + round.image + '" alt="Guess this image">';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  const options = shuffle([round.label, ...round.distractors]);
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, round.label, btn);
    choicesEl.appendChild(btn);
  });

  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const fill = document.getElementById('timerFill');
  const num = document.getElementById('timerNum');
  const pct = Math.max(0, (timeLeft / TIME_LIMIT) * 100);
  fill.style.width = pct + '%';
  num.textContent = timeLeft;
  const low = timeLeft <= 3;
  fill.classList.toggle('low', low);
  num.classList.toggle('low', low);
}

function handleTimeout(){
  const round = order[current];
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => {
    b.disabled = true;
    if(b.textContent === round.label) b.classList.add('correct');
  });
  const feedback = document.getElementById('feedback');
  feedback.textContent = "Time's up! It's " + round.label + ".";
  feedback.className = 'feedback wrong-text';
  document.getElementById('nextBtn').style.display = 'block';
}

function selectAnswer(selected, correctLabel, btnEl){
  clearInterval(timerInterval);
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => {
    b.disabled = true;
    if(b.textContent === correctLabel) b.classList.add('correct');
  });

  const feedback = document.getElementById('feedback');
  if(selected === correctLabel){
    score++;
    feedback.textContent = "Correct! 🎉";
    feedback.className = 'feedback correct-text';
  } else {
    btnEl.classList.add('wrong');
    feedback.textContent = "Not quite — it's " + correctLabel + ".";
    feedback.className = 'feedback wrong-text';
  }
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('nextBtn').style.display = 'block';
}

function showResults(){
  clearInterval(timerInterval);
  document.getElementById('progressFill').style.width = '100%';
  const pct = Math.round((score/order.length)*100);
  let msg = "Nice try — go again?";
  if(pct === 100) msg = "Perfect score! 🌟";
  else if(pct >= 70) msg = "Great job! 👏";
  else if(pct >= 40) msg = "Not bad — try again!";

  document.getElementById('gameCard').innerHTML = `
    <div class="result-screen">
      <div class="big-score">${score}/${order.length}</div>
      <h2>${msg}</h2>
      <p>You guessed ${pct}% of the images correctly.</p>
      <button class="restart-btn" id="restartBtn">Play Again</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', init);
}

init();
</script>
</body>
</html>
