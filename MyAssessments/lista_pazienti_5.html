            // A global tracker variable to protect against aggressive database render loops

            function updateUserAvatar(userGender) {
                
                const avatarImg1 = document.getElementById('profileAvatar1');
                const spinnerIcon1 = document.getElementById('avatarSpinnerIcon1');
                const container1 = document.getElementById('avatarContainer1');

                if (!avatarImg1 || !spinnerIcon1) return;

                // 1. Process and sanitize input values
                let targetSrc1 = 'assets/sb-admin-2/img/undraw_profile.svg';

                if (userGender === 'Femminile') {
                    targetSrc1 = 'assets/img/registrazione/terapeuta-female.png';
                } else if (userGender === 'Maschile') {
                    targetSrc1 = 'assets/img/registrazione/terapeuta-male.png';
                }

                // 2. Assign source asset
                avatarImg1.src = targetSrc1;

                // 3. Clear placeholder settings and render image node
                spinnerIcon1.classList.add('d-none');     // Permanently hide the spinner element
                avatarImg1.classList.remove('d-none');   // Force show the newly assigned image layout
                
                if (container1) {
                    container1.classList.remove('bg-light', 'p-1'); // Clean up temporary loading borders
                }

            }

      /**
       * calculateRowsPerPage
       */

      function calculateRowsPerPage() {
        // 1. Ensure first row is shown to measure actual rendered height
        $allRows.hide();
        $allRows.first().show();
        
        // Measure single row height including borders
        const rowHeight = $allRows.first().outerHeight() || 53;

        // 2. Measure card top offset relative to viewport
        const $cardContainer = $('#tableCardContainer');
        const cardTopOffset = $cardContainer.offset().top || 0;
        const windowHeight = $(window).height() || 0;

        // 3. Measure UI headers, footers & paddings
        const cardHeaderHeight = $('#tableCardContainer .card-header').outerHeight() || 55;
        const theadHeight = $('#userTable thead').outerHeight() || 40;
        const paginationFooterHeight = $('#tableCardContainer .row.align-items-center').outerHeight() || 50;
        
        // Outer margins & inner padding buffers
        const bottomMarginBuffer = 130; // Spacing at bottom of screen
        const cardBodyPadding = 30;    // Vertical padding inside card-body
        const tableBorderBuffer = 8;   // <--- Safety buffer for table borders & padding precision

        // 4. Calculate total occupied height before tbody rows
        const occupiedSpace = cardTopOffset + cardHeaderHeight + theadHeight + paginationFooterHeight + cardBodyPadding + bottomMarginBuffer + tableBorderBuffer;

        // 5. Calculate net available space strictly for table rows
        const availableTbodySpace = windowHeight - occupiedSpace;

        // 6. Calculate fitting rows with integer safety guard
        const calculatedCount = Math.floor(availableTbodySpace / rowHeight);

        return Math.max(1, calculatedCount);
      }

      /**
       * displayPage
       */

      function displayPage(page, animate = true) {
        currentPage = page;
        const start = (page - 1) * rowsPerPage;
        const end = start + rowsPerPage;

        if (animate) {
          $tableContainer.addClass('table-fade-out');
          setTimeout(function() {
            $allRows.hide();
            $filteredRows.slice(start, end).show();
            updateInfoAndPagination(start, end);
            $tableContainer.removeClass('table-fade-out');
          }, 200);
        } else {
          $allRows.hide();
          $filteredRows.slice(start, end).show();
          updateInfoAndPagination(start, end);
        }
      }

      /**
       * updateInfoAndPagination
       */

      function updateInfoAndPagination(start, end) {
        const totalFiltered = $filteredRows.length;
        const showingStart = totalFiltered === 0 ? 0 : start + 1;
        const showingEnd = Math.min(end, totalFiltered);
        $('#paginationInfo').text(`Da ${showingStart} a ${showingEnd} di${totalFiltered} Pazienti`);
        renderPagination();

      /**

        const totalFiltered = $filteredRows.length;
        totalPages = Math.ceil(totalFiltered / rowsPerPage) || 1;

        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        paginationHTML += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" data-page="${currentPage - 1}">Precedente</a></li>`;

        for (let i = 1; i <= totalPages; i++) {
          const activeClass = i === currentPage ? 'active' : '';
          paginationHTML += `<li class="page-item ${activeClass}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }

        const nextDisabled = currentPage === totalPages || totalPages === 0 ? 'disabled' : '';

        $('#paginationControls').html(paginationHTML);

      function recalculateLayout() {
        rowsPerPage = calculateRowsPerPage();
