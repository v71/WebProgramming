<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build the Sentence</title>
    <style>
        :root {
            --bg-0: #0d0d14;
            --bg-1: #15151f;
            --bg-2: #1c1c29;
            --accent: #7c5cff;
            --accent-2: #4fd1c5;
            --correct: #39d98a;
            --wrong: #ff5c7c;
            --text: #e8e8f0;
            --text-dim: #9494a8;
            --border: #2a2a3a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 24px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1100px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            text-align: center;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #game-stats {
            margin: -2px 0 16px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        #game-stats strong {
            color: var(--accent-2);
            font-weight: 600;
        }

        /* Round progress bar */
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .progress-row strong {
            color: var(--accent-2);
            font-weight: 600;
        }

        .progress-bar {
            height: 6px;
            width: 100%;
            background: var(--bg-2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            width: 0%;
            transition: width 0.4s ease;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #0d0d14;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s ease;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button.secondary-btn {
            background: transparent;
            color: var(--accent-2);
            border: 1px solid var(--border);
        }

        button.secondary-btn:hover {
            filter: none;
            border-color: var(--accent-2);
        }

        /* Next/Done button: space is always reserved (visibility, not
           display) so the layout doesn't jump when it appears. Sits
           inline next to the Reveal button rather than as a full-width
           block below the sections. */
        #next-btn {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        #next-btn.visible {
            visibility: visible;
            opacity: 1;
        }

        .section-wrapper {
            width: 100%;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Shared container language for word bank + sentence target */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            min-height: clamp(80px, 12vh, 120px);
            padding: 20px;
            border-radius: 16px;
            align-items: center;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        #word-bank {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background-color: var(--bg-2);
        }

        #target-container {
            border: 2px dashed var(--accent);
            background-color: var(--bg-1);
        }

        .card-container.drag-container-over {
            border-color: var(--accent-2);
            background-color: rgba(79, 209, 197, 0.06);
        }

        /* Draggable word chip */
        .card {
            background-color: var(--bg-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, transform 0.1s, background-color 0.15s;
            touch-action: none;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .card:active {
            cursor: grabbing;
        }

        .card.dragging {
            opacity: 0.3;
        }

        .card.word-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Reveal — swaps the target zone's content rather than
           overlaying it, so it can never be clipped regardless of how
           many words wrap onto extra lines. */
        .reveal-hidden {
            display: none !important;
        }

        .card.word-card.reveal-word {
            border-color: var(--correct);
            background-color: rgba(57, 217, 138, 0.15);
            color: var(--correct);
            cursor: default;
            box-shadow: none;
        }

        /* Status feedback */
        #status-message {
            margin-top: 4px;
            margin-bottom: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        #status-message.correct-text {
            color: var(--correct);
        }

        #status-message.wrong-text {
            color: var(--wrong);
        }

        /* ---------------- Report screen ---------------- */
        .report-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .report-card h2 {
            font-size: 1.6rem;
            margin: 0 0 6px;
        }

        .report-card > p.subtitle {
            color: var(--text-dim);
            margin: 0 0 24px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .summary-cell {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 10px;
        }

        .summary-cell .value {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .summary-cell .label {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .summary-cell.secondary .value {
            font-size: 1.15rem;
            background: none;
            -webkit-text-fill-color: initial;
            color: var(--accent-2);
        }

        table.round-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        table.round-table th,
        table.round-table td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        table.round-table th {
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        table.round-table td.sentence-cell {
            text-align: left;
            color: var(--text-dim);
            max-width: 260px;
        }

        .restart-btn {
            padding: 12px 24px;
        }
    </style>
</head>
<body>

<div class="page">
    <h1>Build the Sentence</h1>

    <div id="game-area">
        <div id="game-stats">
            <span>Time: <strong id="time-value">0s</strong></span>
            <span>Moves: <strong id="moves-value">0</strong></span>
            <span>Reveals: <strong id="reveals-value">0</strong></span>
        </div>

        <div class="progress-row">
            <span>Round</span>
            <span><strong id="progress-ratio">1/5</strong></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

        <div class="controls">
            <button id="next-btn">Next Round →</button>
            <button id="reveal-btn" class="secondary-btn">Hold to Reveal Sentence</button>
        </div>

        <div id="status-message"></div>

        <div class="section-wrapper">
            <div class="section-title">Word Bank (Shuffled)</div>
            <div id="word-bank" class="card-container"></div>
        </div>

        <div class="section-wrapper">
            <div class="section-title">Your Sentence</div>
            <div id="target-container" class="card-container"></div>
            <div id="reveal-row" class="card-container reveal-hidden"></div>
        </div>
    </div>
</div>

    <script>
        const gameArea = document.getElementById('game-area');
        // Snapshot of the original game-area markup, captured once at
        // load, so a restart can rebuild it exactly (same technique used
        // to fix the "Play Again doesn't work" bug in the earlier games:
        // never reference stale DOM nodes after a full innerHTML replace
        // — always rebuild from this template, then re-query + re-bind).
        const GAME_AREA_TEMPLATE = gameArea.innerHTML;

        /* -----------------------------------------------------------
           The rounds are set here, in code — not from a visible input
           field — so no answer is ever shown to the player except via
           the intentional Reveal button. A host platform can generate
           this array dynamically (per lesson/student) instead of
           hard-coding it here.
        ----------------------------------------------------------- */
        const PUZZLE_ROUNDS = [
            "The quick brown fox jumps over the lazy dog.",
            "She sells seashells by the seashore.",
            "A journey of a thousand miles begins with a single step.",
            "Practice makes perfect every single day.",
            "The early bird catches the worm."
        ];

        // Elements — re-queried by setupGameArea() every time the
        // game-area markup is (re)built, so these are always current.
        let wordBank, targetContainer, revealRow, statusMessage;
        let timeValueEl, movesValueEl, revealsValueEl;
        let progressRatioEl, progressFillEl, revealBtn, nextBtn;

        let currentRoundIndex = 0;
        let originalWords = [];
        let draggedCard = null;
        let roundSolved = false;

        // Per-round tracking, reset at the start of every round
        let roundElapsedSeconds = 0;
        let roundTimerInterval = null;
        let roundMoveCount = 0;
        let roundRevealCount = 0;

        // Collected once per round, on completion — the source for the
        // end-of-game report.
        let roundStats = [];

        function setupGameArea() {
            gameArea.innerHTML = GAME_AREA_TEMPLATE;

            wordBank = document.getElementById('word-bank');
            targetContainer = document.getElementById('target-container');
            revealRow = document.getElementById('reveal-row');
            statusMessage = document.getElementById('status-message');
            timeValueEl = document.getElementById('time-value');
            movesValueEl = document.getElementById('moves-value');
            revealsValueEl = document.getElementById('reveals-value');
            progressRatioEl = document.getElementById('progress-ratio');
            progressFillEl = document.getElementById('progress-fill');
            revealBtn = document.getElementById('reveal-btn');
            nextBtn = document.getElementById('next-btn');

            [wordBank, targetContainer].forEach(container => {
                container.addEventListener('dragover', (e) => e.preventDefault());
                container.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    container.classList.add('drag-container-over');
                });
                container.addEventListener('dragleave', (e) => {
                    if (e.target === container) container.classList.remove('drag-container-over');
                });
                container.addEventListener('drop', (e) => {
                    e.preventDefault();
                    container.classList.remove('drag-container-over');
                    if (draggedCard && e.target === container) {
                        container.appendChild(draggedCard);
                        registerMove();
                        checkArrangement();
                    }
                });
            });

            revealBtn.addEventListener('mousedown', showReveal);
            revealBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                showReveal();
            }, { passive: false });

            nextBtn.addEventListener('click', handleNextClick);
        }

        // Document-level listeners — bound exactly once. They read
        // module-level `let` variables at call time, so they always see
        // whichever elements are currently live, even after a rebuild.
        document.addEventListener('dragover', (e) => {
            if (e.target.classList && e.target.classList.contains('card')) {
                e.preventDefault();
            }
        });
        document.addEventListener('drop', (e) => {
            if (e.target.classList && e.target.classList.contains('card') && draggedCard) {
                e.preventDefault();
                const targetCard = e.target;
                const targetParent = targetCard.parentNode;
                if (draggedCard !== targetCard) {
                    const allCards = [...targetParent.querySelectorAll('.card')];
                    const draggedPos = allCards.indexOf(draggedCard);
                    const targetPos = allCards.indexOf(targetCard);
                    if (draggedPos === -1 || draggedPos < targetPos) {
                        targetParent.insertBefore(draggedCard, targetCard.nextSibling);
                    } else {
                        targetParent.insertBefore(draggedCard, targetCard);
                    }
                    registerMove();
                    checkArrangement();
                }
            }
        });
        document.addEventListener('mouseup', hideReveal);
        document.addEventListener('touchend', hideReveal);
        document.addEventListener('touchcancel', hideReveal);

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function createWordCard(word) {
            const card = document.createElement('div');
            card.className = 'card word-card';
            card.textContent = word;
            card.dataset.word = word;
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', () => {
                draggedCard = card;
                setTimeout(() => card.classList.add('dragging'), 0);
            });
            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                draggedCard = null;
                document.querySelectorAll('.card-container').forEach(c => c.classList.remove('drag-container-over'));
            });
            return card;
        }

        function startRoundTimer() {
            stopRoundTimer();
            roundElapsedSeconds = 0;
            updateTimeDisplay();
            roundTimerInterval = setInterval(() => {
                roundElapsedSeconds++;
                updateTimeDisplay();
            }, 1000);
        }
        function stopRoundTimer() {
            if (roundTimerInterval) {
                clearInterval(roundTimerInterval);
                roundTimerInterval = null;
            }
        }
        function updateTimeDisplay() {
            timeValueEl.textContent = roundElapsedSeconds + 's';
        }
        function updateMovesDisplay() {
            movesValueEl.textContent = roundMoveCount;
        }
        function updateRevealsDisplay() {
            revealsValueEl.textContent = roundRevealCount;
        }
        function registerMove() {
            if (roundSolved) return;
            roundMoveCount++;
            updateMovesDisplay();
        }
        function updateProgress() {
            progressRatioEl.textContent = (currentRoundIndex + 1) + '/' + PUZZLE_ROUNDS.length;
            progressFillEl.style.width = (currentRoundIndex / PUZZLE_ROUNDS.length * 100) + '%';
        }

        function initializeRound(index) {
            currentRoundIndex = index;
            roundSolved = false;
            roundMoveCount = 0;
            roundRevealCount = 0;
            updateMovesDisplay();
            updateRevealsDisplay();
            startRoundTimer();
            updateProgress();

            nextBtn.textContent = (index === PUZZLE_ROUNDS.length - 1) ? 'Done' : 'Next Round →';
            nextBtn.classList.remove('visible');

            wordBank.innerHTML = '';
            targetContainer.innerHTML = '';
            revealRow.innerHTML = '';
            statusMessage.textContent = '';
            statusMessage.className = '';

            originalWords = PUZZLE_ROUNDS[index].split(' ');
            const shuffledWords = shuffleArray(originalWords);
            shuffledWords.forEach(word => wordBank.appendChild(createWordCard(word)));

            originalWords.forEach(word => {
                const chip = document.createElement('div');
                chip.className = 'card word-card reveal-word';
                chip.textContent = word;
                revealRow.appendChild(chip);
            });

            checkArrangement();
        }

        function checkArrangement() {
            const targetCards = [...targetContainer.querySelectorAll('.card')];
            const currentWords = targetCards.map(card => card.dataset.word);
            const currentSentence = currentWords.join(' ');
            const originalSentence = originalWords.join(' ');

            if (targetCards.length === 0) {
                statusMessage.className = 'wrong-text';
                statusMessage.textContent = 'Drag words here to start building the sentence.';
                return;
            }

            if (currentWords.length < originalWords.length) {
                statusMessage.className = '';
                statusMessage.textContent = '';
                return;
            }

            if (currentSentence === originalSentence) {
                statusMessage.className = 'correct-text';
                statusMessage.textContent = 'Success! The sentence is in the right order!';

                if (!roundSolved) {
                    roundSolved = true;
                    stopRoundTimer();
                    roundStats.push({
                        round: currentRoundIndex + 1,
                        sentence: PUZZLE_ROUNDS[currentRoundIndex],
                        timeSeconds: roundElapsedSeconds,
                        moves: roundMoveCount,
                        reveals: roundRevealCount
                    });
                    nextBtn.classList.add('visible');
                }
            } else {
                statusMessage.className = 'wrong-text';
                statusMessage.textContent = 'All words are placed, but not in the right order yet.';
            }
        }

        // Reveal: swaps the target zone's real (draggable) words out for
        // a static, correctly-ordered green row, only while the button
        // is actively pressed. Each press (not each second held) counts
        // as one reveal use toward this round's stats.
        function showReveal() {
            if (!roundSolved) {
                roundRevealCount++;
                updateRevealsDisplay();
            }
            targetContainer.classList.add('reveal-hidden');
            revealRow.classList.remove('reveal-hidden');
        }
        function hideReveal() {
            targetContainer.classList.remove('reveal-hidden');
            revealRow.classList.add('reveal-hidden');
        }

        function handleNextClick() {
            if (currentRoundIndex < PUZZLE_ROUNDS.length - 1) {
                initializeRound(currentRoundIndex + 1);
            } else {
                showReport();
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showReport() {
            stopRoundTimer();

            const totalRounds = roundStats.length;
            const totalTime = roundStats.reduce((sum, r) => sum + r.timeSeconds, 0);
            const totalMoves = roundStats.reduce((sum, r) => sum + r.moves, 0);
            const totalReveals = roundStats.reduce((sum, r) => sum + r.reveals, 0);
            const avgTime = totalRounds ? (totalTime / totalRounds).toFixed(1) : 0;
            const avgMoves = totalRounds ? (totalMoves / totalRounds).toFixed(1) : 0;
            const avgReveals = totalRounds ? (totalReveals / totalRounds).toFixed(1) : 0;

            // Exposed for a host platform to read once the game finishes.
            window.sentenceGameReport = {
                roundStats,
                totals: { time: totalTime, moves: totalMoves, reveals: totalReveals },
                averages: { time: Number(avgTime), moves: Number(avgMoves), reveals: Number(avgReveals) }
            };
            console.log('Game report:', window.sentenceGameReport);

            const rowsHtml = roundStats.map(r => `
                <tr>
                    <td>${r.round}</td>
                    <td class="sentence-cell">${escapeHtml(r.sentence)}</td>
                    <td>${r.timeSeconds}s</td>
                    <td>${r.moves}</td>
                    <td>${r.reveals}</td>
                </tr>
            `).join('');

            gameArea.innerHTML = `
                <div class="report-card">
                    <h2>All Rounds Complete! 🎉</h2>
                    <p class="subtitle">${totalRounds} of ${PUZZLE_ROUNDS.length} sentences solved</p>

                    <div class="summary-grid">
                        <div class="summary-cell">
                            <div class="value">${totalTime}s</div>
                            <div class="label">Total Time</div>
                        </div>
                        <div class="summary-cell">
                            <div class="value">${totalMoves}</div>
                            <div class="label">Total Moves</div>
                        </div>
                        <div class="summary-cell">
                            <div class="value">${totalReveals}</div>
                            <div class="label">Total Reveals</div>
                        </div>
                        <div class="summary-cell secondary">
                            <div class="value">${avgTime}s</div>
                            <div class="label">Avg Time / Round</div>
                        </div>
                        <div class="summary-cell secondary">
                            <div class="value">${avgMoves}</div>
                            <div class="label">Avg Moves / Round</div>
                        </div>
                        <div class="summary-cell secondary">
                            <div class="value">${avgReveals}</div>
                            <div class="label">Avg Reveals / Round</div>
                        </div>
                    </div>

                    <table class="round-table">
                        <thead>
                            <tr>
                                <th>Round</th>
                                <th>Sentence</th>
                                <th>Time</th>
                                <th>Moves</th>
                                <th>Reveals</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>

                    <button class="restart-btn" id="restart-btn">Play Again</button>
                </div>
            `;
            document.getElementById('restart-btn').addEventListener('click', () => {
                roundStats = [];
                setupGameArea();
                initializeRound(0);
            });
        }

        // Initial load
        setupGameArea();
        initializeRound(0);
    </script>
</body>
</html>
