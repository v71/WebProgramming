<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess the Image</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg-0:#0d0d14;
    --bg-1:#15151f;
    --bg-2:#1c1c29;
    --accent:#7c5cff;
    --accent-2:#4fd1c5;
    --correct:#39d98a;
    --wrong:#ff5c7c;
    --text:#e8e8f0;
    --text-dim:#9494a8;
    --border:#2a2a3a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
      var(--bg-0);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:520px;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  h1{
    font-size:1.4rem;
    margin:0;
    letter-spacing:0.5px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .stats{
    font-size:0.85rem;
    color:var(--text-dim);
    text-align:right;
  }
  .stats span{color:var(--accent-2); font-weight:600;}
  .game-stats{
    display:flex;
    gap:20px;
    font-size:0.85rem;
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
    margin-bottom:14px;
  }
  .game-stats strong{
    color:var(--accent-2);
    font-weight:600;
  }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:0.8rem;
    color:var(--text-dim);
  }
  .progress-row strong{
    color:var(--accent-2);
    font-weight:600;
  }
  .progress-bar{
    height:6px;
    width:100%;
    background:var(--bg-2);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:20px;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    width:0%;
    transition:width 0.4s ease;
  }
  .card{
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .image-frame{
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    height:280px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .image-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .question{
    text-align:center;
    color:var(--text-dim);
    margin:0 0 16px;
    font-size:0.95rem;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .choice-btn{
    background:var(--bg-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 10px;
    border-radius:10px;
    font-size:0.95rem;
    cursor:pointer;
    transition:all 0.15s ease;
    text-align:center;
  }
  .choice-btn:hover:not(:disabled){
    border-color:var(--accent);
    background:#22223280;
    transform:translateY(-1px);
  }
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{
    background:rgba(57,217,138,0.15);
    border-color:var(--correct);
    color:var(--correct);
  }
  .choice-btn.wrong{
    background:rgba(255,92,124,0.15);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .feedback{
    min-height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    margin-top:26px;
    font-weight:700;
    font-size:1.15rem;
    line-height:1.4;
  }
  .feedback.correct-text{color:var(--correct);}
  .feedback.wrong-text{color:var(--wrong);}
  .next-btn{
    margin-top:14px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#0d0d14;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    visibility:hidden;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .next-btn.visible{
    visibility:visible;
    opacity:1;
  }
  .next-btn:hover{filter:brightness(1.08);}
  .reveal-btn{
    margin-top:10px;
    width:100%;
    padding:12px;
    border-radius:10px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--accent-2);
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    transition:border-color 0.15s ease;
  }
  .reveal-btn:hover{
    border-color:var(--accent-2);
  }
  .result-screen{
    text-align:center;
    padding:30px 10px;
  }
  .result-screen h2{
    font-size:1.6rem;
    margin-bottom:6px;
  }
  .result-screen p{
    color:var(--text-dim);
    margin-bottom:20px;
  }
  .restart-btn{
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#0d0d14;
    font-weight:700;
    cursor:pointer;
    font-size:0.95rem;
  }
  .big-score{
    font-size:2.6rem;
    font-weight:800;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:6px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Indovina l'Emozione</h1>
    <div class="stats">Round <span id="roundNum">1</span>/<span id="totalRounds">4</span><br>Punteggio: <span id="scoreNum">0</span></div>
  </div>
  <div class="game-stats">
    <span>Tempo trascorso: <strong id="timeValue">0s</strong></span>
    <span>Azioni: <strong id="movesValue">0</strong></span>
  </div>
  <div class="progress-row">
    <span>Progresso</span>
    <span><strong id="progressRatio">1/4</strong></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="gameCard">
    <div class="image-frame" id="imageFrame"></div>
    <p class="question">Che emozione vedi?</p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="reveal-btn" id="revealBtn">Clicca per rivelare la risposta</button>
    <button class="next-btn" id="nextBtn">Prossimo →</button>
  </div>
</div>

<script>
// --- Round data: each has a real embedded photo + correct label + distractors ---
const rounds = [
  {
    label: "Birthday Dog",
    distractors: ["Party Cat", "Sunglasses Bunny", "Costume Hamster"],
    image: "images/dog.jpg"
  },
  {
    label: "Happy Leaf",
    distractors: ["Smiling Pumpkin", "Autumn Acorn", "Painted Pinecone"],
    image: "images/leaf.jpg"
  },
  {
    label: "Cool Sunflower",
    distractors: ["Shady Daisy", "Rose with Shades", "Tulip in Sunglasses"],
    image: "images/flower.jpg"
  },
  {
    label: "Doctor Duck",
    distractors: ["Scientist Swan", "Professor Penguin", "Nurse Goose"],
    image: "images/duck.jpg"
  },
]

let order = [];
let current = 0;
let score = 0;
let roundAnswered = false;

// Elapsed-time tracking: counts up for the whole game (not per round),
// purely informational — not a countdown, no pressure.
let elapsedSeconds = 0;
let elapsedTimerInterval = null;

// Move counter: one move = one guess (a choice clicked), across the
// whole game.
let moveCount = 0;

// Set once the game finishes — for the host platform to read/store/report.
let completionTimeSeconds = null;
let completionMoveCount = null;

// Original in-game card markup, saved so we can restore it after the results screen replaces it
const GAME_CARD_TEMPLATE = `
    <div class="image-frame" id="imageFrame"></div>
    <p class="question">What does this image show?</p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="reveal-btn" id="revealBtn">Hold to Reveal Answer</button>
    <button class="next-btn" id="nextBtn">Next →</button>
`;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startElapsedTimer(){
  stopElapsedTimer();
  elapsedSeconds = 0;
  updateTimeDisplay();
  elapsedTimerInterval = setInterval(() => {
    elapsedSeconds++;
    updateTimeDisplay();
  }, 1000);
}

function stopElapsedTimer(){
  if(elapsedTimerInterval){
    clearInterval(elapsedTimerInterval);
    elapsedTimerInterval = null;
  }
}

function updateTimeDisplay(){
  const el = document.getElementById('timeValue');
  if(el) el.textContent = elapsedSeconds + 's';
}

function updateMovesDisplay(){
  const el = document.getElementById('movesValue');
  if(el) el.textContent = moveCount;
}

function init(){
  // Restore the original game layout in case we're coming from the results screen
  document.getElementById('gameCard').innerHTML = GAME_CARD_TEMPLATE;
  document.getElementById('nextBtn').addEventListener('click', goToNextRound);
  bindRevealButton();

  order = shuffle(rounds);
  current = 0;
  score = 0;
  moveCount = 0;
  completionTimeSeconds = null;
  completionMoveCount = null;
  updateMovesDisplay();
  startElapsedTimer();
  document.getElementById('totalRounds').textContent = order.length;
  renderRound();
}

function goToNextRound(){
  current++;
  if(current >= order.length){
    showResults();
  } else {
    renderRound();
  }
}

function renderRound(){
  const round = order[current];
  roundAnswered = false;
  document.getElementById('roundNum').textContent = current + 1;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('progressRatio').textContent = (current + 1) + '/' + order.length;
  document.getElementById('progressFill').style.width = (current / order.length * 100) + '%';

  document.getElementById('imageFrame').innerHTML = '<img src="' + round.image + '" alt="Guess this image">';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('visible');

  const options = shuffle([round.label, ...round.distractors]);
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, round.label, btn);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(selected, correctLabel, btnEl){
  roundAnswered = true;
  moveCount++;
  updateMovesDisplay();
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => {
    b.disabled = true;
    if(b.textContent === correctLabel) b.classList.add('correct');
  });

  const feedback = document.getElementById('feedback');
  if(selected === correctLabel){
    score++;
    feedback.textContent = "Correct! 🎉";
    feedback.className = 'feedback correct-text';
  } else {
    btnEl.classList.add('wrong');
    feedback.textContent = "Not quite — it's " + correctLabel + ".";
    feedback.className = 'feedback wrong-text';
  }
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('nextBtn').classList.add('visible');
}

// Reveal: while the button is held down, the correct choice is
// highlighted green as a preview — released (or the pointer/finger
// moves away), it goes back to normal. Once the round is actually
// answered, the highlight is left in place rather than being wiped
// on release.
function showReveal(){
  const round = order[current];
  document.querySelectorAll('.choice-btn').forEach(b => {
    if(b.textContent === round.label) b.classList.add('correct');
  });
}
function hideReveal(){
  if(roundAnswered) return;
  document.querySelectorAll('.choice-btn.correct').forEach(b => b.classList.remove('correct'));
}

function bindRevealButton(){
  const revealBtn = document.getElementById('revealBtn');
  revealBtn.addEventListener('mousedown', showReveal);
  revealBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    showReveal();
  }, { passive: false });
}

document.addEventListener('mouseup', hideReveal);
document.addEventListener('touchend', hideReveal);
document.addEventListener('touchcancel', hideReveal);

function showResults(){
  stopElapsedTimer();
  completionTimeSeconds = elapsedSeconds;
  completionMoveCount = moveCount;
  console.log('Game finished in', completionTimeSeconds, 'seconds and', completionMoveCount, 'moves.');

  document.getElementById('progressRatio').textContent = order.length + '/' + order.length;
  document.getElementById('progressFill').style.width = '100%';

  const pct = Math.round((score/order.length)*100);
  let msg = "Nice try — go again?";
  if(pct === 100) msg = "Perfect score! 🌟";
  else if(pct >= 70) msg = "Great job! 👏";
  else if(pct >= 40) msg = "Not bad — try again!";

  document.getElementById('gameCard').innerHTML = `
    <div class="result-screen">
      <div class="big-score">${score}/${order.length}</div>
      <h2>${msg}</h2>
      <p>You guessed ${pct}% of the images correctly.</p>
      <button class="restart-btn" id="restartBtn">Play Again</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', init);
}

init();
</script>
</body>
</html>
