<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titolo del gioco</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../js/checkmark.js"></script>
    <script src="../js/celebrazion.js"></script>


    <style>
        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

            background:
                radial-gradient(circle at center,rgba(99, 102, 241, 0.06),transparent 40%),
                radial-gradient(circle at center,rgba(6, 182, 212, 0.06),transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
           GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           COUNTERS
        ========================================= */

        #game-stats {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
           INFORMATION BOX
        ========================================= */

        #instruction-banner {
            margin: 0 0 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            min-height: 52px;
            padding: 10px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dim);
            background: var(--bg-1);
            border-radius: 99px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        /* =========================================
           EMPTY GAME AREA
        ========================================= */

        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* This is intentionally empty.
           Future game content goes here. */

        /* =========================================
           PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 135deg,#6366f1 0%,#a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }
    </style>
</head>

<body>

    <!-- TITLE -->

    <h1 id="game-title">
        Titolo del gioco
    </h1>

    <!-- COUNTERS -->

    <div id="game-stats">
        <span>Round: <strong id="progress-value">1 / 1</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->

    <div id="instruction-banner">
        Istruzioni del gioco
    </div>

    <!-- EMPTY GAME AREA -->

    <div id="game-area">
        
    </div>

    <!-- PROGRESS -->

    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">

        <div
            id="progress-bar-fill"
            class="progress-bar-fill"
            style="width: 0%;">
        </div>

    </div>

    <!-- NO GAME LOGIC -->

    <script>
        /*
         * TEMPLATE
         *
         * Nessuna logica di gioco presente.
         *
         * Il prossimo gioco potrà utilizzare:
         *
         * #game-area
         * #progress-value
         * #time-value
         * #moves-value
         * #reveals-value
         * #progress-bar-fill
         *
         * come elementi di base.
         */
    </script>

</body>
</html>
