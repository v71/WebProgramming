<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill in the Blanks - Multi-Round</title>
    <style>
        :root {
            --bg-0: #0d0d14;
            --bg-1: #15151f;
            --bg-2: #1c1c29;
            --accent: #7c5cff;
            --accent-2: #4fd1c5;
            --correct: #39d98a;
            --wrong: #ff5c7c;
            --text: #e8e8f0;
            --text-dim: #9494a8;
            --border: #2a2a3a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 24px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #game-stats {
            margin: -2px 0 12px;
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        #game-stats strong {
            color: var(--accent-2);
            font-weight: 600;
        }

        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            max-width: 1100px;
            height: 6px;
            background: var(--bg-1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            width: 0%;
            transition: width 0.4s ease;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #0d0d14;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s ease;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button.secondary-btn {
            background: transparent;
            color: var(--accent-2);
            border: 1px solid var(--border);
        }

        button.secondary-btn:hover {
            filter: none;
            border-color: var(--accent-2);
        }

        button.secondary-btn:disabled {
            color: var(--text-dim);
            border-color: var(--border);
            cursor: not-allowed;
            filter: none;
            opacity: 0.5;
        }

        button#next-round-btn {
            display: none;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            min-height: clamp(80px, 12vh, 120px);
            padding: 20px;
            border-radius: 16px;
            align-items: center;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        #word-bank {
            border: 2px dashed var(--border);
            background-color: var(--bg-1);
        }

        .card-container.drag-container-over {
            border-color: var(--accent-2);
            background-color: rgba(79, 209, 197, 0.06);
        }

        .card {
            background-color: var(--bg-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, transform 0.1s, background-color 0.15s;
            touch-action: none;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .card:active {
            cursor: grabbing;
        }

        .card.dragging {
            opacity: 0.3;
        }

        .card.word-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .passage-box {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            font-size: 1.1rem;
            line-height: 2.6;
            color: var(--text);
        }

        .blank-slot {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            min-height: 40px;
            margin: 0 4px;
            vertical-align: middle;
            border: 1px dashed var(--border);
            border-radius: 8px;
            background-color: var(--bg-2);
            transition: border-color 0.2s, background-color 0.2s;
        }

        .blank-slot.filled {
            border: none;
            background: transparent;
            min-width: 0;
            min-height: 0;
        }

        .blank-slot.drag-container-over {
            border-color: var(--accent-2);
            background-color: rgba(79, 209, 197, 0.08);
        }

        .reveal-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            background-color: var(--bg-1);
            border: 2px solid var(--correct);
            color: var(--correct);
            font-weight: 700;
            white-space: nowrap;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            z-index: 2;
        }

        .reveal-badge.visible {
            opacity: 1;
        }

        #status-message {
            margin-top: 4px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 22px;
            text-align: center;
            max-width: 1100px;
            width: 100%;
        }

        #status-message.correct-text {
            color: var(--correct);
        }

        #status-message.wrong-text {
            color: var(--wrong);
        }

        /* Summary Screen Styles */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--accent-2);
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.95rem;
            text-align: left;
        }

        .summary-table th, .summary-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .summary-table th {
            color: var(--text-dim);
            font-weight: 600;
            background: var(--bg-2);
        }

        .summary-totals {
            margin-top: 15px;
            font-size: 1rem;
            color: var(--text-dim);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>Fill in the Blanks</h1>

    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 3</strong></span>
        <span>Time: <strong id="time-value">0s</strong></span>
        <span>Moves: <strong id="moves-value">0</strong></span>
        <span>Reveals: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- Visual Progress Bar -->
    <div class="progress-container" id="progress-container-wrap">
        <div id="progress-bar" class="progress-bar-fill"></div>
    </div>

    <div class="controls" id="game-controls">
        <button id="next-round-btn">Next Round</button>
        <button id="reveal-btn" class="secondary-btn">Hold to Reveal Answers</button>
    </div>

    <div id="status-message"></div>

    <div class="section-wrapper" id="word-bank-section">
        <div class="section-title">Word Bank</div>
        <div id="word-bank" class="card-container"></div>
    </div>

    <div class="section-wrapper" id="passage-section">
        <div class="section-title">Complete the Text</div>
        <div id="text-passage" class="passage-box"></div>
    </div>

    <!-- Summary Screen for Memorized Results -->
    <div id="summary-screen">
        <h2>All Puzzles Completed! 🎉</h2>
        <p>Here is your performance report for analysis:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Text</th>
                    <th>Time</th>
                    <th>Moves</th>
                    <th>Reveals</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
                <!-- Populated via JS -->
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
            <!-- Populated via JS -->
        </div>
        <div style="margin-top: 24px;">
            <button id="restart-game-btn">Play Again</button>
        </div>
    </div>

    <script>
        const revealBtn = document.getElementById('reveal-btn');
        const nextRoundBtn = document.getElementById('next-round-btn');
        const wordBank = document.getElementById('word-bank');
        const passageBox = document.getElementById('text-passage');
        const statusMessage = document.getElementById('status-message');
        const roundValueEl = document.getElementById('round-value');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressBar = document.getElementById('progress-bar');
        
        // Layout wrappers for toggling summary screen
        const progressContainerWrap = document.getElementById('progress-container-wrap');
        const gameControls = document.getElementById('game-controls');
        const wordBankSection = document.getElementById('word-bank-section');
        const passageSection = document.getElementById('passage-section');
        const gameStats = document.getElementById('game-stats');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');
        const restartGameBtn = document.getElementById('restart-game-btn');

        const PUZZLE_ROUNDS = [
            [
                { type: 'text', content: 'The ' },
                { type: 'blank', id: 'b1', answer: 'quick' },
                { type: 'text', content: ' brown ' },
                { type: 'blank', id: 'b2', answer: 'fox' },
                { type: 'text', content: ' jumps over the lazy ' },
                { type: 'blank', id: 'b3', answer: 'dog' },
                { type: 'text', content: ' near the ' },
                { type: 'blank', id: 'b4', answer: 'river' },
                { type: 'text', content: '.' }
            ],
            [
                { type: 'text', content: 'A ' },
                { type: 'blank', id: 'b1', answer: 'journey' },
                { type: 'text', content: ' of a thousand ' },
                { type: 'blank', id: 'b2', answer: 'miles' },
                { type: 'text', content: ' begins with a single ' },
                { type: 'blank', id: 'b3', answer: 'step' },
                { type: 'text', content: '.' }
            ],
            [
                { type: 'text', content: 'To ' },
                { type: 'blank', id: 'b1', answer: 'err' },
                { type: 'text', content: ' is ' },
                { type: 'blank', id: 'b2', answer: 'human' },
                { type: 'text', content: ', to forgive ' },
                { type: 'blank', id: 'b3', answer: 'divine' },
                { type: 'text', content: '.' }
            ]
        ];

        let currentRoundIndex = 0;
        let blanksMeta = [];
        let draggedCard = null;

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let gameCompleted = false;

        let moveCount = 0;
        let revealCount = 0;
        let roundResults = [];

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function updateRoundDisplay() {
            roundValueEl.textContent = `${currentRoundIndex + 1} / ${PUZZLE_ROUNDS.length}`;
            const progressPercent = ((currentRoundIndex) / PUZZLE_ROUNDS.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        function registerMove() {
            if (gameCompleted) return;
            moveCount++;
            updateMovesDisplay();
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function createWordCard(word) {
            const card = document.createElement('div');
            card.className = 'card word-card';
            card.textContent = word;
            card.dataset.word = word;
            card.setAttribute('draggable', 'true');
            addDragAndDropEvents(card);
            return card;
        }

        function addDragAndDropEvents(card) {
            card.addEventListener('dragstart', () => {
                draggedCard = card;
                setTimeout(() => card.classList.add('dragging'), 0);
            });
            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                draggedCard = null;
                document.querySelectorAll('.blank-slot, #word-bank').forEach(el => el.classList.remove('drag-container-over'));
            });
        }

        function attachBlankDropEvents(slot) {
            slot.addEventListener('dragover', (e) => e.preventDefault());
            slot.addEventListener('dragenter', (e) => {
                e.preventDefault();
                slot.classList.add('drag-container-over');
            });
            slot.addEventListener('dragleave', (e) => {
                if (e.target === slot) slot.classList.remove('drag-container-over');
            });
            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                slot.classList.remove('drag-container-over');
                if (!draggedCard || draggedCard.parentNode === slot) return;

                const occupant = slot.querySelector('.word-card');
                if (occupant) {
                    wordBank.appendChild(occupant);
                }
                slot.appendChild(draggedCard);
                registerMove();
                checkArrangement();
            });
        }

        function attachWordBankDropEvents() {
            wordBank.addEventListener('dragover', (e) => e.preventDefault());
            wordBank.addEventListener('dragenter', (e) => {
                e.preventDefault();
                wordBank.classList.add('drag-container-over');
            });
            wordBank.addEventListener('dragleave', (e) => {
                if (e.target === wordBank) wordBank.classList.remove('drag-container-over');
            });
            wordBank.addEventListener('drop', (e) => {
                e.preventDefault();
                wordBank.classList.remove('drag-container-over');
                if (!draggedCard || draggedCard.parentNode === wordBank) return;
                wordBank.appendChild(draggedCard);
                registerMove();
                checkArrangement();
            });
        }

        function initializeGame(roundIndex) {
            summaryScreen.style.display = 'none';
            progressContainerWrap.style.display = 'block';
            gameControls.style.display = 'flex';
            wordBankSection.style.display = 'block';
            passageSection.style.display = 'block';
            gameStats.style.display = 'flex';

            passageBox.innerHTML = '';
            wordBank.innerHTML = '';
            statusMessage.textContent = '';
            statusMessage.className = '';
            gameCompleted = false;
            revealBtn.disabled = false;
            nextRoundBtn.style.display = 'none';
            moveCount = 0;
            revealCount = 0;
            updateMovesDisplay();
            updateRevealsDisplay();
            updateRoundDisplay();
            startElapsedTimer();

            blanksMeta = [];
            const segments = PUZZLE_ROUNDS[roundIndex];

            segments.forEach((seg) => {
                if (seg.type === 'text') {
                    passageBox.appendChild(document.createTextNode(seg.content));
                } else {
                    const slot = document.createElement('span');
                    slot.className = 'blank-slot';
                    slot.dataset.blankId = seg.id;

                    const badge = document.createElement('span');
                    badge.className = 'reveal-badge';
                    badge.textContent = seg.answer;
                    slot.appendChild(badge);

                    attachBlankDropEvents(slot);
                    passageBox.appendChild(slot);
                    blanksMeta.push({ id: seg.id, answer: seg.answer, element: slot });
                }
            });

            const shuffledWords = shuffleArray(blanksMeta.map((b) => b.answer));
            shuffledWords.forEach((word) => {
                wordBank.appendChild(createWordCard(word));
            });

            checkArrangement();
        }

        function checkArrangement() {
            let filledCount = 0;
            let allCorrect = true;

            blanksMeta.forEach((b) => {
                const occupant = b.element.querySelector('.word-card');
                b.element.classList.toggle('filled', !!occupant);
                if (occupant) {
                    filledCount++;
                    if (occupant.dataset.word !== b.answer) allCorrect = false;
                } else {
                    allCorrect = false;
                }
            });

            if (filledCount < blanksMeta.length) {
                statusMessage.textContent = '';
                statusMessage.className = '';
                return;
            }

            if (allCorrect) {
                statusMessage.className = 'correct-text';
                if (!gameCompleted) {
                    gameCompleted = true;
                    stopElapsedTimer();
                    revealBtn.disabled = true;

                    // Reconstruct correct sentence directly from round definition
                    const correctSentence = PUZZLE_ROUNDS[currentRoundIndex].map(seg => {
                        return seg.type === 'text' ? seg.content : seg.answer;
                    }).join('');

                    const effectiveTime = Math.max(elapsedSeconds, 1);
                    const metricValue = Number(((moveCount - revealCount) / effectiveTime).toFixed(2));

                    roundResults.push({
                        sentence: correctSentence,
                        time: elapsedSeconds,
                        moves: moveCount,
                        reveals: revealCount,
                        metric: metricValue
                    });

                    if (currentRoundIndex < PUZZLE_ROUNDS.length - 1) {
                        statusMessage.textContent = 'Round Complete! Click "Next Round" to proceed.';
                        nextRoundBtn.textContent = 'Next Round';
                        nextRoundBtn.style.display = 'inline-block';
                    } else {
                        progressBar.style.width = '100%';
                        statusMessage.textContent = 'All rounds completed! Click "Done" to view your report.';
                        nextRoundBtn.textContent = 'Done';
                        nextRoundBtn.style.display = 'inline-block';
                    }
                }
            } else {
                statusMessage.className = 'wrong-text';
                statusMessage.textContent = 'All blanks are filled, but some words are in the wrong place.';
            }
        }

        function showSummaryScreen() {
            progressContainerWrap.style.display = 'none';
            gameControls.style.display = 'none';
            wordBankSection.style.display = 'none';
            passageSection.style.display = 'none';
            gameStats.style.display = 'none';
            statusMessage.textContent = '';

            summaryTbody.innerHTML = '';
            let totalTime = 0;
            let totalMoves = 0;
            let totalReveals = 0;

            roundResults.forEach((res) => {
                totalTime += res.time;
                totalMoves += res.moves;
                totalReveals += res.reveals;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${res.sentence}</td>
                    <td>${res.time}s</td>
                    <td>${res.moves}</td>
                    <td>${res.reveals}</td>
                    <td>${res.metric}</td>
                `;
                summaryTbody.appendChild(row);
            });

            summaryTotals.innerHTML = `Total Time: ${totalTime}s &bull; Total Moves: ${totalMoves} &bull; Total Reveals: ${totalReveals}`;
            summaryScreen.style.display = 'block';
        }

        nextRoundBtn.addEventListener('click', () => {
            if (currentRoundIndex < PUZZLE_ROUNDS.length - 1) {
                currentRoundIndex++;
                initializeGame(currentRoundIndex);
            } else {
                showSummaryScreen();
            }
        });

        restartGameBtn.addEventListener('click', () => {
            currentRoundIndex = 0;
            roundResults = [];
            initializeGame(currentRoundIndex);
        });

        let isRevealing = false;
        function showReveal() {
            if (gameCompleted || revealBtn.disabled) return;
            if (!isRevealing) {
                isRevealing = true;
                revealCount++;
                updateRevealsDisplay();
            }
            document.querySelectorAll('.reveal-badge').forEach((b) => b.classList.add('visible'));
        }
        function hideReveal() {
            isRevealing = false;
            document.querySelectorAll('.reveal-badge').forEach((b) => b.classList.remove('visible'));
        }

        revealBtn.addEventListener('mousedown', showReveal);
        revealBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showReveal();
        }, { passive: false });

        document.addEventListener('mouseup', hideReveal);
        document.addEventListener('touchend', hideReveal);
        document.addEventListener('touchcancel', hideReveal);

        attachWordBankDropEvents();

        // Start first round on load
        initializeGame(currentRoundIndex);
    </script>
</body>
</html>
