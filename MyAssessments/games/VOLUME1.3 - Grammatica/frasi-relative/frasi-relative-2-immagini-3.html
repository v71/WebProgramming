    <style>

            --bg-0: #2a113d;

            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at center,rgba(99, 102, 241, 0.06),transparent 40%),
                radial-gradient(circle at center,rgba(6, 182, 212, 0.06),transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
            GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,

                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
            COUNTERS
        ========================================= */

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);

            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
            INFORMATION BOX
        ========================================= */

        #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
            GAME AREA
        ========================================= */

        #game-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 0px;
            margin-bottom: 15px;
            padding: 24px;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;

        /* =========================================
            PROGRESS TITLE
        ========================================= */

        #progress-title {

            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;

            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);

            BUTTONS
        ========================================= */

            align-items: stretch;
            width: min(800px, 90vw);   /* was 480px */
            padding: 0;
            gap: 20px;

        .option-card {

            color: #ffffff;
            border: 2px solid var(--border);

            align-items: center;

            box-shadow: var(--shadow-sm);

            transform: none !important;

        }

    <script>
        function analyzeItalianGrammar(sentence) {
            
            const tokens = sentence.match(/[\wÀ-ÿ]+|[.,!?;]/g) || [];
            
            const lexicon = {
                articolo: ["il", "lo", "la", "i", "gli", "le", "un", "uno", "una"],
                preposizione: [
                    "di", "a", "da", "in", "con", "su", "per", "tra", "fra", 
                    "al", "del", "dal", "nel", "sul", "allo", "dallo", "nello", "sullo", 
                    "alla", "dalla", "nella", "sulla", "ai", "dai", "nei", "sui", 
                    "agli", "dagli", "negli", "sugli", "alle", "dalle", "nelle", "sulle"
                ],
                pronome: ["io", "tu", "egli", "esso", "essa", "noi", "voi", "essi", "esse", "lui", "lei", "loro", "mi", "ti", "si", "ci", "vi", "ne", "che", "cui"],
                congiunzione: ["e", "ed", "o", "ma", "però", "anche", "se", "perché", "poiché", "quindi", "dunque"],
                verbo: [
                    "vado", "vai", "va", "andiamo", "andate", "vanno", "andare",
                    "sono", "sei", "è", "siamo", "siete", "essere","era",
                    "ho", "hai", "ha", "abbiamo", "avete", "hanno", "avere",
                    "fai", "fa", "facciamo", "fate", "fanno", "fare",
                    "giocare", "gioco", "giochi", "gioca", "giochiamo", "giochiate", "giocano",
                    "dorme", "corre", "mangia", "parla", "legge", "scrive",
                    "prende"
                ]
            };
            
            return tokens.map(token => {
                let lower = token.toLowerCase();
                let element = "Nome";
                let cssClass = "triangle-black";

                if (/^[.,!?;]$/.test(token)) {
                    return { word: token, elemento: "Punt.", cssClass: "punctuation-gray" };
                }

                if (lexicon.articolo.includes(lower)) {
                    element = "Articolo";
                    cssClass = "triangle-lightblue";
                } else if (lexicon.preposizione.includes(lower)) {
                    element = "Prepos.";
                    cssClass = "bridge-green";
                } else if (lexicon.pronome.includes(lower)) {
                    element = "Pronome";
                    cssClass = "triangle-purple";
                } else if (lexicon.congiunzione.includes(lower)) {
                    element = "Congiunz.";
                    cssClass = "ribbon-pink";
                } else if (lexicon.verbo.includes(lower) || lower.endsWith("are") || lower.endsWith("ere") || lower.endsWith("ire")) {
                    element = "Verbo";
                    cssClass = "circle-red";
                } else if (lower.endsWith("mente")) {
                    element = "Avverbio";
                    cssClass = "circle-orange";
                } else if (["oso", "osa", "osi", "ose", "ile", "ista", "ero", "era", "eri", "ere"].some(s => lower.endsWith(s))) {
                    element = "Aggettivo";
                    cssClass = "triangle-darkblue";
                }

                return { word: token, elemento: element, cssClass };
            });
            
        }
        
        function renderAnalysis(sentence) {
            
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const analysisResults = analyzeItalianGrammar(sentence);
            
            analysisResults.forEach(res => {
                const box = document.createElement('div');
                box.className = 'word-token-box';

                box.innerHTML = `
                    <div class="symbol-area">
                        <div class="shape ${res.cssClass}"></div>
                    </div>
                    <div class="word-text" title="${res.word}">${res.word}</div>
                    <div class="word-label" title="${res.elemento}">${res.elemento}</div>
                `;
                container.appendChild(box);
            });
        }
    </script>

    <script>

            const movesValueEl = document.getElementById('moves-value');
            const revealsValueEl = document.getElementById('reveals-value');
            const revealBtn = document.getElementById('reveal-btn');
            const progressBarFill = document.getElementById('progress-bar-fill');
            const instructionBanner = document.getElementById('instruction-banner');
            const gameTitle = document.getElementById('game-title');
            const gameStats = document.getElementById('game-stats');
            const actionControls = document.getElementById('action-controls');
            const progressTitle = document.getElementById('progress-title');
            const progressContainer = document.querySelector('.progress-bar-container');
            const hintEl = document.getElementById('hint-style');   // NEW

            let elapsedSeconds = 0;
            let moveCount = 0;
            let revealCount = 0;
            let elapsedTimerInterval = null;

            const nextBtn = document.getElementById('next-btn');
            const optionsContainer = document.getElementById('options-container');
            const summaryScreen = document.getElementById('summary-screen');
            const summaryTbody = document.getElementById('summary-tbody');
            const summaryTotals = document.getElementById('summary-totals');

            let ROUNDS = [];
            let currentRoundIndex = 0;
            let roundResults = [];
            let roundCompleted = false;
            let isPeeking = false;
            let optionElements = [];
            let currentRound = null;

            function updateHint(hint) {
                hintEl.textContent = hint || '';
                hintEl.style.display = hint ? '' : 'none';   // no hint -> hide the line
            }

            function startElapsedTimer() {
                stopElapsedTimer();
                elapsedSeconds = 0;
                updateTimerDisplay();
                elapsedTimerInterval = setInterval(() => {
                    elapsedSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }

            function stopElapsedTimer() {
                if (elapsedTimerInterval) {
                    clearInterval(elapsedTimerInterval);
                    elapsedTimerInterval = null;
                }
            }

            function updateTimerDisplay() {
                timeValueEl.textContent = elapsedSeconds + 's';
            }

            function updateMovesDisplay() {
                movesValueEl.textContent = moveCount;
            }

            function updateRevealsDisplay() {
                revealsValueEl.textContent = revealCount;
            }

            function shuffleArray(array) {
                let arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function preloadImages(round) {
                if (!round.options) return;
                round.options.forEach(url => {
                    const img = new Image();
                    img.src = url;
                });
            }

            function loadRound(index) {
                if (index >= ROUNDS.length) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                    return;
                }
            
                const progressRatio = (index / ROUNDS.length) * 100;
                progressBarFill.style.width = progressRatio + '%';
                
                currentRound = ROUNDS[index];
                roundCompleted = false;
                moveCount = 0;
                revealCount = 0;
                optionElements = [];
                
                preloadImages(currentRound);

                progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
                updateMovesDisplay();
                updateRevealsDisplay();
                startElapsedTimer();
                updateHint(currentRound.label);
                renderAnalysis(currentRound.label);

                nextBtn.classList.add('smooth-hidden');
                revealBtn.classList.remove('smooth-hidden');
                revealBtn.disabled = false;

                // POPOLA I TASTI CON IMMAGINI BITMAP ED EVENTUALE HOVER DAL JSON 
                optionsContainer.innerHTML = '';

                const correctIdx = currentRound.correctIndex;
                const incorrectIndices = [];
                for (let i = 0; i < currentRound.options.length; i++) {
                    if (i !== correctIdx) {
                        incorrectIndices.push(i);
                    }
                }

                const maxIncorrectToPick = Math.min(incorrectIndices.length, 1);
                const selectedIncorrect = shuffleArray(incorrectIndices).slice(0, maxIncorrectToPick);
                const order = shuffleArray([correctIdx, ...selectedIncorrect]);

                order.forEach((originalIdx) => {
                    const optionEl = document.createElement('button');
                    optionEl.classList.add('option-card');

                    const imgEl = document.createElement('img');
                    imgEl.src = currentRound.options[originalIdx];
                    imgEl.alt = "Opzione";
                    optionEl.appendChild(imgEl);

                    optionEl.dataset.isCorrect = (originalIdx === currentRound.correctIndex) ? 'true' : 'false';
                    optionEl.addEventListener('click', () => handleOptionClick(optionEl));

                    optionsContainer.appendChild(optionEl);
                    optionElements.push(optionEl);
                });

            }

            async function handleOptionClick(optionEl, imgEl, defaultImgSrc) {
                if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

                if (optionEl.dataset.isCorrect === 'true') {
                    roundCompleted = true;
                    stopElapsedTimer();

                    moveCount++;
                    updateMovesDisplay();

                    optionEl.classList.add('correct-option');
                    optionElements.forEach(el => {
                        el.classList.remove('peek');
                        if (el !== optionEl) el.classList.add('disabled-option');
                    });

                    if (typeof Checkmark !== 'undefined') {
                        try {
                            await Checkmark.show({
                                element: optionEl,
                                size: 48,
                                rise: 70,
                                duration: 1600
                            });
                        } catch (err) {
                            console.warn('Checkmark animation failed:', err);
                        }
                    }

                    progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                    const wrongAttempts = moveCount - 1; 
                    const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                    roundResults.push({
                        label: currentRound.label,
                        time: elapsedSeconds + 's',
                        moves: moveCount,
                        reveals: revealCount,
                        metric: metricValue
                    });

                    if (currentRoundIndex === ROUNDS.length - 1) {
                        nextBtn.textContent = "✓ Fatto";

                        if (typeof Confetti !== 'undefined') {
                            try {
                                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                            } catch (err) {
                                console.warn('Confetti animation failed:', err);
                            }
                        }

                    } else {
                        nextBtn.textContent = "▶ Prossima immagine";
                    }

                    revealBtn.classList.add('smooth-hidden');
                    nextBtn.classList.remove('smooth-hidden');

                } else {
                    moveCount++;
                    updateMovesDisplay();
                    optionEl.classList.add('wrong-option');
                    optionEl.addEventListener('animationend', () => {
                        optionEl.classList.remove('wrong-option');
                    }, { once: true });
                }
            }

            nextBtn.addEventListener('click', () => {
                if (currentRoundIndex === ROUNDS.length - 1) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                } else {
                    currentRoundIndex++;
                    loadRound(currentRoundIndex);
                }
            });

            function showSummaryScreen() {
                gameArea.style.display = 'none';
                instructionBanner.style.display = 'none';
                document.getElementById('game-stats').style.display = 'none';
                document.querySelector('.progress-bar-container').style.display = 'none';
                actionControls.style.display = 'none';
                hintEl.style.display = 'none';
                summaryTbody.innerHTML = '';
                let totalMetric = 0;

                roundResults.forEach(res => {
                    totalMetric += res.metric;
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                    summaryTbody.appendChild(row);
                });

                const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
                const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

                summaryTotals.innerHTML = `
                    <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                    <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
                `;
                summaryScreen.style.display = 'block';
            }

            function showPeek() {
                if (roundCompleted || isPeeking || revealBtn.disabled) return;
                isPeeking = true;
                revealCount++;
                updateRevealsDisplay();
                const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
                if (correctEl) correctEl.classList.add('peek');
            }

            function hidePeek() {
                if (!isPeeking) return;
                isPeeking = false;
                optionElements.forEach(el => el.classList.remove('peek'));
            }

            async function initGame() {
                try {
                    const response = await fetch('corrispondenza-quantità-numero.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    ROUNDS = shuffleArray(data.rounds);
                } catch (err) {
                    console.error('Could not load JSON file:', err);
                }
                loadRound(currentRoundIndex);
            }

            revealBtn.addEventListener('mousedown', showPeek);
            revealBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                showPeek();
            }, { passive: false });

            revealBtn.addEventListener('mouseup', hidePeek);
            revealBtn.addEventListener('mouseleave', hidePeek);
            revealBtn.addEventListener('touchend', hidePeek);
            revealBtn.addEventListener('touchcancel', hidePeek);

            initGame();
        });
    </script>

</body>
</html>
