<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Le parole del mostro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

<style>
        :root {
            --bg-0: #e6e6e6;
            --bg-1: #ffffff;
            --bg-2: #f1f5f9;
            --accent: #6366f1;
            --accent-2: #06b6d4;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --page-space: 24px;  /* free space above the title and under the progress bar */
            --label-gap: 8px;    /* gap between the frame and the "Progresso" label */
        }

        * { box-sizing: border-box; }

        html { scrollbar-gutter: stable; }

        body {
            font-family: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: var(--page-space) 16px calc(var(--page-space) + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
        }

        /* "Progresso" keeps the original template size */
        .section-heading { font-size: 2.2rem; margin: 0 0 6px; flex-shrink: 0; }

        #game-stats, .stats-style {
            margin: 0 0 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 5px 16px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats { flex-wrap: wrap; }
        #game-stats strong { color: var(--text); font-weight: 700; }

        /* ---------- Info bar: one line, tightly wrapped around its content ---------- */
        #instruction-banner {
            padding: 3px 18px;
            max-width: 100%;
            font-weight: 500;
        }

        .info-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
            min-height: 1.7em;
        }

        .info-main.ok { color: #047857; font-weight: 600; }
        .info-main.retry { color: #92400e; font-weight: 600; }
        .cnt { color: var(--text-dim); font-variant-numeric: tabular-nums; }

        .controls {
            margin-top: 0;
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 1050px;
            min-height: 40px;
            flex-wrap: wrap;
        }

        /* The stage takes all the space that is left; everything inside the frame
           is sized from it (see fitStage / fitFonts), so the page never scrolls. */
        #stage {
            flex: none;
            width: 100%;
            max-width: 1050px;
            height: 300px;                 /* replaced by fitStage() */
            margin: 6px 0 var(--label-gap);
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        #game-area {
            position: relative;
            width: min(100%, 720px);       /* replaced by fitStage() */
            height: 100%;                  /* replaced by fitStage() */
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-1);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar-container {
            width: 100%;
            max-width: 1050px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 8px;
            border-radius: 99px;
            margin-bottom: 0;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button { font-family: inherit; }
        button:hover { filter: brightness(1.05); }
        button:disabled { cursor: not-allowed; }
        button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn:hover { transform: translateY(-2px); background-color: #4f46e5; }

        #reveal-btn { min-width: 170px; min-height: 40px; -webkit-user-select: none; user-select: none; touch-action: none; }
        #reveal-btn.next-mode { background-color: var(--correct); touch-action: manipulation; }
        #reveal-btn.next-mode:hover { background-color: #059669; }

        /* ---------- The monster ---------- */
        #chip {
            position: absolute;
            top: 10px;
            left: 12px;
            padding: 3px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4338ca;
            background: #e0e7ff;
            border-radius: 99px;
            pointer-events: none;
        }

        #monster-wrap { flex: 0 0 36%; min-height: 0; display: flex; justify-content: center; }
        #monster { height: 100%; width: auto; max-width: 100%; display: block; }

        .mouth { display: none; }
        #monster[data-mood="normal"] .m-normal,
        #monster[data-mood="happy"] .m-happy,
        #monster[data-mood="oops"] .m-oops { display: inline; }
        #monster[data-mood="happy"] .bob { animation: hop 0.55s ease; }
        .bob { transform-box: fill-box; transform-origin: center bottom; }

        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            40% { transform: translateY(-12px); }
        }

        /* ---------- Speech bubble with the word written by the monster ---------- */
        #bubble {
            position: relative;
            flex: 0 0 24%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 64px 0 16px;
            background: #fffdf5;
            border: 3px solid #94a3b8;
            border-radius: 24px;
        }
        #bubble::before {                    /* little tail pointing at the monster */
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            margin-left: -12px;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 14px solid #94a3b8;
        }
        #bubble::after {
            content: '';
            position: absolute;
            top: -9px;
            left: 50%;
            margin-left: -10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 11px solid #fffdf5;
        }

        #word {
            font-size: var(--wfs, 40px);
            font-weight: 500;
            letter-spacing: 0.08em;
            line-height: 1.2;
            white-space: nowrap;
            text-align: center;
        }

        .ltr {
            display: inline-block;
            padding: 0 0.03em;
            border-radius: 8px;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            transition: background-color 0.12s ease;
        }
        .ltr:hover { background: #e0e7ff; }
        .ltr:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

        /* The part the child has tapped: strong background AND underline */
        .ltr.sel { background: #fde68a; box-shadow: 0 4px 0 #ca8a04; }
        .ltr.wobble { animation: wobble 0.45s ease; }

        /* After the fix, the new letters are shown in green */
        .fixed { color: #047857; background: #bbf7d0; border-radius: 8px; padding: 0 0.03em; }
        .plain { padding: 0 0.03em; }

        #spk {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: #e0e7ff;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
        }

        /* ---------- Options ---------- */
        #options {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        #opt-hint { color: var(--text-dim); font-size: 1rem; text-align: center; }

        .opt {
            flex: 1;
            max-width: 200px;
            height: var(--obh, 80px);
            font-size: var(--ofs, 36px);
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--text);
            background: #ffffff;
            border: 3px solid #94a3b8;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }
        .opt:hover:not(:disabled) { border-color: var(--accent); }
        .opt.wrong { opacity: 0.4; cursor: not-allowed; }
        .opt.good { background: #bbf7d0; border-color: #059669; opacity: 1; }
        .opt:disabled:not(.wrong):not(.good) { opacity: 0.55; }

        /* Help (hold): thick ring and a pulse on the wrong part, or on the right
           option (shape and motion, not only colour) */
        #game-area.peeking .ltr.err:not(.fixed) {
            outline: 4px solid var(--accent);
            outline-offset: 3px;
            animation: pulse 0.9s ease-in-out infinite;
        }
        #game-area.peeking .opt.right:not(:disabled) {
            border-color: var(--accent);
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.4);
            animation: pulse 0.9s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-9deg); }
            40% { transform: rotate(8deg); }
            60% { transform: rotate(-5deg); }
            80% { transform: rotate(3deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            #game-area.peeking .ltr.err, #game-area.peeking .opt.right { animation: none; }
            .ltr.wobble, #monster[data-mood="happy"] .bob { animation: none; }
            .progress-bar-fill, .cool-btn { transition: none; }
        }

        @media (max-width: 600px) {
            :root { --page-space: 14px; }
            body { padding: var(--page-space) 10px calc(var(--page-space) + env(safe-area-inset-bottom, 0px)); }
            h1 { font-size: 1.2rem; }
            #game-stats { gap: 4px 12px; padding: 5px 14px; font-size: 0.9rem; }
            #instruction-banner { font-size: 0.9rem; padding: 3px 12px; }
            #game-area { padding: 8px; }
            #bubble { padding: 0 54px 0 10px; }
            #spk { width: 38px; height: 38px; right: 8px; }
            #options { gap: 8px; }
        }
    </style>
</head>
<body>

    <h1 id="game-title">Le parole del mostro</h1>

    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span id="time-wrap">Tempo: <strong id="time-value">0s</strong></span>
        <span>Tentativi: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style" aria-live="polite">
        <div class="info-main" id="info-main"></div>
    </h3>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn"><span>💡 Help!</span></button>
    </div>

    <div id="stage">
        <div id="game-area">
            <div id="chip"></div>

            <div id="monster-wrap">
                <svg id="monster" viewBox="0 0 240 190" data-mood="normal" role="img" aria-label="Il mostro amichevole">
                    <g class="bob">
                        <!-- feet -->
                        <ellipse cx="88" cy="176" rx="26" ry="10" fill="#7c3aed"/>
                        <ellipse cx="152" cy="176" rx="26" ry="10" fill="#7c3aed"/>
                        <!-- arms -->
                        <ellipse cx="40" cy="120" rx="14" ry="27" fill="#8b5cf6" transform="rotate(20 40 120)"/>
                        <ellipse cx="200" cy="120" rx="14" ry="27" fill="#8b5cf6" transform="rotate(-20 200 120)"/>
                        <!-- pencil in the right hand -->
                        <g transform="rotate(35 208 128)">
                            <rect x="202" y="94" width="12" height="50" rx="2" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
                            <path d="M202 144 L208 158 L214 144 Z" fill="#fcd9a8" stroke="#ca8a04" stroke-width="2"/>
                            <rect x="202" y="90" width="12" height="10" rx="2" fill="#fb7185"/>
                        </g>
                        <!-- horns -->
                        <path d="M84 52 L72 20 L102 44 Z" fill="#fde68a" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M156 52 L168 20 L138 44 Z" fill="#fde68a" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
                        <!-- body -->
                        <ellipse cx="120" cy="108" rx="82" ry="68" fill="#a78bfa" stroke="#7c3aed" stroke-width="4"/>
                        <ellipse cx="120" cy="130" rx="52" ry="36" fill="#c4b5fd" opacity="0.6"/>
                        <!-- eyes -->
                        <circle cx="94" cy="98" r="19" fill="#ffffff" stroke="#4c1d95" stroke-width="3"/>
                        <circle cx="146" cy="98" r="19" fill="#ffffff" stroke="#4c1d95" stroke-width="3"/>
                        <circle cx="97" cy="100" r="8" fill="#1e1b4b"/>
                        <circle cx="143" cy="100" r="8" fill="#1e1b4b"/>
                        <circle cx="100" cy="96" r="3" fill="#ffffff"/>
                        <circle cx="146" cy="96" r="3" fill="#ffffff"/>
                        <!-- cheeks -->
                        <circle cx="70" cy="128" r="9" fill="#f9a8d4" opacity="0.8"/>
                        <circle cx="170" cy="128" r="9" fill="#f9a8d4" opacity="0.8"/>
                        <!-- mouths: one is shown depending on the mood -->
                        <path class="mouth m-normal" d="M 100 134 Q 120 154 140 134" fill="none" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
                        <g class="mouth m-happy">
                            <path d="M 98 128 Q 120 172 142 128 Z" fill="#7f1d1d" stroke="#4c1d95" stroke-width="4" stroke-linejoin="round"/>
                            <ellipse cx="120" cy="152" rx="11" ry="6" fill="#fb7185"/>
                        </g>
                        <ellipse class="mouth m-oops" cx="120" cy="144" rx="9" ry="11" fill="#7f1d1d" stroke="#4c1d95" stroke-width="4"/>
                    </g>
                </svg>
            </div>

            <div id="bubble">
                <div id="word" aria-label="Parola scritta dal mostro"></div>
                <button type="button" id="spk" aria-label="Ascolta la parola">🔊</button>
            </div>

            <div id="options"></div>
        </div>
    </div>

    <h1 class="section-heading">Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <script>
        /* =====================================================
           ROUNDS - edit here. Ordered from easy to hard.
           title: the topic, shown in the corner of the game
           words: the monster's words. For each one:
             word:    the correct spelling
             shown:   the wrong spelling written by the monster
             start/end: the wrong part of `shown`, as letter positions
                      (start included, end excluded: "gato", 2, 3 = the "t")
             fix:     what that part should be ("tt")
             options: the 3 choices, including `fix` (not the wrong part)
           Rule: shown.slice(0, start) + fix + shown.slice(end) must equal word.
           ===================================================== */
        const ROUNDS = [
            { title: 'Doppie', words: [
                { word: 'gatto',  shown: 'gato',  start: 2, end: 3, fix: 'tt', options: ['tt', 'dd', 'ttt'] },
                { word: 'mamma',  shown: 'mama',  start: 2, end: 3, fix: 'mm', options: ['mm', 'nn', 'mmm'] },
                { word: 'pizza',  shown: 'piza',  start: 2, end: 3, fix: 'zz', options: ['zz', 'ss', 'zzz'] },
                { word: 'bella',  shown: 'bela',  start: 2, end: 3, fix: 'll', options: ['ll', 'rr', 'lll'] } ] },

            { title: 'GLI e LI', words: [
                { word: 'figlio',   shown: 'filio',   start: 2, end: 4, fix: 'gli', options: ['gli', 'gni', 'gi'] },
                { word: 'famiglia', shown: 'familia', start: 4, end: 6, fix: 'gli', options: ['gli', 'gni', 'gi'] },
                { word: 'aglio',    shown: 'alio',    start: 1, end: 3, fix: 'gli', options: ['gli', 'gni', 'gi'] },
                { word: 'coniglio', shown: 'conilio', start: 4, end: 6, fix: 'gli', options: ['gli', 'gni', 'gi'] } ] },

            { title: 'CU, QU e CQU', words: [
                { word: 'quadro', shown: 'cuadro', start: 0, end: 2, fix: 'qu',  options: ['qu', 'cqu', 'ku'] },
                { word: 'scuola', shown: 'squola', start: 1, end: 3, fix: 'cu',  options: ['cu', 'cqu', 'ku'] },
                { word: 'acqua',  shown: 'aqua',   start: 1, end: 3, fix: 'cqu', options: ['cqu', 'cu', 'ku'] },
                { word: 'cuore',  shown: 'quore',  start: 0, end: 2, fix: 'cu',  options: ['cu', 'cqu', 'ku'] } ] },

            { title: 'La H', words: [
                { word: 'chiave',   shown: 'ciave',   start: 0, end: 2, fix: 'chi', options: ['chi', 'ghi', 'ki'] },
                { word: 'funghi',   shown: 'fungi',   start: 3, end: 5, fix: 'ghi', options: ['ghi', 'gli', 'chi'] },
                { word: 'occhio',   shown: 'occio',   start: 2, end: 4, fix: 'chi', options: ['chi', 'ghi', 'ki'] },
                { word: 'ghiaccio', shown: 'giaccio', start: 0, end: 2, fix: 'ghi', options: ['ghi', 'chi', 'ci'] } ] },

            { title: 'Gli accenti', words: [
                { word: 'città',  shown: 'citta',  start: 4, end: 5, fix: 'à', options: ['à', 'á', 'è'] },
                { word: 'caffè',  shown: 'caffe',  start: 4, end: 5, fix: 'è', options: ['è', 'é', 'ì'] },
                { word: 'perché', shown: 'perche', start: 5, end: 6, fix: 'é', options: ['é', 'è', 'ê'] },
                { word: 'più',    shown: 'piu',    start: 2, end: 3, fix: 'ù', options: ['ù', 'ú', 'ò'] } ] },

            { title: 'Tutti insieme', words: [
                { word: 'cappotto', shown: 'capotto', start: 2, end: 3, fix: 'pp', options: ['pp', 'bb', 'ppp'] },
                { word: 'scimmia',  shown: 'scimia',  start: 3, end: 4, fix: 'mm', options: ['mm', 'nn', 'mmm'] },
                { word: 'quattro',  shown: 'cuattro', start: 0, end: 2, fix: 'qu', options: ['qu', 'cqu', 'ku'] },
                { word: 'virtù',    shown: 'virtu',   start: 4, end: 5, fix: 'ù',  options: ['ù', 'ú', 'ò'] },
                { word: 'foglio',   shown: 'folio',   start: 2, end: 4, fix: 'gli', options: ['gli', 'gni', 'gi'] } ] }
        ];

        /* =====================================================
           OPTIONS - change these values in code
           voice:          speak words aloud
           autoSpeakWord:  say the intended word when it appears
                           (so the child knows which word the monster means)
           showTime:       show the timer in the stats bar
           ===================================================== */
        const prefs = {
            voice: true,
            autoSpeakWord: true,
            showTime: true
        };

        /* ---------- Template elements and state ---------- */
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const roundValueEl = document.getElementById('round-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const revealBtn = document.getElementById('reveal-btn');

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let isPeeking = false;

        /* ---------- Timer ---------- */
        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        /* ---------- Stats ---------- */
        function updateTimerDisplay() { timeValueEl.textContent = elapsedSeconds + 's'; }
        function updateMovesDisplay() { movesValueEl.textContent = moveCount; }
        function updateRevealsDisplay() { revealsValueEl.textContent = revealCount; }
        function updateRoundDisplay() { roundValueEl.textContent = (roundIdx + 1) + ' / ' + ROUNDS.length; }

        function addMove() {
            moveCount++;
            updateMovesDisplay();
        }

        function resetStats() {
            moveCount = 0;
            revealCount = 0;
            updateMovesDisplay();
            updateRevealsDisplay();
        }

        function setProgress(percent) {
            progressBarFill.style.width = Math.min(Math.max(percent, 0), 100) + '%';
        }

        /* ---------- Help button (hold to show, release to hide) ---------- */
        function onHelpStart() { frameEl.classList.add('peeking'); }
        function onHelpEnd() { frameEl.classList.remove('peeking'); }

        function showPeek() {
            if (nextMode) { goNext(); return; }
            if (isPeeking || revealBtn.disabled) return;
            isPeeking = true;
            revealCount++;
            updateRevealsDisplay();
            onHelpStart();
        }

        function hidePeek() {
            if (!isPeeking) return;
            isPeeking = false;
            onHelpEnd();
        }

        revealBtn.addEventListener('mousedown', showPeek);
        revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showPeek(); }, { passive: false });
        revealBtn.addEventListener('mouseup', hidePeek);
        revealBtn.addEventListener('mouseleave', hidePeek);
        revealBtn.addEventListener('touchend', hidePeek);
        revealBtn.addEventListener('touchcancel', hidePeek);
        revealBtn.addEventListener('blur', hidePeek);
        revealBtn.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); showPeek(); }
        });
        revealBtn.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Enter') hidePeek();
        });

        /* =====================================================
           Fix the Monster's Words
           ===================================================== */
        const stageEl = document.getElementById('stage');
        const frameEl = document.getElementById('game-area');
        const wordEl = document.getElementById('word');
        const optionsEl = document.getElementById('options');
        const bubbleEl = document.getElementById('bubble');
        const monsterEl = document.getElementById('monster');
        const chipEl = document.getElementById('chip');
        const infoMainEl = document.getElementById('info-main');
        const spkBtn = document.getElementById('spk');

        let roundIdx = 0;
        let wordIdx = 0;
        let step = 1;              // 1 = find the wrong part, 2 = choose the spelling, 3 = fixed
        let wordsDone = 0;         // words fixed so far, in all rounds
        let timerStarted = false;
        let nextMode = false;
        let moodTimer = null;
        let statusHtml = '';
        let statusKind = '';

        const TOTAL_WORDS = ROUNDS.reduce((n, r) => n + r.words.length, 0);

        function current() { return ROUNDS[roundIdx].words[wordIdx]; }

        /* ---------- Voice ---------- */
        function say(text, force) {
            if (!prefs.voice && !force) return;
            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'it-IT';
                u.rate = 0.8;
                speechSynthesis.speak(u);
            } catch (e) {}
        }

        spkBtn.addEventListener('click', () => say(current().word, true));

        /* ---------- Info bar ---------- */
        function renderInfo() {
            const total = ROUNDS[roundIdx].words.length;
            const lead = step === 1 ? 'Tocca la parte sbagliata' : (step === 2 ? 'Come si scrive?' : '');
            infoMainEl.className = 'info-main' + (statusHtml && statusKind ? ' ' + statusKind : '');
            infoMainEl.innerHTML = statusHtml ||
                ('<span>' + lead + '</span><span class="cnt">Parola ' + (wordIdx + 1) + ' / ' + total + '</span>');
        }

        function setStatus(html, kind) {
            statusHtml = html || '';
            statusKind = kind || '';
            renderInfo();
        }

        /* ---------- Monster mood ---------- */
        function setMood(mood, backMs) {
            clearTimeout(moodTimer);
            monsterEl.setAttribute('data-mood', mood);
            if (backMs) moodTimer = setTimeout(() => monsterEl.setAttribute('data-mood', 'normal'), backMs);
        }

        /* ---------- Helpers ---------- */
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startTimerOnce() {
            if (timerStarted) return;
            timerStarted = true;
            startElapsedTimer();
        }

        /* ---------- Layout: size the frame, then the text inside it ---------- */
        function fitFonts() {
            const r = ROUNDS[roundIdx];
            const maxLen = Math.max.apply(null, r.words.map(w => Math.max(w.shown.length, w.word.length)));
            const wordW = bubbleEl.clientWidth - 90;
            const wfs = Math.max(22, Math.min(bubbleEl.clientHeight * 0.58, wordW / (maxLen * 0.74), 76));
            frameEl.style.setProperty('--wfs', wfs.toFixed(1) + 'px');

            const maxOpt = Math.max.apply(null, r.words.map(w => Math.max.apply(null, w.options.map(o => o.length))));
            const optH = optionsEl.clientHeight;
            const btnW = (optionsEl.clientWidth - 24) / 3;
            const ofs = Math.max(18, Math.min(optH * 0.42, (btnW * 0.8) / (maxOpt * 0.74), 56));
            frameEl.style.setProperty('--ofs', ofs.toFixed(1) + 'px');
            frameEl.style.setProperty('--obh', Math.max(48, Math.min(optH, 96)) + 'px');
        }

        function fitStage() {
            const body = document.body;
            const bcs = getComputedStyle(body);
            const avail = body.clientHeight - parseFloat(bcs.paddingTop) - parseFloat(bcs.paddingBottom);

            let used = 0;
            Array.from(body.children).forEach(el => {
                if (el === stageEl || el.tagName === 'SCRIPT') return;
                const c = getComputedStyle(el);
                if (c.display === 'none') return;
                used += el.offsetHeight + parseFloat(c.marginTop) + parseFloat(c.marginBottom);
            });
            const scs = getComputedStyle(stageEl);
            used += parseFloat(scs.marginTop) + parseFloat(scs.marginBottom);

            const h = Math.max(280, avail - used);
            stageEl.style.height = h + 'px';
            frameEl.style.height = h + 'px';
            frameEl.style.width = Math.min(stageEl.clientWidth, 720) + 'px';
            fitFonts();
        }

        window.addEventListener('resize', fitStage);
        window.addEventListener('orientationchange', fitStage);
        window.addEventListener('load', fitStage);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitStage);

        /* ---------- Drawing the word and the options ---------- */
        function renderWord() {
            const w = current();
            if (step === 3) {
                wordEl.innerHTML =
                    '<span class="plain">' + w.shown.slice(0, w.start) + '</span>' +
                    '<span class="fixed">' + w.fix + '</span>' +
                    '<span class="plain">' + w.shown.slice(w.end) + '</span>';
                wordEl.setAttribute('aria-label', 'Parola corretta: ' + w.word);
                return;
            }
            wordEl.innerHTML = Array.from(w.shown).map((ch, i) =>
                '<span class="ltr' + (i >= w.start && i < w.end ? ' err' : '') + (step === 2 && i >= w.start && i < w.end ? ' sel' : '') +
                '" role="button" tabindex="0" data-i="' + i + '">' + ch + '</span>'
            ).join('');
            wordEl.setAttribute('aria-label', 'Parola scritta dal mostro: ' + w.shown);
        }

        function renderOptionsHint() {
            optionsEl.innerHTML = '<div id="opt-hint">Prima trova la parte sbagliata della parola</div>';
        }

        function renderOptions() {
            const w = current();
            optionsEl.innerHTML = shuffle(w.options).map(o =>
                '<button type="button" class="opt' + (o === w.fix ? ' right' : '') + '" data-v="' + o + '">' + o + '</button>'
            ).join('');
        }

        function setNextMode(on, isLast) {
            nextMode = on;
            revealBtn.classList.toggle('next-mode', on);
            revealBtn.querySelector('span').textContent = on ? (isLast ? '🔄 Gioca ancora' : '➡️ Avanti') : '💡 Help!';
        }

        function loadWord() {
            const w = current();
            step = 1;
            hidePeek();
            setNextMode(false);
            setMood('normal');
            chipEl.textContent = ROUNDS[roundIdx].title;
            updateRoundDisplay();
            setStatus('');
            renderWord();
            renderOptionsHint();
            fitFonts();
            if (prefs.autoSpeakWord) setTimeout(() => say(w.word), 400);
        }

        /* ---------- Interaction ---------- */
        function onLetter(el) {
            if (!el || step !== 1) return;
            const w = current();
            const i = parseInt(el.dataset.i, 10);

            startTimerOnce();
            addMove();

            if (i >= w.start && i < w.end) {
                step = 2;
                setStatus('');
                renderWord();
                renderOptions();
            } else {
                el.classList.remove('wobble');
                void el.offsetWidth;
                el.classList.add('wobble');
                setMood('oops', 900);
                setStatus('Questa parte è giusta. Cerca ancora!', 'retry');
            }
        }

        function onOption(btn) {
            if (!btn || step !== 2 || btn.disabled) return;
            const w = current();

            addMove();

            if (btn.dataset.v === w.fix) {
                step = 3;
                hidePeek();
                wordsDone++;
                setProgress((wordsDone / TOTAL_WORDS) * 100);
                renderWord();
                Array.from(optionsEl.querySelectorAll('.opt')).forEach(b => { b.disabled = true; });
                btn.classList.add('good');
                setMood('happy', 1800);
                say(w.word);

                const lastWord = wordIdx === ROUNDS[roundIdx].words.length - 1;
                const lastRound = roundIdx === ROUNDS.length - 1;
                if (lastWord && lastRound) {
                    stopElapsedTimer();
                    setStatus('Bravo! Hai finito tutti i round!', 'ok');
                } else if (lastWord) {
                    setStatus('Bravo! Round completato: ' + w.word, 'ok');
                } else {
                    setStatus('Bravo! ' + w.word, 'ok');
                }
                setNextMode(true, lastWord && lastRound);
            } else {
                btn.disabled = true;
                btn.classList.add('wrong');
                setMood('oops', 900);
                setStatus('Non è questa. Riprova!', 'retry');
            }
        }

        function goNext() {
            if (step !== 3) return;
            if (wordIdx < ROUNDS[roundIdx].words.length - 1) {
                wordIdx++;
                loadWord();
            } else if (roundIdx < ROUNDS.length - 1) {
                roundIdx++;
                wordIdx = 0;
                loadWord();
                fitFonts();
            } else {
                roundIdx = 0;
                wordIdx = 0;
                initGame();
            }
        }

        wordEl.addEventListener('click', (e) => onLetter(e.target.closest('.ltr')));
        wordEl.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const el = e.target.closest && e.target.closest('.ltr');
            if (!el) return;
            e.preventDefault();
            onLetter(el);
        });
        optionsEl.addEventListener('click', (e) => onOption(e.target.closest('.opt')));

        wordEl.addEventListener('animationend', (e) => {
            if (e.animationName === 'wobble') e.target.classList.remove('wobble');
        });

        /* ---------- Init ---------- */
        function initGame() {
            stopElapsedTimer();
            timerStarted = false;
            elapsedSeconds = 0;
            updateTimerDisplay();
            resetStats();
            wordsDone = 0;
            setProgress(0);
            document.getElementById('time-wrap').hidden = !prefs.showTime;
            loadWord();
            fitStage();
        }

        initGame();
    </script>
</body>
</html>
