<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Gioco</title>
    <style>
        :root {
            --bg-0: #e6e6e6;
            --bg-1: #ffffff;
            --bg-2: #f1f5f9;
            --accent: #6366f1;
            --accent-2: #06b6d4;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Progress Bar Styles */
        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 12px;
            border-radius: 99px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #game-stats, .stats-style {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #4f46e5;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        }

        .cool-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
        }

        #next-btn {
            background-color: var(--correct);
        }

        #next-btn:hover {
            background-color: #059669;
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.4);
        }

        #next-btn:active {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }
    </style>

    <style>
        /* Montessori Shape Styles */
        .shape {
            display: inline-block;
            flex-shrink: 0;
        }

                .triangle-black {
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #1e293b;
        }
        .triangle-lightblue {
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid #38bdf8;
        }
        .triangle-darkblue {
            width: 0; height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 16px solid #1e40af;
        }
        .circle-red {
            width: 17px; height: 17px;
            background-color: #ef4444;
            border-radius: 50%;
        }
        .circle-orange {
            width: 12px; height: 12px;
            background-color: #f97316;
            border-radius: 50%;
        }
        .bridge-green {
            width: 20px; height: 9px;
            border-top: 3px solid #22c55e;
            border-radius: 10px 10px 0 0;
        }
        .triangle-purple {
            width: 0; height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 18px solid #9333ea;
        }
        .ribbon-pink {
            width: 17px; height: 9px;
            background-color: #ec4899;
            border-radius: 2px;
        }
        .punctuation-gray {
            font-weight: bold;
            color: #94a3b8;
            font-size: 1rem;
        }

        .word-text {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .word-label {
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Single line container designed to fit all words nicely */
        .results-container {
            background: var(--card-bg);
            padding: 2rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: nowrap;
            align-items: flex-end;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

         .word-token-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            flex: 1;
            min-width: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

    </style>
</head>
<body>

    <h1 id="game-title">Nuovo Gioco</h1>
    
    <div id="game-stats">
        <span>Round: <strong id="progress-value">1 / 4</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Osserva l'immagine e scegli, tra le 2 opzioni, l'emozione che la descrive meglio</h3>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>▶ Prossimo</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <div id="game-workspace" class="section-wrapper" style="align-items: center; background: var(--bg-1); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border); min-height: 200px;">
        <!-- Styled text card/border -->
        <div style="background-color: var(--bg-2); border: 2px solid #a5b4fc; border-radius: 16px; padding: 20px 32px; box-shadow: var(--shadow-sm); width: 100%; max-width: 600px; text-align: center;">
            <span id="round-text-label" style="font-size: 1.25rem; font-weight: 600; color: var(--text);"></span>
        </div>
         <!-- Expanded single-line container -->
        <div class="results-container" id="resultsContainer">
            <!-- Dynamic tokens populate here -->
        </div>
    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <script>
        function analyzeItalianGrammar(sentence) {
            const tokens = sentence.match(/[\wÀ-ÿ]+|[.,!?;]/g) || [];

            const lexicon = {
                articolo: ["il", "lo", "la", "i", "gli", "le", "un", "uno", "una"],
                preposizione: [
                    "di", "a", "da", "in", "con", "su", "per", "tra", "fra", 
                    "al", "del", "dal", "nel", "sul", "allo", "dallo", "nello", "sullo", 
                    "alla", "dalla", "nella", "sulla", "ai", "dai", "nei", "sui", 
                    "agli", "dagli", "negli", "sugli", "alle", "dalle", "nelle", "sulle"
                ],
                pronome: ["io", "tu", "egli", "esso", "essa", "noi", "voi", "essi", "esse", "lui", "lei", "loro", "mi", "ti", "si", "ci", "vi", "ne", "che", "cui"],
                congiunzione: ["e", "ed", "o", "ma", "però", "anche", "se", "perché", "poiché", "quindi", "dunque"],
                verbo: [
                    "vado", "vai", "va", "andiamo", "andate", "vanno", "andare",
                    "sono", "sei", "è", "siamo", "siete", "essere",
                    "ho", "hai", "ha", "abbiamo", "avete", "hanno", "avere",
                    "fai", "fa", "facciamo", "fate", "fanno", "fare",
                    "giocare", "gioco", "giochi", "gioca", "giochiamo", "giocate", "giocano",
                    "dorme", "corre", "mangia", "parla", "legge", "scrive"
                ]
            };

            return tokens.map(token => {
                let lower = token.toLowerCase();
                let element = "Nome";
                let cssClass = "triangle-black";

                if (/^[.,!?;]$/.test(token)) {
                    return { word: token, elemento: "Punt.", cssClass: "punctuation-gray" };
                }

                if (lexicon.articolo.includes(lower)) {
                    element = "Articolo";
                    cssClass = "triangle-lightblue";
                } else if (lexicon.preposizione.includes(lower)) {
                    element = "Prepos.";
                    cssClass = "bridge-green";
                } else if (lexicon.pronome.includes(lower)) {
                    element = "Pronome";
                    cssClass = "triangle-purple";
                } else if (lexicon.congiunzione.includes(lower)) {
                    element = "Congiunz.";
                    cssClass = "ribbon-pink";
                } else if (lexicon.verbo.includes(lower) || lower.endsWith("are") || lower.endsWith("ere") || lower.endsWith("ire")) {
                    element = "Verbo";
                    cssClass = "circle-red";
                } else if (lower.endsWith("mente")) {
                    element = "Avverbio";
                    cssClass = "circle-orange";
                } else if (["oso", "osa", "osi", "ose", "ile", "ista", "ero", "era", "eri", "ere"].some(s => lower.endsWith(s))) {
                    element = "Aggettivo";
                    cssClass = "triangle-darkblue";
                }

                return { word: token, elemento: element, cssClass };
            });
        }
        
        function renderAnalysis(sentence) {
        
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            console.log(sentence);
            const analysisResults = analyzeItalianGrammar(sentence);

            analysisResults.forEach(res => {
                const box = document.createElement('div');
                box.className = 'word-token-box';

                box.innerHTML = `
                    <div class="symbol-area">
                        <div class="shape ${res.cssClass}"></div>
                    </div>
                    <div class="word-text" title="${res.word}">${res.word}</div>
                    <div class="word-label" title="${res.elemento}">${res.elemento}</div>
                `;
                container.appendChild(box);
            });
            
        }

    </script>

    <script>
        const ROUNDS = [
            { text: "I bambini giocano a palla" },
            { text: "Scena 2: Riconosci l'espressione di tristezza." },
            { text: "Scena 3: Riconosci l'espressione di rabbia." },
            { text: "Scena 4: Riconosci l'espressione di sorpresa." }
        ];

        const TOTAL_ROUNDS = ROUNDS.length;
        let currentRound = 0;

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const instructionBanner = document.getElementById('instruction-banner');
        const roundTextLabel = document.getElementById('round-text-label');

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function registerMove() {
            moveCount++;
            updateMovesDisplay();
        }

        function loadRound(index) {
            if (index >= TOTAL_ROUNDS) {
                progressBarFill.style.width = '100%';
                instructionBanner.textContent = "Hai completato tutto! 🎉";
                roundTextLabel.textContent = "Ottimo lavoro!";
                return;
            }

            const progressRatio = (index / TOTAL_ROUNDS) * 100;
            progressBarFill.style.width = progressRatio + '%';

            roundTextLabel.textContent = ROUNDS[index].text;

            elapsedSeconds = 0;
            moveCount = 0;
            revealCount = 0;

            progressValueEl.textContent = `${index + 1} / ${TOTAL_ROUNDS}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.classList.add('smooth-hidden');
            revealBtn.classList.remove('smooth-hidden');
            revealBtn.disabled = false;

            renderAnalysis(roundTextLabel.textContent);

        }

        nextBtn.addEventListener('click', () => {
            currentRound++;
            loadRound(currentRound);
        });

        revealBtn.addEventListener('click', () => {
            revealCount++;
            updateRevealsDisplay();
        });

        loadRound(currentRound);
    </script>
</body>
</html>
