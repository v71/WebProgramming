<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Frasi Relative</title>
    <style>
        :root {
            --bg-0: #e6e6e6;
            --bg-1: #ffffff;
            --bg-2: #f1f5f9;
            --accent: #6366f1;
            --accent-2: #06b6d4;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 0.92rem;
            background: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
        }

        .controls {
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 44px;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Progress Bar Styles */
        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 10px;
            border-radius: 99px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #game-stats, .stats-style {
            margin: 0 0 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 8px 16px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #4f46e5;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        }

        .cool-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
        }

        #next-btn {
            background-color: var(--correct);
        }

        #next-btn:hover {
            background-color: #059669;
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.4);
        }

        #next-btn:active {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }
    </style>

    <style>
        /* Montessori Shape Styles */
        .shape {
            display: inline-block;
            flex-shrink: 0;
        }

        .triangle-black { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #1e293b; }
        .triangle-lightblue { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid #38bdf8; }
        .triangle-darkblue { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #1e40af; }
        .circle-red { width: 14px; height: 14px; background-color: #ef4444; border-radius: 50%; }
        .circle-orange { width: 11px; height: 11px; background-color: #f97316; border-radius: 50%; }
        .bridge-green { width: 16px; height: 8px; border-top: 2px solid #22c55e; border-radius: 8px 8px 0 0; }
        .triangle-purple { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #9333ea; }
        .ribbon-pink { width: 14px; height: 8px; background-color: #ec4899; border-radius: 2px; }
        .punctuation-gray { font-weight: bold; color: #94a3b8; font-size: 0.9rem; }

        .word-text {
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .word-label {
            font-size: 0.6rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .results-container {
            background: transparent;
            padding: 0.2rem 0;
            border-radius: 12px;
            display: flex;
            flex-wrap: nowrap;
            align-items: stretch;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
            overflow: hidden;
            margin-bottom: 10px;
            min-height: 80px;
        }

        .word-token-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.5rem 0.6rem;
            flex: 1;
            min-width: 0;
            box-shadow: var(--shadow-sm);
        }

        .symbol-area {
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.3rem;
        }

        /* 3 Image Display Container Accommodating 340x380 */
        .images-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .image-card-slot {
            flex-shrink: 0;
            width: 340px;
            height: 380px;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 2px solid #a5b4fc;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .image-card-slot:hover:not(.disabled-option) {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .image-card-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px; /* Added rounded borders */
        }

        .image-card-slot span {
            position: absolute;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* State Classes */
        .correct-option {
            border-color: var(--correct) !important;
            background-color: rgba(16, 185, 129, 0.1) !important;
        }

        .wrong-option {
            border-color: var(--wrong) !important;
            background-color: rgba(239, 68, 68, 0.05) !important;
            animation: shake 0.4s ease;
        }

        .disabled-option {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .peek {
            border-color: var(--correct) !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
            background-color: rgba(16, 185, 129, 0.08) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            margin: auto;
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <h1 id="game-title">Frasi Relative</h1>
    
    <div id="game-stats">
        <span>Round: <strong id="progress-value">1 / 4</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Tentativi: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Osserva l'immagine e scegli quella che descrive meglio la frase</h3>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>▶ Prossima immagine</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <div id="game-workspace" class="section-wrapper" style="align-items: center; background: var(--bg-1); padding: 15px 25px; border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border);">
        
        <!-- Styled text card/border -->
        <div style="background-color: var(--bg-2); border: 2px solid #a5b4fc; border-radius: 12px; padding: 10px 20px; box-shadow: var(--shadow-sm); width: 100%; max-width: 600px; text-align: center; margin-bottom: 10px;">
            <span id="round-text-label" style="font-size: 1.1rem; font-weight: 600; color: var(--text);"></span>
        </div>

        <!-- Expanded single-line container of cards placed directly under the text label -->
        <div class="results-container" id="resultsContainer">
            <!-- Dynamic tokens populate here -->
        </div>

        <!-- 3 Image Slots Container (340x380 each) placed under the cards -->
        <div class="images-grid" id="imagesGrid">
            <!-- Dynamic image slots populate here -->
        </div>
        
    </div>

    <!-- Results Summary Screen -->
    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Tempo</th>
                    <th>Tentativi</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <script>
        function analyzeItalianGrammar(sentence) {
            const tokens = sentence.match(/[\wÀ-ÿ]+|[.,!?;]/g) || [];

            const lexicon = {
                articolo: ["il", "lo", "la", "i", "gli", "le", "un", "uno", "una"],
                preposizione: [
                    "di", "a", "da", "in", "con", "su", "per", "tra", "fra", 
                    "al", "del", "dal", "nel", "sul", "allo", "dallo", "nello", "sullo", 
                    "alla", "dalla", "nella", "sulla", "ai", "dai", "nei", "sui", 
                    "agli", "dagli", "negli", "sugli", "alle", "dalle", "nelle", "sulle"
                ],
                pronome: ["io", "tu", "egli", "esso", "essa", "noi", "voi", "essi", "esse", "lui", "lei", "loro", "mi", "ti", "si", "ci", "vi", "ne", "che", "cui"],
                congiunzione: ["e", "ed", "o", "ma", "però", "anche", "se", "perché", "poiché", "quindi", "dunque"],
                verbo: [
                    "vado", "vai", "va", "andiamo", "andate", "vanno", "andare",
                    "sono", "sei", "è", "siamo", "siete", "essere","era",
                    "ho", "hai", "ha", "abbiamo", "avete", "hanno", "avere",
                    "fai", "fa", "facciamo", "fate", "fanno", "fare",
                    "giocare", "gioco", "giochi", "gioca", "giochiamo", "giochiate", "giocano",
                    "dorme", "corre", "mangia", "parla", "legge", "scrive"
                ]
            };

            return tokens.map(token => {
                let lower = token.toLowerCase();
                let element = "Nome";
                let cssClass = "triangle-black";

                if (/^[.,!?;]$/.test(token)) {
                    return { word: token, elemento: "Punt.", cssClass: "punctuation-gray" };
                }

                if (lexicon.articolo.includes(lower)) {
                    element = "Articolo";
                    cssClass = "triangle-lightblue";
                } else if (lexicon.preposizione.includes(lower)) {
                    element = "Prepos.";
                    cssClass = "bridge-green";
                } else if (lexicon.pronome.includes(lower)) {
                    element = "Pronome";
                    cssClass = "triangle-purple";
                } else if (lexicon.congiunzione.includes(lower)) {
                    element = "Congiunz.";
                    cssClass = "ribbon-pink";
                } else if (lexicon.verbo.includes(lower) || lower.endsWith("are") || lower.endsWith("ere") || lower.endsWith("ire")) {
                    element = "Verbo";
                    cssClass = "circle-red";
                } else if (lower.endsWith("mente")) {
                    element = "Avverbio";
                    cssClass = "circle-orange";
                } else if (["oso", "osa", "osi", "ose", "ile", "ista", "ero", "era", "eri", "ere"].some(s => lower.endsWith(s))) {
                    element = "Aggettivo";
                    cssClass = "triangle-darkblue";
                }

                return { word: token, elemento: element, cssClass };
            });
        }
        
        function renderAnalysis(sentence) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const analysisResults = analyzeItalianGrammar(sentence);

            analysisResults.forEach(res => {
                const box = document.createElement('div');
                box.className = 'word-token-box';

                box.innerHTML = `
                    <div class="symbol-area">
                        <div class="shape ${res.cssClass}"></div>
                    </div>
                    <div class="word-text" title="${res.word}">${res.word}</div>
                    <div class="word-label" title="${res.elemento}">${res.elemento}</div>
                `;
                container.appendChild(box);
            });
        }
    </script>

    <script>
        const ROUNDS = [
            { 
                text: "La bambina mangia la mela che era sul tavolo", 
                images: ["images-set-1/apple-girl-a.png", "images-set-1/pear-girl-c.png", "images-set-1/apple-girl-b.png"], 
                correctIndex: 2 
            },
            { 
                text: "Il cane rincorre il gatto", 
                images: ["images/cane_gatto_1.jpg", "images/cane_gatto_2.jpg", "images/cane_gatto_3.jpg"], 
                correctIndex: 1 
            },
            { 
                text: "Il gatto dorme al sole", 
                images: ["images/gatto_sole_1.jpg", "images/gatto_sole_2.jpg", "images/gatto_sole_3.jpg"], 
                correctIndex: 2 
            },
            { 
                text: "Il bambino gioca con il cane", 
                images: ["images/bambino_cane_1.jpg", "images/bambino_cane_2.jpg", "images/bambino_cane_3.jpg"], 
                correctIndex: 0 
            }
        ];

        let currentRoundIndex = 0;
        let roundResults = [];
        let roundCompleted = false;
        let isPeeking = false;

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const instructionBanner = document.getElementById('instruction-banner');
        const roundTextLabel = document.getElementById('round-text-label');
        const imagesGrid = document.getElementById('imagesGrid');
        const gameWorkspace = document.getElementById('game-workspace');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let optionElements = [];

        function initImageSlots() {
            imagesGrid.innerHTML = '';
            optionElements = [];
            for (let i = 0; i < 3; i++) {
                const slot = document.createElement('div');
                slot.className = 'image-card-slot';
                
                const span = document.createElement('span');
                span.textContent = `Immagine ${i + 1}`;
                slot.appendChild(span);

                const img = document.createElement('img');
                slot.appendChild(img);

                slot.addEventListener('click', () => {
                    handleOptionClick(slot, ROUNDS[currentRoundIndex]);
                });

                imagesGrid.appendChild(slot);
                optionElements.push(slot);
            }
        }

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function renderImages(roundData) {
            roundData.images.forEach((imgPath, idx) => {
                const slot = optionElements[idx];
                slot.className = 'image-card-slot';
                slot.dataset.isCorrect = (idx === roundData.correctIndex) ? 'true' : 'false';
                
                const img = slot.querySelector('img');
                const span = slot.querySelector('span');
                
                img.style.visibility = 'hidden';
                span.style.display = 'block';
                img.src = imgPath;
                img.alt = `Opzione ${idx + 1}`;
                
                img.onload = function() {
                    span.style.display = 'none';
                    img.style.visibility = 'visible';
                };

                img.onerror = function() {
                    img.style.visibility = 'hidden';
                    span.style.display = 'block';
                };
            });
        }

        function handleOptionClick(optionEl, roundData) {
            if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

            if (optionEl.dataset.isCorrect === 'true') {
                roundCompleted = true;
                stopElapsedTimer();

                moveCount++;
                updateMovesDisplay();

                optionElements.forEach(el => {
                    el.classList.remove('wrong-option', 'peek');
                    if (el !== optionEl) el.classList.add('disabled-option');
                });
                optionEl.classList.add('correct-option');

                progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                const wrongAttempts = moveCount - 1;
                const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                roundResults.push({
                    label: `Round ${currentRoundIndex + 1}`,
                    time: elapsedSeconds + 's',
                    moves: moveCount,
                    reveals: revealCount,
                    metric: metricValue
                });

                if (currentRoundIndex === ROUNDS.length - 1) {
                    nextBtn.textContent = "Fatto";
                } else {
                    nextBtn.textContent = "▶ Prossima immagine";
                }

                revealBtn.classList.add('smooth-hidden');
                nextBtn.classList.remove('smooth-hidden');
            } else {
                moveCount++;
                updateMovesDisplay();
                optionEl.classList.add('wrong-option', 'disabled-option');

                optionEl.addEventListener('animationend', () => {
                    optionEl.classList.remove('wrong-option');
                }, { once: true });
            }
        }

        function loadRound(index) {
            if (index >= ROUNDS.length) {
                showSummaryScreen();
                return;
            }

            roundCompleted = false;
            isPeeking = false;
            const progressRatio = (index / ROUNDS.length) * 100;
            progressBarFill.style.width = progressRatio + '%';

            const roundData = ROUNDS[index];
            roundTextLabel.textContent = roundData.text;

            elapsedSeconds = 0;
            moveCount = 0;
            revealCount = 0;

            progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.classList.add('smooth-hidden');
            revealBtn.classList.remove('smooth-hidden');
            revealBtn.disabled = false;

            renderAnalysis(roundTextLabel.textContent);
            renderImages(roundData);
        }

        function showSummaryScreen() {
            gameWorkspace.style.display = 'none';
            instructionBanner.style.display = 'none'; 
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            document.getElementById('action-controls').style.display = 'none';
            
            summaryTbody.innerHTML = '';
            let totalMetric = 0;

            roundResults.forEach(res => {
                totalMetric += res.metric;
                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                summaryTbody.appendChild(row);
            });

            const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
            const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

            summaryTotals.innerHTML = `
                <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
            `;

            summaryScreen.style.display = 'block';
        }

        function showPeek() {
            if (roundCompleted || isPeeking || revealBtn.disabled) return;
            isPeeking = true;

            revealCount++;
            updateRevealsDisplay();

            const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
            if (correctEl) correctEl.classList.add('peek');
        }

        function hidePeek() {
            if (!isPeeking) return;
            isPeeking = false;
            optionElements.forEach(el => el.classList.remove('peek'));
        }

        nextBtn.addEventListener('click', () => {
            if (currentRoundIndex === ROUNDS.length - 1) {
                showSummaryScreen();
            } else {
                currentRoundIndex++;
                loadRound(currentRoundIndex);
            }
        });

        revealBtn.addEventListener('mousedown', showPeek);
        revealBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showPeek();
        }, { passive: false });

        revealBtn.addEventListener('mouseup', hidePeek);
        revealBtn.addEventListener('mouseleave', hidePeek);
        revealBtn.addEventListener('touchend', hidePeek);
        revealBtn.addEventListener('touchcancel', hidePeek);

        initImageSlots();
        loadRound(currentRoundIndex);
    </script>
</body>
</html>
