<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizzatore Grammaticale Italiano - Riga Unica Espansa</title>
    
    <style>

        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Expanded container width */
        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .input-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Single line container designed to fit all words nicely */
        .results-container {
            background: var(--card-bg);
            padding: 2rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: nowrap;
            align-items: flex-end;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .word-token-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            flex: 1;
            min-width: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .symbol-area {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.4rem;
        }

        .word-text {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .word-label {
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Montessori Shape Styles */
        .shape {
            display: inline-block;
            flex-shrink: 0;
        }

        .triangle-black {
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #1e293b;
        }
        .triangle-lightblue {
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid #38bdf8;
        }
        .triangle-darkblue {
            width: 0; height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 16px solid #1e40af;
        }
        .circle-red {
            width: 17px; height: 17px;
            background-color: #ef4444;
            border-radius: 50%;
        }
        .circle-orange {
            width: 12px; height: 12px;
            background-color: #f97316;
            border-radius: 50%;
        }
        .bridge-green {
            width: 20px; height: 9px;
            border-top: 3px solid #22c55e;
            border-radius: 10px 10px 0 0;
        }
        .triangle-purple {
            width: 0; height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 18px solid #9333ea;
        }
        .ribbon-pink {
            width: 17px; height: 9px;
            background-color: #ec4899;
            border-radius: 2px;
        }
        .punctuation-gray {
            font-weight: bold;
            color: #94a3b8;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Analizzatore Grammaticale Italiano</h1>
        <p class="subtitle">Visualizzazione in riga unica su layout espanso</p>
    </header>

    <div class="input-card">
        <label for="sentenceInput">La tua frase in italiano:</label>
        <div class="input-group">
            <input type="text" id="sentenceInput" value="Io vado a giocare con il cane nero." placeholder="Scrivi qui una frase...">
            <button id="analyzeBtn">Analizza</button>
        </div>
    </div>

    <!-- Expanded single-line container -->
    <div class="results-container" id="resultsContainer">
        <!-- Dynamic tokens populate here -->
    </div>
</div>

<script>
    function analyzeItalianGrammar(sentence) {
        const tokens = sentence.match(/[\wÀ-ÿ]+|[.,!?;]/g) || [];

        const lexicon = {
            articolo: ["il", "lo", "la", "i", "gli", "le", "un", "uno", "una"],
            preposizione: [
                "di", "a", "da", "in", "con", "su", "per", "tra", "fra", 
                "al", "del", "dal", "nel", "sul", "allo", "dallo", "nello", "sullo", 
                "alla", "dalla", "nella", "sulla", "ai", "dai", "nei", "sui", 
                "agli", "dagli", "negli", "sugli", "alle", "dalle", "nelle", "sulle"
            ],
            pronome: ["io", "tu", "egli", "esso", "essa", "noi", "voi", "essi", "esse", "lui", "lei", "loro", "mi", "ti", "si", "ci", "vi", "ne", "che", "cui"],
            congiunzione: ["e", "ed", "o", "ma", "però", "anche", "se", "perché", "poiché", "quindi", "dunque"],
            verbo: [
                "vado", "vai", "va", "andiamo", "andate", "vanno", "andare",
                "sono", "sei", "è", "siamo", "siete", "essere",
                "ho", "hai", "ha", "abbiamo", "avete", "hanno", "avere",
                "fai", "fa", "facciamo", "fate", "fanno", "fare",
                "giocare", "gioco", "giochi", "gioca", "giochiamo", "giocate", "giocano",
                "dorme", "corre", "mangia", "parla", "legge", "scrive"
            ]
        };

        return tokens.map(token => {
            let lower = token.toLowerCase();
            let element = "Nome";
            let cssClass = "triangle-black";

            if (/^[.,!?;]$/.test(token)) {
                return { word: token, elemento: "Punt.", cssClass: "punctuation-gray" };
            }

            if (lexicon.articolo.includes(lower)) {
                element = "Articolo";
                cssClass = "triangle-lightblue";
            } else if (lexicon.preposizione.includes(lower)) {
                element = "Prepos.";
                cssClass = "bridge-green";
            } else if (lexicon.pronome.includes(lower)) {
                element = "Pronome";
                cssClass = "triangle-purple";
            } else if (lexicon.congiunzione.includes(lower)) {
                element = "Congiunz.";
                cssClass = "ribbon-pink";
            } else if (lexicon.verbo.includes(lower) || lower.endsWith("are") || lower.endsWith("ere") || lower.endsWith("ire")) {
                element = "Verbo";
                cssClass = "circle-red";
            } else if (lower.endsWith("mente")) {
                element = "Avverbio";
                cssClass = "circle-orange";
            } else if (["oso", "osa", "osi", "ose", "ile", "ista", "ero", "era", "eri", "ere"].some(s => lower.endsWith(s))) {
                element = "Aggettivo";
                cssClass = "triangle-darkblue";
            }

            return { word: token, elemento: element, cssClass };
        });
    }

    function renderAnalysis() {
        const inputVal = document.getElementById('sentenceInput').value;
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        const analysisResults = analyzeItalianGrammar(inputVal);

        analysisResults.forEach(res => {
            const box = document.createElement('div');
            box.className = 'word-token-box';

            box.innerHTML = `
                <div class="symbol-area">
                    <div class="shape ${res.cssClass}"></div>
                </div>
                <div class="word-text" title="${res.word}">${res.word}</div>
                <div class="word-label" title="${res.elemento}">${res.elemento}</div>
            `;
            container.appendChild(box);
        });
    }

    document.getElementById('analyzeBtn').addEventListener('click', renderAnalysis);
    document.getElementById('sentenceInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') renderAnalysis();
    });

    window.onload = renderAnalysis;
</script>

</body>
</html>
