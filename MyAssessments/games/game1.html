<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Shuffled Character Card Puzzle</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-text: #f8fafc;
            --card-border: #334155;
            --accent-color: #38bdf8;
            --dropzone-bg: #151e33;
            --dropzone-border: #3b82f6;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #f1f5f9;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Container configurations */
        .card-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            width: 100%;
            overflow-x: auto;
            min-height: 140px;
            padding: 20px;
            border-radius: 12px;
            align-items: center;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
        }

        #source-container {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background-color: var(--card-bg);
        }

        #target-container {
            border: 2px dashed var(--dropzone-border);
            background-color: var(--dropzone-bg);
        }

        .card-container.drag-container-over {
            border-color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.05);
        }

        /* Individual Character Card */
        .card {
            flex-shrink: 0;
            width: 70px;
            height: 90px;
            background-color: var(--card-bg);
            color: var(--card-text);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s, transform 0.1s;
            touch-action: none; 
        }

        .card:active {
            cursor: grabbing;
        }

        .card.space {
            border-style: dotted;
            border-color: rgba(255, 255, 255, 0.2);
            background-color: transparent;
            box-shadow: none;
        }

        .card.dragging {
            opacity: 0.3;
        }

        .card.drag-over {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* Status Feedback Message */
        #status-message {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Real-Time Character Card Puzzle</h1>
    
    <div class="controls">
        <input type="text" id="text-input" value="HELLO WORLD" placeholder="Type something...">
        <button id="generate-btn">Reset & Shuffle</button>
    </div>

    <div id="status-message"></div>

    <div class="section-wrapper">
        <div class="section-title">Source List (Randomly Shuffled)</div>
        <div id="source-container" class="card-container"></div>
    </div>

    <div class="section-wrapper">
        <div class="section-title">Drop Zone (Target List)</div>
        <div id="target-container" class="card-container"></div>
    </div>

    <script>
        const inputField = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const sourceContainer = document.getElementById('source-container');
        const targetContainer = document.getElementById('target-container');
        const statusMessage = document.getElementById('status-message');

        let originalTextString = "";
        let draggedCard = null;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initializeGame(text) {
            sourceContainer.innerHTML = ''; 
            targetContainer.innerHTML = ''; 
            statusMessage.textContent = '';
            
            originalTextString = text;
            const charArray = Array.from(originalTextString);
            if (charArray.length === 0) return;

            const shuffledChars = shuffleArray(charArray);

            shuffledChars.forEach(char => {
                const card = document.createElement('div');
                card.classList.add('card');
                
                card.dataset.char = char;

                if (char === ' ') {
                    card.classList.add('space');
                    card.innerHTML = '&nbsp;';
                } else {
                    card.textContent = char;
                }

                card.setAttribute('draggable', 'true');
                addDragAndDropEvents(card);
                sourceContainer.appendChild(card);
            });
            
            checkArrangement();
        }

        function addDragAndDropEvents(card) {
            card.addEventListener('dragstart', (e) => {
                draggedCard = card;
                setTimeout(() => card.classList.add('dragging'), 0);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                draggedCard = null;
                document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                document.querySelectorAll('.card-container').forEach(c => c.classList.remove('drag-container-over'));
            });
        }

        [sourceContainer, targetContainer].forEach(container => {
            container.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            container.addEventListener('dragenter', (e) => {
                e.preventDefault();
                container.classList.add('drag-container-over');
            });

            container.addEventListener('dragleave', (e) => {
                if (e.target === container) {
                    container.classList.remove('drag-container-over');
                }
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                container.classList.remove('drag-container-over');

                if (draggedCard && e.target === container) {
                    container.appendChild(draggedCard);
                    checkArrangement(); // Real-time check on drop
                }
            });
        });

        function attachCardDropZone() {
            document.addEventListener('dragover', (e) => {
                if (e.target.classList && e.target.classList.contains('card')) {
                    e.preventDefault();
                }
            });

            document.addEventListener('drop', (e) => {
                if (e.target.classList && e.target.classList.contains('card') && draggedCard) {
                    e.preventDefault();
                    const targetCard = e.target;
                    const targetParent = targetCard.parentNode;

                    if (draggedCard !== targetCard) {
                        const allCards = [...targetParent.querySelectorAll('.card')];
                        const draggedPos = allCards.indexOf(draggedCard);
                        const targetPos = allCards.indexOf(targetCard);

                        if (draggedPos === -1 || draggedPos < targetPos) {
                            targetParent.insertBefore(draggedCard, targetCard.nextSibling);
                        } else {
                            targetParent.insertBefore(draggedCard, targetCard);
                        }
                        checkArrangement(); // Real-time check on reorder drop
                    }
                }
            });
        }

        attachCardDropZone();

        function checkArrangement() {
            const targetCards = [...targetContainer.querySelectorAll('.card')];
            const currentString = targetCards.map(card => card.dataset.char).join('');

            if (targetCards.length === 0) {
                statusMessage.style.color = 'var(--error-color)';
                statusMessage.textContent = 'The target list is empty!';
                return;
            }

            if (currentString === originalTextString) {
                statusMessage.style.color = 'var(--success-color)';
                statusMessage.textContent = 'Success! The cards match the original text perfectly!';
            } else {
                statusMessage.style.color = 'var(--error-color)';
                statusMessage.textContent = `Current target arrangement: "${currentString}"`;
            }
        }

        // Initialize on load
        initializeGame(inputField.value);

        // Event Listeners
        generateBtn.addEventListener('click', () => initializeGame(inputField.value));
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                initializeGame(inputField.value);
            }
        });
    </script>
</body>
</html>
