<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Indovina l'Immagine dall'Azione</title>
    
<style>
        :root {
            --bg-0: #e6e6e6;
            --bg-1: #ffffff;
            --bg-2: #f1f5f9;
            --accent: #6366f1;
            --accent-2: #06b6d4;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 24px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
        }

        .controls {
            margin-top: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 48px;
        }

        #puzzle-workspace {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 15px;
            width: 100%;
        }

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 10px;
            border-radius: 99px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            padding: 20px;
            border-radius: 20px;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background-color: var(--bg-1);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin: 0 auto;
        }

        /* Action description prompt card replacing the image container */
        #action-prompt-card {
            background-color: var(--bg-1);
            border: 2px solid #a5b4fc;
            padding: 24px 32px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        #action-prompt-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
            line-height: 1.4;
        }

        /* Container holding the two clickable image choices side by side */
        #options-container {
            border-color: var(--border);
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            gap: 20px;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Choice item styling for images */
        .option-card {
            flex-shrink: 0;
            width: 260px;
            height: 260px;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 3px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .option-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
        }

        .option-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .option-card.correct-option {
            border-color: var(--correct);
            background: rgba(16, 185, 129, 0.1);
            cursor: default;
            transform: none !important;
            box-shadow: var(--shadow-sm);
        }

        .option-card.wrong-option {
            border-color: var(--wrong);
            background: rgba(239, 68, 68, 0.05);
            animation: shake 0.4s ease;
        }

        .option-card.disabled-option {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            transform: none !important;
        }

        .option-card.peek {
            border-color: var(--correct);
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        #game-stats, .stats-style {
            margin: 0 0 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 8px 18px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }

        /* =========================================================
           BUTTONS
           ========================================================= */

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        #reveal-btn {
            min-width: 180px;
            min-height: 48px;
            font-size: 1rem;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #4f46e5;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        }

        .cool-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
        }

        #next-btn {
            background-color: var(--correct);
            min-width: 220px;
            min-height: 48px;
        }

        #next-btn:hover {
            background-color: #059669;
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.4);
        }

        #next-btn:active {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }
   </style>
</head>
<body>

    <h1 id="game-title">Che azione è?</h1>

    <div id="game-stats">
        <span>Round: <strong id="progress-value">...</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Tentativi: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Leggi l'azione descritta e seleziona l'immagine corrispondente tra le 2 opzioni.</h3>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>
        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <div id="puzzle-workspace">
        <!-- Text description container replacing the target image -->
        <div id="action-prompt-card">
            <p id="action-prompt-text">Caricamento azione...</p>
        </div>
        <!-- 2 Image Options Container -->
        <div id="options-container" class="card-container"></div>
    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Azione</th>
                    <th>Tempo</th>
                    <th>Tentativi</th>
                    <th>Aiuti</th>
                    <th>Punteggio</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

    <script>
        // Example structure for rounds using 'actionText' instead of an image URL for the target.
        let ROUNDS = [
            {
                label: "Correre",
                actionText: "Una persona che sta correndo all'aperto",
                options: [
                    "https://via.placeholder.com/260/10b981/ffffff?text=Persona+che+corre",
                    "https://via.placeholder.com/260/ef4444/ffffff?text=Persona+che+dorme"
                ],
                correctIndex: 0
            },
            {
                label: "Dormire",
                actionText: "Qualcuno che riposa profondamente nel letto",
                options: [
                    "https://via.placeholder.com/260/ef4444/ffffff?text=Persona+che+mangia",
                    "https://via.placeholder.com/260/10b981/ffffff?text=Persona+che+dorme"
                ],
                correctIndex: 1
            }
        ];

        let currentRoundIndex = 0;
        let roundResults = [];

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const actionPromptText = document.getElementById('action-prompt-text');
        const optionsContainer = document.getElementById('options-container');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const puzzleWorkspace = document.getElementById('puzzle-workspace');
        const actionControls = document.getElementById('action-controls');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');
        const instructionBanner = document.getElementById('instruction-banner');

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let roundCompleted = false;
        let isPeeking = false;
        let optionElements = [];
        let currentRound = null;

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadRound(index) {
            if (index >= ROUNDS.length) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
                return;
            }

            const progressRatio = (index / ROUNDS.length) * 100;
            progressBarFill.style.width = progressRatio + '%';

            currentRound = ROUNDS[index];
            roundCompleted = false;
            moveCount = 0;
            revealCount = 0;
            optionElements = [];

            progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.classList.add('smooth-hidden');
            revealBtn.classList.remove('smooth-hidden');
            revealBtn.disabled = false;

            // Update action description text with a smooth fade effect
            actionPromptText.style.opacity = '0';
            setTimeout(() => {
                actionPromptText.textContent = currentRound.actionText;
                actionPromptText.style.transition = 'opacity 0.35s ease-in-out';
                actionPromptText.style.opacity = '1';
            }, 150);

            optionsContainer.innerHTML = '';

            // Randomize order of the 2 image choices
            const order = shuffleArray([0, 1]);

            order.forEach((originalIdx) => {
                const optionEl = document.createElement('div');
                optionEl.classList.add('option-card');
                
                const imgEl = document.createElement('img');
                imgEl.src = currentRound.options[originalIdx];
                imgEl.alt = "Opzione immagine";
                optionEl.appendChild(imgEl);

                optionEl.dataset.isCorrect = (originalIdx === currentRound.correctIndex) ? 'true' : 'false';

                optionEl.addEventListener('click', () => handleOptionClick(optionEl));

                optionsContainer.appendChild(optionEl);
                optionElements.push(optionEl);
            });
        }

        function handleOptionClick(optionEl) {
            if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

            if (optionEl.dataset.isCorrect === 'true') {
                roundCompleted = true;
                stopElapsedTimer();

                moveCount++;
                updateMovesDisplay();

                optionElements.forEach(el => {
                    el.classList.remove('wrong-option', 'peek');
                    if (el !== optionEl) el.classList.add('disabled-option');
                });
                optionEl.classList.add('correct-option');

                progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                const wrongAttempts = moveCount - 1;
                const metricValue = Math.max(0, 100 - (wrongAttempts * 50) - (revealCount * 50));

                roundResults.push({
                    label: currentRound.label,
                    time: elapsedSeconds + 's',
                    moves: moveCount,
                    reveals: revealCount,
                    metric: metricValue
                });

                if (currentRoundIndex === ROUNDS.length - 1) {
                    nextBtn.textContent = "Fatto";
                } else {
                    nextBtn.textContent = "▶ Prossima azione";
                }

                revealBtn.classList.add('smooth-hidden');
                nextBtn.classList.remove('smooth-hidden');
            } else {
                moveCount++;
                updateMovesDisplay();
                optionEl.classList.add('wrong-option', 'disabled-option');
                optionEl.addEventListener('animationend', () => {
                    optionEl.classList.remove('wrong-option');
                }, { once: true });
            }
        }
        
        nextBtn.addEventListener('click', () => {
            if (currentRoundIndex === ROUNDS.length - 1) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
            } else {
                currentRoundIndex++;
                loadRound(currentRoundIndex);
            }
        });

        function showSummaryScreen() {
            puzzleWorkspace.style.display = 'none';
            instructionBanner.style.display = 'none';
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            actionControls.style.display = 'none';

            summaryTbody.innerHTML = '';
            let totalMetric = 0;

            roundResults.forEach(res => {
                totalMetric += res.metric;
                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                summaryTbody.appendChild(row);
            });

            const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
            const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

            summaryTotals.innerHTML = `
                <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
            `;

            summaryScreen.style.display = 'block';
        }

        function showPeek() {
            if (roundCompleted || isPeeking || revealBtn.disabled) return;
            isPeeking = true;

            revealCount++;
            updateRevealsDisplay();

            const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
            if (correctEl) correctEl.classList.add('peek');
        }

        function hidePeek() {
            if (!isPeeking) return;
            isPeeking = false;
            optionElements.forEach(el => el.classList.remove('peek'));
        }

        loadRound(currentRoundIndex);

        revealBtn.addEventListener('mousedown', showPeek);
        revealBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showPeek();
        }, { passive: false });

        revealBtn.addEventListener('mouseup', hidePeek);
        revealBtn.addEventListener('mouseleave', hidePeek);
        revealBtn.addEventListener('touchend', hidePeek);
        revealBtn.addEventListener('touchcancel', hidePeek);
    </script>
</body>
</html>
