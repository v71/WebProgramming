<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>What Do These Have in Common?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg-0: #0d0d14;
    --bg-1: #15151f;
    --bg-2: #1c1c29;
    --accent: #7c5cff;
    --accent-2: #4fd1c5;
    --correct: #39d98a;
    --wrong: #ff5c7c;
    --text: #e8e8f0;
    --text-dim: #9494a8;
    --border: #2a2a3a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
      var(--bg-0);
    color: var(--text);
    margin: 0;
    padding: 24px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .page {
    width: 100%;
    max-width: 700px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
    letter-spacing: 0.5px;
    text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .progress-row strong {
    color: var(--accent-2);
    font-weight: 600;
  }

  #game-stats {
    margin: -2px 0 12px;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 0.85rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  #game-stats strong {
    color: var(--accent-2);
    font-weight: 600;
  }

  .reveal-btn {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent-2);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .reveal-btn:hover {
    border-color: var(--accent-2);
  }

  .progress-bar {
    height: 6px;
    width: 100%;
    background: var(--bg-2);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
    transition: width 0.4s ease;
  }

  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  .image-pair {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
  }

  .image-frame {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 160px;
    overflow: hidden;
  }

  .image-frame svg {
    width: 65%;
    height: 65%;
  }

  .image-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .question {
    text-align: center;
    color: var(--text-dim);
    margin: 0 0 16px;
    font-size: 0.95rem;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .choice-btn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 10px;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #22223280;
    transform: translateY(-1px);
  }

  .choice-btn:disabled { cursor: default; }

  .choice-btn.correct {
    background: rgba(57, 217, 138, 0.15);
    border-color: var(--correct);
    color: var(--correct);
  }

  .choice-btn.wrong {
    background: rgba(255, 92, 124, 0.15);
    border-color: var(--wrong);
    color: var(--wrong);
  }

  .feedback {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .feedback.correct-text { color: var(--correct); }
  .feedback.wrong-text { color: var(--wrong); }

  .next-btn {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0d0d14;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    display: none;
  }

  .next-btn.visible { display: block; }
  .next-btn:hover { filter: brightness(1.08); }

  /* Report screen */
  .report-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    text-align: center;
  }

  .report-card h2 { font-size: 1.6rem; margin: 0 0 6px; }
  .report-card p.subtitle { color: var(--text-dim); margin: 0 0 24px; }

  .big-score {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
  }

  .restart-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0d0d14;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="page">
  <h1>What Do These Have in Common?</h1>

  <div id="game-stats">
    <span>Time: <strong id="time-value">0s</strong></span>
    <span>Moves: <strong id="moves-value">0</strong></span>
    <span>Reveals: <strong id="reveals-value">0</strong></span>
  </div>

  <div class="progress-row">
    <span>Round</span>
    <span><strong id="progress-ratio">1/5</strong></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

  <div id="game-area">
    <div class="card" id="game-card">
      <div class="image-pair" id="image-pair"></div>
      <p class="question">Which category do both images belong to?</p>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="reveal-btn" id="reveal-btn">Hold to Reveal Answer</button>
      <button class="next-btn" id="next-btn">Next Round →</button>
    </div>
  </div>
</div>

<script>
  const progressRatioEl = document.getElementById('progress-ratio');
  const progressFillEl = document.getElementById('progress-fill');
  const gameArea = document.getElementById('game-area');
  const timeValueEl = document.getElementById('time-value');
  const movesValueEl = document.getElementById('moves-value');
  const revealsValueEl = document.getElementById('reveals-value');

  // Per-round tracking, reset at the start of every round
  let roundElapsedSeconds = 0;
  let roundTimerInterval = null;
  let roundMoveCount = 0;
  let roundRevealCount = 0;

  /* -----------------------------------------------------------
     Images load from the images/ folder next to this file, named
     by icon key: images/sun.png, images/moon.png, images/cat.png,
     etc. — see IMAGE_KEYS below for the full expected filename list.
  ----------------------------------------------------------- */
  const IMAGE_KEYS = ['sun', 'moon', 'cat', 'dog', 'apple', 'banana', 'car', 'bicycle', 'guitar', 'piano'];

  /* -----------------------------------------------------------
     Rounds: two icons + a question with 4 choices, one correct.
     Set here in code — a host platform can generate this array
     dynamically instead of hard-coding it here.
  ----------------------------------------------------------- */
  const PUZZLE_ROUNDS = [
    { icons: ['sun', 'moon'], choices: ['Sky Objects', 'Ocean Creatures', 'Kitchen Items', 'Musical Instruments'], answer: 'Sky Objects' },
    { icons: ['cat', 'dog'], choices: ['Animals', 'Plants', 'Vehicles', 'Tools'], answer: 'Animals' },
    { icons: ['apple', 'banana'], choices: ['Fruits', 'Vegetables', 'Animals', 'Sports'], answer: 'Fruits' },
    { icons: ['car', 'bicycle'], choices: ['Vehicles', 'Furniture', 'Fruits', 'Birds'], answer: 'Vehicles' },
    { icons: ['guitar', 'piano'], choices: ['Musical Instruments', 'Kitchen Appliances', 'Sports Equipment', 'Office Supplies'], answer: 'Musical Instruments' }
  ];

  let currentRoundIndex = 0;
  let score = 0;
  let roundAnswered = false;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function updateProgress() {
    progressRatioEl.textContent = (currentRoundIndex + 1) + '/' + PUZZLE_ROUNDS.length;
    progressFillEl.style.width = (currentRoundIndex / PUZZLE_ROUNDS.length * 100) + '%';
  }

  function startRoundTimer() {
    stopRoundTimer();
    roundElapsedSeconds = 0;
    updateTimeDisplay();
    roundTimerInterval = setInterval(() => {
      roundElapsedSeconds++;
      updateTimeDisplay();
    }, 1000);
  }
  function stopRoundTimer() {
    if (roundTimerInterval) {
      clearInterval(roundTimerInterval);
      roundTimerInterval = null;
    }
  }
  function updateTimeDisplay() {
    timeValueEl.textContent = roundElapsedSeconds + 's';
  }
  function updateMovesDisplay() {
    movesValueEl.textContent = roundMoveCount;
  }
  function updateRevealsDisplay() {
    revealsValueEl.textContent = roundRevealCount;
  }
  function registerMove() {
    if (roundAnswered) return;
    roundMoveCount++;
    updateMovesDisplay();
  }

  function renderRound() {
    roundAnswered = false;
    roundMoveCount = 0;
    roundRevealCount = 0;
    updateMovesDisplay();
    updateRevealsDisplay();
    startRoundTimer();
    updateProgress();

    const round = PUZZLE_ROUNDS[currentRoundIndex];

    const imagePair = document.getElementById('image-pair');
    imagePair.innerHTML = '';
    round.icons.forEach((iconKey) => {
      const frame = document.createElement('div');
      frame.className = 'image-frame';
      const img = document.createElement('img');
      img.src = 'images/' + iconKey + '.png';
      img.alt = iconKey;
      frame.appendChild(img);
      imagePair.appendChild(frame);
    });

    const feedback = document.getElementById('feedback');
    feedback.textContent = '';
    feedback.className = 'feedback';

    const nextBtn = document.getElementById('next-btn');
    nextBtn.classList.remove('visible');
    nextBtn.textContent = (currentRoundIndex === PUZZLE_ROUNDS.length - 1) ? 'Done' : 'Next Round →';

    const choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    shuffle(round.choices).forEach((choice) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice;
      btn.addEventListener('click', () => selectAnswer(choice, round.answer, btn));
      choicesEl.appendChild(btn);
    });
  }

  function selectAnswer(selected, correctAnswer, btnEl) {
    if (roundAnswered) return;
    registerMove();
    roundAnswered = true;
    stopRoundTimer();

    const buttons = document.querySelectorAll('.choice-btn');
    buttons.forEach((b) => {
      b.disabled = true;
      if (b.textContent === correctAnswer) b.classList.add('correct');
    });

    const feedback = document.getElementById('feedback');
    if (selected === correctAnswer) {
      score++;
      feedback.textContent = 'Correct! 🎉';
      feedback.className = 'feedback correct-text';
    } else {
      btnEl.classList.add('wrong');
      feedback.textContent = `Not quite — it's "${correctAnswer}".`;
      feedback.className = 'feedback wrong-text';
    }

    document.getElementById('next-btn').classList.add('visible');
  }

  // Reveal: while the button is held down, the correct choice is
  // highlighted green as a preview. Released before answering, the
  // preview reverts; once the round is actually answered, the
  // highlight stays (it's the real answer at that point).
  function showReveal() {
    if (roundAnswered) return;
    roundRevealCount++;
    updateRevealsDisplay();
    const round = PUZZLE_ROUNDS[currentRoundIndex];
    document.querySelectorAll('.choice-btn').forEach((b) => {
      if (b.textContent === round.answer) b.classList.add('correct');
    });
  }
  function hideReveal() {
    if (roundAnswered) return;
    document.querySelectorAll('.choice-btn.correct').forEach((b) => b.classList.remove('correct'));
  }

  function bindRevealButton() {
    const revealBtn = document.getElementById('reveal-btn');
    revealBtn.addEventListener('mousedown', showReveal);
    revealBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      showReveal();
    }, { passive: false });
  }

  document.addEventListener('mouseup', hideReveal);
  document.addEventListener('touchend', hideReveal);
  document.addEventListener('touchcancel', hideReveal);

  function handleNextClick() {
    if (currentRoundIndex < PUZZLE_ROUNDS.length - 1) {
      currentRoundIndex++;
      renderRound();
    } else {
      showReport();
    }
  }

  function showReport() {
    stopRoundTimer();
    progressRatioEl.textContent = PUZZLE_ROUNDS.length + '/' + PUZZLE_ROUNDS.length;
    progressFillEl.style.width = '100%';

    const total = PUZZLE_ROUNDS.length;
    const pct = Math.round((score / total) * 100);
    let msg = 'Nice try — go again?';
    if (pct === 100) msg = 'Perfect score! 🌟';
    else if (pct >= 70) msg = 'Great job! 👏';
    else if (pct >= 40) msg = 'Not bad — try again!';

    window.quizReport = { score, total, pct };
    console.log('Quiz report:', window.quizReport);

    gameArea.innerHTML = `
      <div class="report-card">
        <h2>Quiz Complete! 🎉</h2>
        <p class="subtitle">You answered ${score} of ${total} correctly</p>
        <div class="big-score">${score}/${total}</div>
        <p class="subtitle">${msg}</p>
        <button class="restart-btn" id="restart-btn">Play Again</button>
      </div>
    `;
    document.getElementById('restart-btn').addEventListener('click', restartGame);
  }

  function restartGame() {
    currentRoundIndex = 0;
    score = 0;
    gameArea.innerHTML = `
      <div class="card" id="game-card">
        <div class="image-pair" id="image-pair"></div>
        <p class="question">Which category do both images belong to?</p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <button class="reveal-btn" id="reveal-btn">Hold to Reveal Answer</button>
        <button class="next-btn" id="next-btn">Next Round →</button>
      </div>
    `;
    document.getElementById('next-btn').addEventListener('click', handleNextClick);
    bindRevealButton();
    renderRound();
  }

  // Initial load
  document.getElementById('next-btn').addEventListener('click', handleNextClick);
  bindRevealButton();
  renderRound();
</script>
</body>
</html>
