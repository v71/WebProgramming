<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio e riconoscimento</title>

    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>
    <link href="../stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        /* =========================================================
           TEMPLATE: parte comune a tutti i giochi (non toccare)
           ========================================================= */
        :root {
            --gap: clamp(6px, 1.7vh, 16px);
            --maxw: 1100px;
            --fs-word: clamp(.8rem, 2.2vh, 1.25rem);
            --fs-ui: clamp(.75rem, 1.85vh, 1.05rem);
        }

        #game-area {
            flex: 1 1 0; min-height: 0; max-height: 380px; width: 100%; max-width: var(--maxw);
            margin: 16px 0 10px 0; padding: clamp(8px, 2.2vh, 22px);
            border-radius: 20px; background: var(--game-area-background);
            border: 2px solid var(--border); box-shadow: var(--shadow-md); overflow: hidden;
        }
        .frame { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1.2vh, 12px); }
        .toprow, .bottomrow { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .toprow { height: clamp(20px, 3.4vh, 32px); }
        .bottomrow { height: clamp(30px, 4.8vh, 46px); }
        .main { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); text-align: center; }
        .main:has(> p + p) { gap: 2px; }

        .big-msg {
            font-size: 1.6rem; font-weight: 400; margin: 0; line-height: 1.4;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }
        .timer {
            font-size: var(--fs-word); line-height: 1; font-weight: 400; color: var(--accent);
            font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }
        .timer-bar { flex: 1; max-width: 500px; height: clamp(8px, 1.3vh, 12px); background: var(--body-background); border-radius: 99px; overflow: hidden; border: 2px solid var(--border); }
        .timer-bar > div { height: 100%; width: 100%; background: var(--accent); }

        button.cool-btn:disabled, button.cool-btn[disabled] {
            opacity: .5 !important; cursor: not-allowed !important; transform: none !important;
            box-shadow: none !important; pointer-events: none !important;
        }
        .cool-btn-2 {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px 28px; font-size: 1.5rem; font-weight: 400; color: var(--text); background-color: #4f46e5;
            border: 2px solid var(--border); border-radius: 99px; cursor: pointer; box-shadow: var(--shadow-lg);
            transition: all .35s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }
        #reveal-btn { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin-bottom: 0 !important; }
        #reveal-btn:disabled { opacity: .4; cursor: not-allowed; }
        #reveal-btn.held {
            background: var(--grid-btn-selected) !important; color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important; transform: none !important;
            box-shadow: var(--shadow-sm) !important; opacity: 1 !important; cursor: default !important;
        }
        #reveal-btn .fa {
            font-size: 25px; line-height: 1; color: #fff; --w: 1px;
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000, 0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000, calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000, calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000, var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important; filter: none !important;
        }
        #reveal-btn .fa, #reveal-btn:hover .fa, #reveal-btn:focus .fa, #reveal-btn:active .fa, #reveal-btn:hover i {
            transform: none !important; animation: none !important; transition: none !important;
        }
        #action-controls { margin-bottom: 0 !important; padding-bottom: 0 !important; }

        .intro-start { margin-top: 24px; }
        .frame:has(#btn-start) .toprow, .frame:has(#btn-start) .bottomrow { display: none; }

        .frame.fade-out { animation: frameOut .25s ease forwards; pointer-events: none; }
        .frame.fade-in { animation: frameIn .35s ease both; }
        @keyframes frameOut { to { opacity: 0; transform: translateY(6px); } }
        @keyframes frameIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .frame.fade-out, .frame.fade-in { animation: none; } }
        @media (max-width: 980px) {
            #instruction-banner { height: calc(var(--fs-ui) * 3.9 + 12px); padding: 0 16px; border-radius: 18px; }
        }

        /* =========================================================
           BLOCCO SPECIFICO DEL GIOCO: studio e riconoscimento
           ========================================================= */

        /* griglia di parole: 4 colonne (studio, test, aiuto, risultato) */
        .rgrid {
            flex: 1 1 0; min-height: 0; width: 100%;
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 66px);
            gap: clamp(6px, 1.4vh, 12px);
            align-content: center;
            overflow-y: auto; padding: 4px;
            scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
        }

        /* parola */
        .rbox {
            font: inherit; font-size: clamp(.95rem, 2.3vh, 1.25rem);
            color: var(--text); background: var(--summary-background);
            border: 2px solid var(--border); border-radius: 14px;
            min-width: 0; padding: 4px 12px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-align: center; overflow-wrap: anywhere;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transition: background .2s ease, border-color .2s ease, opacity .2s ease;
        }
        .rbox .fa { font-size: 1.4em; flex: 0 0 auto; color: var(--accent); text-shadow: none; }

        /* test: parole da segnare */
        button.rbox { cursor: pointer; justify-content: flex-start; text-align: left; }
        button.rbox:hover { border-color: var(--grid-btn-hovered-border-color); }
        .rbox.sel { background: var(--default-btn); border-color: var(--accent); }

        /* aiuto: le parole giuste si illuminano nella schermata di gioco */
        .rbox.help, button.rbox.help { background: var(--grid-btn-help); border-color: var(--grid-btn-help-border-color); }
        .rbox.help .fa { color: var(--text); }

        /* risultato: verde = c'era, rosso = non c'era; le parole non segnate restano neutre (le risposte non vengono mai mostrate) */
        .rbox.ok { background: var(--grid-btn-selected-hovered); border-color: var(--text); }
        .rbox.ok .fa, .rbox.ko .fa { color: var(--text); }
        .rbox.ko { background: var(--grid-btn-wrong); border-color: var(--grid-btn-wrong-border-color); }
        .rbox.dim { opacity: .55; }

        @media (max-width: 700px) {
            #game-area { padding: 8px; border-radius: 16px; }
            .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(40px, auto); align-content: start; }
            .rbox { padding: 4px 8px; }
        }
    </style>
</head>

<body>

    <h1 id="game-title">Studio e riconoscimento</h1>

    <div id="game-stats">
        <span>Round: <strong id="round-value">-</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <div id="instruction-banner" aria-live="polite">
        Premi Inizia: studierai un elenco di parole, poi dovrai riconoscerle in un elenco più lungo.
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn-2" disabled>
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Tieni premuto per avere un aiuto!</span>
        </button>
    </div>

    <div id="game-area"></div>

    <h2 id="progress-title">Progresso</h2>
    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr><th>Round</th><th>Tempo</th><th>Mosse</th><th>Aiuti</th><th>Metric</th></tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
    </div>

    <script>
    /* Formato JSON: ogni elemento di "categories" è un round.
       { "title": "...", "categories": [ { "label": "...", "words": [...da studiare...], "distractors": [...parole in più nel test...] } ] }
       Nel test compaiono "words" + "distractors" in ordine casuale. */

    const DATA_URL = 'studio-e-riconoscimento.json';
    const STUDY_SECONDS = 30;

    let rounds = [], roundIndex = 0, results = [], R = null;
    let moves = 0, helps = 0, seconds = 0;
    let clock = null, studyTimer = null;
    let testItems = [], picked = new Set();
    let helpEnabled = false, isGameReady = false, currentButtonMode = 'help';

    const $ = id => document.getElementById(id);
    const area = $('game-area');
    const revealBtn = $('reveal-btn');
    const btnIcon = $('btn-icon');
    const gameTitle = $('game-title');
    const gameStats = $('game-stats');
    const gameArea = $('game-area');
    const instructionBanner = $('instruction-banner');
    const actionControls = $('action-controls');
    const progressBar = document.querySelector('.progress-bar-container');
    const progressBarTitle = $('progress-title');

    /* =========================================================
       TEMPLATE: scheletro comune (non toccare)
       ========================================================= */
    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

    function setButtonState(mode) {
        currentButtonMode = mode;
        const states = {
            help: { icon: 'fa-lightbulb-o', text: 'Tieni premuto per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check',       text: 'Fatto' }
        };
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(states[mode].icon);
        const textEl = revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = states[mode].text;
    }

    function transitionTo(next) {
        const old = area.querySelector('.frame');
        if (!old) { next(); return; }
        old.classList.add('fade-out');
        setTimeout(() => {
            next();
            const fresh = area.querySelector('.frame');
            if (fresh) fresh.classList.add('fade-in');
        }, 250);
    }

    // minuscolo, senza accenti né punteggiatura: serve a confrontare le parole
    function norm(s) {
        return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    function startClock() {
        if (clock) return;
        clock = setInterval(() => { seconds++; $('time-value').textContent = seconds + 's'; }, 1000);
    }
    function stopClock() { clearInterval(clock); clock = null; }
    function updateStats() { $('moves-value').textContent = moves; $('reveals-value').textContent = helps; }
    function resetRoundStats() { moves = 0; helps = 0; seconds = 0; $('time-value').textContent = '0s'; updateStats(); }
    function setProgress(pct) { $('progress-bar-fill').style.width = pct + '%'; }
    function banner(txt) { $('instruction-banner').textContent = txt; }
    function enableHelp(on) { helpEnabled = on; revealBtn.disabled = !on; }

    function frame({ top = '', a = '', b = '', main = null, bottom = '' }) {
        area.innerHTML = `<div class="frame">
            <div class="toprow">${top}</div>
            ${main !== null ? `<div class="main">${main}</div>` : a + b}
            <div class="bottomrow">${bottom}</div>
        </div>`;
    }

    /* =========================================================
       BLOCCO SPECIFICO DEL GIOCO: studio e riconoscimento
       ========================================================= */

    // elenco di studio
    const studyHtml = () => `<div class="rgrid">${R.words.map(w =>
        `<div class="rbox">${esc(w)}</div>`).join('')}</div>`;

    // elenco del test: tutte le parole, con la casella da segnare
    const testHtml = () => `<div class="rgrid">${testItems.map((it, i) => {
        const on = picked.has(i);
        return `<button type="button" class="rbox${on ? ' sel' : ''}" data-i="${i}" aria-pressed="${on}">
            <i class="fa ${on ? 'fa-check-square-o' : 'fa-square-o'}"></i><span>${esc(it.w)}</span></button>`;
    }).join('')}</div>`;

    // test = parole studiate + parole in più (senza doppioni), in ordine casuale
    function buildTest() {
        const seen = new Set(R.words.map(norm));
        const extra = [];
        R.distractors.forEach(w => { const n = norm(w); if (!seen.has(n)) { seen.add(n); extra.push(w); } });
        testItems = shuffle([...R.words.map(w => ({ w, target: true })), ...extra.map(w => ({ w, target: false }))]);
    }

    /* ---------- FASE 0: intro ---------- */
    function showIntro() {
        setButtonState('help');
        enableHelp(false);
        $('round-value').textContent = `${roundIndex + 1}/${rounds.length}`;
        banner(`Round ${roundIndex + 1} di ${rounds.length}. Premi Inizia: studierai l'elenco per ${STUDY_SECONDS} secondi.`);
        frame({
            main: `<p class="big-msg">Studierai un elenco di ${R.words.length} parole per ${STUDY_SECONDS} secondi.</p>
                <p class="big-msg">Poi verrà coperto e, in un elenco più lungo, dovrai segnare solo le parole che c'erano.</p>
                <p class="big-msg">Il tempo parte quando premi il pulsante.</p>
                <button id="btn-start" class="cool-btn intro-start">Inizia</button>`
        });
        $('btn-start').onclick = () => { startClock(); transitionTo(startStudy); };
    }

    /* ---------- FASE 1: studio ---------- */
    function startStudy() {
        let left = STUDY_SECONDS;
        enableHelp(false);
        banner(`Studia l'elenco per ${STUDY_SECONDS} secondi: poi verrà coperto e dovrai riconoscere le parole in un elenco più lungo.`);
        frame({
            top: `<span class="timer" id="study-left">${left}s</span><div class="timer-bar"><div id="study-bar"></div></div>`,
            main: studyHtml(),
            bottom: '<button id="btn-done" class="cool-btn">Ho finito di studiare</button>'
        });
        const stop = () => { clearInterval(studyTimer); transitionTo(startPlay); };
        $('btn-done').onclick = stop;
        const bar = $('study-bar');
        bar.style.width = '100%';
        bar.getBoundingClientRect();
        bar.style.transition = `width ${STUDY_SECONDS}s linear`;
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
        studyTimer = setInterval(() => {
            left--;
            const el = $('study-left'); if (el) el.textContent = left + 's';
            if (left <= 0) stop();
        }, 1000);
    }

    /* ---------- FASE 2: riconoscimento ---------- */
    function startPlay() {
        picked = new Set();
        buildTest();
        banner('Segna solo le parole che erano nell\'elenco iniziale. Tieni premuto il pulsante Aiuto per vedere quali sono giuste.');
        renderPlay();
        enableHelp(true);
    }

    function refreshPlay() {
        const n = picked.size;
        const msg = $('pick-msg');
        if (msg) msg.textContent = n === 0 ? 'Segna le parole che ricordi'
            : n === 1 ? 'Hai segnato 1 parola' : `Hai segnato ${n} parole`;
        const chk = $('btn-check');
        if (chk) chk.disabled = n === 0;
    }

    function renderPlay() {
        frame({
            top: `<span class="big-msg" id="pick-msg"></span>`,
            main: testHtml(),
            bottom: `<button id="btn-check" class="cool-btn" disabled>Verifica</button>`
        });
        // un solo gestore sul frame
        area.querySelector('.frame').addEventListener('click', e => {
            const b = e.target.closest('.rbox[data-i]');
            if (!b) return;
            const i = +b.dataset.i;
            const on = !picked.has(i);
            if (on) picked.add(i); else picked.delete(i);
            b.classList.toggle('sel', on);
            b.setAttribute('aria-pressed', on);
            b.querySelector('.fa').className = 'fa ' + (on ? 'fa-check-square-o' : 'fa-square-o');
            moves++; updateStats();                 // ogni casella segnata o tolta = una mossa
            refreshPlay();
        });
        $('btn-check').onclick = () => transitionTo(showResult);
        refreshPlay();
    }

    /* Aiuto: tenendo premuto, le parole giuste diventano verdi nella griglia del test */
    (function setupHelp() {
        const btn = revealBtn;
        let held = false;
        const isHelp = () => currentButtonMode === 'help';

        const show = () => {
            if (held || !helpEnabled || !isHelp()) return;
            held = true; helps++; updateStats();
            btn.classList.add('held');
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            // le parole giuste si illuminano nella griglia, senza cambiare schermata
            area.querySelectorAll('.rbox[data-i]').forEach(b =>
                b.classList.toggle('help', testItems[+b.dataset.i].target));
        };
        const hide = () => {
            if (!held) return;
            held = false;
            btn.classList.remove('held');
            area.querySelectorAll('.rbox.help').forEach(b => b.classList.remove('help'));
        };

        btn.addEventListener('pointerdown', e => {
            if (!isHelp()) return;
            e.preventDefault();
            try { btn.setPointerCapture(e.pointerId); } catch (_) {}
            show();
        });
        ['pointerup', 'pointercancel', 'lostpointercapture', 'pointerleave', 'blur'].forEach(ev => btn.addEventListener(ev, hide));
        btn.addEventListener('keydown', e => {
            if (!isHelp()) return;
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); show(); }
        });
        btn.addEventListener('keyup', e => { if (isHelp() && (e.key === ' ' || e.key === 'Enter')) hide(); });
        btn.addEventListener('contextmenu', e => e.preventDefault());

        btn.addEventListener('click', () => {
            if (currentButtonMode === 'next') { btn.disabled = true; transitionTo(nextRound); }
            else if (currentButtonMode === 'done') { btn.disabled = true; transitionTo(showSummary); }
        });
    })();

    /* ---------- FASE 3: risultato ---------- */
    function showResult() {
        stopClock();
        let hits = 0, wrong = 0;
        // verde = segnata e c'era, rosso = segnata ma non c'era; le parole non segnate restano neutre (le risposte non vengono mai mostrate)
        const boxes = testItems.map((it, i) => {
            const on = picked.has(i);
            if (on && it.target) hits++;
            if (on && !it.target) wrong++;
            const cls = on ? (it.target ? 'ok' : 'ko') : 'dim';
            return `<div class="rbox ${cls}"><i class="fa ${on ? 'fa-check-square-o' : 'fa-square-o'}"></i><span>${esc(it.w)}</span></div>`;
        }).join('');

        const total = R.words.length;
        const score = Math.max(0, hits - wrong);        // ogni errore annulla una parola giusta

        results.push({
            label: R.label || `Round ${roundIndex + 1}`,
            score, total, seconds, moves, helps,
            metric: total ? score / total * 100 : 0
        });
        setProgress(results.length / rounds.length * 100);

        const isLast = roundIndex >= rounds.length - 1;
        setButtonState(isLast ? 'done' : 'next');
        helpEnabled = false;
        revealBtn.disabled = false;

        banner(`Verde = parola giusta, rosso = parola che non c'era. Riconosciute: ${hits} su ${total} · Errori: ${wrong}.`);
        const msg = score === total ? 'Perfetto!' : score >= total * 0.6 ? 'Bel lavoro!' : 'Buon tentativo!';
        frame({
            top: `<span class="big-msg">Risultato: ${score} / ${total} · ${msg}</span>`,
            main: `<div class="rgrid">${boxes}</div>`
        });
    }

    /* =========================================================
       TEMPLATE: round successivo, riepilogo, caricamento, avvio
       ========================================================= */
    function nextRound() {
        roundIndex++;
        R = rounds[roundIndex];
        resetRoundStats();
        showIntro();
    }

    function showSummary() {
        enableHelp(false);
        stopClock();
        [gameTitle, gameStats, instructionBanner, actionControls, progressBarTitle, progressBar, gameArea]
            .forEach(el => el.style.display = 'none');

        const tbody = $('summary-tbody');
        tbody.innerHTML = '';
        results.forEach((res, idx) => {
            const row = document.createElement('tr');
            [`${idx + 1} · ${res.label}`, res.seconds + 's', res.moves, res.helps, res.metric.toFixed(2)].forEach((value, i) => {
                const td = document.createElement('td');
                td.textContent = value;
                if (i === 4) td.style.fontWeight = '700';
                row.appendChild(td);
            });
            tbody.appendChild(row);
        });

        const sum = k => results.reduce((a, r) => a + r[k], 0);
        const averageMetric = results.length ? sum('metric') / results.length : 0;
        const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

        $('summary-totals').innerHTML = `
            <div>Tempo Totale: <strong>${sum('seconds')}s</strong> | Mosse Totali: <strong>${sum('moves')}</strong> | Aiuti Totali: <strong>${sum('helps')}</strong></div>
            <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
            <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>`;

        const screen = $('summary-screen');
        screen.style.display = 'block';
        screen.classList.add('show');
    }

    // un round valido ha almeno 2 parole da studiare e almeno 1 parola in più, tutte stringhe non vuote
    const okList = (a, min) => Array.isArray(a) && a.length >= min && a.every(w => typeof w === 'string' && w.trim());
    const validRound = r => r && okList(r.words, 2) && okList(r.distractors, 1);

    async function loadRound() {
        isGameReady = false;
        enableHelp(false);
        frame({ main: '<p class="big-msg">Caricamento…</p>' });
        try {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const all = Array.isArray(data.categories) ? data.categories.filter(validRound) : [];
            if (!all.length) throw new Error('JSON vuoto o non valido');
            if (data.title) { gameTitle.textContent = data.title; document.title = data.title; }
            rounds = shuffle(all.slice());
            roundIndex = 0;
            results = [];
            R = rounds[0];
            resetRoundStats();
            setProgress(0);
            isGameReady = true;
            showIntro();
        } catch (err) {
            frame({ main: `<p class="big-msg">Impossibile caricare gli esercizi.</p>
                <p class="big-msg">Controlla che il file <strong>${DATA_URL}</strong> sia nella stessa cartella e che la pagina sia aperta da un server (non da file://).</p>` });
        }
    }

    (async function initGame() {
        await loadRound();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>
