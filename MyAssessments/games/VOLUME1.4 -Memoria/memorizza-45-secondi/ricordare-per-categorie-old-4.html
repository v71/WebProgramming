<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricordare per categorie</title>

    <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <!-- Main CSS File -->
    <link href="../stylesheet.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        :root {
            --word: #7931b4;
            --help: #4f46e5;
            --ok: #22c55e;
            --ko: #ef4444;
            --gap: clamp(6px, 1.7vh, 16px);
            --maxw: 1100px;
            --fs-word: clamp(.8rem, 2.2vh, 1.25rem);
            --fs-ui: clamp(.75rem, 1.85vh, 1.05rem);
        }

        h1{
            margin: 0;
            font-size: clamp(1.25rem, 4vh, 2.3rem);
            line-height: 1.1;
            font-weight: 800;
            margin-bottom:16px;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* L'area di gioco ha SEMPRE le stesse dimensioni, in tutte le fasi */
        #game-area {
            flex: 1 1 0;
            min-height: 0;
            max-height: 450px;
            width: 100%;
            max-width: var(--maxw);
            margin: 16px 0 10px 0;
            padding: clamp(8px, 2.2vh, 22px);
            border-radius: 20px;
            background: var(--game-area-background);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Scheletro unico: [ riga alta ] [ zona A ] [ zona B ] [ riga bassa ] */
        .frame { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1.2vh, 12px); }
        .toprow, .bottomrow { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .toprow { height: clamp(20px, 3.4vh, 32px); }
        .bottomrow { height: clamp(30px, 4.8vh, 46px); }
        
        .main { 
            flex: 1 1 0; 
            min-height: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: var(--gap); 
            text-align: center; 
        }
        
        /* Stessa altezza e stessa posizione dei due riquadri in tutte le fasi */
        .slotA,
        .slotB {
            box-sizing: border-box;
        }

        .slotA {
            flex: 0 0 33%;   /* altezza fissa del riquadro alto */
        }

        .slotB {
            flex: 1 1 0;     /* il riquadro basso occupa lo spazio restante */
        }

        .tag {
            font-size: clamp(.65rem, 1.5vh, .85rem);
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--text);
            background: var(--summary-background);
            padding: 3px 14px;
            border-radius: 99px;
            border: 1px solid var(--border);
        }

        .big-msg { 
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0; 
            line-height: 1.4; 
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* timer (riga alta, fase di studio) */
        .timer {
            font-size: var(--fs-word);
            line-height: 1;
            font-weight: 400;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            min-width: 3.2ch;
            text-align: right;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        .timer-bar {
            flex: 1;
            max-width: 500px;
            height: clamp(8px, 1.3vh, 12px);
            background: var(--body-background);
            border-radius: 99px;
            overflow: hidden;
            border: 2px solid var(--border);
        }
        .timer-bar > div { height: 100%; width: 100%; background: var(--accent); }

        /* zone */
        .zone {
            background: var(--summary-background);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: clamp(6px, 1.2vh, 12px);
            display: flex; flex-direction: column;
            gap: clamp(4px, .9vh, 8px);
            overflow: hidden;
            min-height: 0;
            transition: border-color .15s, background .15s;
        }

        .zone-label {
            margin: 0;
            font-size: var(--fs-ui);
            font-weight: 400;
            color: var(--accent);
            text-align: center;
            line-height: 1.25;
            flex: 0 0 auto;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        .zone.panel { align-items: center; justify-content: center; text-align: center; }

        /* PULSANTI PAROLA */
        .wgrid { display: grid; gap: clamp(4px, 1vh, 10px); width: 100%; min-height: 0; align-content: start; }

        .pool .wgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

        .wbtn {
            font: inherit;
            font-size: 1.2rem;
            font-weight: 400;
            color: #fff;
            min-height: 32px;
            background: var(--word);
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease, opacity 0.4s ease;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .wbtn.static 
        {
             cursor: default; 
        }
        
        .wbtn.static:disabled
         {
            opacity: 1; 
            pointer-events: none !important;
            transform: none !important;
        }

        .wbtn:hover 
        {
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        .wbtn.sel 
        { 
            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
            opacity: 1 !important;
            cursor: default !important;
        }

        .wbtn:focus-visible { outline: 3px solid #fff; outline-offset: 1px; }
        .wbtn.hint { cursor: default; border-color: var(--c); }

        .wbtn.ok { background: rgba(34,197,94,.35); border-color: var(--ok); }
        .wbtn.ko { background: rgba(239,68,68,.35); border-color: var(--wrong); }

        .wbtn small { display: block; font-size: .55em; font-weight: 600; color: #ddd; line-height: 1.1; }

        .zone.target { cursor: pointer; }
        .pool.target { border-color: var(--text); background: var(--summary-background); }

        /* gruppi (smistamento e risultato): colonne fisse */
        .boxes, .groups { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: clamp(6px, 1.4vh, 14px); min-height: 0; }
        .box { position: relative; border-style: solid; border-width: 3px; border-color: var(--c); }
        .box .wgrid { grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 15vh, 140px), 1fr)); overflow-y: auto; flex: 1 1 0; }
        .box .zone-label { color: var(--c); padding-bottom: 2px; border-bottom: 2px solid var(--c); }
        .box.peek .zone-label { color: #fff; background: var(--c); border-radius: 8px; border-bottom-color: transparent; padding: 2px 6px; }
        
        .box.empty::after {
            content: 'Clicca qui'; 
            position: absolute; 
            left: 0; 
            right: 0; 
            top: 58%; 
            transform: translateY(-50%);
            text-align: center; 
            font-weight: 400; 
            font-size: 1.5rem; 
            color: var(--text); 
            pointer-events: none;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }
        
        .box.target { background: rgba(255,255,255,.07); border-style: solid; }
        .box.target.empty::after { content: 'Metti qui'; color: var(--c); }

        /* risultato */
        .group { background: var(--body-background); border: 3px solid var(--border); border-radius: 14px; padding: clamp(5px, 1.1vh, 10px); overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
        .group h3 { margin: 0; font-size: var(--fs-ui); color: var(--accent); text-align: center; line-height: 1.2; }
        .group .wgrid { grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 15vh, 140px), 1fr)); overflow-y: auto; }
        .score { font-size: clamp(1.4rem, 4.6vh, 2.6rem); line-height: 1; font-weight: 800; color: var(--accent); text-shadow: 0 2px 4px rgba(0,0,0,.5); }

        @media (max-width: 980px) {
            #instruction-banner { height: calc(var(--fs-ui) * 3.9 + 12px); padding: 0 16px; border-radius: 18px; }
        }

        @media (max-width: 700px) {
            :root { --fs-ui: .78rem; --fs-word: .82rem; }
            body { padding: 8px 10px; }
            h1, #progress-title { font-size: min(clamp(1.1rem, 4vh, 2.3rem), 6vw); }
            #game-area { padding: 8px; border-radius: 16px; }
            .pool .wgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .boxes, .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .box .wgrid, .group .wgrid { grid-template-columns: 1fr; }
            .zone { padding: 5px; gap: 3px; }
            .wbtn { padding: 2px 3px; border-radius: 6px; }
            .wbtn small { font-size: .62em; }
        }

        /* schermi bassi: nascondo il titolo "Progresso" (resta la barra) */
        @media (max-height: 700px) {
            #progress-title { display: none; }
        }

    </style>

    <style>
    
        button.cool-btn:disabled,
        button.cool-btn[disabled] {
            opacity: .5 !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
            pointer-events: none !important;
        }

        .wbtn.locked:disabled {
            pointer-events: none !important;
            transform: none !important;
            opacity: 1.0 !important;
        }

    .pool[data-z="pool"] .wgrid {
        flex: 1 1 0;
        align-content: center;
        align-content: safe center;
        overflow-y: auto;
    }

    .box .wgrid {
        align-content: center;
        align-content: safe center;
    }

    </style>

    <style>

        .box .wgrid,
        .group .wgrid,
        .pool .wgrid {
            scrollbar-width: thin;                                  /* Firefox */
            scrollbar-color: var(--c, var(--accent)) transparent;   /* Firefox */
        }

        .box .wgrid::-webkit-scrollbar,
        .group .wgrid::-webkit-scrollbar,
        .pool .wgrid::-webkit-scrollbar {
            width: 6px;
        }

        .box .wgrid::-webkit-scrollbar-track,
        .group .wgrid::-webkit-scrollbar-track,
        .pool .wgrid::-webkit-scrollbar-track {
            background: transparent;
        }

        .box .wgrid::-webkit-scrollbar-thumb,
        .group .wgrid::-webkit-scrollbar-thumb,
        .pool .wgrid::-webkit-scrollbar-thumb {
            background: var(--c, var(--accent));
            border-radius: 99px;
        }

        .box .wgrid,
        .group .wgrid,
        .pool .wgrid {
            box-sizing: border-box;
            padding-inline: 8px;
        }

        .main:has(> p + p) {
            gap: 2px;
        }

    </style>

    <style>

        .cool-btn-2 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* Il tasto Help si tiene premuto: evita menu contestuale, selezione e zoom al tocco lungo */
        #reveal-btn {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */

       #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px; /* spessore del bordo */
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma quando il pulsante è in hover, in focus o premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }

        #reveal-btn:disabled { 
            opacity: .4; cursor: not-allowed; 
        }

        /* Il tasto Help si tiene premuto: evita menu contestuale, selezione, zoom e scroll al tocco lungo */
        #reveal-btn {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Stato "premuto" (quello che prima era #help-btn.held) */
        #reveal-btn.held {
            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
            opacity: 1 !important;
            cursor: default !important;
        }

        /* Meno spazio sotto il pulsante Aiuto */
        #action-controls {
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }

        #reveal-btn {
            margin-bottom: 0 !important;
        }

        #game-area {
            margin-top: 16px;   /* was 16px, adjust to taste */
        }

        /* Intro: stessa altezza per riga alta e riga bassa, così il testo è centrato nello spazio sopra il pulsante */
        .frame:has(#btn-start) .toprow {
            height: 0;
            display: none;
        }

        .frame:has(#btn-start) .main {
            padding-bottom: 12px;
        }

        .frame:has(#btn-done) .bottomrow {
            margin-top: 12px;   /* increase for more space */
        }

        /* Sposta il pulsante Verifica un po' più in basso */
        .frame:has(#btn-check) .bottomrow {
            position: relative;
            top: 6px;   /* aumenta o diminuisci a piacere */
        }

        /* Fase di studio: parole centrate verticalmente nel contenitore */
        .frame:has(#btn-done) .pool .wgrid {
            flex: 1 1 0;
            align-content: center;
            align-content: safe center;
            overflow-y: auto;
        }

    </style>

    <style>

        /* Transizione tra le schermate */
        .frame.fade-out {
            animation: frameOut .25s ease forwards;
            pointer-events: none;           /* evita doppi click durante la dissolvenza */
        }
        .frame.fade-in {
            animation: frameIn .35s ease both;
        }

        @keyframes frameOut {
            to { opacity: 0; transform: translateY(6px); }
        }
        @keyframes frameIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .frame.fade-out, .frame.fade-in { animation: none; }
        }

    </style>

    <style>

        /* Intro: pulsante sotto il testo, il blocco è centrato nel contenitore */
        .intro-start {
            margin-top: 24px;   /* distanza tra testo e pulsante */
        }

        /* Nell'intro le righe alta e bassa sono vuote: le nascondo così il blocco è al centro esatto */
        .frame:has(#btn-start) .toprow,
        .frame:has(#btn-start) .bottomrow {
            display: none;
        }

    </style>

</head>

    <script>
    /* I round (esercizi 001, 017, 033, 049, 065, 081, 097, 113, 129 del Metodo Scintilla – Vol. 02 Memoria)
       sono nel file esterno JSON: per ogni sessione ne viene scelto uno a caso. */
    const DATA_URL = 'ricordare-per-categorie.json';
    const STUDY_SECONDS = 45;
    const COLORS = ['#38bdf8', '#f472b6', '#facc15', '#4ade80'];

    let R = null;                  // round scelto a caso per questa sessione
    let moves = 0;
    let helps = 0;
    let seconds = 0;
    let clock = null;
    let studyTimer = null;
    let place = {};
    let sel = null;
    let order = [];
    let helpEnabled = false;
    let isGameReady = false;       // true solo quando i dati sono caricati

    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const btnIcon = document.getElementById('btn-icon');
    let currentButtonMode = 'help';

    /* =========================================================
    PULSANTE: ICONA E TESTO
    ========================================================= */

    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

    function setButtonIcon(iconClass) {
        if (!btnIcon) return;
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(iconClass);
    }

    function setButtonState(mode) {
        currentButtonMode = mode;
        const states = {
            help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check',       text: 'Fatto' }
        };
        setButtonIcon(states[mode].icon);
        const textEl = revealBtn && revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = states[mode].text;
    }

    /* Dissolvenza: esce la schermata attuale, poi appare la successiva */
    function transitionTo(next) {
        const old = area.querySelector('.frame');
        if (!old) { next(); return; }
        old.classList.add('fade-out');
        setTimeout(() => {
            next();
            const fresh = area.querySelector('.frame');
            if (fresh) fresh.classList.add('fade-in');
        }, 250);
    }

    const $ = id => document.getElementById(id);
    const area = $('game-area');

    function norm(s) {
        return s
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ');
    }

    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startClock() {
        if (clock) return;
        clock = setInterval(() => { seconds++; $('time-value').textContent = seconds + 's'; }, 1000);
    }

    function stopClock() {
        clearInterval(clock);
        clock = null;
    }

    function updateStats() {
        $('moves-value').textContent = moves;
        $('reveals-value').textContent = helps;
    }

    function setProgress(pct) {
        $('progress-bar-fill').style.width = pct + '%';
    }

    function banner(txt) {
        $('instruction-banner').textContent = txt;
    }

    /*
    function enableHelp(on) {
        helpEnabled = on;
        $('help-btn').disabled = !on;
    }
    */

    function enableHelp(on) {
        helpEnabled = on;
        revealBtn.disabled = !on;
    }

    /* Scheletro unico: riga alta / zona A / zona B / riga bassa (oppure un solo blocco "main") */
    function frame({ top = '', a = '', b = '', main = null, bottom = '' }) {
        area.innerHTML = `<div class="frame">
            <div class="toprow">${top}</div>
            ${main !== null ? `<div class="main">${main}</div>` : a + b}
            <div class="bottomrow">${bottom}</div>
        </div>`;
    }

        enableHelp(false);
        banner('Premi Inizia: vedrai le parole per 45 secondi. Prova a raggrupparle per categoria.');

            bottom: '<button id="btn-start" class="cool-btn">Inizia</button>'

                /*

    function startStudy() {
        let left = STUDY_SECONDS;
        enableHelp(false);
        banner('Studia le parole: tra poco dovrai metterle nei gruppi giusti.');
        
        frame({
            top: `<span class="timer" id="study-left">${left}s</span><div class="timer-bar"><div id="study-bar"></div></div>`,
            a: `<div class="zone pool slotA">
                    <div class="wgrid">${R.words.map(w => `<button class="wbtn static" disabled>${w}</button>`).join('')}</div>
                </div>`,
            b: `<div class="zone panel slotA">
                    <p class="big-msg">Cerca i dettagli in comune tra le parole</p>
                </div>`,
            bottom: '<button id="btn-done" class="cool-btn">Ho finito di studiare</button>'
        });
        /*
        const stop = () => {
            clearInterval(studyTimer);
            startSort();
        };
        */
        const stop = () => {
            clearInterval(studyTimer);
            transitionTo(startSort);
        };

        $('btn-done').onclick = stop;
        const bar = $('study-bar');
        bar.style.width = '100%';
        bar.getBoundingClientRect();
        bar.style.transition = `width ${STUDY_SECONDS}s linear`;
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
        studyTimer = setInterval(() => {
            left--;
            const el = $('study-left'); if (el) el.textContent = left + 's';
            if (left <= 0) stop();
        }, 1000);
    }

    /* ---------- FASE 2: smistamento a tocco ---------- */
    // A ogni riquadro assegna la categoria che contiene più parole giuste (stato attuale)
    function assignCategories() {
        const names = Object.keys(R.groups), n = names.length;
        const catOf = {};
        names.forEach((nm, c) => R.groups[nm].forEach(w => catOf[norm(w)] = c));
        const counts = names.map(() => new Array(n).fill(0));
        R.words.forEach((w, i) => { if (place[i] !== 'pool') counts[place[i]][catOf[norm(w)]]++; });
        const assign = new Array(n).fill(-1), usedB = new Set(), usedC = new Set();
        for (let k = 0; k < n; k++) {
            let best = -1, bb = -1, bc = -1;
            for (let b = 0; b < n; b++) if (!usedB.has(b)) for (let c = 0; c < n; c++) if (!usedC.has(c) && counts[b][c] > best) { best = counts[b][c]; bb = b; bc = c; }
            assign[bb] = bc; usedB.add(bb); usedC.add(bc);
        }
        return { names, catOf, assign };
    }

    function startSort() {
        place = {}; R.words.forEach((w, i) => place[i] = 'pool');
        order = shuffle(R.words.map((_, i) => i));
        sel = null;
        banner('Tocca una parola e poi il gruppo dove vuoi metterla. Tieni premuto Help per vedere le risposte.');
        renderSort();
        enableHelp(true);
    }

    /*
    const wordBtn = i => `<button class="wbtn ${sel === i ? 'sel' : ''}" data-i="${i}">${R.words[i]}</button>`;
    */

    ? `<button class="wbtn grid-button ${sel === i ? 'sel' : ''}" data-i="${i}">${R.words[i]}</button>`

    */

    const wordBtn = i => place[i] === 'pool'
    ? `<button class="wbtn grid-button ${sel === i ? 'sel' : ''}" data-i="${i}">${R.words[i]}</button>`
    : `<button class="wbtn grid-button locked sel" data-i="${i}" disabled>${R.words[i]}</button>`;

            : sel !== null ? `Ora tocca un gruppo per «${R.words[sel]}»`
            : `Parole da sistemare (${inPool.length})`;

function poolHtml() {
    const inPool = order.filter(i => place[i] === 'pool');
    return `<div class="zone pool slotA ${sel !== null ? 'target' : ''}" data-z="pool">
                <div class="wgrid">${inPool.map(wordBtn).join('')}</div></div>`;
}

    function boxesHtml() {
        const names = Object.keys(R.groups);
        return `<div class="boxes slotB" style="--n:${names.length}">` + names.map((nm, b) => {
            const items = order.filter(i => place[i] === b);
            return `<div class="zone box ${items.length ? '' : 'empty'} ${sel !== null ? 'target' : ''}" data-z="${b}" style="--c:${COLORS[b % COLORS.length]}">
                <p class="zone-label">Gruppo ${b + 1}</p><div class="wgrid">${items.map(wordBtn).join('')}</div></div>`;
        }).join('') + '</div>';
    }

    function renderSort() {
        const inPool = order.filter(i => place[i] === 'pool');
        // la barra avanza di una parola ogni volta che una parola è dentro un gruppo (giusto o sbagliato)
        setProgress((R.words.length - inPool.length) / R.words.length * 100);
        frame({
           top: `<span class="big-msg">${
                inPool.length === 0
                    ? 'Tutte le parole sono nei gruppi: premi Verifica'
                    : inPool.length === 1
                        ? 'Manca ancora 1 parola'
                        : `Mancano ancora ${inPool.length} parole`
            }</span>`,
            a: poolHtml(),
            b: boxesHtml(),
            bottom: `<button id="btn-check" class="cool-btn" ${inPool.length ? 'disabled' : ''}>Verifica</button>`
        });
        // un solo gestore (delegato): continua a funzionare anche se i riquadri vengono sostituiti
        area.querySelector('.frame').onclick = e => {
            
           const w = e.target.closest('.wbtn');
            if (w && w.dataset.i !== undefined && place[+w.dataset.i] === 'pool') {
                const i = +w.dataset.i;
                sel = (sel === i) ? null : i;
                renderSort();
                return;
            }

            const z = e.target.closest('.zone');
            if (z && sel !== null && z.dataset.z !== undefined) {
                const dest = z.dataset.z === 'pool' ? 'pool' : +z.dataset.z;
                if (place[sel] !== dest) { place[sel] = dest; moves++; updateStats(); }
                sel = null; renderSort();
            }
        };
        /*
        $('btn-check').onclick = showResult;
        */
       $('btn-check').onclick = () => transitionTo(showResult);
    }

    /* Help "tieni premuto": finché il pulsante è premuto ogni gruppo mostra la categoria e TUTTE le sue
       parole corrette; al rilascio si ripristina lo stato attuale. Si sostituisce solo il contenuto dei
       riquadri, quindi le dimensioni non cambiano. */
    (function setupHelp() {
        const btn = revealBtn;   // was: $('help-btn')
        let held = false;
        const show = () => {
            if (held || !helpEnabled) return;
            held = true; helps++; updateStats();
            btn.classList.add('held');
            const { names, assign } = assignCategories();
            area.querySelector('.boxes').innerHTML = names.map((_, b) => {
                const nm = names[assign[b]];
                return `<div class="zone box peek" style="--c:${COLORS[b % COLORS.length]}"><p class="zone-label">${nm}</p>
                    <div class="wgrid">${R.groups[nm].map(w => `<span class="wbtn hint">${w}</span>`).join('')}</div></div>`;
            }).join('');
        };
        const hide = () => {
            if (!held) return;
            held = false;
            btn.classList.remove('held');
            const old = area.querySelector('.boxes');
            if (old) old.outerHTML = boxesHtml();
        };
        btn.addEventListener('pointerdown', e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (_) {} show(); });
        ['pointerup', 'pointercancel', 'lostpointercapture', 'pointerleave', 'blur'].forEach(ev => btn.addEventListener(ev, hide));
        btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); show(); } });
        btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') hide(); });
        btn.addEventListener('contextmenu', e => e.preventDefault());
    })();

    /* ---------- FASE 3: risultato (stesso scheletro) ---------- */
    function showResult() {
        stopClock();
        enableHelp(false);
        const { names, catOf, assign } = assignCategories();
        let score = 0;
        const groups = names.map((_, b) => {
            const idxs = R.words.map((w, i) => i).filter(i => place[i] === b);
            const btns = idxs.map(i => {
                const ok = catOf[norm(R.words[i])] === assign[b];
                if (ok) score++;
                return `<span class="wbtn static ${ok ? 'ok' : 'ko'}">${R.words[i]}${ok ? '' : `<small>→ ${names[catOf[norm(R.words[i])]]}</small>`}</span>`;
            }).join('');
            return `<div class="group" style="border-color:${COLORS[b % COLORS.length]}"><h3>${names[assign[b]]}</h3><div class="wgrid">${btns || '<span class="big-msg">Vuoto</span>'}</div></div>`;
        }).join('');

        banner('Ecco il risultato: verde = nel gruppo giusto, rosso = nel gruppo sbagliato.');
        const total = R.words.length;
        const msg = score === total
            ? 'Perfetto! Tutte le parole nel gruppo giusto.'
            : score >= total * 0.6
                ? 'Bel lavoro!'
                : 'Buon tentativo: la prossima volta cerca i punti in comune tra le parole.';
        frame({
            top: `<span class="big-msg">Risultato</span>`,
            a: `<div class="zone panel slotA" style="border-style:solid;border-color:var(--summary-background)"><div class="score">${score} / ${total}</div><p class="big-msg">${msg}</p></div>`,
            b: `<div class="groups slotB" style="--n:${names.length}">${groups}</div>`
        });
    }

    /* ---------- Caricamento JSON + scelta casuale ---------- */
    async function loadRound() {
        isGameReady = false;
        enableHelp(false);
        frame({ main: '<p class="big-msg">Caricamento…</p>' });

        try {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const all = await res.json();
            if (!Array.isArray(all) || !all.length) throw new Error('JSON vuoto');
            R = all[Math.floor(Math.random() * all.length)];
            moves = 0; helps = 0; seconds = 0; $('time-value').textContent = '0s';
            setProgress(0); updateStats();
            isGameReady = true;
            showIntro();
        } catch (err) {
            frame({ main: `<p class="big-msg">Impossibile caricare gli esercizi.</p>
                <p class="big-msg">Controlla che il file <strong>${DATA_URL}</strong> sia nella stessa cartella e che la pagina sia aperta da un server (non da file://).</p>` });
        }
    }

    /* =========================================================
       AVVIO
       ========================================================= */
    async function initGame() {
        await loadRound();
        document.body.classList.add('loaded');
    }

    initGame();
