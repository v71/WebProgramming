<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricordare per categorie</title>

    <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <!-- Main CSS File -->
    <link href="../stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        :root {
            --word: #7931b4;
            --help: #4f46e5;
            --ok: #22c55e;
            --ko: #ef4444;
            --gap: clamp(6px, 1.7vh, 16px);
            --maxw: 1100px;
            --fs-word: clamp(.8rem, 2.2vh, 1.25rem);
            --fs-ui: clamp(.75rem, 1.85vh, 1.05rem);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /*
        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.25rem, 4vh, 2.3rem);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }
        */
        /* L'area di gioco ha SEMPRE le stesse dimensioni, in tutte le fasi */
        #game-area {
            flex: 1 1 0;
            min-height: 0;
            max-height: 450px;
            width: 100%;
            max-width: var(--maxw);
            margin: 16px 0 10px 0;
            padding: clamp(8px, 2.2vh, 22px);
            border-radius: 20px;
            background: var(--game-area-background);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Scheletro unico: [ riga alta ] [ zona A ] [ zona B ] [ riga bassa ] */
        .frame { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1.2vh, 12px); }
        .toprow, .bottomrow { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .toprow { height: clamp(20px, 3.4vh, 32px); }
        .bottomrow { height: clamp(30px, 4.8vh, 46px); }
        .main { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); text-align: center; }
        .main:has(> p + p) { gap: 2px; }

        .slotA, .slotB { box-sizing: border-box; }
        .slotA { flex: 0 0 33%; }
        .slotB { flex: 1 1 0; }

        .big-msg {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0;
            line-height: 1.4;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }

        /* timer (riga alta, fase di studio) */
        .timer {
            font-size: var(--fs-word);
            line-height: 1;
            font-weight: 400;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            min-width: 3.2ch;
            text-align: right;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }

        .timer-bar { flex: 1; max-width: 500px; height: clamp(8px, 1.3vh, 12px); background: var(--body-background); border-radius: 99px; overflow: hidden; border: 2px solid var(--border); }
        .timer-bar > div { height: 100%; width: 100%; background: var(--accent); }

        /* zone */
        .zone {
            background: var(--summary-background);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: clamp(6px, 1.2vh, 12px);
            display: flex; flex-direction: column;
            gap: clamp(4px, .9vh, 8px);
            overflow: hidden;
            min-height: 0;
            transition: border-color .15s, background .15s;
        }

        .zone-label {
            margin: 0;
            font-size: var(--fs-ui);
            font-weight: 400;
            color: var(--accent);
            text-align: center;
            line-height: 1.25;
            flex: 0 0 auto;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }

        .zone.panel 
        { 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }

        /* PULSANTI PAROLA */
        .wgrid { display: grid; gap: clamp(4px, 1vh, 10px); width: 100%; min-height: 0; align-content: start; }
        
        .pool .wgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

        .wbtn {
            font: inherit;
            font-size: 1.2rem;
            font-weight: 400;
            color: #fff;
            min-height: 32px;
            background: var(--word);
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .3s ease, border-color .3s ease, transform .3s ease, opacity .4s ease;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .wbtn.static { cursor: default; }
        .wbtn.static:disabled { opacity: 1; pointer-events: none !important; transform: none !important; }
        .wbtn:hover {
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }
        .wbtn.sel {
            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
            opacity: 1 !important;
            cursor: default !important;
        }
        .wbtn.locked:disabled { pointer-events: none !important; transform: none !important; opacity: 1 !important; }
        .wbtn:focus-visible { outline: 3px solid #fff; outline-offset: 1px; }
        .wbtn.hint { cursor: default; border-color: var(--c); }
        
        .wbtn.ok { background: var(--grid-btn-selected-hovered ); border-color: var(--text); }
        .wbtn.ko { background: var(--grid-btn-wrong); color:var(--text); border-color: var(--grid-btn-wrong-border-color); }
        
        .wbtn small { display: block; font-size: .55em; font-weight: 600; color: #ddd; line-height: 1.1; }
        .wbtn.ok, .wbtn.ko { pointer-events: none; }

        .zone.target { cursor: pointer; }
        .pool.target { border-color: var(--border); background: var(--summary-background); }

        /* gruppi (smistamento e risultato) */
        .boxes, 
        .groups { 
            display: grid; 
            grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); 
            grid-auto-rows: minmax(0, 1fr); 
            gap: clamp(6px, 1.4vh, 14px); 
            min-height: 0; 
        }
        
       .box { position: relative; border-style: solid; border-width: 2px; border-color: var(--c); }
       .box .wgrid { grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 15vh, 140px), 1fr)); overflow-y: auto; flex: 1 1 0; align-content: safe center; }
       .box .zone-label { color: var(--c); padding-bottom: 2px; border-bottom: 2px solid var(--c); }
        
       .box .zone-label {
            color: var(--c);
            padding-bottom: 8px;      /* was 2px, increase for a lower line */
            border-bottom: 2px solid var(--c);
        }
        
        .box.empty::after {
            content: 'Clicca qui';
            position: absolute; left: 0; right: 0; top: 58%; transform: translateY(-50%);
            text-align: center; font-weight: 400; font-size: 1.5rem; color: var(--text); pointer-events: none;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }
        
        .box.target { 
          /*  background:  #565186; */
          background: var(--body-background);
        }

        .box.target.empty::after { content: 'Metti qui'; color: var(--c); }

        /* risultato */
        .group { 
            background: var(--summary-background); 
            border: 2px solid var(--border); 
            border-radius: 14px; 
            padding: clamp(5px, 1.1vh, 10px); 
            overflow: hidden; 
            min-height: 0; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; }
        
        .group h3 { margin: 0; font-size: var(--fs-ui); color: var(--accent); text-align: center; line-height: 1.2; }
        .group .wgrid { grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 15vh, 140px), 1fr)); overflow-y: auto; }
        .score { font-size: clamp(1.4rem, 4.6vh, 2.6rem); line-height: 1; font-weight: 800; color: var(--accent); text-shadow: 0 2px 4px rgba(0,0,0,.5); }

        /* scrollbar e padding delle griglie */
        .box .wgrid, .group .wgrid, .pool .wgrid {
            scrollbar-width: thin;
            scrollbar-color: var(--c, var(--accent)) transparent;
            box-sizing: border-box;
            padding-inline: 8px;
        }
        
        .box .wgrid::-webkit-scrollbar, .group .wgrid::-webkit-scrollbar, .pool .wgrid::-webkit-scrollbar { width: 6px; }
        .box .wgrid::-webkit-scrollbar-track, .group .wgrid::-webkit-scrollbar-track, .pool .wgrid::-webkit-scrollbar-track { background: transparent; }
        .box .wgrid::-webkit-scrollbar-thumb, .group .wgrid::-webkit-scrollbar-thumb, .pool .wgrid::-webkit-scrollbar-thumb { background: var(--c, var(--accent)); border-radius: 99px; }

        /* pulsanti di gioco */
        button.cool-btn:disabled, button.cool-btn[disabled] {
            opacity: .5 !important; 
            cursor: not-allowed !important; 
            transform: none !important; 
            box-shadow: none !important; 
            pointer-events: none !important;
        }

        /* pulsante Aiuto / Prossimo round / Fatto */
        .cool-btn-2 {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px 28px; font-size: 1.5rem; font-weight: 400;
            color: var(--text); background-color: #4f46e5;
            border: 2px solid var(--border); border-radius: 99px; cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all .35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
        }

        #reveal-btn { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin-bottom: 0 !important; }
        #reveal-btn:disabled { opacity: .4; cursor: not-allowed; }
        #reveal-btn.held {
            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
            opacity: 1 !important;
            cursor: default !important;
        }
        #reveal-btn .fa {
            font-size: 25px; line-height: 1; color: #fff; --w: 1px;
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000, 0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000, calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000, calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000, var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }
        /* l'icona resta ferma in hover, focus e pressione */
        #reveal-btn .fa, #reveal-btn:hover .fa, #reveal-btn:focus .fa, #reveal-btn:active .fa, #reveal-btn:hover i {
            transform: none !important; animation: none !important; transition: none !important;
        }
        #action-controls { margin-bottom: 0 !important; padding-bottom: 0 !important; }

        /* posizioni specifiche per schermata */
        .frame:has(#btn-start) .toprow,
        .frame:has(#btn-start) .bottomrow { display: none; }
        .intro-start { margin-top: 24px; }
        
        .frame:has(#btn-done) .bottomrow {
            margin-top: 0;
            position: relative;
            top: 18px;      /* increase or decrease to taste */
        }

        .frame:has(#btn-check) .bottomrow { position: relative; top: 6px; }
        .frame:has(#btn-done) .pool .wgrid { flex: 1 1 0; align-content: safe center; overflow-y: auto; }
        .pool[data-z="pool"] .wgrid { flex: 1 1 0; align-content: safe center; overflow-y: auto; }

        /* transizione tra le schermate */
        .frame.fade-out { animation: frameOut .25s ease forwards; pointer-events: none; }
        .frame.fade-in { animation: frameIn .35s ease both; }
        @keyframes frameOut { to { opacity: 0; transform: translateY(6px); } }
        @keyframes frameIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .frame.fade-out, .frame.fade-in { animation: none; } }

        @media (max-width: 980px) {
            #instruction-banner { height: calc(var(--fs-ui) * 3.9 + 12px); padding: 0 16px; border-radius: 18px; }
        }

        @media (max-width: 700px) {
            #game-area { padding: 8px; border-radius: 16px; }
            .pool .wgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .boxes, .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .box .wgrid, .group .wgrid { grid-template-columns: 1fr; }
            .zone { padding: 5px; gap: 3px; }
            .wbtn { padding: 2px 3px; border-radius: 6px; }
            .wbtn small { font-size: .62em; }
        }
     
    </style>

</head>

<body>

    <h1 id="game-title">Ricordare per categorie</h1>

    <div id="game-stats">
        <span>Round: <strong id="round-value">-</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <div id="instruction-banner" aria-live="polite">
        Premi Inizia: vedrai le parole per 45 secondi. Prova a raggrupparle per categoria.
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn-2" disabled>
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Tieni premuto per avere un aiuto!</span>
        </button>
    </div>

    <div id="game-area"></div>

    <h2 id="progress-title">Progresso</h2>
    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
    </div>

    <script>

    /* I round (esercizi 001, 017, 033, 049, 065, 081, 097, 113, 129 del Metodo Scintilla – Vol. 02 Memoria)
       sono nel file esterno JSON: vengono mescolati e giocati uno dopo l'altro, senza ripetizioni. */
    
    const DATA_URL = 'ricordare-per-categorie.json';
    const STUDY_SECONDS = 45;
    const COLORS = ['#38bdf8', '#f472b6', '#facc15', '#4ade80'];

    let rounds = [];               // tutti i round, in ordine casuale
    let roundIndex = 0;            // round corrente
    let results = [];              // risultati di ogni round
    let R = null;                  // round corrente
    let moves = 0;
    let helps = 0;
    let seconds = 0;
    let clock = null;
    let studyTimer = null;
    let place = {};
    let sel = null;
    let order = [];
    let helpEnabled = false;
    let isGameReady = false;       // true solo quando i dati sono caricati
    let currentButtonMode = 'help';

    const $ = id => document.getElementById(id);
    const area = $('game-area');
    const revealBtn = $('reveal-btn');
    const btnIcon = $('btn-icon');

    const gameTitle = document.getElementById('game-title');
    const gameStats = document.getElementById('game-stats');
    const gameArea = document.getElementById('game-area');
    const instructionBanner = document.getElementById('instruction-banner');
    const actionControls = document.getElementById('action-controls');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressBar = document.querySelector('.progress-bar-container');
    const progressBarTitle = document.getElementById('progress-title');

    /* =========================================================
       PULSANTE: ICONA E TESTO (help / next / done)
       ========================================================= */
    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

    function setButtonIcon(iconClass) {
        if (!btnIcon) return;
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(iconClass);
    }

    function setButtonState(mode) {
        currentButtonMode = mode;
        const states = {
            help: { icon: 'fa-lightbulb-o', text: 'Tieni premuto per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check',       text: 'Fatto' }
        };
        setButtonIcon(states[mode].icon);
        const textEl = revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = states[mode].text;
    }

    /* Dissolvenza: esce la schermata attuale, poi appare la successiva */
    function transitionTo(next) {
        const old = area.querySelector('.frame');
        if (!old) { next(); return; }
        old.classList.add('fade-out');
        setTimeout(() => {
            next();
            const fresh = area.querySelector('.frame');
            if (fresh) fresh.classList.add('fade-in');
        }, 250);
    }

    /* =========================================================
       UTILITÀ
       ========================================================= */
    function norm(s) {
        return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
    }

    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startClock() {
        if (clock) return;
        clock = setInterval(() => { seconds++; $('time-value').textContent = seconds + 's'; }, 1000);
    }

    function stopClock() {
        clearInterval(clock);
        clock = null;
    }

    function updateStats() {
        $('moves-value').textContent = moves;
        $('reveals-value').textContent = helps;
    }

    function resetRoundStats() {
        moves = 0; helps = 0; seconds = 0;
        $('time-value').textContent = '0s';
        updateStats();
    }

    function setProgress(pct) { $('progress-bar-fill').style.width = pct + '%'; }
    function banner(txt) { $('instruction-banner').textContent = txt; }

    function enableHelp(on) {
        helpEnabled = on;
        revealBtn.disabled = !on;
    }

    /* Scheletro unico: riga alta / zona A / zona B / riga bassa (oppure un solo blocco "main") */
    function frame({ top = '', a = '', b = '', main = null, bottom = '' }) {
        area.innerHTML = `<div class="frame">
            <div class="toprow">${top}</div>
            ${main !== null ? `<div class="main">${main}</div>` : a + b}
            <div class="bottomrow">${bottom}</div>
        </div>`;
    }

    /* ---------- FASE 0: intro ---------- */
    function showIntro() {
        setButtonState('help');
        enableHelp(false);
        $('round-value').textContent = `${roundIndex + 1}/${rounds.length}`;
        banner(`Round ${roundIndex + 1} di ${rounds.length}. Premi Inizia: vedrai le parole per ${STUDY_SECONDS} secondi.`);
        frame({
            main: `<p class="big-msg">Vedrai ${R.words.length} parole per ${STUDY_SECONDS} secondi.</p>
                <p class="big-msg">Cerca di ricordarle e di metterle in gruppi.</p>
                <p class="big-msg">Il tempo parte quando premi il pulsante.</p>
                <button id="btn-start" class="cool-btn intro-start">Inizia</button>`
        });
        $('btn-start').onclick = () => { startClock(); transitionTo(startStudy); };
    }

    /* ---------- FASE 1: studio ---------- */
    function startStudy() {
        let left = STUDY_SECONDS;
        enableHelp(false);
        banner('Studia le parole: tra poco dovrai metterle nei gruppi giusti.');
        frame({
            top: `<span class="timer" id="study-left">${left}s</span><div class="timer-bar"><div id="study-bar"></div></div>`,
            a: `<div class="zone pool slotA">
                    <div class="wgrid">${R.words.map(w => `<button class="wbtn static" disabled>${w}</button>`).join('')}</div>
                </div>`,
            b: `<div class="zone panel slotA">
                    <p class="big-msg">Cerca i dettagli in comune tra le parole</p>
                </div>`,
            bottom: '<button id="btn-done" class="cool-btn">Ho finito di studiare</button>'
        });
        const stop = () => {
            clearInterval(studyTimer);
            transitionTo(startSort);
        };
        $('btn-done').onclick = stop;
        const bar = $('study-bar');
        bar.style.width = '100%';
        bar.getBoundingClientRect();
        bar.style.transition = `width ${STUDY_SECONDS}s linear`;
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
        studyTimer = setInterval(() => {
            left--;
            const el = $('study-left'); if (el) el.textContent = left + 's';
            if (left <= 0) stop();
        }, 1000);
    }

    /* ---------- FASE 2: smistamento a tocco ---------- */
    // A ogni riquadro assegna la categoria che contiene più parole giuste (stato attuale)
    function assignCategories() {
        const names = Object.keys(R.groups), n = names.length;
        const catOf = {};
        names.forEach((nm, c) => R.groups[nm].forEach(w => catOf[norm(w)] = c));
        const counts = names.map(() => new Array(n).fill(0));
        R.words.forEach((w, i) => { if (place[i] !== 'pool') counts[place[i]][catOf[norm(w)]]++; });
        const assign = new Array(n).fill(-1), usedB = new Set(), usedC = new Set();
        for (let k = 0; k < n; k++) {
            let best = -1, bb = -1, bc = -1;
            for (let b = 0; b < n; b++) if (!usedB.has(b)) for (let c = 0; c < n; c++) if (!usedC.has(c) && counts[b][c] > best) { best = counts[b][c]; bb = b; bc = c; }
            assign[bb] = bc; usedB.add(bb); usedC.add(bc);
        }
        return { names, catOf, assign };
    }

    function startSort() {
        place = {}; R.words.forEach((w, i) => place[i] = 'pool');
        order = shuffle(R.words.map((_, i) => i));
        sel = null;
        banner('Tocca una parola e poi il gruppo dove vuoi metterla. Tieni premuto il pulsante Aiuto per vedere le risposte.');
        renderSort();
        enableHelp(true);
    }

    const wordBtn = i => place[i] === 'pool'
        ? `<button class="wbtn grid-button ${sel === i ? 'sel' : ''}" data-i="${i}">${R.words[i]}</button>`
        : `<button class="wbtn grid-button locked sel" data-i="${i}" disabled>${R.words[i]}</button>`;

    function poolHtml() {
        const inPool = order.filter(i => place[i] === 'pool');
        return `<div class="zone pool slotA ${sel !== null ? 'target' : ''}" data-z="pool">
                    <div class="wgrid">${inPool.map(wordBtn).join('')}</div></div>`;
    }

    function boxesHtml() {
        const names = Object.keys(R.groups);
        return `<div class="boxes slotB" style="--n:${names.length}">` + names.map((nm, b) => {
            const items = order.filter(i => place[i] === b);
            return `<div class="zone box ${items.length ? '' : 'empty'} ${sel !== null ? 'target' : ''}" data-z="${b}" style="--c:${COLORS[b % COLORS.length]}">
                <p class="zone-label">Gruppo ${b + 1}</p><div class="wgrid">${items.map(wordBtn).join('')}</div></div>`;
        }).join('') + '</div>';
    }

    function renderSort() {
        const inPool = order.filter(i => place[i] === 'pool');
        frame({
            top: `<span class="big-msg">${
                inPool.length === 0
                    ? 'Tutte le parole sono nei gruppi: premi Verifica'
                    : inPool.length === 1
                        ? 'Manca ancora 1 parola'
                        : `Mancano ancora ${inPool.length} parole`
            }</span>`,
            a: poolHtml(),
            b: boxesHtml(),
            bottom: `<button id="btn-check" class="cool-btn" ${inPool.length ? 'disabled' : ''}>Verifica</button>`
        });
        // un solo gestore (delegato): continua a funzionare anche se i riquadri vengono sostituiti
        area.querySelector('.frame').onclick = e => {
            const w = e.target.closest('.wbtn');
            if (w && w.dataset.i !== undefined && place[+w.dataset.i] === 'pool') {
                const i = +w.dataset.i;
                sel = (sel === i) ? null : i;
                renderSort();
                return;
            }
            const z = e.target.closest('.zone');
            if (z && sel !== null && z.dataset.z !== undefined) {
                const dest = z.dataset.z === 'pool' ? 'pool' : +z.dataset.z;
                if (place[sel] !== dest) { place[sel] = dest; moves++; updateStats(); }
                sel = null; renderSort();
            }
        };
        $('btn-check').onclick = () => transitionTo(showResult);
    }

    /* Pulsante: in modalità "help" si tiene premuto per vedere le risposte;
       in modalità "next" / "done" funziona come un normale click. */
    (function setupHelp() {
        const btn = revealBtn;
        let held = false;
        const isHelp = () => currentButtonMode === 'help';

        const show = () => {
            if (held || !helpEnabled || !isHelp()) return;
            held = true; helps++; updateStats();
            btn.classList.add('held');
            const { names, assign } = assignCategories();
            area.querySelector('.boxes').innerHTML = names.map((_, b) => {
                const nm = names[assign[b]];
                const btns = R.groups[nm].map(w => `<span class="wbtn ok">${w}</span>`).join('');
                return `<div class="zone box" style="--c:${COLORS[b % COLORS.length]}">
                            <p class="zone-label">Gruppo ${b + 1}</p>
                            <div class="wgrid">${btns}</div>
                        </div>`;
            }).join('');
        };

        const hide = () => {
            if (!held) return;
            held = false;
            btn.classList.remove('held');
            const old = area.querySelector('.boxes');
            if (old) old.outerHTML = boxesHtml();
        };

        btn.addEventListener('pointerdown', e => {
            if (!isHelp()) return;
            e.preventDefault();
            try { btn.setPointerCapture(e.pointerId); } catch (_) {}
            show();
        });
        ['pointerup', 'pointercancel', 'lostpointercapture', 'pointerleave', 'blur'].forEach(ev => btn.addEventListener(ev, hide));
        btn.addEventListener('keydown', e => {
            if (!isHelp()) return;
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); show(); }
        });
        btn.addEventListener('keyup', e => { if (isHelp() && (e.key === ' ' || e.key === 'Enter')) hide(); });
        btn.addEventListener('contextmenu', e => e.preventDefault());

        btn.addEventListener('click', () => {
            if (currentButtonMode === 'next') {
                btn.disabled = true;
                transitionTo(nextRound);
            } else if (currentButtonMode === 'done') {
                btn.disabled = true;
                transitionTo(showSummary);
            }
        });
    })();

    /* ---------- FASE 3: risultato ---------- */
    function showResult() {
        stopClock();
        const { names, catOf, assign } = assignCategories();
        let score = 0;
        const groups = names.map((_, b) => {
            const idxs = R.words.map((w, i) => i).filter(i => place[i] === b);
            const btns = idxs.map(i => {
                const ok = catOf[norm(R.words[i])] === assign[b];
                if (ok) score++;
                return `<span class="wbtn static ${ok ? 'ok' : 'ko'}">${R.words[i]}</span>`;
            }).join('');
            // after
            return `<div class="zone box" style="--c:${COLORS[b % COLORS.length]}"><p class="zone-label">Gruppo ${b + 1}</p><div class="wgrid">${btns || '<span class="big-msg">Vuoto</span>'}</div></div>`;
        }).join('');

        const total = R.words.length;

        // salva i valori del round e fai avanzare la barra
        results.push({
            label: Object.keys(R.groups).join(' · '),
            score, total, seconds, moves, helps,
            metric: total ? score / total * 100 : 0
        });
        setProgress(results.length / rounds.length * 100);

        // il pulsante diventa "Prossimo round", oppure "Fatto" all'ultimo round
        const isLast = roundIndex >= rounds.length - 1;
        setButtonState(isLast ? 'done' : 'next');
        helpEnabled = false;
        revealBtn.disabled = false;

        banner('Ecco il risultato: verde = nel gruppo giusto, rosso = nel gruppo sbagliato.');
        const msg = score === total
            ? 'Perfetto! Tutte le parole nel gruppo giusto.'
            : score >= total * 0.6
                ? 'Bel lavoro!'
                : 'Buon tentativo: la prossima volta cerca i punti in comune tra le parole.';
        frame({
            top: `<span class="big-msg">Risultato</span>`,
            a: `<div class="zone panel slotA" style="border-style:solid;border-color:var(--border)"><div class="score">${score} / ${total}</div><p class="big-msg">${msg}</p></div>`,
            b: `<div class="groups slotB" style="--n:${names.length}">${groups}</div>`
        });
    }

    /* ---------- Prossimo round ---------- */
    function nextRound() {
        roundIndex++;
        R = rounds[roundIndex];
        resetRoundStats();
        showIntro();                // showIntro rimette il pulsante in modalità aiuto
    }

    function showSummary() {
        enableHelp(false);
        stopClock();

        // nascondo tutto il gioco, compresa l'area di gioco
        [gameTitle, gameStats, instructionBanner, actionControls,
        progressBarTitle, progressBar, gameArea].forEach(el => el.style.display = 'none');

        const tbody = $('summary-tbody');
        tbody.innerHTML = '';
        results.forEach((res, idx) => {
            const row = document.createElement('tr');
            const values = [`${idx + 1} · ${res.label}`, res.seconds + 's', res.moves, res.helps, res.metric.toFixed(2)];
            values.forEach((value, i) => {
                const td = document.createElement('td');
                td.textContent = value;              // textContent: niente HTML iniettato dal JSON
                if (i === 4) td.style.fontWeight = '700';
                row.appendChild(td);
            });
            tbody.appendChild(row);
        });

        const sum = k => results.reduce((a, r) => a + r[k], 0);
        const totalTime = sum('seconds');
        const totalMoves = sum('moves');
        const totalHelps = sum('helps');
        const averageMetric = results.length ? sum('metric') / results.length : 0;
        const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

        $('summary-totals').innerHTML = `
            <div>Tempo Totale: <strong>${totalTime}s</strong> | Mosse Totali: <strong>${totalMoves}</strong> | Aiuti Totali: <strong>${totalHelps}</strong></div>
            <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
            <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>`;

        const screen = $('summary-screen');
        screen.style.display = 'block';
        screen.classList.add('show');
    }

    /* ---------- Caricamento JSON + mescolamento dei round ---------- */
    async function loadRound() {
        isGameReady = false;
        enableHelp(false);
        frame({ main: '<p class="big-msg">Caricamento…</p>' });

        try {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const all = await res.json();
            if (!Array.isArray(all) || !all.length) throw new Error('JSON vuoto');
            rounds = shuffle(all.slice());      // tutti i round, in ordine casuale, senza ripetizioni
            roundIndex = 0;
            results = [];
            R = rounds[0];
            resetRoundStats();
            setProgress(0);
            isGameReady = true;
            showIntro();
        } catch (err) {
            frame({ main: `<p class="big-msg">Impossibile caricare gli esercizi.</p>
                <p class="big-msg">Controlla che il file <strong>${DATA_URL}</strong> sia nella stessa cartella e che la pagina sia aperta da un server (non da file://).</p>` });
        }
    }
    
    /* =========================================================
       AVVIO
       ========================================================= */
    async function initGame() {
        await loadRound();
        document.body.classList.add('loaded');
    }

    initGame();
    </script>
</body>
