<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordine inverso</title>
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>
    <link href="../stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        :root { --word: #7931b4; --gap: clamp(6px, 1.7vh, 16px); --maxw: 1100px; --fs-word: clamp(.8rem, 2.2vh, 1.25rem); --fs-ui: clamp(.75rem, 1.85vh, 1.05rem); }
        h1 { margin: 0 0 10px; font-size: 2.3rem; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); text-align: center;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 8px rgba(0,0,0,.5); }
        body { padding-block: 20px; }
        #game-area { flex: 1 1 0; min-height: 450px; max-height: 450px; width: 100%; max-width: var(--maxw); margin: 16px 0 10px 0;
            padding: clamp(8px, 2.2vh, 22px); border-radius: 20px; background: var(--game-area-background); border: 2px solid var(--border);
            box-shadow: var(--shadow-md); overflow: hidden; }
        .frame { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1.2vh, 12px); }
        .toprow, .bottomrow { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .toprow { height: clamp(20px, 3.4vh, 32px); }
        .bottomrow { height: clamp(30px, 4.8vh, 46px); }
        .main { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); text-align: center; }
        .main:has(> p + p) { gap: 2px; }
        .big-msg { font-size: 1.8rem; font-weight: 400; margin: 0; line-height: 1.4;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5); }
        .zone-label { margin: 0; font-size: 1.5rem; font-weight: 400; color: var(--accent); text-align: center; line-height: 1.25; flex: 0 0 auto;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5); }
        .timer { font-size: var(--fs-word); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 8px rgba(0,0,0,.5); }
        .timer-bar { flex: 1; max-width: 500px; height: clamp(8px, 1.3vh, 12px); background: var(--body-background); border-radius: 99px; overflow: hidden; border: 2px solid var(--border); }
        .timer-bar > div { height: 100%; width: 100%; background: var(--accent); }
        .board { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3vh, 30px); width: 100%; max-height: 100%; overflow-y: auto; padding-inline: 8px;
                scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }

        /* catena di parole: caselle collegate da frecce */
        .chain { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 4px; width: 100%; }

        .arrow { 
            flex: 0 0 auto; 
            color: var(--text); 
            font-size: 1.5em; 
            text-align: center; 
            padding: 0 clamp(4px, 0.9vw, 1px); 
              text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }
        
        .wbox, .slot { display: flex; align-items: center; justify-content: center; flex: 0 1 140px; min-width: 0; min-height: clamp(44px, 8vh, 64px); padding: 4px 8px;
                        font-size: 1.3rem; border: 2px solid var(--border); border-radius: 14px; text-align: center; }
        
        .wbox { 
            background: var(--word); 
            color: #fff; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; 
        }
        
        .peek { width: 100%; }
        .peek .wbox { background: var(--grid-btn-selected); border-color: var(--grid-btn-selected-border-color); }

        .slot.play { 
            background: var(--summary-background); 
            color: var(--text); 
        }
        
        .slot.play:focus-within { 
            border-color: var(--accent); 
        }
        
        .slot .w { 
            min-width: 0; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }
        
        .slot.ok { 
            background: var(--grid-btn-selected-hovered); 
            border-color: var(--text); 
            color: #fff; 
        }
        
        .slot.ko { 
            background: var(--grid-btn-wrong); 
            color: var(--text); 
            border-color: var(--grid-btn-wrong-border-color, #ef4444); 
        }
        
        .ans { 
            font: inherit; 
            width: 100%; 
            min-width: 0; 
            color: var(--text); 
            background: transparent; 
            border: 0; 
            border-radius: 0; 
            padding: 2px 4px; 
            text-align: 
            center; outline: none; 
        }
        
        .ans:focus { 
            border-bottom-color: var(--text); 
        }

        button.cool-btn:disabled { 
            opacity: .5; 
            cursor: not-allowed; 
            transform: none; 
            box-shadow: none; 
            pointer-events: none; 
        }
        
        .cool-btn-2 { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            padding: 12px 28px; 
            font-size: 1.5rem; 
            color: var(--text); 
            background-color: #4f46e5;
            border: 2px solid var(--border); 
            border-radius: 99px; cursor: pointer; 
            box-shadow: var(--shadow-lg); 
            transition: all .35s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 8px rgba(0,0,0,.5);
         }
        
        #reveal-btn { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin-bottom: 0 !important; }
        #reveal-btn:disabled { opacity: .4; cursor: not-allowed; }
        #reveal-btn.held { background: var(--grid-btn-selected) !important; color: var(--grid-btn-selected-color) !important; border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important; box-shadow: var(--shadow-sm) !important; opacity: 1 !important; cursor: default !important; }
        #reveal-btn .fa { font-size: 25px; line-height: 1; color: #fff; transform: none !important; animation: none !important; transition: none !important; }
        #action-controls { margin-bottom: 0 !important; padding-bottom: 0 !important; }

        .frame:has(#btn-start) .toprow, .frame:has(#btn-start) .bottomrow { 
            display: none;
         }
        
        .intro-start { 
            margin-top: 24px; 
        }
        
        .frame:has(#btn-check) .toprow { 
            display: none; 
        }

        .frame.fade-out { 
            animation: frameOut .25s ease forwards; pointer-events: none; 
        }
        
        .frame.fade-in { 
            animation: frameIn .35s ease both; 
        }
        
        @keyframes frameOut { to { opacity: 0; transform: translateY(6px); } }
        @keyframes frameIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .frame.fade-out, .frame.fade-in { animation: none; } }
        @media (max-width: 980px) { #instruction-banner { height: calc(var(--fs-ui) * 3.9 + 12px); padding: 0 16px; border-radius: 18px; } }
        @media (max-width: 700px) {
            #game-area { padding: 8px; border-radius: 16px; }
            .wbox, .slot { flex-basis: 100px; font-size: 1.05rem; }
        }

    </style>
</head>
<body>
    <h1 id="game-title">Ordine inverso</h1>
    <div id="game-stats">
        <span>Round: <strong id="round-value">-</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>
    <div id="instruction-banner" aria-live="polite">Premi Inizia: vedrai una sequenza di parole da memorizzare.</div>
    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn-2" disabled>
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Tieni premuto per avere un aiuto!</span>
        </button>
    </div>
    <div id="game-area"></div>
    <h2 id="progress-title">Progresso</h2>
    <div class="progress-bar-container"><div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div></div>
    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead><tr><th>Round</th><th>Tempo</th><th>Mosse</th><th>Aiuti</th><th>Metric</th></tr></thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
    </div>

    <script>
    /* Formato JSON: { "title": "...", "categories": [ { "label": "Sequenza 1", "words": ["faro", "bicicletta", ...] }, ... ] }
       Fasi: intro > studio della sequenza (45 s) > risposta scritta in ordine inverso > risultato.
       La casella i della risposta corrisponde alla parola words[N-1-i]. */

    const DATA_URL = 'set-1.json';
    const STUDY_SECONDS = 45;

    let rounds = [], roundIndex = 0, results = [], R = null, N = 0;
    let moves = 0, helps = 0, seconds = 0, clock = null, studyTimer = null;
    let answers = [], committed = [];
    let helpEnabled = false, currentButtonMode = 'help';

    const $ = id => document.getElementById(id);
    const area = $('game-area'), revealBtn = $('reveal-btn'), btnIcon = $('btn-icon');
    const gameTitle = $('game-title'), gameStats = $('game-stats'), instructionBanner = $('instruction-banner');
    const actionControls = $('action-controls'), progressBarFill = $('progress-bar-fill');
    const progressBar = document.querySelector('.progress-bar-container'), progressBarTitle = $('progress-title');

    /* ---------- Pulsante: icona e testo (help / next / done) ---------- */
    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];
    function setButtonState(mode) {
        currentButtonMode = mode;
        const states = {
            help: { icon: 'fa-lightbulb-o', text: 'Tieni premuto per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check', text: 'Fatto' }
        };
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(states[mode].icon);
        const t = revealBtn.querySelector('.btn-text'); if (t) t.textContent = states[mode].text;
    }

    function transitionTo(next) {
        const old = area.querySelector('.frame');
        if (!old) { next(); return; }
        old.classList.add('fade-out');
        setTimeout(() => { next(); const f = area.querySelector('.frame'); if (f) f.classList.add('fade-in'); }, 250);
    }

    /* ---------- Utilità ---------- */
    const norm = s => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function startClock() { if (clock) return; clock = setInterval(() => { seconds++; $('time-value').textContent = seconds + 's'; }, 1000); }
    function stopClock() { clearInterval(clock); clock = null; }
    function updateStats() { $('moves-value').textContent = moves; $('reveals-value').textContent = helps; }
    function resetRoundStats() { moves = 0; helps = 0; seconds = 0; $('time-value').textContent = '0s'; updateStats(); }
    function setProgress(pct) { progressBarFill.style.width = pct + '%'; }
    function banner(txt) { instructionBanner.textContent = txt; }
    function enableHelp(on) { helpEnabled = on; revealBtn.disabled = !on; }

    function frame({ top = '', a = '', b = '', main = null, bottom = '' }) {
        area.innerHTML = `<div class="frame">
            <div class="toprow">${top}</div>
            ${main !== null ? `<div class="main">${main}</div>` : a + b}
            <div class="bottomrow">${bottom}</div>
        </div>`;
    }

    // catena di caselle collegate da frecce
    const chain = cells => `<div class="chain">${cells.join('<span class="arrow">→</span>')}</div>`;
    /*const modelHtml = () => chain(R.words.map(w => `<div class="wbox">${esc(w)}</div>`));*/
    const modelHtml = (rev = false) => chain((rev ? [...R.words].reverse() : R.words).map(w => `<div class="wbox">${esc(w)}</div>`));

    /* ---------- FASE 0: intro ---------- */
    function showIntro() {
        setButtonState('help'); enableHelp(false);
        $('round-value').textContent = `${roundIndex + 1}/${rounds.length}`;
        banner(`Round ${roundIndex + 1} di ${rounds.length}. Premi Inizia: vedrai una sequenza di ${N} parole per ${STUDY_SECONDS} secondi.`);
        frame({
            main: `<p class="big-msg">Leggi una sequenza di ${N} parole.</p>
                <p class="big-msg">Poi la sequenza verrà coperta.</p>
                <p class="big-msg">Dovrai scriverle in ordine inverso, partendo dall'ultima.</p>
                <button id="btn-start" class="cool-btn intro-start">Inizia</button>`
        });
        $('btn-start').onclick = () => { startClock(); transitionTo(startStudy); };
    }

    /* ---------- FASE 1: studio della sequenza ---------- */
    function startStudy() {
        let left = STUDY_SECONDS;
        enableHelp(false);
        banner('Leggi la sequenza una volta: tra poco verrà coperta.');
        frame({
            top: `<span class="timer" id="study-left">${left}s</span><div class="timer-bar"><div id="study-bar"></div></div>`,
            main: `<div class="board"><p class="zone-label">Memorizza la sequenza</p>${modelHtml()}</div>`,
            bottom: '<button id="btn-done" class="cool-btn">Ho memorizzato</button>'
        });
        const stop = () => { clearInterval(studyTimer); transitionTo(startPlay); };
        $('btn-done').onclick = stop;
        const bar = $('study-bar');
        bar.style.width = '100%'; bar.getBoundingClientRect();
        bar.style.transition = `width ${STUDY_SECONDS}s linear`;
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
        studyTimer = setInterval(() => {
            left--; const el = $('study-left'); if (el) el.textContent = left + 's';
            if (left <= 0) stop();
        }, 1000);
    }

    /* ---------- FASE 2: risposta scritta in ordine inverso ---------- */
    const inputHtml = i => `<label class="slot play"><input class="ans" type="text" data-i="${i}" value="${esc(answers[i])}"
        autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Parola ${i + 1} (in ordine inverso)"></label>`;

    // peek = true (aiuto): al posto dei campi compare la sequenza originale
    const boardPlayHtml = (peek = false) => peek
        ? `<p class="zone-label">La sequenza in ordine inverso</p><div class="peek">${modelHtml(true)}</div>`
        : `<p class="zone-label">Scrivi le parole in ordine inverso, partendo dall'ultima</p>${chain(R.words.map((_, i) => inputHtml(i)))}`;

    function refreshPlay() {
        const chk = $('btn-check');
        if (chk) chk.disabled = answers.some(a => !a.trim());
    }

    function startPlay() {
        answers = Array(N).fill(''); committed = Array(N).fill('');
        banner('La sequenza è coperta: scrivi le parole in ordine inverso, partendo dall\'ultima.');
        frame({
            main: `<div class="board" id="board">${boardPlayHtml()}</div>`,
            bottom: '<button id="btn-check" class="cool-btn" disabled>Verifica</button>'
        });
        const fr = area.querySelector('.frame');
        fr.addEventListener('input', e => {
            const inp = e.target.closest('.ans'); if (!inp) return;
            answers[+inp.dataset.i] = inp.value; refreshPlay();
        });
        // una "mossa" = una risposta nuova o modificata, contata quando si lascia il campo
        fr.addEventListener('change', e => {
            const inp = e.target.closest('.ans'); if (!inp) return;
            const i = +inp.dataset.i, v = norm(inp.value);
            if (v && v !== committed[i]) { committed[i] = v; moves++; updateStats(); }
        });
        // Invio: passa al campo successivo; dall'ultimo prova a verificare
        fr.addEventListener('keydown', e => {
            const inp = e.target.closest('.ans');
            if (!inp || e.key !== 'Enter') return;
            e.preventDefault();
            const next = fr.querySelector(`.ans[data-i="${+inp.dataset.i + 1}"]`);
            if (next) next.focus();
            else { inp.blur(); if (!$('btn-check').disabled) $('btn-check').click(); }
        });
        $('btn-check').onclick = () => transitionTo(showResult);
        refreshPlay();
        enableHelp(true);
    }

    /* Pulsante: in modalità "help" si tiene premuto per rivedere la sequenza; in "next"/"done" è un click */
    (function setupHelp() {
        const btn = revealBtn; let held = false;
        const isHelp = () => currentButtonMode === 'help';
        const show = () => {
            if (held || !helpEnabled || !isHelp()) return;
            held = true; helps++; updateStats(); btn.classList.add('held');
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            const board = $('board'); if (board) board.innerHTML = boardPlayHtml(true);
        };
        const hide = () => {
            if (!held) return;
            held = false; btn.classList.remove('held');
            const board = $('board');
            if (board && area.querySelector('#btn-check')) board.innerHTML = boardPlayHtml();
        };
        btn.addEventListener('pointerdown', e => {
            if (!isHelp()) return;
            e.preventDefault();
            try { btn.setPointerCapture(e.pointerId); } catch (_) {}
            show();
        });
        ['pointerup', 'pointercancel', 'lostpointercapture', 'pointerleave', 'blur'].forEach(ev => btn.addEventListener(ev, hide));
        btn.addEventListener('keydown', e => { if (isHelp() && (e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); show(); } });
        btn.addEventListener('keyup', e => { if (isHelp() && (e.key === ' ' || e.key === 'Enter')) hide(); });
        btn.addEventListener('contextmenu', e => e.preventDefault());
        btn.addEventListener('click', () => {
            if (currentButtonMode === 'next') { btn.disabled = true; transitionTo(nextRound); }
            else if (currentButtonMode === 'done') { btn.disabled = true; transitionTo(showSummary); }
        });
    })();

    /* ---------- FASE 3: risultato ---------- */
    function showResult() {
        stopClock();
        let score = 0;
        // verde / rosso: si mostra la risposta data, mai quella esatta
        const cells = R.words.map((_, i) => {
            const ok = norm(answers[i]) === norm(R.words[N - 1 - i]);
            if (ok) score++;
            return `<div class="slot ${ok ? 'ok' : 'ko'}"><span class="w">${esc(answers[i].trim() || '—')}</span></div>`;
        });
        const total = N;
        results.push({
            label: R.label || `Round ${roundIndex + 1}`,
            score, total, seconds, moves, helps,
            metric: total ? score / total * 100 : 0
        });
        setProgress(results.length / rounds.length * 100);

        const isLast = roundIndex >= rounds.length - 1;
        setButtonState(isLast ? 'done' : 'next');
        helpEnabled = false; revealBtn.disabled = false;

        banner('Ecco il risultato: verde = parola giusta, rosso = parola sbagliata.');
        const msg = score === total ? 'Perfetto!' : score >= total * 0.6 ? 'Bel lavoro!' : 'Buon tentativo!';
        frame({
            top: `<span class="big-msg">Risultato: ${score} / ${total} · ${msg}</span>`,
            main: `<div class="board"><p class="zone-label">Le tue parole, in ordine inverso</p>${chain(cells)}</div>`
        });
    }

    function nextRound() {
        roundIndex++; R = rounds[roundIndex]; N = R.words.length; resetRoundStats(); showIntro();
    }

    function showSummary() {
        enableHelp(false); stopClock();
        [gameTitle, gameStats, instructionBanner, actionControls, progressBarTitle, progressBar, area].forEach(el => el.style.display = 'none');
        const tbody = $('summary-tbody'); tbody.innerHTML = '';
        results.forEach((res, idx) => {
            const row = document.createElement('tr');
            [`${idx + 1} · ${res.label}`, res.seconds + 's', res.moves, res.helps, res.metric.toFixed(2)].forEach((value, i) => {
                const td = document.createElement('td');
                td.textContent = value;              // textContent: niente HTML iniettato dal JSON
                if (i === 4) td.style.fontWeight = '700';
                row.appendChild(td);
            });
            tbody.appendChild(row);
        });
        const sum = k => results.reduce((a, r) => a + r[k], 0);
        const avg = results.length ? sum('metric') / results.length : 0;
        const norm100 = Math.min(Math.max(avg, 0), 100);
        $('summary-totals').innerHTML = `
            <div>Tempo Totale: <strong>${sum('seconds')}s</strong> | Mosse Totali: <strong>${sum('moves')}</strong> | Aiuti Totali: <strong>${sum('helps')}</strong></div>
            <div>Media: <strong>${avg.toFixed(2)}</strong></div>
            <div>Punteggio: <strong>${norm100.toFixed(1)} / 100</strong></div>`;
        const screen = $('summary-screen'); screen.style.display = 'block'; screen.classList.add('show');
    }

    /* ---------- Caricamento JSON ---------- */
    const validRound = r => r && Array.isArray(r.words) && r.words.length > 1 && r.words.every(w => typeof w === 'string' && w.trim());

    async function loadRound() {
        enableHelp(false);
        frame({ main: '<p class="big-msg">Caricamento…</p>' });
        try {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const all = Array.isArray(data.categories) ? data.categories.filter(validRound) : [];
            if (!all.length) throw new Error('JSON vuoto o non valido');
            if (data.title) { gameTitle.textContent = data.title; document.title = data.title; }
            rounds = shuffle(all.slice());
            roundIndex = 0; results = []; R = rounds[0]; N = R.words.length;
            resetRoundStats(); setProgress(0);
            showIntro();
        } catch (err) {
            frame({ main: `<p class="big-msg">Impossibile caricare gli esercizi.</p>
                <p class="big-msg">Controlla che il file <strong>${DATA_URL}</strong> sia nella stessa cartella e che la pagina sia aperta da un server (non da file://).</p>` });
        }
    }

    (async function initGame() { await loadRound(); document.body.classList.add('loaded'); })();
    </script>
</body>
</html>
