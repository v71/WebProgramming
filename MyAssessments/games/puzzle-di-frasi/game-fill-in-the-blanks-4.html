<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Il ciclo dell'acqua</title>

     <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../js/checkmark.js"></script>
    <script src="../js/celebrazion.js"></script>

    <style>
        :root {
            --card-w: 72px;
            --card-h: 94px;

            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --accent-2: #06b6d4;
            --correct: #ffffff;
            --wrong: #ef4444;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        #game-stats, .stats-style {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        #game-area {
            width: 100%;
            max-width: 1050px;
            flex: 0 1 auto;
            min-height: 0;
            margin-top: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .dd-wrap { 
            width: 100%; 
            max-width: 1050px; 
            max-height: 100%; 
            display: flex; 
            flex-direction: column; 
            min-height: 0; 
        }

        .dd-tray {
            background: var(--bg-1);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-height: 64px;
            margin-bottom: 12px;
            flex: 0 0 auto;
        }

        .dd-empty { 
            color: var(--text-dim); 
            padding: 0 6px; 
        }

        /* ===== Word Chip Styles & Hover Effect ===== */
        .dd-chip {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1;
            background: #7931b4;
            color: #fff;
            border: 2px solid var(--border);
            border-radius: 99px;
            padding: 11px 18px;
            margin: 0;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s ease;
        }

        .dd-chip:hover:not(:disabled) {
            background: #ffffff;
            border-color: var(--accent); 
            color: var(--accent);
            transform: translateY(-4px);
        }
        
        .dd-chip.dd-used, .dd-chip.dd-used:hover { 
            opacity: 0.4; 
            cursor: default; 
            filter: none;
            transform: none;
            background: #7931b4;
            color: #fff;
        }
        
        .dd-chip.dd-wrong { 
            border-color: #ef4444; 
            background: #40285c; 
            color: #ef4444; 
        }
        
        .dd-chip:focus-visible {
             outline: 3px solid var(--accent-2); 
             outline-offset: 2px; 
        }

        .dd-text {
            background: #37275e;
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: clamp(14px, 2.5vw, 28px);
            padding-bottom: 20px;
            font-size: 20px;
            line-height: 2.3;
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: auto;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        /* Instant border change when peeking */
        .dd-text.dd-peek-container {
            border-color: #ffffff !important;
            transition: none !important;
        }

        /* Unselected placeholder style */
        .dd-blank {
            display: inline-block;
            position: relative;
            height: 1.7em;
            margin: 0 2px;
            padding: 0 14px;
            white-space: nowrap;
            text-align: center;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 600;
            line-height: calc(1.7em - 4px);
            color: var(--text);
            background: #553d94;
            border: 2px solid #000000;
            border-radius: 99px;
            vertical-align: middle;
            cursor: default;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }
        
        /* Current active gap */
        .dd-blank.dd-current { 
            border-style: solid; 
            border-color: #ffffff; 
            background: #544b7a; 
         }
        
        .dd-sizer { 
            visibility: hidden; 
            pointer-events: none; 
        }
        
        .dd-blank.dd-filled { 
            border-style: solid; 
            border-color: var(--border); 
            background: 5d258a; 
            color: #ffffff; 
        }
        
        .dd-blank.dd-filled .dd-sizer { 
            visibility: visible; 
        }
        
       /* Instant container border change */
        .dd-text.dd-peeking {
            border-color: #ffffff !important;
            transition: none !important;
        }

        /* Instant cascading reveal for all unfilled blanks */
        .dd-text.dd-peeking .dd-blank:not(.dd-filled) {
            border-style: solid !important;
            border-color: #ffffff !important;
            background: #10b981 !important;
            color: #ffffff !important;
            transition: none !important;
        }
        
        .dd-text.dd-peeking .dd-blank:not(.dd-filled) .dd-sizer { 
            visibility: visible !important;
        }

        /* Instant cascading reveal for all unfilled blanks */
        .dd-text.dd-peeking .dd-blank:not(.dd-filled) {
            border-style: solid !important;
            border-color: #ffffff !important;
            background: #10b981 !important;
            color: #ffffff !important;
            transition: none !important;
        }
        
        .dd-text.dd-peeking .dd-blank:not(.dd-filled) .dd-sizer { 
            visibility: visible !important;
        }
        
        .dd-shake { animation: dd-shake 0.2s; }
        
        @keyframes dd-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @media (prefers-reduced-motion: reduce) { .dd-shake { animation: none; } }

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 12px;
            border-radius: 99px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            box-shadow: none !important; 
            transform: none !important;
         }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #4338ca;
        }

        .cool-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <h1 id="game-title">Il ciclo dell'acqua</h1>

    <div id="game-stats">
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Tentativi: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Clicca la parola giusta per lo spazio evidenziato</h3>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn"><span>💡 Help!</span></button>
    </div>

    <div id="game-area">
        <div class="dd-wrap">
            <div class="dd-tray" id="dd-tray" aria-label="Parole da inserire"></div>
            <div class="dd-text" id="dd-text"></div>
        </div>
    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <script>
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const revealBtn = document.getElementById('reveal-btn');
        const ddText = document.getElementById('dd-text');

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let isPeeking = false;

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() { timeValueEl.textContent = elapsedSeconds + 's'; }
        function updateMovesDisplay() { movesValueEl.textContent = moveCount; }
        function updateRevealsDisplay() { revealsValueEl.textContent = revealCount; }

        function addMove() {
            moveCount++;
            updateMovesDisplay();
        }

        function resetStats() {
            moveCount = 0;
            revealCount = 0;
            updateMovesDisplay();
            updateRevealsDisplay();
        }

        function setInstruction(text) {
            document.getElementById('instruction-banner').textContent = text;
        }

        function setProgress(percent) {
            progressBarFill.style.width = Math.min(Math.max(percent, 0), 100) + '%';
        }

        function onHelpStart() {
            ddText.classList.add('dd-peeking');
        }

        function onHelpEnd() {
            ddText.classList.remove('dd-peeking');
        }

        function showPeek() {
            if (isPeeking || revealBtn.disabled) return;
            isPeeking = true;
            revealCount++;
            updateRevealsDisplay();
            onHelpStart();
        }

        function hidePeek() {
            if (!isPeeking) return;
            isPeeking = false;
            onHelpEnd();
        }

        revealBtn.addEventListener('mousedown', showPeek);
        revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showPeek(); }, { passive: false });
        revealBtn.addEventListener('mouseup', hidePeek);
        revealBtn.addEventListener('mouseleave', hidePeek);
        revealBtn.addEventListener('touchend', hidePeek);
        revealBtn.addEventListener('touchcancel', hidePeek);

        const GAME_TEXT =
            "L'acqua si muove di continuo intorno al nostro pianeta in un percorso chiamato {ciclo dell'acqua}. " +
            "Il calore del {sole} scalda oceani e laghi e trasforma l'acqua liquida in vapore invisibile: questo processo si chiama {evaporazione}. " +
            "Salendo, il vapore incontra aria più fredda e si trasforma di nuovo in minuscole goccioline che si riuniscono a formare le {nuvole}. " +
            "Questo passaggio si chiama {condensazione}. " +
            "Quando le goccioline diventano troppo pesanti, cadono al suolo come {precipitazioni}, ad esempio pioggia, neve o grandine. " +
            "Una parte dell'acqua scorre sul terreno come {ruscellamento} e confluisce nei fiumi, che la riportano al {mare}, dove il ciclo ricomincia.";
        const GAME_DISTRACTORS = ["erosione", "ghiacciaio"];

        const ddTray = document.getElementById('dd-tray');

        let ddPlaced = 0, ddTotal = 0, ddMisses = 0, ddCurrent = null;

        function ddShuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function ddFlash(el, cls, ms) {
            el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
            clearTimeout(el['t_' + cls]);
            el['t_' + cls] = setTimeout(() => el.classList.remove(cls), ms || 400);
        }

        function ddBuild() {
            ddTray.innerHTML = '';
            ddText.innerHTML = '';
            ddPlaced = 0; ddMisses = 0; ddCurrent = null;
            const answers = [];

            GAME_TEXT.split(/(\{[^}]+\})/).forEach(part => {
                const m = part.match(/^\{(.+)\}$/);
                if (!m) { ddText.appendChild(document.createTextNode(part)); return; }
                answers.push(m[1]);
                const b = document.createElement('span');
                b.className = 'dd-blank';
                b.dataset.answer = m[1];
                const sizer = document.createElement('span');
                sizer.className = 'dd-sizer';
                sizer.textContent = m[1];
                b.appendChild(sizer);
                ddText.appendChild(b);
            });
            ddTotal = answers.length;

            ddShuffle(answers.concat(GAME_DISTRACTORS)).forEach(w => {
                const c = document.createElement('button');
                c.type = 'button';
                c.className = 'dd-chip';
                c.textContent = w;
                c.dataset.word = w;
                c.addEventListener('click', () => ddChoose(c));
                ddTray.appendChild(c);
            });
            ddNextBlank();
        }

        function ddNextBlank() {
            if (ddCurrent) ddCurrent.classList.remove('dd-current');
            ddCurrent = ddText.querySelector('.dd-blank:not(.dd-filled)');
            if (ddCurrent) {
                ddCurrent.classList.add('dd-current');
                ddCurrent.scrollIntoView({ block: 'nearest' });
            }
        }

        async function ddChoose(chip) {
            if (!ddCurrent) return;
            addMove();

            if (chip.dataset.word === ddCurrent.dataset.answer) {
                // Store a reference to the placeholder before advancing
                const targetBlank = ddCurrent;

                targetBlank.classList.add('dd-filled');
                chip.remove(); // Removes the card completely from the tray
                ddPlaced++;

                // Show checkmark animation anchored on the correct placeholder
                await Checkmark.show({
                    element: targetBlank,
                    size: 48,
                    rise: 70,
                    duration: 1600
                });

                setProgress(ddPlaced / ddTotal * 100);
                ddNextBlank();
                if (ddPlaced === ddTotal) ddFinish();

            } else {
                ddMisses++;
                ddFlash(chip, 'dd-shake');
                ddFlash(chip, 'dd-wrong', 900);
            }
        }

        function ddFinish() {
            stopElapsedTimer();
            hidePeek();
            revealBtn.disabled = true;
            const msg = ddMisses === 0
                ? 'Perfetto! Ogni parola è finita al posto giusto al primo colpo.'
                : 'Completato! Hai sbagliato ' + ddMisses + (ddMisses === 1 ? ' volta' : ' volte') + ' lungo il percorso.';
            setInstruction(msg);
        }

        const DD_FONT_SCALE = 0.85;
        function ddFitText() {
            let lo = 12, hi = 44;
            while (hi - lo > 0.5) {
                const mid = (lo + hi) / 2;
                ddText.style.fontSize = mid + 'px';
                if (ddText.scrollHeight <= ddText.clientHeight + 1) lo = mid; else hi = mid;
            }
            ddText.style.fontSize = Math.max(12, lo * DD_FONT_SCALE) + 'px';
        }

        let ddResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(ddResizeTimer);
            ddResizeTimer = setTimeout(ddFitText, 100);
        });

        function initGame() {
            resetStats();
            setProgress(0);
            revealBtn.disabled = false;
            setInstruction('Tocca la parola giusta per lo spazio evidenziato');
            ddBuild();
            ddTray.style.minHeight = '';
            ddTray.style.minHeight = ddTray.offsetHeight + 'px';
            ddFitText();
            startElapsedTimer();
        }

        initGame();
    </script>
</body>
</html>
