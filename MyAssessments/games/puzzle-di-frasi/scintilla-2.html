<html lang="it">
<head>
    <meta charset="UTF-8">

    <style>

        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --accent-2: #06b6d4;
            --correct: #ffffff;
            --wrong: #ef4444;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at center, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at center, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
           GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           COUNTERS
        ========================================= */

        #game-stats {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
           INFORMATION BOX
        ========================================= */
        
        #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
           EMPTY GAME AREA
        ========================================= */

        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* This is intentionally empty.
           Future game content goes here. */

        /* =========================================
           PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 135deg,#6366f1 0%,#a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }
    </style>

    <style>

        #game-area {
            padding: 24px;
        }

        .button-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 14px;
        }

        .grid-button {

            border: 2px solid #000205;
            border-radius: 14px;
            background: #7931b4;
            color: #ffffff;

            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        .grid-button:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            color: var(--accent);
            z-index: 5;
        }

        .grid-button.selected {
            background: #ff9800;
            border-color: #000205;
            color: #ffffff;
        }

        @media (max-width: 700px) { .button-grid { gap: 10px; }
        .grid-button {
            min-height: 60px;
            font-size: 1rem;
        }
        }

    </style>

    <style>

    .grid-button.error { 
        animation: buttonErrorShake 0.45s ease; 
        border-color: var(--wrong);
        background-color: rgba(239, 68, 68, 0.05);
        color: var(--wrong);
    } 
    
    @keyframes buttonErrorShake { 
        0% { transform: translateX(0); }
        20% { transform: translateX(-10px); } 
        40% { transform: translateX(10px); } 
        60% { transform: translateX(-8px); } 
        80% { transform: translateX(8px); } 
        100% { transform: translateX(0); } 
    }

    </style>

        .cool-btn:hover {

        }

        .cool-btn:active {

        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
            background-color: #10b981;
        }

        .cool-btn.wrong-btn {
            background-color: var(--wrong);

            background: #4caf50;

        }

        #reveal-btn * {

</style>

document.addEventListener('DOMContentLoaded', () => {
    let buttons = []; 
    let buttonFoundState = [];
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 0; 
    let foundCorrectCount = 0; 
    let isGameCompleted = false;
    let isGameLoading = true; // Added loading guard flag
    let moveCount = 0;
    let revealCount = 0;

    const revealBtn = document.getElementById('reveal-btn');
    const gridButtons = document.querySelectorAll('.grid-button');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const progressBarFill = document.getElementById('progress-bar-fill');

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        const timeValueEl = document.getElementById('time-value');
        if (timeValueEl) {
            timeValueEl.textContent = elapsedSeconds + 's';
        }
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateGridUI(title) {
        const istruzionBanner = document.getElementById('instruction-banner');
        if (istruzionBanner) {
            istruzionBanner.textContent = title;
        }
        gridButtons.forEach(button => {
            const index = Number(button.dataset.index);
            if (buttons[index]) {
                button.textContent = buttons[index].label;
                button.classList.remove('selected', 'error');
            }
        });
    }

    function updateProgressBar(value) {
        if (progressBarFill) {
            progressBarFill.style.width = (value * 100) + '%';
        }
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    async function initGame() {
        try {
            isGameLoading = true;
            const response = await fetch('categories.json');
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status}`);
            }

            const data = await response.json();
            let totalCategories = data.categories.length;
            if (totalCategories === 0) return;
            
            const randomIndex = Math.floor(Math.random() * totalCategories);
            const currentCategoryData = data.categories[randomIndex];

            buttons = [...currentCategoryData.buttons];
            buttonFoundState = new Array(buttons.length).fill(false);

            totalCorrectItems = buttons.filter(b => b.value === true).length;

            isGameCompleted = false;
            isGameLoading = false; // Loading complete
            moveCount = 0;
            revealCount = 0;
            foundCorrectCount = 0;

            updateMovesDisplay();
            updateRevealDisplay();
            updateProgressBar(0);
            updateGridUI(currentCategoryData.instruction);
            startElapsedTimer();

        } catch (err) {
            isGameLoading = false;
            console.error('Could not load categories.json:', err);
        }
    }

    // Reveal button events
    /*
    if (revealBtn) {
        revealBtn.addEventListener('pointerdown', () => {
            if (isGameCompleted || isGameLoading) return;
            revealCount++;
            updateRevealDisplay();
            gridButtons.forEach(button => {
                const index = Number(button.dataset.index);
                if (buttons[index] && buttons[index].value === true) {
                    button.classList.add('help-correct');
                }
            });
        });

        const hideHelp = () => {
            if (isGameCompleted || isGameLoading) return;
            gridButtons.forEach(button => button.classList.remove('help-correct'));
        };

        revealBtn.addEventListener('pointerup', hideHelp);
        revealBtn.addEventListener('pointerleave', hideHelp);
    }
    */

    // Reveal button events with Pointer Capture to prevent flickering
    if (revealBtn) {
        revealBtn.addEventListener('pointerdown', (e) => {
            if (isGameCompleted || isGameLoading) return;
            
            // Lock pointer events to this button so it won't flicker if the cursor moves slightly
            revealBtn.setPointerCapture(e.pointerId);

            revealCount++;
            updateRevealDisplay();
            
            gridButtons.forEach(button => {
                const index = Number(button.dataset.index);
                if (buttons[index] && buttons[index].value === true) {
                    button.classList.add('help-correct');
                }
            });
        });

        const hideHelp = (e) => {
            if (isGameCompleted || isGameLoading) return;
            
            // Release pointer capture if it was set
            if (revealBtn.hasPointerCapture(e.pointerId)) {
                revealBtn.releasePointerCapture(e.pointerId);
            }

            gridButtons.forEach(button => {
                button.classList.remove('help-correct');
            });
        };

        revealBtn.addEventListener('pointerup', hideHelp);
        revealBtn.addEventListener('pointercancel', hideHelp);
        revealBtn.addEventListener('lostpointercapture', hideHelp);
    }

    function onCategoryComplete() {
        if (isGameCompleted) return;
        isGameCompleted = true;

        if (typeof Confetti !== 'undefined') {
            Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
            Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
            Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
        }

        stopElapsedTimer();
    }

    // Grid buttons click events
    gridButtons.forEach(button => {
        button.addEventListener('click', async () => {
            // Guard clauses against interaction during load, completion, or already-found states
            if (isGameCompleted || isGameLoading) return;
            
            const index = Number(button.dataset.index);
            if (!buttons[index] || buttonFoundState[index]) return; // Ignore if already found

            const value = buttons[index].value;

            if (value === true) {
                // Mark as found immediately to lock out concurrent double-clicks during animation
                buttonFoundState[index] = true; 
                
                // Increment move count only on valid, unclicked interactions
                moveCount++;
                updateMovesDisplay();

                button.classList.add('selected');
                foundCorrectCount++;

                if (typeof Checkmark !== 'undefined') {
                    await Checkmark.show({
                        element: button,
                        size: 48,
                        rise: 70,
                        duration: 1600
                    });
                }

                let ratio = foundCorrectCount / totalCorrectItems;
                updateProgressBar(ratio);

                if (foundCorrectCount === totalCorrectItems) {
                    onCategoryComplete();
                }
            } else {
                // Incorrect item click
                moveCount++;
                updateMovesDisplay();

                button.classList.remove('error');
                void button.offsetWidth; // Force reflow
                button.classList.add('error');
                setTimeout(() => {
                    button.classList.remove('error');
                }, 450);
            }
        });
    });

    // Start the game loop
    initGame();
});

</script>
