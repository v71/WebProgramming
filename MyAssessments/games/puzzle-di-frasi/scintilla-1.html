    <style>

        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;

            --text: #ffffff;

            --border: #000205;

        * { box-sizing: border-box; }

        body {

            background:

            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
           GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,

            justify-content: center;
            align-items: center;
            gap: 24px;

            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
           INFORMATION BOX
        ========================================= */

        #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
           EMPTY GAME AREA
        ========================================= */

        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* This is intentionally empty.
           Future game content goes here. */

        /* =========================================
           PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 135deg,#6366f1 0%,#a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }
    </style>

    <style>

        #game-area {
            padding: 24px;
        }

        .button-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 14px;
        }

        .grid-button {
            min-height: 70px;
            border: 2px solid #000205;
            border-radius: 14px;
            background: #7931b4;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        .grid-button:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            color: var(--accent);
            z-index: 5;
        }

        .grid-button.selected {
            background: #ff9800;
            border-color: #000205;
            color: #ffffff;
        }

        @media (max-width: 700px) { .button-grid { gap: 10px; }
        .grid-button {
            min-height: 60px;
            font-size: 1rem;
        }
        }

    </style>

    <style>

    .grid-button.error { 
        animation: buttonErrorShake 0.45s ease; 
        border-color: var(--wrong);
        background-color: rgba(239, 68, 68, 0.05);
        color: var(--wrong);
    } 
    
    @keyframes buttonErrorShake { 
        0% { transform: translateX(0); }
        20% { transform: translateX(-10px); } 
        40% { transform: translateX(10px); } 
        60% { transform: translateX(-8px); } 
        80% { transform: translateX(8px); } 
        100% { transform: translateX(0); } 
    }

    </style>

<style>

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }
        
            .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn i {
            font-size: 1.1rem;
            -webkit-text-stroke: 1px currentColor;
            transition: transform 0.25s ease;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #10b981;
        }

        .cool-btn:hover i {
            transform: translateX(3px);
        }

        .cool-btn:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
            background-color: #10b981;
        }

        .cool-btn.wrong-btn {
            background-color: var(--wrong);
            cursor: default;
            pointer-events: none;
            box-shadow: 0 10px 25px -3px rgba(239, 68, 68, 0.25);
            opacity: 1 !important; /* <-- Mantiene il colore pieno senza trasparenza */
        }

</style>
</head>


<body>

<script>
    
    const buttonValues = [
        false, true, true,
        false, false, false,
        true, false, true,
        false, false, false,
        true, false, false
    ];

    const buttonLabels = [
        "quaderno"," pesca"," patata",
        "telefono"," mercato"," cane",
        "pomodoro"," termometro"," mais",
        "marmotta"," portafoglio"," spazzola",
        "castagna","panetteria"," pentola"
    ];

    const gridButtons = document.querySelectorAll('.grid-button');

    gridButtons.forEach(button => {
        const index = Number(button.dataset.index);
        button.textContent = buttonLabels[index]; });

        const timeValueEl = document.getElementById('time-value');
       
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        timeValueEl.textContent = elapsedSeconds + 's';
    }

    function loadSentence() {
        startElapsedTimer();
    }

    </script>

    gridButtons.forEach(button => {

        button.addEventListener('click', () => {

            // Get the boolean associated with this button
            const index = Number(button.dataset.index);
            const value = buttonValues[index];

            // Correct button
            if (value === true) {

                // Keep the button pressed
                button.classList.add('selected');

            }

            // Wrong button
            else {

                // Restart the animation if clicked again
                button.classList.remove('error');
                void button.offsetWidth;

                // Shake + red
                button.classList.add('error');

                // Return to normal after the animation
                setTimeout(() => {
                    button.classList.remove('error');
                }, 450);
            }

            console.log(
                'Button:', index + 1,
                'Value:', value
            );

        });

    });


    </script>
