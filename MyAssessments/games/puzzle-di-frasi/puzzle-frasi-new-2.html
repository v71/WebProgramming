<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Puzzle di Frasi</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../js/checkmark.js"></script>
    <script src="../js/celebrazion.js"></script>

    <style>

        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;

            --accent-2: #06b6d4;
            --correct: #ffffff;
            --wrong: #ef4444;
            
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at center, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at center, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            /* Contorno nero nitido attorno al testo */
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,  
                -2px  2px 0 #000,  
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5); /* Aggiunge anche una leggera ombra tridimensionale */
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.2px;
            text-align: center;
            width: 100%;
        }

        /* Progress Bar Styles */
        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 12px;
            border-radius: 99px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Container sizes dynamically and stays centered */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            min-height: clamp(90px, 14vh, 130px);
            padding: 20px;
            border-radius: 20px;
            align-items: center;
            box-sizing: border-box;
            background-color: var(--bg-1);
            box-shadow: var(--shadow-md);
            border: 2px solid rgba(255, 255, 255, 0.8);
            margin: 0 auto;
        }

        #source-container {
            border-color: var(--border);
        }

        #target-container {
            border: 2px solid #000000;
            background-color: #37275e;
            /* Border is 1px thicker per side than #source-container's 1px
               border; trim padding by that same 1px per side so the two
               containers end up with identical usable (content) width. */
            padding: 19px;
        }

        /* Slot styles for Drop Zone */
        .slot {
            position: relative;
            flex-shrink: 0;
            min-width: 90px;
            height: 60px;
            padding: 0;
            background-color: var(--bg-2);
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            /* Only properties that do NOT change the slot's size are animated.
               "transition: all" used to animate the border going from 2px to none,
               so the slot kept changing width for 0.25s after a word was placed. */
            transition: border-color 0.25s ease, background-color 0.25s ease,
                        box-shadow 0.25s ease, transform 0.25s ease;
            cursor: pointer;
        }

        /* Highlight for the current active slot */
        .slot.active-slot {
            border-color: #ffffff;
            border-style: solid;
            background-color: #544b7a;
        }

        /* Filled slot becomes an invisible wrapper: the card inside keeps its
           normal, unmodified styling. */
        .slot.filled,
        .slot.revealed {
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .slot.filled:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        /* Error state for incorrect slots */
        .slot.error-slot {
            animation: shake 0.4s ease;
        }

        .slot.error-slot .card {
            border-color: var(--wrong);
            background-color: rgba(239, 68, 68, 0.05);
            color: var(--wrong);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .target-wrapper {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }

        #reveal-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: min(92vw, 1060px);
            min-width: 100%;
            height: max-content;
            min-height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 19px;
            border-radius: 20px;
            background-color: var(--bg-1);
            border: 2px solid var(--correct);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: var(--shadow-lg);
            z-index: 10;
            box-sizing: border-box;
        }

        #reveal-overlay.visible {
            opacity: 1;
        }

        .card.reveal-letter {
            border-color: var(--correct);
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--correct);
            cursor: default;
            box-shadow: none;
            transform: none !important;
        }

        /* Cards hold a whole word: flexible width, no fixed square */
        .card {
            flex-shrink: 0;
            min-width: 90px;
            height: 60px;
            padding: 0 18px;
            background: #7931b4;
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        /* Hover effect for source cards */
        #source-container .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            color: var(--accent);
            z-index: 5;
        }

        /* Cards inside a slot keep the exact same styling as everywhere else */
        .slot .card {
            transform: none !important;
            background: #5d258a;
        }

        #game-stats, .stats-style {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn i {
            font-size: 1.1rem;
            -webkit-text-stroke: 1px currentColor;
            transition: transform 0.25s ease;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
                background-color: var(--accent);
        }

        .cool-btn:hover i {
            transform: translateX(3px);
        }

        .cool-btn:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
            background-color: #059669;
        }

        .cool-btn.wrong-btn {
            background-color: var(--wrong);
            cursor: default;
            pointer-events: none;
            box-shadow: 0 10px 25px -3px rgba(239, 68, 68, 0.25);
            opacity: 1 !important; /* <-- Mantiene il colore pieno senza trasparenza */
        }

    </style>
</head>
<body>
    
    <h1 id="game-title">Puzzle di Frasi</h1>

    <div id="game-stats">
        <span>Frase: <strong id="progress-value">1 / 4</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Clicca sulle parole nella prima lista per ricomporre la frase nella seconda lista, nell'ordine giusto.</h3>


    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <div id="puzzle-workspace" class="section-wrapper" style="align-items: center;">
        <div class="section-wrapper">
            <div id="source-container" class="card-container"></div>
        </div>

        <div class="section-wrapper" style="margin-bottom:0;">
            <div class="target-wrapper">
                <div id="target-container" class="card-container"></div>
                <div id="reveal-overlay" aria-hidden="true"></div>
            </div>
        </div>
    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

<script>
        // Each entry is a full sentence; it gets split into words, which are then
        // the clickable units instead of individual letters.

        ///////////////////////////////////////////////////////////////////////////////
        // LE FRASI SONO LETTE NELLA FUNZIONE INITGAME DAL FILE SENTENCES.JSON
        ///////////////////////////////////////////////////////////////////////////////

        let PUZZLE_SENTENCES = [];

        let currentSentenceIndex = 0;
        let roundResults = [];

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const revealOverlay = document.getElementById('reveal-overlay');
        const sourceContainer = document.getElementById('source-container');
        const targetContainer = document.getElementById('target-container');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const puzzleWorkspace = document.getElementById('puzzle-workspace');
        const actionControls = document.getElementById('action-controls');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');
        const instructionBanner = document.getElementById('instruction-banner');

        let originalWords = [];       // array of words for the current sentence
        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let sentenceCompleted = false;
        let isRevealing = false;
        let slotsMeta = [];
        let rowCap = 0;               // maximum width (px) both containers may use

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function registerMove() {
            if (sentenceCompleted) return;
            moveCount++;
            updateMovesDisplay();
            updateSlotHighlights();
            fitTargetContainer();          // slot widths changed: re-hug the placeholders
            checkSentenceAutomatic();
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function measureFullRowWidth(words) {
            const temp = document.createElement('div');
            temp.className = 'card-container';
            temp.style.visibility = 'hidden';
            temp.style.position = 'absolute';
            temp.style.pointerEvents = 'none';

            words.forEach(word => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.textContent = word;
                temp.appendChild(card);
            });

            puzzleWorkspace.appendChild(temp);
            const width = temp.getBoundingClientRect().width;
            puzzleWorkspace.removeChild(temp);
            return width;
        }

        /* The source container gets the width of the whole sentence on one row
           (capped to the available space). That same value is the maximum width
           the target container may use. */
        function syncContainerWidths() {
            if (!originalWords.length) return;

            const fullWidth = measureFullRowWidth(originalWords);
            const maxAllowedWidth = puzzleWorkspace.clientWidth - 40;
            rowCap = Math.min(fullWidth, maxAllowedWidth);

            sourceContainer.style.width = rowCap + 'px';
            fitTargetContainer();
        }

        /* Makes the target container exactly as wide as its widest row of slots.
           It does NOT measure the container's current layout: it reads only the
           width of each slot (a slot's width never depends on the container),
           then simulates the line wrapping and adds padding and border. */
        function fitTargetContainer() {
            const slots = Array.from(targetContainer.children);
            if (!slots.length) return;

            const cs = getComputedStyle(targetContainer);
            const gap = parseFloat(cs.columnGap) || 14;
            const extras = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
                         + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);

            const cap = rowCap || (puzzleWorkspace.clientWidth - 40);
            const maxInner = cap - extras;

            let widest = 0;
            let rowWidth = 0;
            slots.forEach(slot => {
                const w = slot.getBoundingClientRect().width;
                if (rowWidth === 0) {
                    rowWidth = w;
                } else if (rowWidth + gap + w <= maxInner) {
                    rowWidth += gap + w;
                } else {
                    widest = Math.max(widest, rowWidth);
                    rowWidth = w;
                }
            });
            widest = Math.max(widest, rowWidth);

            const finalWidth = Math.min(Math.ceil(widest + extras) + 1, cap); // +1 avoids sub-pixel re-wrap
            targetContainer.style.width = finalWidth + 'px';
        }

        function loadSentence(index) {
            if (index >= PUZZLE_SENTENCES.length) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
                return;
            }

            const progressRatio = (index / PUZZLE_SENTENCES.length) * 100;
            progressBarFill.style.width = progressRatio + '%';

            originalWords = PUZZLE_SENTENCES[index].split(' ');
            sourceContainer.style.width = '';
            targetContainer.style.width = '';
            sourceContainer.innerHTML = '';
            targetContainer.innerHTML = '';
            sentenceCompleted = false;
            moveCount = 0;
            revealCount = 0;
            slotsMeta = [];

            progressValueEl.textContent = `${index + 1} / ${PUZZLE_SENTENCES.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.classList.add('smooth-hidden');
            revealBtn.classList.remove('smooth-hidden');
            revealBtn.disabled = false;
            revealBtn.classList.remove('wrong-btn');
            revealBtn.innerHTML = "<span>💡 Help!</span>";

            // One slot per word in the sentence
            for (let i = 0; i < originalWords.length; i++) {
                const slot = document.createElement('div');
                slot.classList.add('slot');

                slot.addEventListener('click', () => {
                    if (sentenceCompleted) return;
                    const card = slot.querySelector('.card');
                    if (card) {
                        sourceContainer.appendChild(card);
                        slot.classList.remove('filled');

                        slotsMeta.forEach(m => m.element.classList.remove('error-slot'));
                        if (revealBtn.classList.contains('wrong-btn')) {
                            revealBtn.classList.remove('wrong-btn');
                            revealBtn.disabled = false;
                            revealBtn.innerHTML = "<span>💡 Help!</span>";
                        }

                        registerMove();
                    }
                });

                targetContainer.appendChild(slot);
                slotsMeta.push({ element: slot, expected: originalWords[i] });
            }

            updateSlotHighlights();

            const shuffledWords = shuffleArray(originalWords);

            shuffledWords.forEach(word => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.word = word;
                card.textContent = word;

                setupCardTapToMove(card);
                sourceContainer.appendChild(card);
            });

            requestAnimationFrame(() => {
                syncContainerWidths();
            });
        }

        function setupCardTapToMove(card) {
            card.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (sentenceCompleted) return;

                if (card.parentNode === sourceContainer) {
                    const emptySlotMeta = slotsMeta.find(m => !m.element.querySelector('.card'));
                    if (emptySlotMeta) {
                        emptySlotMeta.element.appendChild(card);
                        emptySlotMeta.element.classList.add('filled');
                        
                        // Aggiorniamo subito i movimenti e la griglia
                        moveCount++;
                        updateMovesDisplay();
                        updateSlotHighlights();
                        fitTargetContainer(); // Ricalcola subito prima del checkmark!

                        const isWordCorrect = (card.dataset.word === emptySlotMeta.expected);

                        if (isWordCorrect) {
                            await Checkmark.show({
                                element: emptySlotMeta.element,
                                size: 48,
                                rise: 70,
                                duration: 1600
                            });
                        }

                        // Controllo finale della frase (senza richiamare registerMove duplicato)
                        checkSentenceAutomatic();
                    }
                } else if (card.parentNode.classList.contains('slot')) {
                    const slot = card.parentNode;
                    sourceContainer.appendChild(card);
                    slot.classList.remove('filled');

                    slotsMeta.forEach(m => m.element.classList.remove('error-slot'));
                    if (revealBtn.classList.contains('wrong-btn')) {
                        revealBtn.classList.remove('wrong-btn');
                        revealBtn.disabled = false;
                        revealBtn.innerHTML = "<span>💡 Help!</span>";
                    }

                    moveCount++;
                    updateMovesDisplay();
                    updateSlotHighlights();
                    fitTargetContainer();
                    checkSentenceAutomatic();
                }
            });
        }

        function updateSlotHighlights() {
            slotsMeta.forEach(m => m.element.classList.remove('active-slot'));

            const firstEmptyMeta = slotsMeta.find(m => !m.element.querySelector('.card'));
            if (firstEmptyMeta) {
                firstEmptyMeta.element.classList.add('active-slot');
            }
        }

        function checkSentenceAutomatic() {
            if (sentenceCompleted) return;

            const currentWords = slotsMeta.map(m => {
                const card = m.element.querySelector('.card');
                return card ? card.dataset.word : '';
            });

            const allSlotsFilled = slotsMeta.every(m => m.element.querySelector('.card'));
            const isCorrect = allSlotsFilled && currentWords.every((w, i) => w === originalWords[i]);

            if (isCorrect) {
                sentenceCompleted = true;
                stopElapsedTimer();
                updateSlotHighlights();

                slotsMeta.forEach(m => m.element.classList.remove('error-slot'));

                // Esplosione festosa dai lati dello schermo
                Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60,  spread: 60, count: 90 });
                Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                Confetti.burst({ origin: { x: 0.5 , y: 0.5 }, angle: 90, spread: 60, count: 90 });

                progressBarFill.style.width = (((currentSentenceIndex + 1) / PUZZLE_SENTENCES.length) * 100) + '%';

                // Score this round directly on a 0-100 scale: start at 100, lose points
                // for each wrong guess and each reveal used.
                const wrongAttempts = moveCount - 1; // moveCount includes the final correct click
                const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                roundResults.push({
                    sentence: originalWords.join(' '),
                    time: elapsedSeconds + 's',
                    moves: moveCount,
                    reveals: revealCount,
                    metric: metricValue
                });

                if (currentSentenceIndex === PUZZLE_SENTENCES.length - 1) {
                    nextBtn.textContent = "Fatto";
                } else {
                    nextBtn.textContent = "▶ Prossima frase";
                }

                revealBtn.classList.remove('wrong-btn');
                revealBtn.disabled = false;

                revealBtn.classList.add('smooth-hidden');
                nextBtn.classList.remove('smooth-hidden');

            } else if (allSlotsFilled) {
                revealBtn.innerHTML = "<span>⚠️ Frase errata</span>";
                revealBtn.classList.add('wrong-btn');
                revealBtn.disabled = true;

                slotsMeta.forEach(m => m.element.classList.add('error-slot'));
            } else {
                slotsMeta.forEach(m => m.element.classList.remove('error-slot'));

                if (revealBtn.classList.contains('wrong-btn')) {
                    revealBtn.classList.remove('wrong-btn');
                    revealBtn.disabled = false;
                    revealBtn.innerHTML = "<span>💡 Help!</span>";
                }
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentSentenceIndex === PUZZLE_SENTENCES.length - 1) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
            } else {
                currentSentenceIndex++;
                loadSentence(currentSentenceIndex);
            }
        });

        function showSummaryScreen() {
            puzzleWorkspace.style.display = 'none';
            instructionBanner.style.display = 'none';
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            actionControls.style.display = 'none';

            summaryTbody.innerHTML = '';
            let totalMetric = 0;

            roundResults.forEach(res => {
                totalMetric += res.metric;
                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${res.sentence}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                summaryTbody.appendChild(row);
            });

            // Each round metric is already on a 0-100 scale, so just average and clamp.
            const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
            const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

            summaryTotals.innerHTML = `
                <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
            `;

            summaryScreen.style.display = 'block';
        }

        function showReveal() {
            if (sentenceCompleted || isRevealing || revealBtn.disabled) return;
            isRevealing = true;

            revealCount++;
            updateRevealsDisplay();

            revealOverlay.innerHTML = '';
            originalWords.forEach((word) => {
                const slot = document.createElement('div');
                slot.classList.add('slot', 'revealed');

                const card = document.createElement('div');
                card.classList.add('card', 'reveal-letter');
                card.textContent = word;

                slot.appendChild(card);
                revealOverlay.appendChild(slot);
            });
            revealOverlay.classList.add('visible');
        }

        function hideReveal() {
            if (!isRevealing) return;
            isRevealing = false;
            revealOverlay.classList.remove('visible');
        }


        async function initGame() {
            try {
                const response = await fetch('sentences-set-1.json');
                const data = await response.json();
                PUZZLE_SENTENCES = data.sentences;

                if (data.title) {
                    document.title = data.title;
                    document.getElementById('game-title').textContent = data.title;
                }

            } catch (err) {
                console.error('Could not load sentences.json:', err);
                PUZZLE_SENTENCES = ["QUALCOSA é ANDATO STORTO"]; // fallback so it still runs
            }

            loadSentence(currentSentenceIndex);
        }

        revealBtn.addEventListener('mousedown', showReveal);
        revealBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showReveal();
        }, { passive: false });

        revealBtn.addEventListener('mouseup', hideReveal);
        revealBtn.addEventListener('mouseleave', hideReveal);
        revealBtn.addEventListener('touchend', hideReveal);
        revealBtn.addEventListener('touchcancel', hideReveal);

        let resizeDebounceTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeDebounceTimer);
            resizeDebounceTimer = setTimeout(syncContainerWidths, 150);
        });

        // load json with the sentences

        initGame();

    </script>

</body>
</html>
