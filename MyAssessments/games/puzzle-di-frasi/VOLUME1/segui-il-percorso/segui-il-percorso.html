<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titolo del gioco</title>

     <!-- File esterni condivisi -->
    <script src="../../../js/checkmark.js"></script>
    <script src="../../../js/celebrazion.js"></script>
    
    <style>

        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --accent-2: #06b6d4;
            --correct: #ffffff;
            --wrong: #ef4444;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at center, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at center, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
            GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
            COUNTERS
        ========================================= */

        #game-stats {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
            INFORMATION BOX
        ========================================= */
        
        #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
            EMPTY GAME AREA
        ========================================= */

        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* =========================================
            PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
            PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
            COMBO BOXES CONTAINER & 2X2 GRID
        ========================================= */

        .combo-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .combo-item {
            width: 100%;
            padding: 8px;
        }

        /* WRAPPER RIGIDO PER EVITARE SLITTAMENTI DELLA FRECCIA */
        .custom-select-wrapper {
            position: relative;
            width: 100%;
            display: inline-block;
        }

        .game-select {
            width: 100%;
            height: 42px;
            padding: 0 45px 0 14px !important;
            font-size: 1.25rem;
            font-family: inherit;
            color: var(--text);
            background-color: var(--bg-2);
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .game-select option {
            background-color: var(--bg-1);
            color: var(--text);
            padding: 10px;
        }

        .game-select:hover {
            border-color: var(--accent);
            background-color: #624b9e;
        }

        .game-select:focus {
            border-color: var(--accent);
        }

       .game-select:disabled,
       .game-select.selected {
            color: #ffffff !important;
            opacity: 1 !important; /* Evita lo sbiadimento grigio tipico dei select disabilitati su iOS/Firefox */
        }

        .game-select.error { 
            animation: selectErrorShake 0.45s ease; 
            border-color: var(--wrong);
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--wrong);
        }

        .game-select.help-correct {
            background-color: #4caf50 !important;
            border-color: #ffffff;
        }

        /* FRECCIA ANCORATA IN MODO ASSOLUTO */
        .select-arrow {
            position: absolute !important;
            top: 50% !important;
            right: 14px !important;
            transform: translateY(-50%) !important;
            width: 32px !important;
            height: 32px !important;
            pointer-events: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: transform 0.25s ease !important;
        }

        .select-arrow svg {
            width: 100% !important;
            height: 100% !important;
            fill: #ffffff !important;
        }

        .custom-select-wrapper.open .select-arrow {
            transform: translateY(-50%) rotate(180deg) !important;
        }
        
        @keyframes selectErrorShake { 
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); } 
            40% { transform: translateX(10px); } 
            60% { transform: translateX(-8px); } 
            80% { transform: translateX(8px); } 
            100% { transform: translateX(0); } 
        }

        /* =========================================
            CONTROLS
        ========================================= */

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }
        
        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #10b981;
        }

        .cool-btn:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
            background-color: #10b981;
        }

        /* =========================================
            SUMMARY SCREEN
        ========================================= */

        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }

        /* =========================================
            DEBUG AREA
        ========================================= */

        #debug-container {
            width: 100%;
        }

        #debug-text-area {
            width: 100%;
            background: var(--bg-2);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Segoe UI';
            font-size: 1.25rem;
            resize: none;
            min-height: 120px;
            outline: none;
        }

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
            .combo-container { grid-template-columns: 1fr; }
        }
    </style>

<style>

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;

            color: #ffffff;
            background-color: #4f46e5;

            cursor: pointer;

            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);

            display: flex;
            justify-content: center; /* Centra i bottoni in orizzontale */
            align-items: center;     /* Allinea i bottoni in verticale */
            gap: 12px;               /* Spazio tra i pulsanti */
            margin: 0px 0;          /* Distanza sopra e sotto il blocco dei bottoni */
            width: 100%;
            flex-wrap: wrap;         /* Fa andare a capo i bottoni se lo schermo è troppo piccolo */
        }

</style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Segui il percorso
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
        Instruzion banner.
    </div>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- GAME AREA WITH 4 COMBO BOXES IN A 2x2 GRID -->
    <div id="game-area">
        <div id="debug-container">
            <textarea id="debug-text-area" readonly rows="5"></textarea>
        </div>

        <!-- 4 Action Buttons -->
        <div class="game-buttons-container">
            <button type="button" class="cool-btn-2" data-index="0">Prima Tappa</button>
            <button type="button" class="cool-btn-2" data-index="1">Seconda Tappa</button>
            <button type="button" class="cool-btn-2" data-index="2">Terza Tappa</button>
            <button type="button" class="cool-btn-2" data-index="3">Quarta Tappa</button>
        </div>

        <div class="combo-container">
            <div class="combo-item">
                <div class="custom-select-wrapper">
                    <select id="select-0" class="game-select" data-index="0" required>
                        <option value="" disabled selected hidden>Prima tappa...</option>
                    </select>
                    <span class="select-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="combo-item">
                <div class="custom-select-wrapper">
                    <select id="select-1" class="game-select" data-index="1" required>
                        <option value="" disabled selected hidden>Terza tappa...</option>
                    </select>
                    <span class="select-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="combo-item">
                <div class="custom-select-wrapper">
                    <select id="select-2" class="game-select" data-index="2" required>
                        <option value="" disabled selected hidden>Seconda tappa...</option>
                    </select>
                    <span class="select-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="combo-item">
                <div class="custom-select-wrapper">
                    <select id="select-3" class="game-select" data-index="3" required>
                        <option value="" disabled selected hidden>Quarta tappa...</option>
                    </select>
                    <span class="select-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
        
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let buttons = []; 
    let selectFoundState = [];
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 4;
    let foundCorrectCount = 0; 
    let isGameCompleted = false;
    let isGameLoading = true;
    let moveCount = 0;
    let revealCount = 0;
    let currentCategoryTitle = '';
    let currentExercise = null;
    let originalButtonTexts = []; // Memorizza i testi originali dei bottoni .cool-btn-2

    const gameArea = document.getElementById('game-area');
    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const gameSelects = document.querySelectorAll('.game-select');
    const helpButtons = document.querySelectorAll('.cool-btn-2');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const instructionBanner = document.getElementById('instruction-banner');
    const timeValueEl = document.getElementById('time-value');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');
    const debugTextArea = document.getElementById('debug-text-area');

    // Salva i testi originali dei pulsanti all'avvio
    if (helpButtons.length > 0) {
        originalButtonTexts = Array.from(helpButtons).map(btn => btn.textContent);
    }
    
    function logDebug(message) {
        if (debugTextArea) {
            debugTextArea.value = message;
        }
    }
    
    function showSummaryScreen() {
        gameArea.style.display = 'none';
        instructionBanner.style.display = 'none';
        document.getElementById('game-stats').style.display = 'none';
        document.querySelector('.progress-bar-container').style.display = 'none';
        document.getElementById('progress-title').style.display = 'none';
        document.getElementById('game-title').style.display = 'none';
        actionControls.style.display = 'none';
        
        summaryTbody.innerHTML = '';
        
        const metricValue = Math.max(0, 100 - (moveCount * 2) - elapsedSeconds);

        const row = document.createElement('tr');
        row.innerHTML = `
            <td><strong>${currentCategoryTitle}</strong></td>
            <td>${elapsedSeconds}s</td>
            <td>${moveCount}</td>
            <td>${revealCount}</td>
            <td><strong>${metricValue.toFixed(2)}</strong></td>
        `;
        summaryTbody.appendChild(row);
        
        summaryTotals.innerHTML = `
            <div>Tempo Totale: <strong>${elapsedSeconds}s</strong></div>
            <div>Mosse Totali: <strong>${moveCount}</strong></div>
            <div>Aiuti Totali: <strong>${revealCount}</strong></div>
        `;
        summaryScreen.style.display = 'block';
    }

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) {
            timeValueEl.textContent = elapsedSeconds + 's';
        }
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateGridUI(title) {
        if (instructionBanner) {
            instructionBanner.textContent = title;
        }

        const placeholders = [
            "Prima tappa...",
            "Seconda tappa...",
            "Terza tappa...",
            "Quarta tappa..."
        ];

        gameSelects.forEach((select, index) => {
            const placeholderText = placeholders[index];
            select.innerHTML = `<option value="" disabled selected hidden>${placeholderText}</option>`;
            buttons.forEach((btn, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = btn.label;
                select.appendChild(opt);
            });
            select.classList.remove('selected', 'error', 'help-correct');
            select.style.backgroundColor = '';
            select.style.color = '';
            select.style.borderColor = '';
            select.disabled = false;
        });
    }

    function updateProgressBar(value) {
        if (progressBarFill) {
            progressBarFill.style.width = (Math.min(Math.max(value, 0), 1) * 100) + '%';
        }
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    // Mostra le soluzioni e imposta lo sfondo verde sui bottoni .cool-btn-2
    function showHelp() {
        if (!currentExercise || !currentExercise.solutions) return;

        helpButtons.forEach((btn, index) => {
            if (currentExercise.solutions[index] !== undefined) {
                btn.textContent = currentExercise.solutions[index];
                btn.style.backgroundColor = '#4caf50'; // Sfondo verde
                btn.style.color = '#ffffff'; // Testo bianco per leggibilità
                btn.classList.add('help-active');
            }
        });
    }

    // Ripristina il testo predefinito e rimuove lo sfondo verde al rilascio
    function hideHelp() {
        if (isGameCompleted || isGameLoading) return;

        helpButtons.forEach((btn, index) => {
            if (originalButtonTexts[index] !== undefined) {
                btn.textContent = originalButtonTexts[index];
            }
            btn.style.backgroundColor = '';
            btn.style.color = '';
            btn.classList.remove('help-active');
        });
    }

    async function initGame() {
        try {
            isGameLoading = true;
            
            if (revealBtn) {
                revealBtn.innerHTML = "<span>💡 Help</span>";
            }

            const response = await fetch('categorie-segui-il-percorso.json');
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status}`);
            }

            const data = await response.json();
            if (!data.categories || data.categories.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * data.categories.length);
            currentExercise = data.categories[randomIndex];

            buttons = [...currentExercise.buttons];
            currentCategoryTitle = currentExercise.instruction;
            selectFoundState = new Array(gameSelects.length).fill(false);
            
            totalCorrectItems = Math.min(4, buttons.filter(b => b.value === true).length || 4);

            isGameCompleted = false;
            isGameLoading = false;
            moveCount = 0;
            revealCount = 0;
            foundCorrectCount = 0;

            logDebug(currentExercise.text);
            updateMovesDisplay();
            updateRevealDisplay();
            updateProgressBar(0);
            updateGridUI(currentCategoryTitle);
            startElapsedTimer();

        } catch (err) {
            isGameLoading = false;
            console.error('Could not load JSON:', err);
        }
    }

    // Gestione apertura, scelta e click esterno (blur) per i select
    gameSelects.forEach(select => {
        const wrapper = select.closest('.custom-select-wrapper');

        select.addEventListener('focus', () => {
            wrapper.classList.add('open');
        });

        select.addEventListener('change', () => {
            wrapper.classList.remove('open');
            select.blur();
        });

        select.addEventListener('blur', () => {
            setTimeout(() => {
                if (document.activeElement !== select) {
                    wrapper.classList.remove('open');
                }
            }, 150);
        });
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.custom-select-wrapper')) {
            gameSelects.forEach(select => {
                const wrapper = select.closest('.custom-select-wrapper');
                wrapper.classList.remove('open');
                select.blur();
            });
        }
    });

    if (revealBtn) {
        const handleShowHelp = () => {
            if (isGameCompleted || isGameLoading) return;
            revealCount++;
            updateRevealDisplay();
            showHelp();
        };

        revealBtn.addEventListener('mousedown', handleShowHelp);
        revealBtn.addEventListener('mouseup', hideHelp);
        revealBtn.addEventListener('mouseleave', hideHelp);
        revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleShowHelp(); }, { passive: false });
        revealBtn.addEventListener('touchend', hideHelp);
        revealBtn.addEventListener('touchcancel', hideHelp);

        revealBtn.addEventListener('click', () => {
            if (isGameCompleted) {
                showSummaryScreen();
            }
        });
    }

    // Validazione sequenziale delle scelte
    gameSelects.forEach(select => {
        const wrapper = select.closest('.custom-select-wrapper');

        select.addEventListener('focus', () => {
            wrapper.classList.add('open');
        });

        select.addEventListener('blur', () => {
            setTimeout(() => {
                if (document.activeElement !== select) {
                    wrapper.classList.remove('open');
                }
            }, 150);
        });

        select.addEventListener('change', async () => {
            if (isGameCompleted || isGameLoading) return;
            
            wrapper.classList.remove('open');
            select.blur();

            const selectIndex = Number(select.dataset.index);
            const chosenBtnIndex = Number(select.value);
            if (isNaN(chosenBtnIndex) || selectFoundState[selectIndex]) return;

            const expectedValue = foundCorrectCount + 1;
            const isCorrect = buttons[chosenBtnIndex] && buttons[chosenBtnIndex].value === expectedValue;
            
            moveCount++;
            updateMovesDisplay();

            if (isCorrect) {
                selectFoundState[selectIndex] = true;
                select.disabled = true;
                select.classList.add('selected');
                select.style.backgroundColor = '#ff9800';
                select.style.color = '#ffffff';
                select.style.borderColor = '#ffffff';
                foundCorrectCount++;

                if (typeof Checkmark !== 'undefined') {
                    try {
                        await Checkmark.show({
                            element: select,
                            size: 48,
                            rise: 70,
                            duration: 1600
                        });
                    } catch (err) {
                        console.warn('Checkmark animation failed:', err);
                    }
                }

                updateProgressBar(foundCorrectCount / totalCorrectItems);

                if ((foundCorrectCount === totalCorrectItems) && !isGameCompleted) {
                    isGameCompleted = true;
                    stopElapsedTimer();

                    if (typeof Confetti !== 'undefined') {
                        try {
                            await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                            await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                            await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                        } catch (err) {
                            console.warn('Confetti animation failed:', err);
                        }
                    }

                    if (revealBtn) {
                        revealBtn.innerHTML = "<span>✓ Fatto</span>";
                    }
                }

            } else {
                select.classList.remove('error');
                void select.offsetWidth;
                select.classList.add('error');
                setTimeout(() => {
                    select.classList.remove('error');
                }, 400);
            }
        });
    });

    initGame();
});
</script>

</body>
</html>
