<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown Intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg-0: #0d0d14;
    --bg-1: #15151f;
    --bg-2: #1c1c29;
    --accent: #7c5cff;
    --accent-2: #4fd1c5;
    --correct: #39d98a;
    --wrong: #ff5c7c;
    --text: #e8e8f0;
    --text-dim: #9494a8;
    --border: #2a2a3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
      var(--bg-0);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #intro-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
  }

  .intro-number {
    font-size: 9rem;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: intro-pop 0.8s ease;
  }

  @keyframes intro-pop {
    0%   { transform: scale(0.6); opacity: 0; }
    30%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* What shows once the countdown finishes — replace this with your
     actual game/app content. */
  #done-screen {
    display: none;
    text-align: center;
  }

  #done-screen.visible {
    display: block;
  }

  #done-screen h1 {
    font-size: 1.8rem;
    margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-number" id="intro-number">3</div>
  </div>

  <div id="done-screen">
    <h1>Go! 🚀</h1>
  </div>

  <script>
    /* -----------------------------------------------------------
       Standalone 3-2-1 countdown intro.

       Usage: call runIntroCountdown(callback). The countdown plays
       (3 → 2 → 1), then intro-screen is hidden, done-screen is shown,
       and callback() runs — swap done-screen's contents (or the
       callback itself) for whatever should appear once the countdown
       finishes, e.g. starting a game.
    ----------------------------------------------------------- */
    function runIntroCountdown(onDone) {
      const introScreen = document.getElementById('intro-screen');
      const introNumber = document.getElementById('intro-number');
      const doneScreen = document.getElementById('done-screen');

      let count = 3;
      introNumber.textContent = count;

      const tick = () => {
        count--;
        if (count > 0) {
          // Restart the pop animation on each number
          introNumber.style.animation = 'none';
          void introNumber.offsetWidth; // force reflow to re-trigger animation
          introNumber.style.animation = '';
          introNumber.textContent = count;
          setTimeout(tick, 800);
        } else {
          introScreen.style.display = 'none';
          doneScreen.classList.add('visible');
          if (onDone) onDone();
        }
      };

      setTimeout(tick, 800);
    }

    // Run on load
    runIntroCountdown(() => {
      console.log('Countdown finished — start your game/app here.');
    });
  </script>
</body>
</html>
