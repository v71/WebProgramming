<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequenza Corretta</title>
    <style>
        :root {
            --bg-0: #e6e6e6;
            --bg-1: #ffffff;
            --bg-2: #f1f5f9;
            --accent: #6366f1;
            --accent-2: #06b6d4;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.2px;
            text-align: center;
            width: 100%;
        }

        /* Progress Bar Styles */
        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 12px;
            border-radius: 99px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Container sizes dynamically and stays centered */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            min-height: clamp(120px, 16vh, 190px);
            padding: 20px;
            border-radius: 20px;
            align-items: center;
            box-sizing: border-box;
            background-color: var(--bg-1);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin: 0 auto;
        }

        #source-container {
            border-color: var(--border);
        }

        #target-container {
            border: 2px solid #a5b4fc;
            background-color: #faf8ff;
        }

        /* Slot styles for Drop Zone */
        .slot {
            position: relative;
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            background-color: var(--bg-2);
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        /* Highlight for the current active slot */
        .slot.active-slot {
            border-color: var(--accent);
            border-style: solid;
            background-color: #ede9fe;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Filled slot acts as a unified card container and lifts together smoothly */
        .slot.filled {
            border-style: solid;
            border-color: var(--border);
            background-color: var(--bg-1);
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        .slot.filled:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        /* Slot currently under the dragged card */
        .slot.drag-over {
            border-color: var(--accent-2) !important;
            background-color: rgba(6, 182, 212, 0.12) !important;
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.2) !important;
        }

        /* Error state for incorrect slots */
        .slot.error-slot {
            border-color: var(--wrong) !important;
            background-color: rgba(239, 68, 68, 0.05) !important;
            animation: shake 0.4s ease;
        }

        .slot.error-slot .card {
            color: var(--wrong);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .target-wrapper {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }

        #reveal-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 20px;
            border-radius: 20px;
            background-color: var(--bg-1);
            border: 2px solid var(--correct);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: var(--shadow-lg);
            z-index: 10;
        }

        #reveal-overlay.visible {
            opacity: 1;
        }

        .card.reveal-letter {
            border-color: var(--correct);
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--correct);
            cursor: default;
            box-shadow: none;
            transform: none !important;
        }

        .card {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        .card.reveal-letter {
            cursor: default;
        }

        /* Hover effect for source cards */
        #source-container .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            color: var(--accent);
            z-index: 5;
        }

        /* Inside slots, cards don't translate independently and borders are reset */
        .slot .card {
            border: none;
            box-shadow: none;
            background: transparent;
            width: 100%;
            height: 100%;
            transform: none !important;
        }

        .card-img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .card-icon {
            font-size: 2.4rem;
            line-height: 52px;
            pointer-events: none;
        }

        .card-label {
            line-height: 1.1;
            overflow-wrap: anywhere;
            pointer-events: none;
        }

        /* Original card while its copy is being dragged */
        .card.dragging-source {
            opacity: 0.3;
        }

        /* Floating copy that follows the pointer */
        .card.drag-ghost {
            position: fixed;
            margin: 0;
            z-index: 1000;
            pointer-events: none;
            cursor: grabbing;
            transition: none;
            transform: scale(1.08) !important;
            border: 2px solid var(--accent) !important;
            background: #ffffff !important;
            color: var(--accent);
            box-shadow: 0 18px 35px -8px rgba(99, 102, 241, 0.45) !important;
        }

        #game-stats, .stats-style {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn i {
            font-size: 1.1rem;
            -webkit-text-stroke: 1px currentColor; 
            transition: transform 0.25s ease;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #4f46e5;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        }

        .cool-btn:hover i {
            transform: translateX(3px);
        }

        .cool-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
        }

        #next-btn {
            background-color: var(--correct);
        }

        #next-btn:hover {
            background-color: #059669;
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.4);
        }

        #next-btn:active {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }

        .cool-btn.wrong-btn {
            background-color: var(--wrong);
            cursor: default;
            pointer-events: none;
            box-shadow: 0 10px 25px -3px rgba(239, 68, 68, 0.25);
        }

    </style>
</head>
<body>

    <h1 id="game-title">Sequenza Corretta</h1>
    
    <div id="game-stats">
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Round: <strong id="progress-value">1 / 4</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Trascina le carte dalla prima lista alla seconda nell'ordine corretto.</h3>


    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <div id="puzzle-workspace" class="section-wrapper" style="align-items: center;">
        <div class="section-wrapper">
            <!--<div class="section-title">Componi qui (la casella attiva è evidenziata)</div>-->
            <div class="target-wrapper">
                <div id="target-container" class="card-container"></div>
                <div id="reveal-overlay" aria-hidden="true"></div>
            </div>
        </div>
        <div class="section-wrapper" style="margin-bottom:0;">
            <!--<div class="section-title">Lettere disponibili (trascina per spostare)</div>-->
            <div id="source-container" class="card-container"></div>
        </div>

    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>


    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Sequenza</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

                { text: "Anziano", icon: "👴", image: IMAGES.anziano } ] },
            { title: "Preparare la pizza", prompt: "Ordina i passaggi per preparare una pizza.", items: [
                { text: "Farina", icon: "🌾", image: IMAGES.farina }, { text: "Impasto", icon: "🥣", image: IMAGES.impasto }, { text: "Forno", icon: "🔥", image: IMAGES.forno },
                { text: "Pizza", icon: "🍕", image: IMAGES.pizza } ] }
        ];
        let currentWordIndex = 0;
        let roundResults = [];

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const revealOverlay = document.getElementById('reveal-overlay');
        const sourceContainer = document.getElementById('source-container');
        const targetContainer = document.getElementById('target-container');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const puzzleWorkspace = document.getElementById('puzzle-workspace');
        const actionControls = document.getElementById('action-controls');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');
        const instructionBanner = document.getElementById('instruction-banner');

        let currentPuzzle = null;
        let correctSequence = "";
        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let wordCompleted = false;
        let isRevealing = false;
        let slotsMeta = [];

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function registerMove() {
            if (wordCompleted) return;
            moveCount++;
            updateMovesDisplay();
            updateSlotHighlights();
            checkWordAutomatic();
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadWord(index) {
            if (index >= PUZZLES.length) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
                return;
            }

            const progressRatio = (index / PUZZLES.length) * 100;
            progressBarFill.style.width = progressRatio + '%';

            currentPuzzle = PUZZLES[index];
            correctSequence = currentPuzzle.items.map((_, i) => i).join(',');
            instructionBanner.textContent = currentPuzzle.prompt;
            sourceContainer.style.width = ''; 
            sourceContainer.style.minHeight = '';
            sourceContainer.innerHTML = ''; 
            targetContainer.innerHTML = ''; 
            wordCompleted = false;
            moveCount = 0;
            revealCount = 0;
            slotsMeta = [];
            
            progressValueEl.textContent = `${index + 1} / ${PUZZLES.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.classList.add('smooth-hidden');
            revealBtn.classList.remove('smooth-hidden');
            revealBtn.disabled = false;
            revealBtn.classList.remove('wrong-btn');
            revealBtn.innerHTML = "<span>💡 Help!</span>";

            for (let i = 0; i < currentPuzzle.items.length; i++) {
                const slot = document.createElement('div');
                slot.classList.add('slot');

                targetContainer.appendChild(slot);
                slotsMeta.push({ element: slot, expected: String(i) });
            }

            updateSlotHighlights();

            // Shuffle the items (keeping their original index as id), making sure the
            // starting order is never already the solution.
            const indices = currentPuzzle.items.map((_, i) => i);
            let shuffledIndices = shuffleArray(indices);
            while (shuffledIndices.join(',') === correctSequence && indices.length > 1) {
                shuffledIndices = shuffleArray(indices);
            }

            shuffledIndices.forEach(id => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = id;
                fillCard(card, currentPuzzle.items[id]);

                setupCardDrag(card);
                sourceContainer.appendChild(card);
            });

            requestAnimationFrame(() => {
                const initialRect = sourceContainer.getBoundingClientRect();
                sourceContainer.style.width = initialRect.width + 'px';
                // Lock the height too, so the layout doesn't collapse as cards leave the container
                sourceContainer.style.minHeight = initialRect.height + 'px';
            });
        }

        /* ---------- Drag & Drop (Pointer Events: mouse, touch and pen) ---------- */

        const DRAG_THRESHOLD = 4; // px of movement before a press becomes a drag
        let drag = null;

        function fillCard(card, item) {
            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = item.image;
            img.alt = item.text;
            img.draggable = false;
            // If an image fails to load, fall back to the emoji so the card is never empty
            img.addEventListener('error', () => {
                const fallback = document.createElement('span');
                fallback.className = 'card-icon';
                fallback.textContent = item.icon;
                img.replaceWith(fallback);
            });
            const label = document.createElement('span');
            label.className = 'card-label';
            label.textContent = item.text;
            card.append(img, label);
        }

        function setupCardDrag(card) {
            card.addEventListener('dragstart', (e) => e.preventDefault());

            card.addEventListener('pointerdown', (e) => {
                if (wordCompleted || drag) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();

                const rect = card.getBoundingClientRect();
                drag = {
                    card,
                    origin: card.parentNode,
                    pointerId: e.pointerId,
                    startX: e.clientX,
                    startY: e.clientY,
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top,
                    width: rect.width,
                    height: rect.height,
                    started: false,
                    ghost: null,
                    hoverSlot: null
                };

                document.addEventListener('pointermove', onDragMove);
                document.addEventListener('pointerup', onDragEnd);
                document.addEventListener('pointercancel', onDragCancel);
            });
        }

        function startDragVisuals() {
            drag.started = true;

            const ghost = drag.card.cloneNode(true);
            ghost.classList.remove('dragging-source');
            ghost.classList.add('drag-ghost');
            ghost.style.width = drag.width + 'px';
            ghost.style.height = drag.height + 'px';
            document.body.appendChild(ghost);
            drag.ghost = ghost;

            drag.card.classList.add('dragging-source');
            document.body.style.cursor = 'grabbing';
        }

        function onDragMove(e) {
            if (!drag || e.pointerId !== drag.pointerId) return;

            if (!drag.started) {
                const dx = e.clientX - drag.startX;
                const dy = e.clientY - drag.startY;
                if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
                startDragVisuals();
            }

            drag.ghost.style.left = (e.clientX - drag.offsetX) + 'px';
            drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';

            // Highlight the slot currently under the pointer
            const slot = getSlotAt(e.clientX, e.clientY);
            if (slot !== drag.hoverSlot) {
                if (drag.hoverSlot) drag.hoverSlot.classList.remove('drag-over');
                if (slot) slot.classList.add('drag-over');
                drag.hoverSlot = slot;
            }
        }

        function getSlotAt(x, y) {
            const el = document.elementFromPoint(x, y);
            if (!el) return null;
            const slot = el.closest('.slot');
            return slot && slotsMeta.some(m => m.element === slot) ? slot : null;
        }

        function onDragEnd(e) {
            if (!drag || e.pointerId !== drag.pointerId) return;

            const current = drag;

            if (current.started) {
                const slot = getSlotAt(e.clientX, e.clientY);
                const el = document.elementFromPoint(e.clientX, e.clientY);
                const overSource = !!(el && el.closest('#source-container'));
                let changed = false;

                if (slot) {
                    if (slot !== current.origin) {
                        // If the slot is occupied, swap: the occupant goes back where the dragged card came from
                        const occupant = slot.querySelector('.card');
                        if (occupant) current.origin.appendChild(occupant);
                        slot.appendChild(current.card);
                        changed = true;
                    }
                } else if (overSource && current.origin !== sourceContainer) {
                    sourceContainer.appendChild(current.card);
                    changed = true;
                }

                cleanupDrag();

                if (changed) {
                    syncFilledSlots();
                    clearErrorState();
                    registerMove();
                }
            } else {
                cleanupDrag();
            }
        }

        function onDragCancel(e) {
            if (!drag || e.pointerId !== drag.pointerId) return;
            cleanupDrag();
        }

        function cleanupDrag() {
            if (!drag) return;
            if (drag.ghost) drag.ghost.remove();
            if (drag.hoverSlot) drag.hoverSlot.classList.remove('drag-over');
            drag.card.classList.remove('dragging-source');
            document.body.style.cursor = '';

            document.removeEventListener('pointermove', onDragMove);
            document.removeEventListener('pointerup', onDragEnd);
            document.removeEventListener('pointercancel', onDragCancel);
            drag = null;
        }

        function syncFilledSlots() {
            slotsMeta.forEach(m => {
                m.element.classList.toggle('filled', !!m.element.querySelector('.card'));
            });
        }

        function clearErrorState() {
            slotsMeta.forEach(m => m.element.classList.remove('error-slot'));
            if (revealBtn.classList.contains('wrong-btn')) {
                revealBtn.classList.remove('wrong-btn');
                revealBtn.disabled = false;
                revealBtn.innerHTML = "<span>💡 Help!</span>";
            }
        }

        /* ------------------------------------------------------------------------ */

        function updateSlotHighlights() {
            slotsMeta.forEach(m => m.element.classList.remove('active-slot'));

            const firstEmptyMeta = slotsMeta.find(m => !m.element.querySelector('.card'));
            if (firstEmptyMeta) {
                firstEmptyMeta.element.classList.add('active-slot');
            }
        }

        function checkWordAutomatic() {
            if (wordCompleted) return;

            const currentString = slotsMeta.map(m => {
                const card = m.element.querySelector('.card');
                return card ? card.dataset.id : '';
            }).join(',');

            const allSlotsFilled = slotsMeta.every(m => m.element.querySelector('.card'));

            if (allSlotsFilled && currentString === correctSequence) {
                wordCompleted = true;
                stopElapsedTimer();
                updateSlotHighlights();

                slotsMeta.forEach(m => m.element.classList.remove('error-slot'));

                roundResults.push({
                    word: currentPuzzle.title,
                    time: elapsedSeconds,
                    moves: moveCount,
                    reveals: revealCount
                });

                if (currentWordIndex === PUZZLES.length - 1) {
                    nextBtn.textContent = "Fatto";
                } else {
                    nextBtn.textContent = "▶ Prossima parola";
                }
                
                revealBtn.classList.remove('wrong-btn');
                revealBtn.disabled = false;
                
                // Smoothly fade out Help and fade in Next button
                revealBtn.classList.add('smooth-hidden');
                nextBtn.classList.remove('smooth-hidden');

            } else if (allSlotsFilled) {
                // Turn Help! button red and non-clickable
                revealBtn.innerHTML = "<span>⚠️ Parola errata</span>";
                revealBtn.classList.add('wrong-btn');
                revealBtn.disabled = true;

                slotsMeta.forEach(m => m.element.classList.add('error-slot'));
            } else {
                slotsMeta.forEach(m => m.element.classList.remove('error-slot'));

                if (revealBtn.classList.contains('wrong-btn')) {
                    revealBtn.classList.remove('wrong-btn');
                    revealBtn.disabled = false;
                    revealBtn.innerHTML = "<span>💡 Help!</span>";
                }
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentWordIndex === PUZZLES.length - 1) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
            } else {
                currentWordIndex++;
                loadWord(currentWordIndex);
            }
        });

        function showSummaryScreen() {
            puzzleWorkspace.style.display = 'none';
            instructionBanner.style.display = 'none'; 
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            actionControls.style.display = 'none';
            
            summaryTbody.innerHTML = '';
            let totalTime = 0;
            let totalMoves = 0;
            let totalReveals = 0;

            roundResults.forEach(res => {
                totalTime += res.time;
                totalMoves += res.moves;
                totalReveals += res.reveals;
                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${res.word}</strong></td><td>${res.time}s</td><td>${res.moves}</td><td>${res.reveals}</td>`;
                summaryTbody.appendChild(row);
            });

            summaryTotals.innerHTML = `
                <div>Tempo totale: <strong>${totalTime}s</strong></div>
                <div>Mosse totali: <strong>${totalMoves}</strong></div>
                <div>Aiuti totali: <strong>${totalReveals}</strong></div>
            `;

            summaryScreen.style.display = 'block';
        }

        function showReveal() {
            if (wordCompleted || isRevealing || revealBtn.disabled) return;
            isRevealing = true;
            
            revealCount++;
            updateRevealsDisplay();

            revealOverlay.innerHTML = '';
            currentPuzzle.items.forEach((item) => {
                const card = document.createElement('div');
                card.classList.add('card', 'reveal-letter');
                fillCard(card, item);
                revealOverlay.appendChild(card);
            });
            revealOverlay.classList.add('visible');
        }

        function hideReveal() {
            if (!isRevealing) return;
            isRevealing = false;
            revealOverlay.classList.remove('visible');
        }

        revealBtn.addEventListener('mousedown', showReveal);
        revealBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showReveal();
        }, { passive: false });

        revealBtn.addEventListener('mouseup', hideReveal);
        revealBtn.addEventListener('mouseleave', hideReveal);
        revealBtn.addEventListener('touchend', hideReveal);
        revealBtn.addEventListener('touchcancel', hideReveal);

        loadWord(currentWordIndex);
    </script>
</body>
</html>
