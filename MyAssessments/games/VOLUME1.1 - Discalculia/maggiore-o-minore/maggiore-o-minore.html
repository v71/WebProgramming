<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maggiore Minore o Uguale</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <style>
        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

            background:
                radial-gradient(circle at center,rgba(99, 102, 241, 0.06),transparent 40%),
                radial-gradient(circle at center,rgba(6, 182, 212, 0.06),transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
           GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           COUNTERS
        ========================================= */

        #game-stats {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
           INFORMATION BOX
        ========================================= */

         #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
           EMPTY GAME AREA
        ========================================= */

        #game-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
            margin-bottom: 15px;
            padding: 24px;

            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        /* This is intentionally empty.
           Future game content goes here. */

        /* =========================================
           PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 135deg,#6366f1 0%,#a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
            COO_-BUTTONS
           ========================================= */

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5; /* Blu fisso a riposo */
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn i {
            font-size: 1.1rem;
            -webkit-text-stroke: 1px currentColor;
            transition: transform 0.25s ease;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #10b981; /* Blu leggermente più scuro all'hover */
        }

        .cool-btn:hover i {
            transform: translateX(3px);
        }

        .cool-btn:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
           background-color: #10b981;
        }

        .cool-btn.wrong-btn {
            background-color: var(--wrong);
            cursor: default;
            pointer-events: none;
            box-shadow: 0 10px 25px -3px rgba(239, 68, 68, 0.25);
            opacity: 1 !important; /* Mantiene il colore pieno senza trasparenza */
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }

    </style>

    <style>

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

         #image-container {
            border: 2px solid #000000;
            background-color: #ffffff;
            padding: 0px; /* Riduci il padding da 10px a 4px */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content; /* Adatta la larghezza al contenuto */
            height: auto;
            overflow: hidden;
            border-radius: 14px; /* Allinea leggermente l'arrotondamento */
        }

        #image-container img {
            max-width: 100%;
            max-height: 400px; /* Limita l'altezza massima per evitare immagini troppo grandi */
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
        }

         @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #options-container {
            border-color: var(--border);
            display: flex; /* Added missing display flex */
            flex-direction: column;
            justify-content: stretch;
            align-items: stretch;
            width: 400px;
            padding: 14px;
            gap: 12px;
            flex: 1; /* Matches the height of the image container */
        }

        .option-card {
            flex: 1; /* Distributes the height equally among the 3 buttons */
            width: 100%;
            min-height: 0; /* Overrides previous min-height so flex: 1 works correctly */
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            color: var(--bg-0); /* Dark text for readability */
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 18px 22px;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            white-space: normal;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        #options-container {
            border-color: var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            width: 400px;
            padding: 0px;
            gap: 16px; /* Increased gap to ensure clear separation */
        }

       .option-card {
            flex-shrink: 0;
            width: 100%;
            min-height: 100px;
            background: #7931b4;
            color: #ffffff; /* Fixed: dark text on a light background */
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 18px 22px;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            white-space: normal;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        .option-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            color: var(--accent);
             background: #ffffff;
        }

        .option-card.correct-option {
            border-color: #000000;
            background: var(--accent);
            color: var(--correct);
            cursor: default;
            transform: none !important;
            box-shadow: var(--shadow-sm);
        }

        .option-card.wrong-option {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
            color:#ef4444;
            animation: shake 0.4s ease;
        }

         .option-card.disabled-option {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .option-card.disabled-option:not(.wrong-option) {
            transform: none !important;
        }

        .option-card.wrong-option.disabled-option {
            opacity: 1;   /* stays fully red instead of faded */
        }

        .option-card.peek {
            border-color: var(--correct);
            background: #10b981;
            color: var(--correct);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

    </style>

<style>

        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);

        }

        .summary-totals {

            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }
    
</style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Maggiore, Minore o Uguale ?
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="progress-value">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <h3 id="instruction-banner" class="stats-style">Osserva l'immagine e scegli, tra le 3 opzioni, quella giusta.</h3>

    <!-- HELP BUTTON -->
    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>
        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- EMPTY GAME AREA -->
    <div id="game-area">
        <div id="image-container" class="card-container"></div>
        <div id="options-container" class="card-container"></div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>
    <div class="progress-bar-container">
        <div
            id="progress-bar-fill"
            class="progress-bar-fill"
            style="width: 0%;">
        </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

    <!-- NO GAME LOGIC -->
    <script>
                
           document.addEventListener('DOMContentLoaded', () => {
            
            const gameArea = document.getElementById('game-area');
            const progressValueEl = document.getElementById('progress-value');
            const timeValueEl = document.getElementById('time-value');
            const movesValueEl = document.getElementById('moves-value');
            const revealsValueEl = document.getElementById('reveals-value');
            const revealBtn = document.getElementById('reveal-btn');
            const progressBarFill = document.getElementById('progress-bar-fill');
            const instructionBanner = document.getElementById('instruction-banner');
            const gameTitle = document.getElementById('game-title');
            const gameStats = document.getElementById('game-stats');
            const actionControls = document.getElementById('action-controls');
            const progressTitle = document.getElementById('progress-title');
            const progressContainer = document.querySelector('.progress-bar-container');

            let elapsedSeconds = 0;
            let moveCount = 0;
            let revealCount = 0;
            let elapsedTimerInterval = null;

            // GAME SPECIFIC
            const nextBtn = document.getElementById('next-btn');
            const imageContainer = document.getElementById('image-container');
            const optionsContainer = document.getElementById('options-container');
            const summaryScreen = document.getElementById('summary-screen');
            const summaryTbody = document.getElementById('summary-tbody');
            const summaryTotals = document.getElementById('summary-totals');

            let ROUNDS = [];
            let currentRoundIndex = 0;
            let roundResults = [];
            let roundCompleted = false;
            let isPeeking = false;
            let optionElements = [];
            let currentRound = null;
            let imageLoadToken = 0;   // <-- add this

            // GAME SPECIFIC

            // TEMPLATE FUNCTIONS
            function startElapsedTimer() {
                stopElapsedTimer();
                elapsedSeconds = 0;
                updateTimerDisplay();
                elapsedTimerInterval = setInterval(() => {
                    elapsedSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }

            function stopElapsedTimer() {
                if (elapsedTimerInterval) {
                    clearInterval(elapsedTimerInterval);
                    elapsedTimerInterval = null;
                }
            }

            function updateTimerDisplay() {
                timeValueEl.textContent = elapsedSeconds + 's';
            }

            function updateMovesDisplay() {
                movesValueEl.textContent = moveCount;
            }

            function updateRevealsDisplay() {
                revealsValueEl.textContent = revealCount;
            }

            // GAME SPECIFIC

            function shuffleArray(array) {
                let arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function loadRound(index) {
                if (index >= ROUNDS.length) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                    return;
                }
            
                const progressRatio = (index / ROUNDS.length) * 100;
                progressBarFill.style.width = progressRatio + '%';
                
                currentRound = ROUNDS[index];
                roundCompleted = false;
                moveCount = 0;
                revealCount = 0;
                optionElements = [];
                
                progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
                updateMovesDisplay();
                updateRevealsDisplay();
                startElapsedTimer();
                
                nextBtn.classList.add('smooth-hidden');
                revealBtn.classList.remove('smooth-hidden');
                revealBtn.disabled = false;

                // ---------- IMAGE SWAP (no layout jump) ----------
                const existingImg = imageContainer.querySelector('img');

                // Token to ignore stale loads if rounds advance quickly
                const loadToken = ++imageLoadToken;
                const roundForImage = currentRound;
                
                const updateImageSource = () => {
                    if (loadToken !== imageLoadToken) return; // outdated request

                    // Lock the current size so the page doesn't collapse during the swap
                    const h = imageContainer.offsetHeight;
                    const w = imageContainer.offsetWidth;
                    if (h) imageContainer.style.minHeight = h + 'px';
                    if (w) imageContainer.style.minWidth = w + 'px';

                    const newImg = new Image();
                    newImg.alt = roundForImage.label;

                    const show = () => {
                        if (loadToken !== imageLoadToken) return; // outdated request
                        imageContainer.replaceChildren(newImg);
                        newImg.getBoundingClientRect(); // force reflow so the fade-in runs
                        newImg.style.opacity = '1';
                        // Release the size lock now that the new image is in place
                        imageContainer.style.minHeight = '';
                        imageContainer.style.minWidth = '';
                    };

                    newImg.onload = show;
                    newImg.onerror = show;
                    newImg.src = roundForImage.img;
                };

                if (existingImg) {
                    existingImg.style.opacity = '0';
                    setTimeout(updateImageSource, 350);
                } else {
                    updateImageSource();
                }

                // ---------- OPTIONS ----------
                optionsContainer.innerHTML = '';

                const correctIdx = currentRound.correctIndex;
                const incorrectIndices = [];
                for (let i = 0; i < currentRound.options.length; i++) {
                    if (i !== correctIdx) {
                        incorrectIndices.push(i);
                    }
                }

                // Pick 2 random wrong options, add the correct one, then shuffle
                const selectedIncorrect = shuffleArray(incorrectIndices).slice(0, 2);
                const order = shuffleArray([correctIdx, ...selectedIncorrect]);

                order.forEach((originalIdx) => {
                    const optionEl = document.createElement('div');
                    optionEl.classList.add('option-card');
                    optionEl.textContent = currentRound.options[originalIdx];
                    optionEl.dataset.isCorrect = (originalIdx === currentRound.correctIndex) ? 'true' : 'false';

                    optionEl.addEventListener('click', () => handleOptionClick(optionEl));

                    optionsContainer.appendChild(optionEl);
                    optionElements.push(optionEl);
                });
                
            }

            async function handleOptionClick(optionEl) {
                if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

                if (optionEl.dataset.isCorrect === 'true') {
                    roundCompleted = true;
                    stopElapsedTimer();

                    moveCount++;
                    updateMovesDisplay();

                    if (typeof Checkmark !== 'undefined') {
                        try {
                            await Checkmark.show({
                                element: optionEl, // Fixed: use optionEl instead of undefined 'button'
                                size: 48,
                                rise: 70,
                                duration: 1600
                            });
                        } catch (err) {
                            console.warn('Checkmark animation failed:', err);
                        }
                    }

                    optionElements.forEach(el => {
                        //el.classList.remove('wrong-option', 'peek');
                        el.classList.remove('peek');
                        if (el !== optionEl) el.classList.add('disabled-option');
                    });
                    optionEl.classList.add('correct-option');

                    progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                    const wrongAttempts = moveCount - 1; 
                    const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                    roundResults.push({
                        label: currentRound.label,
                        time: elapsedSeconds + 's',
                        moves: moveCount,
                        reveals: revealCount,
                        metric: metricValue
                    });

                    if (currentRoundIndex === ROUNDS.length - 1) {
                        nextBtn.textContent = "✓ Fatto";

                        if (typeof Confetti !== 'undefined') {
                            try {
                                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                            } catch (err) {
                                console.warn('Confetti animation failed:', err);
                            }
                        }

                    } else {
                        nextBtn.textContent = "▶ Prossima immagine";
                    }

                    revealBtn.classList.add('smooth-hidden');
                    nextBtn.classList.remove('smooth-hidden');
                }  else {
                    moveCount++;
                    updateMovesDisplay();
                    optionEl.classList.add('wrong-option');
                    optionEl.addEventListener('animationend', () => {
                        optionEl.classList.remove('wrong-option');
                    }, { once: true });
                }
            }

            nextBtn.addEventListener('click', () => {
                if (currentRoundIndex === ROUNDS.length - 1) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                } else {
                    currentRoundIndex++;
                    loadRound(currentRoundIndex);
                }
            });

            function showSummaryScreen() {
                gameArea.style.display = 'none';
                instructionBanner.style.display = 'none';
                document.getElementById('game-stats').style.display = 'none';
                document.querySelector('.progress-bar-container').style.display = 'none';
                actionControls.style.display = 'none';
                summaryTbody.innerHTML = '';
                let totalMetric = 0;

                roundResults.forEach(res => {
                    totalMetric += res.metric;
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                    summaryTbody.appendChild(row);
                });

                const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
                const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

                summaryTotals.innerHTML = `
                    <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                    <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
                `;
                summaryScreen.style.display = 'block';
            }

            function showPeek() {
                if (roundCompleted || isPeeking || revealBtn.disabled) return;
                isPeeking = true;
                revealCount++;
                updateRevealsDisplay();
                const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
                if (correctEl) correctEl.classList.add('peek');
            }

            function hidePeek() {
                if (!isPeeking) return;
                isPeeking = false;
                optionElements.forEach(el => el.classList.remove('peek'));
            }

            async function initGame() {
                try {
                    const response = await fetch('maggiore-o-minore.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    // Mescola l'intero array dei round in modo casuale all'avvio
                    ROUNDS = shuffleArray(data.rounds);

                } catch (err) {
                    console.error('Could not load JSON file:', err);
                }
                loadRound(currentRoundIndex);
            }

            revealBtn.addEventListener('mousedown', showPeek);
            revealBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                showPeek();
            }, { passive: false });

            revealBtn.addEventListener('mouseup', hidePeek);
            revealBtn.addEventListener('mouseleave', hidePeek);
            revealBtn.addEventListener('touchend', hidePeek);
            revealBtn.addEventListener('touchcancel', hidePeek);

            initGame();

        });

    </script>

</body>
</html>
