<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maggiore o minore</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <style>
        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --correct: #10b981;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000000;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at center,rgba(99, 102, 241, 0.06),transparent 40%),
                radial-gradient(circle at center,rgba(6, 182, 212, 0.06),transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
           TEMPORARLY HIDES THE BODY TO AVOID ABRUPT CHANGES FOR THE RAW CONTENT
         ========================================= */

        body {
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }

        body.loaded {
            opacity: 1;
        }

        /* =========================================
            GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
            COUNTERS
        ========================================= */

        #game-stats {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
            INFORMATION BOX
        ========================================= */

        #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
            GAME AREA
        ========================================= */

        #game-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 0px;
            margin-bottom: 15px;
            padding: 24px;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        /* =========================================
            PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
            PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
            BUTTONS
        ========================================= */

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn i {
            font-size: 1.1rem;
            -webkit-text-stroke: 1px currentColor;
            transition: transform 0.25s ease;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #10b981;
        }

        .cool-btn:hover i {
            transform: translateX(3px);
        }

        .cool-btn:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
           background-color: #10b981;
        }

        /* =========================================
            RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
            #options-container { width: 100% !important; }
            .option-card { min-height: 72px !important; }
            .option-card { font-size: 1.4rem; }
        }
    </style>

    <style>
        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        #image-container,
        #image-container-2 {
            border: 2px solid #000000;
            background-color: #ffffff;
            padding: 0px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            max-width: 240px;
            height: auto;
            overflow: hidden;
            border-radius: 14px;
        }

        #image-container img,
        #image-container-2 img {
            max-width: 100%;
            max-height: 300px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* OPTIONS CONTAINER: 3 OPTIONS STACKED IN ONE COLUMN
           The rows are 1fr, so the stack stretches to the same height as the
           number image next to it. To show them side by side instead, use:
           grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr;  */
        #options-container {
            border-color: var(--border);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: repeat(3, minmax(0, 1fr));
            justify-content: center;
            align-items: stretch;
            width: 300px;
            max-width: 100%;
            padding: 0px;
            gap: 12px;
        }

        .option-card {
            flex-shrink: 0;
            width: 100%;
            min-width: 0;
            min-height: 90px;
            background: #7931b4;
            color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 10px;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            /* Ottimizzazioni per prevenire il reflow e rendere fluido il passaggio */
            contain: layout style;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        /* Testo dentro il pulsante opzione */
        .option-card {
            font-family: inherit;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .option-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            color: #000000;
        }

        .option-card.correct-option:hover {
            background: var(--accent);
            color: #ffffff;
            transform: none !important;
            border-color: #000000;
        }

        .option-card.correct-option {
            border-color: #000000;
            background: var(--accent);
            cursor: default;
            transform: none !important;
            box-shadow: var(--shadow-sm);
        }

        .option-card.wrong-option {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
            animation: shake 0.4s ease;
        }

        .option-card.disabled-option {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .option-card.disabled-option:not(.wrong-option) {
            transform: none !important;
        }

        .option-card.wrong-option.disabled-option {
            opacity: 1;
        }

       .option-card.peek {
            border-color: var(--correct);
            background: #10b981;
        }
    </style>

    <style>
        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: #10b981;
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }
    </style>
</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Maggiore o Minore
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="progress-value">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <h3 id="instruction-banner" class="stats-style">Osserva il numero e scegli il suo numero amico.</h3>

    <!-- HELP BUTTON -->
    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>
        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- GAME AREA -->
    <div id="game-area">
        <div id="image-container" class="card-container"></div>
        <div id="image-container-2" class="card-container"></div>
        <div id="options-container" class="card-container"></div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>
    <div class="progress-bar-container">
        <div
            id="progress-bar-fill"
            class="progress-bar-fill"
            style="width: 0%;">
        </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

    <!-- LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Total number of option buttons per round: 1 correct + (OPTIONS_COUNT - 1) wrong.
            const OPTIONS_COUNT = 3;
            const ALLOWED_ROUNDS = [5, 10, 15, 20, 30];

            const gameArea = document.getElementById('game-area');
            const progressValueEl = document.getElementById('progress-value');
            const timeValueEl = document.getElementById('time-value');
            const movesValueEl = document.getElementById('moves-value');
            const revealsValueEl = document.getElementById('reveals-value');
            const revealBtn = document.getElementById('reveal-btn');
            const progressBarFill = document.getElementById('progress-bar-fill');
            const instructionBanner = document.getElementById('instruction-banner');
            const gameTitle = document.getElementById('game-title');
            const gameStats = document.getElementById('game-stats');
            const actionControls = document.getElementById('action-controls');
            const progressTitle = document.getElementById('progress-title');
            const progressContainer = document.querySelector('.progress-bar-container');

            let elapsedSeconds = 0;
            let moveCount = 0;
            let revealCount = 0;
            let elapsedTimerInterval = null;

            const nextBtn = document.getElementById('next-btn');
            const imageContainer = document.getElementById('image-container');
            const imageContainer2 = document.getElementById('image-container-2');
            const imageContainers = [imageContainer, imageContainer2];
            const optionsContainer = document.getElementById('options-container');
            const summaryScreen = document.getElementById('summary-screen');
            const summaryTbody = document.getElementById('summary-tbody');
            const summaryTotals = document.getElementById('summary-totals');

            let ROUNDS = [];
            let currentRoundIndex = 0;
            let roundResults = [];
            let roundCompleted = false;
            let isPeeking = false;
            let optionElements = [];
            let currentRound = null;
            let imageLoadToken = 0;

            function startElapsedTimer() {
                stopElapsedTimer();
                elapsedSeconds = 0;
                updateTimerDisplay();
                elapsedTimerInterval = setInterval(() => {
                    elapsedSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }

            function stopElapsedTimer() {
                if (elapsedTimerInterval) {
                    clearInterval(elapsedTimerInterval);
                    elapsedTimerInterval = null;
                }
            }

            function updateTimerDisplay() {
                timeValueEl.textContent = elapsedSeconds + 's';
            }

            function updateMovesDisplay() {
                movesValueEl.textContent = moveCount;
            }

            function updateRevealsDisplay() {
                revealsValueEl.textContent = revealCount;
            }

            function shuffleArray(array) {
                let arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function preloadImages(round) {
                const urlsToPreload = [];
                if (round.img1) urlsToPreload.push(round.img1);
                if (round.img2) urlsToPreload.push(round.img2);

                urlsToPreload.forEach(url => {
                    const img = new Image();
                    img.src = url;
                });
            }

            function loadRound(index) {
                if (index >= ROUNDS.length) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                    return;
                }
            
                const progressRatio = (index / ROUNDS.length) * 100;
                progressBarFill.style.width = progressRatio + '%';
                
                currentRound = ROUNDS[index];
                roundCompleted = false;
                moveCount = 0;
                revealCount = 0;
                optionElements = [];
                
                preloadImages(currentRound);

                progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
                updateMovesDisplay();
                updateRevealsDisplay();
                startElapsedTimer();
                
                nextBtn.classList.add('smooth-hidden');
                revealBtn.classList.remove('smooth-hidden');
                revealBtn.disabled = false;

                const existingImg = imageContainer.querySelector('img');
                const loadToken = ++imageLoadToken;
                const roundForImage = currentRound;
                
                const updateImageSource = () => {
                    if (loadToken !== imageLoadToken) return;

                    imageContainers.forEach((container, i) => {
                        const h = container.offsetHeight;
                        const w = container.offsetWidth;
                        if (h) container.style.minHeight = h + 'px';
                        if (w) container.style.minWidth = w + 'px';

                        const newImg = new Image();
                        newImg.alt = roundForImage.label;

                        const show = () => {
                            if (loadToken !== imageLoadToken) return;
                            container.replaceChildren(newImg);
                            newImg.getBoundingClientRect();
                            newImg.style.opacity = '1';
                            container.style.minHeight = '';
                            container.style.minWidth = '';
                        };

                        newImg.onload = show;
                        newImg.onerror = show;
                        // First container shows img1, second shows img2 (as stored in the JSON)
                        newImg.src = i === 0 ? roundForImage.img1 : roundForImage.img2;
                    });
                };

                if (existingImg) {
                    imageContainers.forEach(container => {
                        const img = container.querySelector('img');
                        if (img) img.style.opacity = '0';
                    });
                    setTimeout(updateImageSource, 350);
                } else {
                    updateImageSource();
                }

                // ---------- POPOLA I TASTI CON IMMAGINI BITMAP ED EVENTUALE HOVER DAL JSON ----------
                optionsContainer.innerHTML = '';

                const correctIdx = currentRound.correctIndex;
                const incorrectIndices = [];
                for (let i = 0; i < currentRound.options.length; i++) {
                    if (i !== correctIdx) {
                        incorrectIndices.push(i);
                    }
                }

                // 3 buttons total: 1 correct + 2 wrong
                const maxIncorrectToPick = Math.min(incorrectIndices.length, OPTIONS_COUNT - 1);
                const selectedIncorrect = shuffleArray(incorrectIndices).slice(0, maxIncorrectToPick);
                const order = shuffleArray([correctIdx, ...selectedIncorrect]);

                order.forEach((originalIdx) => {
                    const optionEl = document.createElement('button');
                    optionEl.classList.add('option-card');
                    
                    // Opzione testuale: il valore in currentRound.options[i] è mostrato come testo
                    optionEl.textContent = currentRound.options[originalIdx];

                    optionEl.dataset.isCorrect = (originalIdx === currentRound.correctIndex) ? 'true' : 'false';

                    optionEl.addEventListener('click', () => handleOptionClick(optionEl));

                    optionsContainer.appendChild(optionEl);
                    optionElements.push(optionEl);
                });
            }

            async function handleOptionClick(optionEl) {
                if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

                if (optionEl.dataset.isCorrect === 'true') {
                    roundCompleted = true;
                    stopElapsedTimer();

                    moveCount++;
                    updateMovesDisplay();

                    optionEl.classList.add('correct-option');
                    optionElements.forEach(el => {
                        el.classList.remove('peek');
                        if (el !== optionEl) el.classList.add('disabled-option');
                    });

                    if (typeof Checkmark !== 'undefined') {
                        try {
                            await Checkmark.show({
                                element: optionEl,
                                size: 48,
                                rise: 70,
                                duration: 1600
                            });
                        } catch (err) {
                            console.warn('Checkmark animation failed:', err);
                        }
                    }

                    progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                    const wrongAttempts = moveCount - 1; 
                    const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                    roundResults.push({
                        label: currentRound.label,
                        time: elapsedSeconds + 's',
                        moves: moveCount,
                        reveals: revealCount,
                        metric: metricValue
                    });

                    if (currentRoundIndex === ROUNDS.length - 1) {
                        nextBtn.textContent = "✓ Fatto";

                        if (typeof Confetti !== 'undefined') {
                            try {
                                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                            } catch (err) {
                                console.warn('Confetti animation failed:', err);
                            }
                        }

                    } else {
                        nextBtn.textContent = "▶ Prossima immagine";
                    }

                    revealBtn.classList.add('smooth-hidden');
                    nextBtn.classList.remove('smooth-hidden');

                } else {
                    moveCount++;
                    updateMovesDisplay();
                    optionEl.classList.add('wrong-option');
                    optionEl.addEventListener('animationend', () => {
                        optionEl.classList.remove('wrong-option');
                    }, { once: true });
                }
            }

            nextBtn.addEventListener('click', () => {
                if (currentRoundIndex === ROUNDS.length - 1) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                } else {
                    currentRoundIndex++;
                    loadRound(currentRoundIndex);
                }
            });

            function showSummaryScreen() {
                gameArea.style.display = 'none';
                instructionBanner.style.display = 'none';
                document.getElementById('game-stats').style.display = 'none';
                document.querySelector('.progress-bar-container').style.display = 'none';
                actionControls.style.display = 'none';
                summaryTbody.innerHTML = '';
                let totalMetric = 0;

                roundResults.forEach(res => {
                    totalMetric += res.metric;
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                    summaryTbody.appendChild(row);
                });

                const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
                const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

                summaryTotals.innerHTML = `
                    <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                    <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
                `;
                summaryScreen.style.display = 'block';
            }

            function showPeek() {
                if (roundCompleted || isPeeking || revealBtn.disabled) return;
                isPeeking = true;
                revealCount++;
                updateRevealsDisplay();
                const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
                if (correctEl) correctEl.classList.add('peek');
            }

            function hidePeek() {
                if (!isPeeking) return;
                isPeeking = false;
                optionElements.forEach(el => el.classList.remove('peek'));
            }

            async function initGame(roundsCount = 5) {
            try {
                const response = await fetch('maggiore-o-minore.json');
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                const data = await response.json();

                const sortedRounds = data.rounds.sort((a, b) => {
                    const numA = parseInt((a.label.match(/\d+/) || [0])[0], 10);
                    const numB = parseInt((b.label.match(/\d+/) || [0])[0], 10);
                    return numA - numB;
                });

                // Use the requested number if it is allowed, otherwise fall back to all rounds
                const count = ALLOWED_ROUNDS.includes(roundsCount) ? roundsCount : sortedRounds.length;

                // Shuffle first, then keep only the first `count` rounds
                ROUNDS = shuffleArray(sortedRounds).slice(0, count);

                document.body.classList.add('loaded');

            } catch (err) {
                console.error('Could not load JSON file:', err);
            }
            loadRound(currentRoundIndex);
        }

            revealBtn.addEventListener('mousedown', showPeek);
            revealBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                showPeek();
            }, { passive: false });

            revealBtn.addEventListener('mouseup', hidePeek);
            revealBtn.addEventListener('mouseleave', hidePeek);
            revealBtn.addEventListener('touchend', hidePeek);
            revealBtn.addEventListener('touchcancel', hidePeek);

            initGame();
        });
    </script>
