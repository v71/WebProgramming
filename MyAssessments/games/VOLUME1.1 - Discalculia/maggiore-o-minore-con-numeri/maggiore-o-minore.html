<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maggiore o minore</title>

    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <link href="../stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        /* =========================================
           GAME AREA
        ========================================= */
        #game-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            flex-wrap: wrap;
            margin: 0 0 15px;
            padding: 24px;
            border-radius: 20px;
            background: var(--game-area-background);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            min-height: 52px;
        }

        button:hover { filter: brightness(1.05); }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        /* Number images */
        #image-container-1,
        #image-container-2 {
            border: 2px solid #000;
            background-color: var(--summary-background);
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            max-width: 240px;
            height: auto;
            overflow: hidden;
            border-radius: 14px;
        }

        #image-container-1 img,
        #image-container-2 img {
            max-width: 100%;
            max-height: 300px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* =========================================
           OPTIONS (3 stacked in one column)
           For a row instead: grid-template-columns: repeat(3, 1fr);
           grid-template-rows: 1fr;
        ========================================= */
        #options-container {
            border-color: var(--border);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: repeat(3, minmax(0, 1fr));
            justify-content: center;
            align-items: stretch;
            width: 300px;
            max-width: 100%;
            padding: 0;
            gap: 12px;
        }

        .option-card {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #7931b4;
            color: #fff;
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 22px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.3;
            white-space: normal;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease,
                        box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .option-card:hover {
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        .option-card.correct-option {
            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
            opacity: 1 !important;
            cursor: default !important;
        }

        .option-card.wrong-option {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
            color: #ef4444;
            animation: shake 0.4s ease;
        }

        .option-card.disabled-option {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .option-card.disabled-option:not(.wrong-option) { transform: none !important; }
        .option-card.wrong-option.disabled-option { opacity: 1; }

        .option-card.peek {
            border-color: var(--correct);
            background: #10b981;
            color: var(--correct);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        /* =========================================
           HELP / NEXT / DONE BUTTON
        ========================================= */
        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #fff;
            --w: 1px;
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* The icon stays still on hover / focus / press */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }
    </style>
    
</head>

<body>

    <h1 id="game-title">Maggiore o Minore</h1>

    <div id="game-stats">
        <span>Round: <strong id="progress-value">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Osserva il numero e scegli il suo numero amico.</h3>

    <!-- HELP / NEXT / DONE BUTTON (single button) -->
    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Clicca qui per avere un aiuto!</span>
        </button>
    </div>

    <div id="game-area">
        <div id="image-container-1" class="card-container"></div>
        <div id="image-container-2" class="card-container"></div>
        <div id="options-container" class="card-container"></div>
    </div>

    <h1 id="progress-title">Progresso</h1>
    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        /* ---------- CONFIG ---------- */
        const OPTIONS_COUNT = 3;                  // 1 correct + (OPTIONS_COUNT - 1) wrong
        const ALLOWED_ROUNDS = [5, 10, 15, 20, 30];

        const BUTTON_STATES = {
            help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check',       text: 'Fatto!' }
        };

        /* ---------- ELEMENTS ---------- */
        const $ = (id) => document.getElementById(id);

        const progressValueEl   = $('progress-value');
        const timeValueEl       = $('time-value');
        const movesValueEl      = $('moves-value');
        const revealsValueEl    = $('reveals-value');
        const progressBarFill   = $('progress-bar-fill');
        const instructionBanner = $('instruction-banner');
        const gameStats         = $('game-stats');
        const gameArea          = $('game-area');
        const actionControls    = $('action-controls');
        const progressContainer = document.querySelector('.progress-bar-container');
        const optionsContainer  = $('options-container');
        const imageContainers   = [$('image-container-1'), $('image-container-2')];
        const summaryScreen     = $('summary-screen');
        const summaryTbody      = $('summary-tbody');
        const summaryTotals     = $('summary-totals');

        // The single help / next / done button
        const revealBtn = $('reveal-btn');
        const btnIcon   = $('btn-icon');
        const btnText   = revealBtn.querySelector('.btn-text');

        /* ---------- STATE ---------- */
        let ROUNDS = [];
        let currentRoundIndex = 0;
        let currentRound = null;
        let roundResults = [];
        let roundCompleted = false;
        let isPeeking = false;
        let optionElements = [];
        let imageLoadToken = 0;

        let elapsedSeconds = 0;
        let moveCount = 0;
        let revealCount = 0;
        let elapsedTimerInterval = null;

        let buttonMode = 'help';   // 'help' | 'next' | 'done'

        /* ---------- TIMER / COUNTERS ---------- */
        function updateTimerDisplay()   { timeValueEl.textContent = elapsedSeconds + 's'; }
        function updateMovesDisplay()   { movesValueEl.textContent = moveCount; }
        function updateRevealsDisplay() { revealsValueEl.textContent = revealCount; }

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        /* ---------- BUTTON ---------- */
        function setButtonMode(mode) {
            buttonMode = mode;
            const state = BUTTON_STATES[mode];
            btnIcon.classList.remove(...Object.values(BUTTON_STATES).map(s => s.icon));
            btnIcon.classList.add(state.icon);
            btnText.textContent = state.text;
        }

        // Hold-to-peek: only in "help" mode
        function showPeek() {
            if (buttonMode !== 'help' || roundCompleted || isPeeking || revealBtn.disabled) return;
            isPeeking = true;
            revealCount++;
            updateRevealsDisplay();
            const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
            if (correctEl) correctEl.classList.add('peek');
        }

        function hidePeek() {
            if (!isPeeking) return;
            isPeeking = false;
            optionElements.forEach(el => el.classList.remove('peek'));
        }

        // Click: only in "next" or "done" mode
        function goNext() {
            if (currentRoundIndex === ROUNDS.length - 1) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
            } else {
                currentRoundIndex++;
                loadRound(currentRoundIndex);
            }
        }

        revealBtn.addEventListener('click', () => {
            if (buttonMode === 'next' || buttonMode === 'done') goNext();
        });

        revealBtn.addEventListener('mousedown', showPeek);
        revealBtn.addEventListener('touchstart', (e) => {
            if (buttonMode !== 'help') return;   // let the tap become a normal click
            e.preventDefault();
            showPeek();
        }, { passive: false });

        revealBtn.addEventListener('mouseup', hidePeek);
        revealBtn.addEventListener('mouseleave', hidePeek);
        revealBtn.addEventListener('touchend', hidePeek);
        revealBtn.addEventListener('touchcancel', hidePeek);

        /* ---------- HELPERS ---------- */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function preloadImages(round) {
            [round.img1, round.img2].filter(Boolean).forEach(url => {
                const img = new Image();
                img.src = url;
            });
        }

        /* ---------- ROUND ---------- */
        function loadRound(index) {
            if (index >= ROUNDS.length) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
                return;
            }

            progressBarFill.style.width = (index / ROUNDS.length) * 100 + '%';

            currentRound = ROUNDS[index];
            roundCompleted = false;
            moveCount = 0;
            revealCount = 0;
            optionElements = [];

            preloadImages(currentRound);

            progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            setButtonMode('help');
            revealBtn.disabled = false;

            loadImages();
            buildOptions();
        }

        function loadImages() {
            const loadToken = ++imageLoadToken;
            const round = currentRound;
            const hasOldImages = imageContainers[0].querySelector('img');

            const swapImages = () => {
                if (loadToken !== imageLoadToken) return;

                imageContainers.forEach((container, i) => {
                    // keep the old size while the new image loads (avoids layout jumps)
                    if (container.offsetHeight) container.style.minHeight = container.offsetHeight + 'px';
                    if (container.offsetWidth)  container.style.minWidth  = container.offsetWidth + 'px';

                    const newImg = new Image();
                    newImg.alt = round.label;

                    const show = () => {
                        if (loadToken !== imageLoadToken) return;
                        container.replaceChildren(newImg);
                        newImg.getBoundingClientRect();   // force reflow so the fade-in runs
                        newImg.style.opacity = '1';
                        container.style.minHeight = '';
                        container.style.minWidth = '';
                    };

                    newImg.onload = show;
                    newImg.onerror = show;
                    newImg.src = i === 0 ? round.img1 : round.img2;
                });
            };

            if (hasOldImages) {
                imageContainers.forEach(c => {
                    const img = c.querySelector('img');
                    if (img) img.style.opacity = '0';
                });
                setTimeout(swapImages, 350);
            } else {
                swapImages();
            }
        }

        function buildOptions() {
            optionsContainer.innerHTML = '';

            const correctIdx = currentRound.correctIndex;
            const incorrectIndices = currentRound.options
                .map((_, i) => i)
                .filter(i => i !== correctIdx);

            const picked = shuffleArray(incorrectIndices).slice(0, OPTIONS_COUNT - 1);
            const order = shuffleArray([correctIdx, ...picked]);

            order.forEach((originalIdx) => {
                const optionEl = document.createElement('button');
                optionEl.classList.add('option-card');
                optionEl.textContent = currentRound.options[originalIdx];
                optionEl.dataset.isCorrect = (originalIdx === correctIdx) ? 'true' : 'false';
                optionEl.addEventListener('click', () => handleOptionClick(optionEl));

                optionsContainer.appendChild(optionEl);
                optionElements.push(optionEl);
            });
        }

        /* ---------- ANSWER ---------- */
        async function handleOptionClick(optionEl) {
            if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

            // WRONG ANSWER
            if (optionEl.dataset.isCorrect !== 'true') {
                moveCount++;
                updateMovesDisplay();
                optionEl.classList.add('wrong-option');
                optionEl.addEventListener('animationend', () => {
                    optionEl.classList.remove('wrong-option');
                }, { once: true });
                return;
            }

            // CORRECT ANSWER
            roundCompleted = true;
            revealBtn.disabled = true;   // block clicks while animations run
            stopElapsedTimer();
            hidePeek();

            moveCount++;
            updateMovesDisplay();

            optionEl.classList.add('correct-option');
            optionElements.forEach(el => {
                el.classList.remove('peek');
                if (el !== optionEl) el.classList.add('disabled-option');
            });

            if (typeof Checkmark !== 'undefined') {
                try {
                    await Checkmark.show({ element: optionEl, size: 48, rise: 70, duration: 1600 });
                } catch (err) {
                    console.warn('Checkmark animation failed:', err);
                }
            }

            progressBarFill.style.width = ((currentRoundIndex + 1) / ROUNDS.length) * 100 + '%';

            const wrongAttempts = moveCount - 1;
            roundResults.push({
                label: currentRound.label,
                time: elapsedSeconds + 's',
                moves: moveCount,
                reveals: revealCount,
                metric: Math.max(0, 100 - wrongAttempts * 20 - revealCount * 20)
            });

            const isLastRound = currentRoundIndex === ROUNDS.length - 1;

            if (isLastRound && typeof Confetti !== 'undefined') {
                try {
                    await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60,  spread: 60, count: 90 });
                    await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                    await Confetti.burst({ origin: { x: 0.5,  y: 0.5 }, angle: 90,  spread: 60, count: 90 });
                } catch (err) {
                    console.warn('Confetti animation failed:', err);
                }
            }

            setButtonMode(isLastRound ? 'done' : 'next');
            revealBtn.disabled = false;
        }

        /* ---------- SUMMARY ---------- */
        function showSummaryScreen() {
            stopElapsedTimer();
            gameArea.style.display = 'none';
            instructionBanner.style.display = 'none';
            gameStats.style.display = 'none';
            progressContainer.style.display = 'none';
            actionControls.style.display = 'none';

            summaryTbody.innerHTML = '';
            let totalMetric = 0;

            roundResults.forEach(res => {
                totalMetric += res.metric;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${res.label}</strong></td>
                    <td>${res.time}</td>
                    <td>${res.moves}</td>
                    <td>${res.reveals}</td>
                    <td><strong>${res.metric.toFixed(2)}</strong></td>`;
                summaryTbody.appendChild(row);
            });

            const averageMetric = roundResults.length ? totalMetric / roundResults.length : 0;
            const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

            summaryTotals.innerHTML = `
                <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>`;
            summaryScreen.style.display = 'block';
        }

        /* ---------- INIT ---------- */
        async function initGame(roundsCount = 5) {
            try {
                const response = await fetch('maggiore-o-minore.json');
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();

                const sortedRounds = data.rounds.sort((a, b) => {
                    const numA = parseInt((a.label.match(/\d+/) || [0])[0], 10);
                    const numB = parseInt((b.label.match(/\d+/) || [0])[0], 10);
                    return numA - numB;
                });

                // Use the requested number if allowed, otherwise all rounds
                const count = ALLOWED_ROUNDS.includes(roundsCount) ? roundsCount : sortedRounds.length;
                ROUNDS = shuffleArray(sortedRounds).slice(0, count);

                document.body.classList.add('loaded');
            } catch (err) {
                console.error('Could not load JSON file:', err);
            }
            loadRound(currentRoundIndex);
        }

        initGame();
    });
    </script>

</body>
</html>
