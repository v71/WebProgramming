<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrispondenza quantità numero</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <link href="../stylesheet.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        /* =========================================
            GAME AREA
        ========================================= */

        #game-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 0px;
            margin-bottom: 15px;
            padding: 24px;
            border-radius: 20px;
            background: var(--game-area-background);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

    </style>

    <style>
        
        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none !important;
            transform: none !important;
        }

        #image-container {
            border: 2px solid #000000;
            background-color: #ffffff;
            padding: 0px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            height: auto;
            overflow: hidden;
            border-radius: 14px;
        }

        #image-container img {
            max-width: 100%;
            max-height: 400px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* OPTIONS CONTAINER GRID: 2 COLUMNS, 5 ROWS */
        #options-container {
            border-color: var(--border);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, auto);
            justify-content: center;
            align-items: stretch;
            width: 480px;
            padding: 0px;
            gap: 10px;
        }

        .option-card {
            flex-shrink: 0;
            width: 100%;
            min-height: 65px;
            background: #7931b4;
            color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 10px;
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            /* Ottimizzazioni per prevenire il reflow e rendere fluido il passaggio */
            contain: layout style;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        /* Stile per l'immagine bitmap all'interno del pulsante opzione con dimensioni fisse/vincolate per evitare il salto */
        .option-card img {
            width: auto;
            height: 52px;
            max-width: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            /* Forza il browser a mantenere lo spazio bitmap allocato */
            flex-shrink: 0;
        }

        .option-card:hover {
            /*
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            */
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        .option-card.correct-option:hover {
            background: var(--accent);
            transform: none !important;
            border-color: #000000;
        }

        .option-card.correct-option {
            /*
            border-color: #000000;
            background: var(--accent);
            cursor: default;
            transform: none !important;
            box-shadow: var(--shadow-sm);
            */
            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
            opacity: 1 !important;
            cursor: default !important;
        }

        .option-card.wrong-option {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
            animation: shake 0.4s ease;
        }

        .option-card.disabled-option {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .option-card.disabled-option:not(.wrong-option) {
            transform: none !important;
        }

        .option-card.wrong-option.disabled-option {
            opacity: 1;
        }

       .option-card.peek {
            border-color: var(--correct);
            background: #10b981;
        }

    </style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Corrispondenza quantità numero
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="progress-value">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <h3 id="instruction-banner" class="stats-style">Osserva l'immagine e scegli, tra le opzioni, quella giusta.</h3>

    <!-- HELP BUTTON -->
    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- GAME AREA -->
    <div id="game-area">
        <div id="image-container" class="card-container"></div>
        <div id="options-container" class="card-container"></div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>
    <div class="progress-bar-container">
        <div
            id="progress-bar-fill"
            class="progress-bar-fill"
            style="width: 0%;">
        </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

    <!-- LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameArea = document.getElementById('game-area');
            const progressValueEl = document.getElementById('progress-value');
            const timeValueEl = document.getElementById('time-value');
            const movesValueEl = document.getElementById('moves-value');
            const revealsValueEl = document.getElementById('reveals-value');
            const revealBtn = document.getElementById('reveal-btn');
            const progressBarFill = document.getElementById('progress-bar-fill');
            const instructionBanner = document.getElementById('instruction-banner');
            const gameTitle = document.getElementById('game-title');
            const gameStats = document.getElementById('game-stats');
            const actionControls = document.getElementById('action-controls');
            const progressTitle = document.getElementById('progress-title');
            const progressContainer = document.querySelector('.progress-bar-container');

            let elapsedSeconds = 0;
            let moveCount = 0;
            let revealCount = 0;
            let elapsedTimerInterval = null;

            const imageContainer = document.getElementById('image-container');
            const optionsContainer = document.getElementById('options-container');
            const summaryScreen = document.getElementById('summary-screen');
            const summaryTbody = document.getElementById('summary-tbody');
            const summaryTotals = document.getElementById('summary-totals');

            let ROUNDS = [];
            let currentRoundIndex = 0;
            let roundResults = [];
            let roundCompleted = false;
            let isPeeking = false;
            let optionElements = [];
            let currentRound = null;
            let imageLoadToken = 0;
            let isGameLoading = true;
            let buttonMode = 'help'; // 'help' | 'next' | 'done'

            function startElapsedTimer() {
                stopElapsedTimer();
                elapsedSeconds = 0;
                updateTimerDisplay();
                elapsedTimerInterval = setInterval(() => {
                    elapsedSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }

            function stopElapsedTimer() {
                if (elapsedTimerInterval) {
                    clearInterval(elapsedTimerInterval);
                    elapsedTimerInterval = null;
                }
            }

            function updateTimerDisplay() {
                timeValueEl.textContent = elapsedSeconds + 's';
            }

            function updateMovesDisplay() {
                movesValueEl.textContent = moveCount;
            }

            function updateRevealsDisplay() {
                revealsValueEl.textContent = revealCount;
            }

            function shuffleArray(array) {
                let arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function preloadImages(round) {
                const urlsToPreload = [];
                if (round.img) urlsToPreload.push(round.img);
                if (round.options) urlsToPreload.push(...round.options);

                urlsToPreload.forEach(url => {
                    const img = new Image();
                    img.src = url;
                });
            }

            // help = in gioco, next = round completato, done = ultimo round completato
            function setButtonMode(mode) {
                buttonMode = mode;
                const labels = {
                    help: '💡 Help!',
                    next: '▶ Prossimo round',
                    done: '✓ Fatto'
                };
                const textEl = revealBtn.querySelector('span');
                if (textEl) textEl.textContent = labels[mode];
            }

            function loadRound(index) {
                if (index >= ROUNDS.length) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                    return;
                }
            
                const progressRatio = (index / ROUNDS.length) * 100;
                progressBarFill.style.width = progressRatio + '%';
                
                currentRound = ROUNDS[index];
                roundCompleted = false;
                moveCount = 0;
                revealCount = 0;
                optionElements = [];
                
                preloadImages(currentRound);

                progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
                updateMovesDisplay();
                updateRevealsDisplay();
                startElapsedTimer();
                
                setButtonMode('help');
                revealBtn.disabled = false;

                const existingImg = imageContainer.querySelector('img');
                const loadToken = ++imageLoadToken;
                const roundForImage = currentRound;
                
                const updateImageSource = () => {
                    if (loadToken !== imageLoadToken) return;

                    const h = imageContainer.offsetHeight;
                    const w = imageContainer.offsetWidth;
                    if (h) imageContainer.style.minHeight = h + 'px';
                    if (w) imageContainer.style.minWidth = w + 'px';

                    const newImg = new Image();
                    newImg.alt = roundForImage.label;

                    const show = () => {
                        if (loadToken !== imageLoadToken) return;
                        imageContainer.replaceChildren(newImg);
                        newImg.getBoundingClientRect();
                        newImg.style.opacity = '1';
                        imageContainer.style.minHeight = '';
                        imageContainer.style.minWidth = '';
                    };

                    newImg.onload = show;
                    newImg.onerror = show;
                    newImg.src = roundForImage.img;
                };

                if (existingImg) {
                    existingImg.style.opacity = '0';
                    setTimeout(updateImageSource, 350);
                } else {
                    updateImageSource();
                }

                // POPOLA I TASTI CON IMMAGINI BITMAP ED EVENTUALE HOVER DAL JSON 
                optionsContainer.innerHTML = '';

                const correctIdx = currentRound.correctIndex;
                const incorrectIndices = [];
                for (let i = 0; i < currentRound.options.length; i++) {
                    if (i !== correctIdx) {
                        incorrectIndices.push(i);
                    }
                }

                const maxIncorrectToPick = Math.min(incorrectIndices.length, 9);
                const selectedIncorrect = shuffleArray(incorrectIndices).slice(0, maxIncorrectToPick);
                const order = shuffleArray([correctIdx, ...selectedIncorrect]);

                order.forEach((originalIdx) => {
                    const optionEl = document.createElement('button');
                    optionEl.classList.add('option-card');
                    
                    const imgEl = document.createElement('img');
                    const defaultImgSrc = currentRound.options[originalIdx];
                    imgEl.src = defaultImgSrc;
                    imgEl.alt = "Opzione";
                    optionEl.appendChild(imgEl);

                    optionEl.dataset.isCorrect = (originalIdx === currentRound.correctIndex) ? 'true' : 'false';
                    optionEl.addEventListener('click', () => handleOptionClick(optionEl, imgEl, defaultImgSrc));

                    optionsContainer.appendChild(optionEl);
                    optionElements.push(optionEl);
                });
            }
            /*
            async function handleOptionClick(optionEl, imgEl, defaultImgSrc) {
                if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

                if (optionEl.dataset.isCorrect === 'true') {
                    roundCompleted = true;
                    stopElapsedTimer();

                    moveCount++;
                    updateMovesDisplay();

                    imgEl.src = defaultImgSrc;

                    optionEl.classList.add('correct-option');
                    optionElements.forEach(el => {
                        el.classList.remove('peek');
                        if (el !== optionEl) el.classList.add('disabled-option');
                    });

                    if (typeof Checkmark !== 'undefined') {
                        try {
                            await Checkmark.show({
                                element: optionEl,
                                size: 48,
                                rise: 70,
                                duration: 1600
                            });
                        } catch (err) {
                            console.warn('Checkmark animation failed:', err);
                        }
                    }

                    progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                    const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                    roundResults.push({
                        label: currentRound.label,
                        time: elapsedSeconds + 's',
                        moves: moveCount,
                        reveals: revealCount,
                        metric: metricValue
                    });

                    if (currentRoundIndex === ROUNDS.length - 1) {
                        nextBtn.textContent = "✓ Fatto";

                        if (typeof Confetti !== 'undefined') {
                            try {
                                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                            } catch (err) {
                                console.warn('Confetti animation failed:', err);
                            }
                        }

                    } else {
                        nextBtn.textContent = "▶ Prossima immagine";
                    }

                    revealBtn.classList.add('smooth-hidden');
                    nextBtn.classList.remove('smooth-hidden');

                } else {
                    moveCount++;
                    updateMovesDisplay();
                    optionEl.classList.add('wrong-option');
                    optionEl.addEventListener('animationend', () => {
                        optionEl.classList.remove('wrong-option');
                    }, { once: true });
                }
            }

            nextBtn.addEventListener('click', () => {
                if (currentRoundIndex === ROUNDS.length - 1) {
                    progressBarFill.style.width = '100%';
                    showSummaryScreen();
                } else {
                    currentRoundIndex++;
                    loadRound(currentRoundIndex);
                }
            });
            */

            async function handleOptionClick(optionEl, imgEl, defaultImgSrc) {
                if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

                if (optionEl.dataset.isCorrect === 'true') {
                    roundCompleted = true;
                    stopElapsedTimer();
                    hidePeek();

                    moveCount++;
                    updateMovesDisplay();

                    imgEl.src = defaultImgSrc;

                    optionEl.classList.add('correct-option');
                    optionElements.forEach(el => {
                        el.classList.remove('peek');
                        if (el !== optionEl) el.classList.add('disabled-option');
                    });

                    // Prima tutto lo stato (barra, risultati, pulsante), poi le animazioni
                    const isLastRound = currentRoundIndex === ROUNDS.length - 1;

                    progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                    const wrongAttempts = moveCount - 1;
                    const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                    roundResults.push({
                        label: currentRound.label,
                        time: elapsedSeconds + 's',
                        moves: moveCount,
                        reveals: revealCount,
                        metric: metricValue
                    });

                    setButtonMode(isLastRound ? 'done' : 'next');

                    // Animazioni (non bloccano lo stato di gioco)
                    if (typeof Checkmark !== 'undefined') {
                        try {
                            await Checkmark.show({ element: optionEl, size: 48, rise: 70, duration: 1600 });
                        } catch (err) {
                            console.warn('Checkmark animation failed:', err);
                        }
                    }

                    if (isLastRound && typeof Confetti !== 'undefined') {
                        try {
                            await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                            await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                            await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                        } catch (err) {
                            console.warn('Confetti animation failed:', err);
                        }
                    }

                } else {
                    moveCount++;
                    updateMovesDisplay();
                    optionEl.classList.add('wrong-option');
                    optionEl.addEventListener('animationend', () => {
                        optionEl.classList.remove('wrong-option');
                    }, { once: true });
                }

                // A round completato il tasto porta al round successivo, o al riepilogo se era l'ultimo
                revealBtn.addEventListener('click', () => {
                    if (buttonMode === 'next') {
                        currentRoundIndex++;
                        loadRound(currentRoundIndex);
                    } else if (buttonMode === 'done') {
                        progressBarFill.style.width = '100%';
                        showSummaryScreen();
                    }
                });
            }

            function showSummaryScreen() {
                gameArea.style.display = 'none';
                instructionBanner.style.display = 'none';
                document.getElementById('game-stats').style.display = 'none';
                document.querySelector('.progress-bar-container').style.display = 'none';
                actionControls.style.display = 'none';
                summaryTbody.innerHTML = '';
                let totalMetric = 0;

                roundResults.forEach(res => {
                    totalMetric += res.metric;
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                    summaryTbody.appendChild(row);
                });

                const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
                const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

                summaryTotals.innerHTML = `
                    <div>Media: <strong>${averageMetric.toFixed(2)}</strong></div>
                    <div>Punteggio: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
                `;
                summaryScreen.style.display = 'block';
            }

            function showPeek() {
                if (roundCompleted || isPeeking || revealBtn.disabled) return;
                isPeeking = true;
                revealCount++;
                updateRevealsDisplay();
                const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
                if (correctEl) correctEl.classList.add('peek');
            }

            function hidePeek() {
                if (!isPeeking) return;
                isPeeking = false;
                optionElements.forEach(el => el.classList.remove('peek'));
            }

            async function initGame() {
                try {
                    isGameLoading = true;
                    stopElapsedTimer();

                    const response = await fetch('corrispondenza-quantità-numero.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error: ${response.status}`);
                    }
                    const data = await response.json();
                    
                    const sortedRounds = data.rounds.sort((a, b) => {
                        const numA = parseInt((a.label.match(/\d+/) || [0])[0], 10);
                        const numB = parseInt((b.label.match(/\d+/) || [0])[0], 10);
                        return numA - numB;
                    });

                    ROUNDS = shuffleArray(sortedRounds);

                    document.body.classList.add('loaded');
                    isGameLoading = false;
                } catch (err) {
                    console.error('Could not load JSON file:', err);
                }
               loadRound(currentRoundIndex);
               document.body.classList.add('loaded');
            }
            
            revealBtn.addEventListener('mousedown', showPeek);
            revealBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                showPeek();
            }, { passive: false });

            revealBtn.addEventListener('mouseup', hidePeek);
            revealBtn.addEventListener('mouseleave', hidePeek);
            revealBtn.addEventListener('touchend', hidePeek);
            revealBtn.addEventListener('touchcancel', hidePeek);

            initGame();
        });
    </script>

</body>
</html>
