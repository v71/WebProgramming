<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Indovina in Numero Amico</title>
    
<style>
        :root {
            --bg-0: #e6e6e6;
            --bg-1: #ffffff;
            --bg-2: #f1f5f9;
            --accent: #6366f1;
            --accent-2: #06b6d4;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
        }

        .controls {
            margin-top: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 1050px;
            position: relative;
            min-height: 48px;
        }
/*
        #puzzle-workspace {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 28px;
            width: 100%;
            max-width: 1050px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
*/
        #puzzle-workspace {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch; /* <--- Changed from center to stretch */
            gap: 28px;
            width: 100%;
            max-width: 1050px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .progress-bar-container {
            width: 100%;
            max-width: 1050px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 10px;
            border-radius: 99px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-container {
            display: flex;
            background-color: var(--bg-1);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            box-sizing: border-box;
        }

        /* Main Target Image: Enlarged size */
        /*
        #image-container {
            border: 2px solid #a5b4fc;
            padding: 8px; 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            max-width: 450px; 
            max-height: 450px;
            overflow: hidden;
            flex-shrink: 0;
        }
        */

        #image-container {
            border: 2px solid #a5b4fc;
            padding: 8px;
            display: flex; /* Changed from inline-flex to flex so height: 100% works */
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            flex: 1; /* Allows it to grow and match the height of the options column */
            max-width: 450px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
        }

        /* Options Container: Stacked vertically, larger layout */
        /*
        #options-container {
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
            width: 360px;
            padding: 14px;
            gap: 10px;
        }
        */

        #options-container {
            flex-direction: column;
            justify-content: center;
            align-items: center; /* Centers the option cards nicely */
            width: auto; /* Hugs the content instead of forcing 360px */
            padding: 12px;
            gap: 10px;
        }

        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Dedicated style for option image cards */
        .option-img-card {
            flex-shrink: 0;
            width: auto; /* Shrinks horizontally to fit the image */
            height: auto; /* Shrinks vertically to fit the image */
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 2px solid var(--border);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px; /* Leaves a gap of just a few pixels around the image */
            cursor: pointer;
            user-select: none;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .option-img-card img {
            max-width: 140px;  /* Limits the max width so they don't get too large */
            max-height: 90px;  /* Limits the max height */
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }

        .option-img-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .option-img-card.correct-option {
            border-color: var(--correct);
            background: rgba(16, 185, 129, 0.1);
            cursor: default;
            transform: none !important;
        }

        .option-img-card.wrong-option {
            border-color: var(--wrong);
            background: rgba(239, 68, 68, 0.05);
            animation: shake 0.4s ease;
        }

        .option-img-card.disabled-option {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            transform: none !important;
        }

        .option-img-card.peek {
            border-color: var(--correct);
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        #game-stats, .stats-style {
            margin: 0 0 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 8px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 1.8rem;
        }

        .summary-table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 1rem;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .summary-totals {
            margin-top: 18px;
            padding: 14px;
            background: var(--bg-2);
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }

        button:hover { filter: brightness(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none !important; transform: none !important; }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        #reveal-btn { min-width: 160px; min-height: 44px; }
        .cool-btn.smooth-hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(0.95); position: absolute; }
        .cool-btn:hover { transform: translateY(-2px); background-color: #4f46e5; }
        
        #next-btn { background-color: var(--correct); min-width: 200px; min-height: 44px; }
        #next-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <h1 id="game-title">Trova l'Amico del Numero</h1>

    <div id="game-stats">
        <span>Round: <strong id="progress-value">...</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Tentativi: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <h3 id="instruction-banner" class="stats-style">Osserva il numero principale e trova l'immagine corrispondente sulla destra!</h3>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden"><span>Caricamento...</span></button>
        <button id="reveal-btn" class="cool-btn"><span>💡 Help!</span></button>
    </div>

    <div id="puzzle-workspace">
        <div id="image-container" class="card-container"></div>
        <div id="options-container" class="card-container"></div>
    </div>

    <h1>Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>
    
    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Tempo</th>
                    <th>Tentativi</th>
                    <th>Aiuti</th>
                    <th>Punteggio</th>
                </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
    </div>

    <script>
        let ROUNDS = [];
        let currentRoundIndex = 0;
        let roundResults = [];

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const imageContainer = document.getElementById('image-container');
        const optionsContainer = document.getElementById('options-container');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const puzzleWorkspace = document.getElementById('puzzle-workspace');
        const actionControls = document.getElementById('action-controls');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');
        const instructionBanner = document.getElementById('instruction-banner');

        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let roundCompleted = false;
        let isPeeking = false;
        let optionElements = [];
        let currentRound = null;

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() { timeValueEl.textContent = elapsedSeconds + 's'; }
        function updateMovesDisplay() { movesValueEl.textContent = moveCount; }
        function updateRevealsDisplay() { revealsValueEl.textContent = revealCount; }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadRound(index) {
            if (index >= ROUNDS.length) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
                return;
            }

            const progressRatio = (index / ROUNDS.length) * 100;
            progressBarFill.style.width = progressRatio + '%';

            currentRound = ROUNDS[index];
            roundCompleted = false;
            moveCount = 0;
            revealCount = 0;
            optionElements = [];

            progressValueEl.textContent = `${index + 1} / ${ROUNDS.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.classList.add('smooth-hidden');
            revealBtn.classList.remove('smooth-hidden');
            revealBtn.disabled = false;

            const updateImageSource = () => {
                imageContainer.innerHTML = `<img src="${currentRound.mainImg}" alt="${currentRound.label}">`;
                const newImg = imageContainer.querySelector('img');
                if (newImg) {
                    newImg.getBoundingClientRect();
                    newImg.style.opacity = '1';
                }
            };
            updateImageSource();

            optionsContainer.innerHTML = '';

            const correctIdx = currentRound.correctIndex;
            let incorrectIndices = [];
            for (let i = 0; i < currentRound.options.length; i++) {
                if (i !== correctIdx) incorrectIndices.push(i);
            }
            
            const selectedIncorrect = shuffleArray(incorrectIndices).slice(0, 2);
            const order = shuffleArray([correctIdx, ...selectedIncorrect]);

            order.forEach((originalIdx) => {
                const optionEl = document.createElement('div');
                optionEl.classList.add('option-img-card'); // <--- Updated class here
                optionEl.innerHTML = `<img src="${currentRound.options[originalIdx]}" alt="Option">`;
                optionEl.dataset.isCorrect = (originalIdx === currentRound.correctIndex) ? 'true' : 'false';

                optionEl.addEventListener('click', () => handleOptionClick(optionEl));
                optionsContainer.appendChild(optionEl);
                optionElements.push(optionEl);
            });


        }
        
        function handleOptionClick(optionEl) {
            if (roundCompleted || optionEl.classList.contains('disabled-option')) return;

            if (optionEl.dataset.isCorrect === 'true') {
                roundCompleted = true;
                stopElapsedTimer();

                moveCount++;
                updateMovesDisplay();

                optionElements.forEach(el => {
                    el.classList.remove('wrong-option', 'peek');
                    if (el !== optionEl) el.classList.add('disabled-option');
                });
                optionEl.classList.add('correct-option');

                progressBarFill.style.width = (((currentRoundIndex + 1) / ROUNDS.length) * 100) + '%';

                const wrongAttempts = moveCount - 1; 
                const metricValue = Math.max(0, 100 - (wrongAttempts * 20) - (revealCount * 20));

                roundResults.push({
                    label: currentRound.label,
                    time: elapsedSeconds + 's',
                    moves: moveCount,
                    reveals: revealCount,
                    metric: metricValue
                });

                if (currentRoundIndex === ROUNDS.length - 1) {
                    nextBtn.textContent = "Fatto";
                } else {
                    nextBtn.textContent = "▶ Prossimo";
                }

                revealBtn.classList.add('smooth-hidden');
                nextBtn.classList.remove('smooth-hidden');
            } else {
                moveCount++;
                updateMovesDisplay();
                optionEl.classList.add('wrong-option', 'disabled-option');
                optionEl.addEventListener('animationend', () => {
                    optionEl.classList.remove('wrong-option');
                }, { once: true });
            }
        }
        
        nextBtn.addEventListener('click', () => {
            if (currentRoundIndex === ROUNDS.length - 1) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
            } else {
                currentRoundIndex++;
                loadRound(currentRoundIndex);
            }
        });

        function showSummaryScreen() {
            puzzleWorkspace.style.display = 'none';
            instructionBanner.style.display = 'none';
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            actionControls.style.display = 'none';

            summaryTbody.innerHTML = '';
            let totalMetric = 0;

            roundResults.forEach(res => {
                totalMetric += res.metric;
                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${res.label}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(0)}</strong></td>`;
                summaryTbody.appendChild(row);
            });

            const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
            const normalizedScore = Math.min(Math.max(averageMetric, 0), 100);

            summaryTotals.innerHTML = `
                <div>Media: <strong>${averageMetric.toFixed(1)}</strong></div>
                <div>Punteggio: <strong>${normalizedScore.toFixed(0)} / 100</strong></div>
            `;

            summaryScreen.style.display = 'block';
        }

        function showPeek() {
            if (roundCompleted || isPeeking || revealBtn.disabled) return;
            isPeeking = true;
            revealCount++;
            updateRevealsDisplay();

            const correctEl = optionElements.find(el => el.dataset.isCorrect === 'true');
            if (correctEl) correctEl.classList.add('peek');
        }

        function hidePeek() {
            if (!isPeeking) return;
            isPeeking = false;
            optionElements.forEach(el => el.classList.remove('peek'));
        }

        async function initGame() {
            try {
                const response = await fetch('indovina-numero-set-1.json');
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();
                ROUNDS = shuffleArray(data.rounds);
            } catch (err) {
                console.warn('Could not load JSON file, using fallback mock data for testing:', err);
            }
            loadRound(currentRoundIndex);
        }

        revealBtn.addEventListener('mousedown', showPeek);
        revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showPeek(); }, { passive: false });
        revealBtn.addEventListener('mouseup', hidePeek);
        revealBtn.addEventListener('mouseleave', hidePeek);
        revealBtn.addEventListener('touchend', hidePeek);
        revealBtn.addEventListener('touchcancel', hidePeek);

        initGame();
    </script>
</body>
</html>
