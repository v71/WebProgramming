<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Word Character Card Puzzle</title>
    <style>
        :root {
            --bg-0: #0d0d14;
            --bg-1: #15151f;
            --bg-2: #1c1c29;
            --accent: #7c5cff;
            --accent-2: #4fd1c5;
            --correct: #39d98a;
            --wrong: #ff5c7c;
            --text: #e8e8f0;
            --text-dim: #9494a8;
            --border: #2a2a3a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(79,209,197,0.07), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 24px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #0d0d14;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s ease;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button.secondary-btn {
            background: transparent;
            color: var(--accent-2);
            border: 1px solid var(--border);
        }

        button.secondary-btn:hover {
            filter: none;
            border-color: var(--accent-2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
        }

        .section-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Progress Bar Styles */
        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            width: 0%;
            transition: width 0.4s ease;
        }

        .card-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            width: 100%;
            overflow-x: auto;
            min-height: clamp(120px, 18vh, 200px);
            padding: 20px;
            border-radius: 16px;
            align-items: center;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        #source-container {
            border: 2px dashed var(--border);
            background-color: var(--bg-1);
        }

        #target-container {
            border: 2px dashed var(--accent);
            background-color: var(--bg-1);
        }

        .target-wrapper {
            position: relative;
        }

        #reveal-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 20px;
            border-radius: 16px;
            background-color: var(--bg-1);
            border: 2px solid var(--correct);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            overflow-x: auto;
        }

        #reveal-overlay.visible {
            opacity: 1;
        }

        .card.reveal-letter {
            border-color: var(--correct);
            background-color: rgba(57, 217, 138, 0.15);
            color: var(--correct);
            cursor: default;
            box-shadow: none;
        }

        .card.reveal-letter.space {
            background-color: transparent;
            border-style: dotted;
        }

        .card-container.drag-container-over {
            border-color: var(--accent-2);
            background-color: rgba(79, 209, 197, 0.06);
        }

        .card {
            flex-shrink: 0;
            width: 70px;
            height: 90px;
            background-color: var(--bg-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, transform 0.1s, background-color 0.15s;
            touch-action: none;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .card:active {
            cursor: grabbing;
        }

        .card.space {
            border-style: dotted;
            border-color: var(--border);
            background-color: transparent;
            box-shadow: none;
        }

        .card.dragging {
            opacity: 0.3;
        }

        #status-message {
            margin-top: 4px;
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 600;
            min-height: 22px;
            text-align: center;
        }

        #status-message.correct-text {
            color: var(--correct);
        }

        #game-stats {
            margin: -5px 0 16px;
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        #game-stats strong {
            color: var(--accent-2);
            font-weight: 600;
        }

        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
        }

        .summary-table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .summary-totals {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-2);
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
        }

        .summary-totals strong {
            color: var(--accent-2);
        }
    </style>
</head>
<body>

    <h1 id="game-title">Character Card Puzzle</h1>
    
    <div id="game-stats">
        <span>Word: <strong id="progress-value">1 / 4</strong></span>
        <span>Time: <strong id="time-value">0s</strong></span>
        <span>Moves: <strong id="moves-value">0</strong></span>
        <span>Reveals: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- Visual Progress Bar Element -->
    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>

    <div class="controls" id="action-controls">
        <button id="next-btn" style="display: none;">Next Word</button>
        <button id="reveal-btn" class="secondary-btn">Hold to Reveal Word</button>
    </div>

    <div id="status-message"></div>

    <div id="puzzle-workspace" class="section-wrapper">
        <div class="section-wrapper" style="width:100%; max-width:none; margin-bottom:20px;">
            <div class="section-title">Source List (Randomly Shuffled)</div>
            <div id="source-container" class="card-container"></div>
        </div>

        <div class="section-wrapper" style="width:100%; max-width:none; margin-bottom:0;">
            <div class="section-title">Drop Zone (Target List)</div>
            <div class="target-wrapper">
                <div id="target-container" class="card-container"></div>
                <div id="reveal-overlay" aria-hidden="true"></div>
            </div>
        </div>
    </div>

    <!-- Summary Screen for Memorized Results -->
    <div id="summary-screen">
        <h2>All Puzzles Completed! 🎉</h2>
        <p>Here is your performance report for analysis:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Word</th>
                    <th>Time</th>
                    <th>Moves</th>
                    <th>Reveals</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
                <!-- Populated via JS -->
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
            <!-- Populated via JS -->
        </div>
    </div>

    <script>
        const PUZZLE_WORDS = ["HELLO WORLD", "CODE PUZZLE", "JAVASCRIPT", "UI DESIGN"];
        let currentWordIndex = 0;
        let roundResults = [];

        const nextBtn = document.getElementById('next-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const revealOverlay = document.getElementById('reveal-overlay');
        const sourceContainer = document.getElementById('source-container');
        const targetContainer = document.getElementById('target-container');
        const statusMessage = document.getElementById('status-message');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const progressValueEl = document.getElementById('progress-value');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const puzzleWorkspace = document.getElementById('puzzle-workspace');
        const actionControls = document.getElementById('action-controls');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');

        let originalTextString = "";
        let draggedCard = null;
        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let moveCount = 0;
        let revealCount = 0;
        let wordCompleted = false;
        let isRevealing = false;

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timeValueEl.textContent = elapsedSeconds + 's';
        }

        function updateMovesDisplay() {
            movesValueEl.textContent = moveCount;
        }

        function updateRevealsDisplay() {
            revealsValueEl.textContent = revealCount;
        }

        function registerMove() {
            if (wordCompleted) return;
            moveCount++;
            updateMovesDisplay();
            checkWordAutomatic();
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadWord(index) {
            if (index >= PUZZLE_WORDS.length) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
                return;
            }

            const progressRatio = (index / PUZZLE_WORDS.length) * 100;
            progressBarFill.style.width = progressRatio + '%';

            originalTextString = PUZZLE_WORDS[index];
            sourceContainer.innerHTML = ''; 
            targetContainer.innerHTML = ''; 
            statusMessage.textContent = '';
            statusMessage.className = '';
            wordCompleted = false;
            moveCount = 0;
            revealCount = 0;
            
            progressValueEl.textContent = `${index + 1} / ${PUZZLE_WORDS.length}`;
            updateMovesDisplay();
            updateRevealsDisplay();
            startElapsedTimer();

            nextBtn.style.display = 'none';
            revealBtn.disabled = false;

            const charArray = Array.from(originalTextString);
            const shuffledChars = shuffleArray(charArray);

            shuffledChars.forEach(char => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.char = char;

                if (char === ' ') {
                    card.classList.add('space');
                    card.innerHTML = '&nbsp;';
                } else {
                    card.textContent = char;
                }

                card.setAttribute('draggable', 'true');
                addDragAndDropEvents(card);
                sourceContainer.appendChild(card);
            });
        }

        function addDragAndDropEvents(card) {
            card.addEventListener('dragstart', (e) => {
                draggedCard = card;
                setTimeout(() => card.classList.add('dragging'), 0);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                draggedCard = null;
                document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                document.querySelectorAll('.card-container').forEach(c => c.classList.remove('drag-container-over'));
            });
        }

        [sourceContainer, targetContainer].forEach(container => {
            container.addEventListener('dragover', (e) => e.preventDefault());

            container.addEventListener('dragenter', (e) => {
                e.preventDefault();
                container.classList.add('drag-container-over');
            });

            container.addEventListener('dragleave', (e) => {
                if (e.target === container) {
                    container.classList.remove('drag-container-over');
                }
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                container.classList.remove('drag-container-over');

                if (draggedCard && e.target === container) {
                    container.appendChild(draggedCard);
                    registerMove();
                }
            });
        });

        function attachCardDropZone() {
            document.addEventListener('dragover', (e) => {
                if (e.target.classList && e.target.classList.contains('card')) {
                    e.preventDefault();
                }
            });

            document.addEventListener('drop', (e) => {
                if (e.target.classList && e.target.classList.contains('card') && draggedCard) {
                    e.preventDefault();
                    const targetCard = e.target;
                    const targetParent = targetCard.parentNode;

                    if (draggedCard !== targetCard) {
                        const allCards = [...targetParent.querySelectorAll('.card')];
                        const draggedPos = allCards.indexOf(draggedCard);
                        const targetPos = allCards.indexOf(targetCard);

                        if (draggedPos === -1 || draggedPos < targetPos) {
                            targetParent.insertBefore(draggedCard, targetCard.nextSibling);
                        } else {
                            targetParent.insertBefore(draggedCard, targetCard);
                        }
                        registerMove();
                    }
                }
            });
        }

        attachCardDropZone();

        function checkWordAutomatic() {
            if (wordCompleted) return;

            const targetCards = [...targetContainer.querySelectorAll('.card')];
            const currentString = targetCards.map(card => card.dataset.char).join('');

            if (targetCards.length === originalTextString.length && currentString === originalTextString) {
                wordCompleted = true;
                stopElapsedTimer();
                
                statusMessage.className = 'correct-text';
                statusMessage.textContent = 'Correct! Great job!';

                const effectiveTime = Math.max(elapsedSeconds, 1);
                const metricValue = Number(((moveCount - revealCount) / effectiveTime).toFixed(2));

                roundResults.push({
                    word: originalTextString,
                    time: elapsedSeconds + 's',
                    moves: moveCount,
                    reveals: revealCount,
                    metric: metricValue
                });

                if (currentWordIndex === PUZZLE_WORDS.length - 1) {
                    nextBtn.textContent = "Done";
                } else {
                    nextBtn.textContent = "Next Word";
                }

                nextBtn.style.display = 'inline-block';
                revealBtn.disabled = true;
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentWordIndex === PUZZLE_WORDS.length - 1) {
                progressBarFill.style.width = '100%';
                showSummaryScreen();
            } else {
                currentWordIndex++;
                loadWord(currentWordIndex);
            }
        });

        function showSummaryScreen() {
            puzzleWorkspace.style.display = 'none';
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            actionControls.style.display = 'none';
            statusMessage.style.display = 'none';
            
            summaryTbody.innerHTML = '';
            let totalMetric = 0;

            roundResults.forEach(res => {
                totalMetric += res.metric;
                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${res.word}</strong></td><td>${res.time}</td><td>${res.moves}</td><td>${res.reveals}</td><td><strong>${res.metric.toFixed(2)}</strong></td>`;
                summaryTbody.appendChild(row);
            });

            // Calculate Overall Score (Average of metrics)
            const averageMetric = roundResults.length > 0 ? totalMetric / roundResults.length : 0;
            
            // Normalize value (mapping a typical range like 0 to 5 into a 0 to 100 percentage scale)
            const normalizedScore = Math.min(Math.max((averageMetric / 5) * 100, 0), 100);

            summaryTotals.innerHTML = `
                <div>Average Metric: <strong>${averageMetric.toFixed(2)}</strong></div>
                <div>Normalized Score: <strong>${normalizedScore.toFixed(1)} / 100</strong></div>
            `;

            summaryScreen.style.display = 'block';
        }

        function showReveal() {
            if (wordCompleted || isRevealing) return;
            isRevealing = true;
            
            revealCount++;
            updateRevealsDisplay();

            revealOverlay.innerHTML = '';
            Array.from(originalTextString).forEach((char) => {
                const card = document.createElement('div');
                card.classList.add('card', 'reveal-letter');
                if (char === ' ') {
                    card.classList.add('space');
                    card.innerHTML = '&nbsp;';
                } else {
                    card.textContent = char;
                }
                revealOverlay.appendChild(card);
            });
            revealOverlay.classList.add('visible');
        }

        function hideReveal() {
            if (!isRevealing) return;
            isRevealing = false;
            revealOverlay.classList.remove('visible');
        }

        revealBtn.addEventListener('mousedown', showReveal);
        revealBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showReveal();
        }, { passive: false });

        document.addEventListener('mouseup', hideReveal);
        document.addEventListener('touchend', hideReveal);
        document.addEventListener('touchcancel', hideReveal);

        // Initial Load
        loadWord(currentWordIndex);
    </script>
</body>
</html>
