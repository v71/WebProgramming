<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio regola a metà</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <!-- Main CSS File -->
    <link href="../../css/stylesheet.css" rel="stylesheet">

    <style>

        .button-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            row-gap: 10px;
            column-gap: 44px;
            position: relative;
        }

        /* Vertical divider line between the two columns */
        .button-grid::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--border);
            transform: translateX(-50%);
            pointer-events: none;
        }

        @media (max-width: 700px) { .button-grid { gap: 10px; }
            .grid-button {
                min-height: 60px;
                font-size: 1rem;
            }
        }

    </style>

    <style>

       .grid-button {
            min-height: 40px;
            font-size: 1.2rem;
        }

    </style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Cambio regola a metà
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
        Caricamento...
    </div>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- GAME AREA -->
    <div id="game-area">
        <div class="button-grid" id="button-grid-container">
            <!-- I pulsanti vengono generati dinamicamente per evitare disallineamenti -->
        </div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let buttons = []; 
    let buttonFoundState = [];
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 0; 
    let foundCorrectCount = 0; 
    let isGameCompleted = false;
    let isGameLoading = true;
    let moveCount = 0;
    let revealCount = 0;
    let currentCategoryTitle = '';

    const gameArea = document.getElementById('game-area');
    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const buttonGridContainer = document.getElementById('button-grid-container');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const wordCountEl = document.getElementById('word-count');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const instructionBanner = document.getElementById('instruction-banner');
    const timeValueEl = document.getElementById('time-value');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');

    function showSummaryScreen() {
        gameArea.style.display = 'none';
        instructionBanner.style.display = 'none';
        document.getElementById('game-stats').style.display = 'none';
        document.querySelector('.progress-bar-container').style.display = 'none';
        document.getElementById('progress-title').style.display = 'none';
        document.getElementById('game-title').style.display = 'none';
        actionControls.style.display = 'none';
        
        summaryTbody.innerHTML = '';
        
        const metricValue = Math.max(0, 100 - (moveCount * 2) - elapsedSeconds);

        const row = document.createElement('tr');
        row.innerHTML = `
            <td><strong>${currentCategoryTitle}</strong></td>
            <td>${elapsedSeconds}s</td>
            <td>${moveCount}</td>
            <td>${revealCount}</td>
            <td><strong>${metricValue.toFixed(2)}</strong></td>
        `;
        summaryTbody.appendChild(row);
        
        summaryTotals.innerHTML = `
            <div>Tempo Totale: <strong>${elapsedSeconds}s</strong></div>
            <div>Mosse Totali: <strong>${moveCount}</strong></div>
            <div>Aiuti Totali: <strong>${revealCount}</strong></div>
        `;
        summaryScreen.style.display = 'block';
    }

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) {
            timeValueEl.textContent = elapsedSeconds + 's';
        }
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateWordCountDisplay() {
        if (wordCountEl) {
            wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
        }
    }

    function updateProgressBar(value) {
        if (progressBarFill) {
            progressBarFill.style.width = (Math.min(Math.max(value, 0), 1) * 100) + '%';
        }
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    async function initGame() {
        try {
            isGameLoading = true;
            
            if (revealBtn) {
                revealBtn.innerHTML = "<span>💡 Help</span>";
            }

            const response = await fetch('cambio-di-regola-a-metà.json');
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status}`);
            }

            const data = await response.json();
            if (!data.categories || data.categories.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * data.categories.length);
            const currentCategoryData = data.categories[randomIndex];

            buttons = [...currentCategoryData.buttons];
            currentCategoryTitle = currentCategoryData.instruction; 
            buttonFoundState = new Array(buttons.length).fill(false);
            totalCorrectItems = buttons.filter(b => b.value === 1 || b.value === 2).length;

            // Generazione dinamica della griglia pulsanti per evitare problemi di indicizzazione
            buttonGridContainer.innerHTML = '';
            buttons.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'grid-button';
                btn.dataset.index = index;
                btn.textContent = item.label;
                
                btn.addEventListener('click', async () => {
                    if (isGameCompleted || isGameLoading) return;
                    if (buttonFoundState[index]) return;

                    // Calcolo della colonna basato sull'indice effettivo (0-based) della griglia CSS a 2 colonne
                    const columnNumber = (index % 2) + 1;
                    const itemTargetValue = item.value;
                    const isCorrect = (itemTargetValue === columnNumber);

                    moveCount++;
                    updateMovesDisplay();

                    if (isCorrect) {
                        buttonFoundState[index] = true;
                        btn.disabled = true;
                        btn.classList.add('selected');
                        foundCorrectCount++;

                        updateWordCountDisplay();

                        if (typeof Checkmark !== 'undefined') {
                            try {
                                await Checkmark.show({
                                    element: btn,
                                    size: 48,
                                    rise: 70,
                                    duration: 1600
                                });
                            } catch (err) {
                                console.warn('Checkmark animation failed:', err);
                            }
                        }

                        updateProgressBar(foundCorrectCount / totalCorrectItems);

                        if ((foundCorrectCount === totalCorrectItems) && !isGameCompleted) {
                            isGameCompleted = true;
                            stopElapsedTimer();

                            // 1. Immediately disable all grid buttons so they can't be clicked during confetti
                            const allGridButtons = buttonGridContainer.querySelectorAll('.grid-button');
                            allGridButtons.forEach(b => b.disabled = true);

                            if (typeof Confetti !== 'undefined') {
                                try {
                                    await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                                    await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                                    await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                                } catch (err) {
                                    console.warn('Confetti animation failed:', err);
                                }
                            }

                            if (revealBtn) {
                                revealBtn.innerHTML = "<span>✓ Fatto</span>";
                            }
                        }
                    } else {
                        btn.classList.remove('error');
                        void btn.offsetWidth; 
                        btn.classList.add('error');
                        setTimeout(() => {
                            btn.classList.remove('error');
                        }, 400);
                    }
                });

                buttonGridContainer.appendChild(btn);
            });

            if (instructionBanner) {
                instructionBanner.textContent = currentCategoryTitle;
            }

            isGameCompleted = false;
            isGameLoading = false;
            moveCount = 0;
            revealCount = 0;
            foundCorrectCount = 0;

            updateMovesDisplay();
            updateRevealDisplay();
            updateWordCountDisplay();
            updateProgressBar(0);
            startElapsedTimer();

            document.body.classList.add('loaded');

        } catch (err) {
            isGameLoading = false;
            console.error('Could not load json:', err);
        }
    }

    if (revealBtn) {
        const showHelp = () => {
            if (isGameCompleted || isGameLoading) return;
            revealCount++;
            updateRevealDisplay();
            
            const gridButtons = buttonGridContainer.querySelectorAll('.grid-button');
            gridButtons.forEach(button => {
                const index = Number(button.dataset.index);
                if (buttons[index] && (buttons[index].value === 1 || buttons[index].value === 2)) {
                    button.classList.add('help-correct');
                }
            });
        };

        const hideHelp = () => {
            if (isGameCompleted || isGameLoading) return;
            const gridButtons = buttonGridContainer.querySelectorAll('.grid-button');
            gridButtons.forEach(button => {
                button.classList.remove('help-correct');
            });
        };

        revealBtn.addEventListener('mousedown', showHelp);
        revealBtn.addEventListener('mouseup', hideHelp);
        revealBtn.addEventListener('mouseleave', hideHelp);
        revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showHelp(); }, { passive: false });
        revealBtn.addEventListener('touchend', hideHelp);
        revealBtn.addEventListener('touchcancel', hideHelp);

        revealBtn.addEventListener('click', () => {
            if (isGameCompleted) {
                showSummaryScreen();
            }
        });
    }

    initGame();
});
</script>

</body>
</html>
