<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Riempi i vuoti</title>

     <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <link href="../stylesheet.css" rel="stylesheet">    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>

        :root {
            --card-w: 72px;
            --card-h: 94px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient( circle at 10% 10%, rgba(99, 102, 241, 0.06), transparent 40% ),
                radial-gradient( circle at 90% 90%, rgba(6, 182, 212, 0.06),  transparent 40% ),
                var(--body-background);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
        }

        .dd-wrap {
            width: 100%;
            max-width: 1050px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .dd-tray {
            background: var(--game-area-background);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-height: 64px;
            margin-bottom: 12px;
            flex: 0 0 auto;
        }

        .dd-empty {
            color: var(--text-dim);
            padding: 0 6px;
        }

        .dd-chip {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1;
            background: #7931b4;
            color: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 11px 18px;
            margin: 0;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s ease;
        }

        .dd-chip:hover:not(:disabled) {
            /*
            background: #ffffff;
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-4px);
            */
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;

        }

        .dd-chip.dd-used,
        .dd-chip.dd-used:hover {
            opacity: 0.4;
            cursor: default;
            filter: none;
            transform: none;
            background: #7931b4;
            color: #fff;
        }

        .dd-chip.dd-wrong {
            border-color: #ef4444;
            background: #40285c;
            color: #ef4444;
        }

        .dd-chip:focus-visible {
            outline: 3px solid var(--accent-2);
            outline-offset: 2px;
        }

        .dd-text {
            background: #37275e;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: clamp(14px, 2.5vw, 28px);
            padding-bottom: 20px;
            font-size: 20px;
            line-height: 2.3;
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: auto;
            transition:
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background-color 0.25s ease,
                color 0.25s ease;
        }

        .dd-text.dd-peek-container {
            border-color: #ffffff !important;
            transition: none !important;
        }

        .dd-blank {
            display: inline-block;
            position: relative;
            height: 1.7em;
            margin: 0 2px;
            padding: 0 14px;
            white-space: nowrap;
            text-align: center;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 600;
            line-height: calc(1.7em - 4px);
            color: var(--text);
            background: #553d94;
            border: 2px solid #000000;
            border-radius: 6px;
            vertical-align: middle;
            cursor: default;
            transition:
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background-color 0.25s ease,
                color 0.25s ease;
        }

        .dd-blank.dd-current {
            border-style: solid;
            border-color: #ffffff;
            background: #544b7a;
            border-radius: 6px;
        }

        .dd-blank.dd-error {
            border-color: #ef4444;
            background: #5c2635;
            color: #ff6b6b;
        }

        .dd-text.dd-peeking .dd-blank.dd-current {
            border-color: #ffffff !important;
            background: #10b981 !important;
            transition: none !important;
        }

        .dd-sizer {
            visibility: hidden;
            pointer-events: none;
        }

        .dd-blank.dd-filled {
                /*
            border-style: solid;
            border-color: var(--border);
            background: #5d258a;
            border-radius: 6px;
            color: #ffffff;
            */

            background: var(--grid-btn-selected) !important;
            color: var(--grid-btn-selected-color) !important;
            border-color: var(--grid-btn-selected-border-color) !important;
            transform: none !important;
            box-shadow: var(--shadow-sm) !important;
         
         /* Ombra centrata e simmetrica (0 spostamento orizzontale, 0 verticale) */
         /*   box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.1) !important;*/
            
            opacity: 1 !important;
            cursor: default !important;
        }

        .dd-blank.dd-filled .dd-sizer {
            visibility: visible;
        }

        .dd-text.dd-peeking {
            border-color: #ffffff !important;
            transition: none !important;
        }

        .dd-text.dd-peeking .dd-blank:not(.dd-filled) {
            border-style: solid !important;
            border-color: #ffffff !important;
            background: #10b981 !important;
            color: #ffffff !important;
            transition: none !important;
        }

        .dd-text.dd-peeking .dd-blank:not(.dd-filled) .dd-sizer {
            visibility: visible !important;
        }

        .dd-shake {
            animation: dd-shake 0.12s;
        }

        .dd.disabled {
            opacity: 0.35;
            pointer-events: none;
            cursor: default;
            filter: grayscale(100%);
        }

        @keyframes dd-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .dd-shake { animation: none; }
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        :root {
            --btn-emoji-outline: 0.2px;  /* 0 = nessun contorno, 0.5px = default */
        }

        #reveal-btn .btn-icon,
        #reveal-btn .btn-emoji {
            text-shadow: none !important;
            -webkit-text-stroke: 0 !important;
        }

    </style>

<style>

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */

        #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px; /* spessore del bordo */
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma quando il pulsante è in hover, in focus o premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }

</style>

</head>

<body>

    <h1 id="game-title">
        Il ciclo dell'acqua
    </h1>

    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Tentativi: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong> </span>
    </div>

    <h3 id="instruction-banner" class="stats-style">
        Clicca la parola giusta per lo spazio evidenziato
    </h3>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <span class="btn-text">Help!</span>
        </button>
    </div>

    <div id="game-area">
        <div class="dd-wrap">
            <div
                class="dd-tray"
                id="dd-tray"
                aria-label="Parole da inserire">
            </div>
            <div
                class="dd-text"
                id="dd-text">
            </div>
        </div>
    </div>

    <!-- =========================================================
         FINAL REPORT WINDOW
         ========================================================= -->

    <div id="summary-screen">
        <h2>
            Hai completato tutto! 🎉
        </h2>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Tentativi</th>
                </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div
            class="summary-totals"
            id="summary-totals">
        </div>
    </div>

    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div
            id="progress-bar-fill"
            class="progress-bar-fill">
        </div>
    </div>


<script>

document.addEventListener('DOMContentLoaded', () => {

    const DD_FONT_SCALE = 0.85;
    const SHAKE_MS = 200;
    const SHUFFLE_ROUNDS = true;   // false = round nell'ordine in cui sono scritti

    /* =========================================================
       DOM REFERENCES
       ========================================================= */

    const roundValueEl = document.getElementById('round-value');
    const timeValueEl = document.getElementById('time-value');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const wordCountEl = document.getElementById('word-count');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const revealBtn = document.getElementById('reveal-btn');
    const ddText = document.getElementById('dd-text');
    const ddTray = document.getElementById('dd-tray');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');
    const instructionBanner = document.getElementById('instruction-banner');
    const gameTitle = document.getElementById('game-title');
    const gameStats = document.getElementById('game-stats');
    const actionControls = document.getElementById('action-controls');
    const gameArea = document.getElementById('game-area');
    const progressTitle = document.getElementById('progress-title');
    const progressContainer = document.querySelector('.progress-bar-container');

    const hiddenOnSummary = [
        gameTitle, gameStats, instructionBanner, actionControls,
        gameArea, progressTitle, progressContainer
    ];

    // Stato "selezionato" della parola corretta: verde, anche se il pulsante è disabilitato.
    // (!important perché il pulsante disabilitato di solito viene sbiadito dal CSS della pagina;
    // per cambiare colore basta modificare questi valori)
    (function injectChipStyles() {
        const style = document.createElement('style');
        style.textContent = `
            button.dd-chip.dd-selected,
            button.dd-chip.dd-selected:disabled,
            button.dd-chip.dd-selected:hover {
                background: #10b981 !important;
                border-color: #ffffff !important;
                color: #ffffff !important;
                opacity: 1 !important;
                filter: none !important;
                cursor: default;
            }
        `;
        document.head.prepend(style);
    })();

    /* =========================================================
       GAME STATE
       ========================================================= */

    let rounds = [];           // round giocabili (già validati)
    let roundIndex = 0;        // round corrente
    let results = [];          // risultato di ogni round completato
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let moveCount = 0;
    let revealCount = 0;
    let isPeeking = false;
    let ddPlaced = 0;
    let ddTotal = 0;
    let ddMisses = 0;
    let ddCurrent = null;
    let currentRound = null;
    let roundCompleted = false;
    let finalScore = 0;
    let buttonMode = 'help'; // 'help' | 'next' | 'done'

    /* =========================================================
       GAME DATA
       Le parole da inserire sono tra parentesi graffe nel testo.
       ========================================================= */

    const GAME_ROUNDS = [
        {
            title: "Il ciclo dell'acqua",
            text:
                "L'acqua si muove di continuo intorno al nostro pianeta in un percorso chiamato {ciclo dell'acqua}. " +
                "Il calore del {sole} scalda oceani e laghi e trasforma l'acqua liquida in vapore invisibile: questo processo si chiama {evaporazione}. " +
                "Salendo, il vapore incontra aria più fredda e si trasforma di nuovo in minuscole goccioline che si riuniscono a formare le {nuvole}. " +
                "Questo passaggio si chiama {condensazione}. " +
                "Quando le goccioline diventano troppo pesanti, cadono al suolo come {precipitazioni}, ad esempio pioggia, neve o grandine. " +
                "Una parte dell'acqua scorre sul terreno come {ruscellamento} e confluisce nei fiumi, che la riportano al {mare}, dove il ciclo ricomincia.",

            distractors: [
                "erosione",
                "ghiacciaio"
            ]
        },

        {
            title: "La fotosintesi clorofilliana",
            text:
                "Le piante producono il proprio nutrimento attraverso un processo chiamato {fotosintesi}. " +
                "Le foglie catturano la luce del {sole} grazie alla clorofilla. " +
                "Dalle radici assorbono l'acqua, mentre dall'aria prendono l'anidride {carbonica}. " +
                "Come risultato, rilasciano nell'atmosfera l'ossigeno che tutti noi {respiriamo}.",

            distractors: [
                "azoto",
                "radice"
            ]
        }
    ];

    function setRevealLabel(label) {
        if (!revealBtn) return;

        let textEl = revealBtn.querySelector('.btn-text');
        
        if (!textEl) {
            revealBtn.textContent = '';
            textEl = document.createElement('span');
            textEl.className = 'btn-text';
            revealBtn.appendChild(textEl);
        }

        const parts = String(label).trim().split(/\s+/);
        const hasEmoji = parts.length > 1 && /\p{Extended_Pictographic}/u.test(parts[0]);

        textEl.textContent = '';
        if (hasEmoji) {
            const emojiEl = document.createElement('span');
            emojiEl.className = 'btn-emoji';
            emojiEl.textContent = parts.shift();
            textEl.appendChild(emojiEl);
            textEl.appendChild(document.createTextNode(' ' + parts.join(' ')));
        } else {
            textEl.textContent = parts.join(' ');
        }
    }

    // Trasforma un round in { title, parts, answers, distractors }; null se non è giocabile
    function parseRound(round) {
        if (!round || typeof round.text !== 'string') return null;

        const parts = round.text.split(/(\{[^}]+\})/).map(part => {
            const match = part.match(/^\{(.+)\}$/);
            return match ? { blank: match[1].trim() } : { text: part };
        });

        const answers = parts.filter(p => p.blank !== undefined).map(p => p.blank);
        if (answers.length === 0 || answers.some(a => a === '')) return null;

        const distractors = Array.isArray(round.distractors)
            ? round.distractors.filter(d => typeof d === 'string' && d.trim() !== '').map(d => d.trim())
            : [];

        return { title: round.title || '', parts, answers, distractors };
    }

    /* =========================================================
       TIMER
       ========================================================= */

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        timeValueEl.textContent = elapsedSeconds + 's';
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    /* =========================================================
       STATS
       ========================================================= */

    function updateWordCountDisplay() {
        if (wordCountEl) wordCountEl.textContent = `${ddPlaced} / ${ddTotal}`;
    }

    function updateRoundDisplay() {
        if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${rounds.length}`;
    }

    function updateMovesDisplay() {
        movesValueEl.textContent = moveCount;
    }

    function updateRevealsDisplay() {
        revealsValueEl.textContent = revealCount;
    }

    function addMove() {
        moveCount++;
        updateMovesDisplay();
    }

    function resetStats() {
        moveCount = 0;
        revealCount = 0;
        updateMovesDisplay();
        updateRevealsDisplay();
    }

    function computeScore() {
        const raw = 100 - ddMisses * 5 - revealCount * 10 - Math.floor(elapsedSeconds / 2);
        return Math.max(0, raw);
    }

    /* =========================================================
       UI HELPERS
       ========================================================= */

    function setInstruction(text) {
        instructionBanner.textContent = text;
    }

    // Barra generale: round completati / round totali
    function setOverallProgress(done) {
        const total = rounds.length;
        progressBarFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    // help = in gioco, next = round completato, done = ultimo round completato
    function setButtonMode(mode) {
        buttonMode = mode;
        const labels = {
            help: 'Help!',
            next: '➜ Prossimo round',
            done: '✓ Fatto!'
        };
        setRevealLabel(labels[mode]);
    }

    /* =========================================================
       HELP / PEEK (tieni premuto)
       ========================================================= */

    function showPeek() {
        if (buttonMode !== 'help' || isPeeking || roundCompleted || revealBtn.disabled) return;
        isPeeking = true;
        revealCount++;
        updateRevealsDisplay();
        ddText.classList.add('dd-peeking');
    }

    function hidePeek() {
        if (!isPeeking) return;
        isPeeking = false;
        ddText.classList.remove('dd-peeking');
    }

    /* =========================================================
       DATA HELPERS
       ========================================================= */

    function ddShuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    /* =========================================================
       BUILD CURRENT ROUND
       ========================================================= */

    function ddBuild(round) {
        ddTray.innerHTML = '';
        ddText.innerHTML = '';
        ddPlaced = 0;
        ddMisses = 0;
        ddCurrent = null;
        roundCompleted = false;
        currentRound = round;

        gameTitle.textContent = round.title;

        round.parts.forEach(part => {
            if (part.blank === undefined) {
                ddText.appendChild(document.createTextNode(part.text));
                return;
            }

            const blank = document.createElement('span');
            blank.className = 'dd-blank';
            blank.dataset.answer = part.blank;
            const sizer = document.createElement('span');
            sizer.className = 'dd-sizer';
            sizer.textContent = part.blank;
            blank.appendChild(sizer);
            ddText.appendChild(blank);
        });

        ddTotal = round.answers.length;
        updateWordCountDisplay();

        ddShuffle(round.answers.concat(round.distractors)).forEach(word => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'dd-chip';
            chip.textContent = word;
            chip.dataset.word = word;
            chip.addEventListener('click', () => ddChoose(chip));
            ddTray.appendChild(chip);
        });

        ddNextBlank(false); // al primo caricamento la pagina non deve scorrere
    }

    /* =========================================================
       FIND NEXT EMPTY PLACEHOLDER
       ========================================================= */

    function ddNextBlank(scroll = true) {
        if (ddCurrent) ddCurrent.classList.remove('dd-current');

        ddCurrent = ddText.querySelector('.dd-blank:not(.dd-filled)');

        if (ddCurrent) {
            ddCurrent.classList.add('dd-current');
            if (scroll) ddCurrent.scrollIntoView({ block: 'nearest' });
        }
    }

    /* =========================================================
       ANIMATIONS (non bloccano mai lo stato di gioco)
       ========================================================= */

    function playCheckmark(element) {
        if (typeof Checkmark === 'undefined' || typeof Checkmark.show !== 'function') return;
        try {
            Promise.resolve(Checkmark.show({ element, size: 48, rise: 70, duration: 1600 }))
                .catch(err => console.warn('Checkmark animation failed:', err));
        } catch (err) {
            console.warn('Checkmark animation failed:', err);
        }
    }

    async function playConfetti() {
        if (typeof Confetti === 'undefined') return;
        try {
            await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
            await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
            await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
        } catch (err) {
            console.warn('Confetti animation failed:', err);
        }
    }

    /* =========================================================
       WORD SELECTION
       ========================================================= */

    function ddChoose(chip) {
        if (roundCompleted || !ddCurrent || isPeeking || chip.disabled) return;

        const targetBlank = ddCurrent;
        const isCorrect = chip.dataset.word === targetBlank.dataset.answer;

        addMove();

        // WRONG ANSWER
        if (!isCorrect) {
            ddMisses++;
            targetBlank.classList.remove('dd-shake', 'dd-error');
            targetBlank.classList.add('dd-error');
            void targetBlank.offsetWidth; // riavvia l'animazione
            targetBlank.classList.add('dd-shake');
            setTimeout(() => targetBlank.classList.remove('dd-shake', 'dd-error'), SHAKE_MS);
            return;
        }

        // CORRECT ANSWER: tutto lo stato si aggiorna subito, le animazioni vengono dopo
        targetBlank.classList.add('dd-filled');

        // La parola resta al suo posto in stato "selezionato" (verde) e non è più cliccabile
        chip.classList.add('dd-selected');
        chip.disabled = true;

        ddPlaced++;
        updateWordCountDisplay();

        const completed = ddPlaced === ddTotal;
        if (completed) {
            if (ddCurrent) ddCurrent.classList.remove('dd-current');
            ddCurrent = null;
            ddFinish();
        } else {
            ddNextBlank(); // lo spazio successivo si evidenzia subito
        }

        playCheckmark(targetBlank);

        // Coriandoli solo alla fine del gioco (per averli a ogni round togli "isLastRound")
        const isLastRound = roundIndex >= rounds.length - 1;
        if (completed && isLastRound) playConfetti();
    }

    /* =========================================================
       ROUND FINISH
       ========================================================= */

    function ddFinish() {
        roundCompleted = true;
        stopElapsedTimer();
        hidePeek();

        // Le parole non usate (distrattori) non devono sembrare ancora cliccabili;
        // quelle corrette restano verdi (dd-selected)
        ddTray.querySelectorAll('.dd-chip:not(.dd-selected)').forEach(chip => {
            chip.disabled = true;
            chip.classList.add('dd-disabled');
        });

        finalScore = computeScore();
        results.push({
            title: currentRound && currentRound.title ? currentRound.title : 'Paragrafo',
            seconds: elapsedSeconds,
            moves: moveCount,
            mistakes: ddMisses,
            reveals: revealCount,
            score: finalScore
        });

        const isLastRound = roundIndex >= rounds.length - 1;
        setOverallProgress(roundIndex + 1);   // la barra avanza di un round
        setInstruction(isLastRound
            ? 'Paragrafo completato! Clicca Fatto per vedere il riepilogo.'
            : 'Paragrafo completato! Clicca per passare al prossimo.');
        revealBtn.disabled = false;
        setButtonMode(isLastRound ? 'done' : 'next');
    }

    /* =========================================================
       BUTTON EVENTS
       ========================================================= */

    revealBtn.addEventListener('pointerdown', showPeek);
    revealBtn.addEventListener('pointerup', hidePeek);
    revealBtn.addEventListener('pointerleave', hidePeek);
    revealBtn.addEventListener('pointercancel', hidePeek);
    revealBtn.addEventListener('contextmenu', e => e.preventDefault()); // long-press su mobile

    revealBtn.addEventListener('keydown', (e) => {
        if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) showPeek();
    });
    revealBtn.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.key === 'Enter') hidePeek();
    });
    revealBtn.addEventListener('blur', hidePeek);

    // A round completato il tasto porta al round successivo, o al riepilogo se era l'ultimo
    revealBtn.addEventListener('click', () => {
        if (buttonMode === 'next') loadRound(roundIndex + 1);
        else if (buttonMode === 'done') showSummaryScreen();
    });

    /* =========================================================
       FINAL REPORT
       ========================================================= */

    // Quale valore va sotto una colonna, in base al testo dell'intestazione
    function summaryKeyFor(headerText) {
        const t = headerText.trim().toLowerCase();
        if (/temp/.test(t)) return 'time';
        if (/error/.test(t)) return 'errors';
        if (/mosse|tentativ/.test(t)) return 'moves';
        if (/aiut/.test(t)) return 'hints';
        if (/metric|punteggio|score/.test(t)) return 'score';
        return '';
    }

    function showSummaryScreen() {
        stopElapsedTimer();
        hidePeek();

        // Le righe seguono le colonne dell'intestazione della tabella (nell'HTML): così non si sfasano
        const table = summaryTbody.closest('table');
        const headers = table ? Array.from(table.querySelectorAll('thead th')) : [];
        const keys = headers.length
            ? headers.map((th, i) => (i === 0 ? 'title' : summaryKeyFor(th.textContent)))
            : ['title', 'time', 'moves', 'hints', 'score'];

        summaryTbody.innerHTML = '';
        results.forEach(r => {
            const values = {
                title: r.title,
                time: `${r.seconds}s`,
                moves: String(r.moves),
                errors: String(r.mistakes),
                hints: String(r.reveals),
                score: String(r.score)
            };

            const row = document.createElement('tr');
            keys.forEach((key, i) => {
                const td = document.createElement('td');
                td.textContent = values[key] !== undefined ? values[key] : '';
                if (i === 0 || key === 'score') td.style.fontWeight = '700';
                row.appendChild(td);
            });
            summaryTbody.appendChild(row);
        });

        // Un blocco per ogni dato (come negli altri giochi), non righe separate da <br>
        const sum = key => results.reduce((t, r) => t + r[key], 0);
        summaryTotals.innerHTML = `
            <div>Tempo: <strong>${sum('seconds')}s</strong></div>
            <div>Tentativi: <strong>${sum('moves')}</strong></div>
            <div>Errori: <strong>${sum('mistakes')}</strong></div>
            <div>Aiuti: <strong>${sum('reveals')}</strong></div>
            <div>Punteggio: <strong>${sum('score')}</strong></div>
        `;
        summaryTotals.style.flexWrap = 'wrap';
        summaryTotals.style.gap = '8px 24px';

        hiddenOnSummary.forEach(el => { if (el) el.style.display = 'none'; });
        summaryScreen.style.display = 'block';
    }

    /* =========================================================
       TEXT FITTING
       ========================================================= */

    function ddFitText() {
        if (!ddText.clientHeight) return; // area nascosta: niente da misurare

        let lo = 12;
        let hi = 44;

        while (hi - lo > 0.5) {
            const mid = (lo + hi) / 2;
            ddText.style.fontSize = mid + 'px';
            if (ddText.scrollHeight <= ddText.clientHeight + 1) {
                lo = mid;
            } else {
                hi = mid;
            }
        }

        ddText.style.fontSize = Math.max(12, lo * DD_FONT_SCALE) + 'px';
    }

    let ddResizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(ddResizeTimer);
        ddResizeTimer = setTimeout(ddFitText, 100);
    });

    /* =========================================================
       ROUNDS
       ========================================================= */

    function loadRound(index) {
        roundIndex = index;

        hidePeek();
        resetStats();
        updateRoundDisplay();
        setOverallProgress(roundIndex);   // la barra mostra i round già completati
        setInstruction('Tocca la parola giusta per lo spazio evidenziato');
        setButtonMode('help');
        revealBtn.disabled = false;

        ddBuild(rounds[roundIndex]);

        // Il testo cambia a ogni round: la dimensione del font va ricalcolata
        ddFitText();
        startElapsedTimer();
    }

    /* =========================================================
       INITIALIZATION
       ========================================================= */

    function initGame() {
        summaryScreen.style.display = 'none';
        hiddenOnSummary.forEach(el => { if (el) el.style.display = ''; });

        const playable = GAME_ROUNDS.map(parseRound).filter(Boolean);
        if (playable.length < GAME_ROUNDS.length) {
            console.warn(`${GAME_ROUNDS.length - playable.length} round scartati: servono un testo e almeno una parola tra {graffe}.`);
        }
        if (playable.length === 0) {
            setInstruction('Nessun paragrafo disponibile.');
            revealBtn.disabled = true;
            document.body.classList.add('loaded');
            return;
        }

        rounds = SHUFFLE_ROUNDS ? ddShuffle(playable) : playable;
        results = [];

        document.body.classList.add('loaded');
        loadRound(0);

        // Ora l'area di gioco è visibile (e i font caricati): adatta di nuovo la dimensione del testo
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(ddFitText);
        }
    }

    initGame();
});


</script>
