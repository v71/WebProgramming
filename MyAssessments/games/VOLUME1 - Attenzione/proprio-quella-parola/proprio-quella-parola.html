<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proprio quella parola</title>

    <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <!-- Verifica il nome: nel codice originale era "celebrazion.js" (forse "celebrazione.js"?) -->
    <script src="../../js/celebrazion.js"></script>

    <link href="../stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .button-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 14px;
        }

        /* Il riepilogo è nascosto all'avvio, senza dipendere dal CSS esterno */
        #summary-screen { display: none; }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: #ffffff; /* testo leggibile sullo sfondo fisso #4f46e5 */
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #restart-btn { margin-top: 20px; }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */
        #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px;
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma in hover, focus o quando il pulsante è premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }
    </style>
</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">Proprio quella parola</h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INSTRUCTION BOX -->
    <div id="instruction-banner">Caricamento…</div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Clicca qui per avere un aiuto!</span>
        </button>
    </div>

    <!-- GAME AREA -->
    <div id="game-area">
        <div class="button-grid">
            <button class="grid-button" data-index="0"></button>
            <button class="grid-button" data-index="1"></button>
            <button class="grid-button" data-index="2"></button>
            <button class="grid-button" data-index="3"></button>
            <button class="grid-button" data-index="4"></button>
            <button class="grid-button" data-index="5"></button>
            <button class="grid-button" data-index="6"></button>
            <button class="grid-button" data-index="7"></button>
            <button class="grid-button" data-index="8"></button>
            <button class="grid-button" data-index="9"></button>
            <button class="grid-button" data-index="10"></button>
            <button class="grid-button" data-index="11"></button>
            <button class="grid-button" data-index="12"></button>
            <button class="grid-button" data-index="13"></button>
            <button class="grid-button" data-index="14"></button>
        </div>
    </div>

    <!-- PROGRESS (h2: la pagina ha un solo h1) -->
    <h2 id="progress-title">Progresso</h2>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Istruzione</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Punti</th>
                </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
        <button id="restart-btn" class="cool-btn">
            <i class="fa fa-repeat"></i>
            <span class="btn-text">Rigioca</span>
        </button>
    </div>

<script>

document.addEventListener('DOMContentLoaded', () => {
    const DATA_URL = 'proprio-quella-parola.json';
    const SHUFFLE_ROUNDS = true; // false = round nell'ordine del file
    const MAX_BUTTONS = 15;      // deve coincidere con i .grid-button nell'HTML

    // --- Stato ---
    let categories = [];
    let roundIndex = 0;
    let results = [];
    let buttons = [];
    let elapsedSeconds = 0;
    let elapsedStart = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 0;
    let foundCorrectCount = 0;
    let isGameCompleted = false;
    let isGameLoading = true;
    let moveCount = 0;
    let revealCount = 0;
    let currentCategoryTitle = '';
    let helpActive = false;

    // --- Elementi ---
    const gameTitle = document.getElementById('game-title');
    const gameArea = document.getElementById('game-area');
    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gridButtons = document.querySelectorAll('.grid-button');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const wordCountEl = document.getElementById('word-count');
    const roundValueEl = document.getElementById('round-value');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const instructionBanner = document.getElementById('instruction-banner');
    const timeValueEl = document.getElementById('time-value');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');
    const gameStats = document.getElementById('game-stats');
    const progressBar = document.querySelector('.progress-bar-container');
    const progressBarTitle = document.getElementById('progress-title');
    const btnIcon = document.getElementById('btn-icon');

    const gameElements = [
        gameArea, gameStats, instructionBanner, progressBar,
        progressBarTitle, gameTitle, actionControls
    ];

    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

    function setButtonIcon(iconClass) {
        if (!btnIcon) return;
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(iconClass);
    }

    function setButtonState(mode) {
        const texts = {
            help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check', text: 'Fatto' }
        };
        setButtonIcon(texts[mode].icon);
        const textEl = revealBtn && revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = texts[mode].text;
    }

    function setGameVisible(visible) {
        gameElements.forEach(el => {
            if (el) el.style.display = visible ? '' : 'none';
        });
        if (summaryScreen) summaryScreen.style.display = visible ? 'none' : 'block';
    }

    function computeScore() {
        const mistakes = Math.max(0, moveCount - totalCorrectItems);
        const raw = 100 - mistakes * 5 - revealCount * 10 - Math.floor(elapsedSeconds / 2);
        return Math.max(0, raw);
    }

    function addCell(row, text, bold = false) {
        const td = document.createElement('td');
        if (bold) {
            const strong = document.createElement('strong');
            strong.textContent = text;
            td.appendChild(strong);
        } else {
            td.textContent = text;
        }
        row.appendChild(td);
    }

    function showSummaryScreen() {
        stopElapsedTimer();
        setGameVisible(false);
        summaryTbody.innerHTML = '';

        results.forEach(r => {
            const row = document.createElement('tr');
            addCell(row, r.title, true);
            addCell(row, `${r.seconds}s`);
            addCell(row, String(r.moves));
            addCell(row, String(r.reveals));
            addCell(row, String(r.score), true);
            summaryTbody.appendChild(row);
        });

        const sum = key => results.reduce((t, r) => t + r[key], 0);
        summaryTotals.innerHTML = `
            <div>Tempo Totale: <strong>${sum('seconds')}s</strong></div>
            <div>Mosse Totali: <strong>${sum('moves')}</strong></div>
            <div>Aiuti Totali: <strong>${sum('reveals')}</strong></div>
            <div>Punti: <strong>${sum('score')}</strong></div>
        `;
    }

    // --- Timer basato su Date.now(): resta corretto anche con la scheda in background ---
    function tickTimer() {
        elapsedSeconds = Math.floor((Date.now() - elapsedStart) / 1000);
        updateTimerDisplay();
    }

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            tickTimer(); // ultimo aggiornamento preciso
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) timeValueEl.textContent = elapsedSeconds + 's';
    }

    function startElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
        elapsedStart = Date.now();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(tickTimer, 500);
    }

    function updateGridUI(title) {
        if (instructionBanner) instructionBanner.textContent = title;
        gridButtons.forEach(button => {
            const index = Number(button.dataset.index);
            button.classList.remove('selected', 'error', 'help-correct');
            if (buttons[index]) {
                button.textContent = buttons[index].label;
                button.disabled = false;
                button.style.visibility = '';
            } else {
                button.textContent = '';
                button.disabled = true;
                button.style.visibility = 'hidden';
            }
        });
    }

    function updateWordCountDisplay() {
        if (wordCountEl) wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
    }

    function setOverallProgress(done) {
        const total = categories.length;
        if (progressBarFill) progressBarFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    function updateRoundDisplay() {
        if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${categories.length}`;
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    function showLoadError(message) {
        isGameLoading = false;
        document.body.classList.add('loaded');
        if (instructionBanner) instructionBanner.textContent = message;
    }

    const DEFAULT_INSTRUCTION = 'Segna solo le parole scritte esattamente come «». Le forme simili non valgono.';

    function buildInstruction(category) {
        const target = String(category.target || category.word || '').trim();
        const base = (typeof category.instruction === 'string' && category.instruction.trim())
            ? category.instruction
            : DEFAULT_INSTRUCTION;

        if (!base.includes('«»')) return base;
        return target ? base.split('«»').join(`«${target}»`) : null;
    }

    function isValidCategory(category) {
        return !!category
            && Array.isArray(category.buttons)
            && category.buttons.length > 0
            && category.buttons.length <= MAX_BUTTONS          // evita round impossibili da finire
            && category.buttons.every(b => b && typeof b.label === 'string') // niente null / label mancanti
            && category.buttons.some(b => b.value === true)
            && buildInstruction(category) !== null;
    }

    function loadRound(index) {
        roundIndex = index;
        const category = categories[roundIndex];

        buttons = [...category.buttons];
        currentCategoryTitle = buildInstruction(category);
        totalCorrectItems = buttons.filter(b => b.value === true).length;

        isGameCompleted = false;
        moveCount = 0;
        revealCount = 0;
        foundCorrectCount = 0;

        revealBtn.classList.remove('smooth-hidden');
        revealBtn.disabled = false;

        updateRoundDisplay();
        updateMovesDisplay();
        updateRevealDisplay();
        updateWordCountDisplay();
        setOverallProgress(roundIndex);
        updateGridUI(currentCategoryTitle);
        setButtonState('help');
        startElapsedTimer();
    }

    async function initGame() {
        try {
            isGameLoading = true;
            stopElapsedTimer();

            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
            const data = await response.json();

            if (!Array.isArray(data.categories) || data.categories.length === 0) {
                showLoadError('Nessuna categoria disponibile.');
                return;
            }

            categories = data.categories.filter(isValidCategory);
            if (categories.length < data.categories.length) {
                console.warn(`${data.categories.length - categories.length} categorie scartate perché non valide.`);
            }
            if (categories.length === 0) {
                showLoadError('Nessuna categoria valida.');
                return;
            }

            if (SHUFFLE_ROUNDS) {
                for (let i = categories.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [categories[i], categories[j]] = [categories[j], categories[i]];
                }
            }

            results = [];
            setGameVisible(true); // mostra il gioco, nasconde il riepilogo
            if (gameTitle && data.title) gameTitle.textContent = data.title;
            loadRound(0);

            document.body.classList.add('loaded');
            isGameLoading = false;
        } catch (err) {
            console.error(`Could not load ${DATA_URL}:`, err);
            showLoadError('Errore nel caricamento del gioco.');
        }
    }

    if (revealBtn) {
        const showHelp = (e) => {
            if (isGameCompleted || isGameLoading || helpActive) return;
            helpActive = true;

            if (e && e.pointerId !== undefined) {
                try { revealBtn.setPointerCapture(e.pointerId); } catch (_) {}
            }

            revealCount++;
            updateRevealDisplay();
            gridButtons.forEach(button => {
                const index = Number(button.dataset.index);
                if (buttons[index] && buttons[index].value === true) {
                    button.classList.add('help-correct');
                }
            });
        };

        const hideHelp = (e) => {
            if (!helpActive) return;
            helpActive = false;

            if (e && e.pointerId !== undefined) {
                try { revealBtn.releasePointerCapture(e.pointerId); } catch (_) {}
            }

            gridButtons.forEach(button => button.classList.remove('help-correct'));
        };

        revealBtn.addEventListener('pointerdown', showHelp);
        revealBtn.addEventListener('pointerup', hideHelp);
        revealBtn.addEventListener('pointerleave', hideHelp);
        revealBtn.addEventListener('pointercancel', hideHelp);
        revealBtn.addEventListener('contextmenu', e => e.preventDefault());

        revealBtn.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) showHelp(e);
        });
        revealBtn.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Enter') hideHelp(e);
        });
        revealBtn.addEventListener('blur', hideHelp);

        revealBtn.addEventListener('click', () => {
            if (!isGameCompleted || revealBtn.disabled) return;
            if (roundIndex < categories.length - 1) loadRound(roundIndex + 1);
            else showSummaryScreen();
        });
    }

    if (restartBtn) {
        restartBtn.addEventListener('click', () => {
            initGame();
        });
    }

    gridButtons.forEach(button => {
        button.addEventListener('click', async () => {
            if (isGameCompleted || isGameLoading) return;

            const index = Number(button.dataset.index);
            if (!buttons[index] || button.disabled) return;

            moveCount++;
            updateMovesDisplay();

            if (buttons[index].value !== true) {
                button.classList.remove('error');
                void button.offsetWidth;
                button.classList.add('error');
                setTimeout(() => button.classList.remove('error'), 400);
                return;
            }

            button.disabled = true;
            button.classList.add('selected');
            foundCorrectCount++;
            updateWordCountDisplay();

            const justCompleted = foundCorrectCount === totalCorrectItems;
            const isLastRound = roundIndex >= categories.length - 1;
            const roundAtClick = roundIndex;

            if (justCompleted) {
                isGameCompleted = true;
                stopElapsedTimer();
                gridButtons.forEach(btn => { btn.disabled = true; });

                results.push({
                    title: currentCategoryTitle,
                    seconds: elapsedSeconds,
                    moves: moveCount,
                    reveals: revealCount,
                    score: computeScore()
                });

                setOverallProgress(roundIndex + 1);

                // Il pulsante "Prossimo round" si abilita solo a fine animazione,
                // così il segno di spunta non finisce sul round successivo.
                revealBtn.disabled = true;
            }

            if (typeof Checkmark !== 'undefined') {
                try {
                    await Checkmark.show({ element: button, size: 48, rise: 70, duration: 1600 });
                } catch (err) {
                    console.warn('Checkmark animation failed:', err);
                }
            }

            if (justCompleted && roundIndex === roundAtClick) {
                setButtonState(isLastRound ? 'done' : 'next');
                revealBtn.disabled = false;
            }

            if (justCompleted && isLastRound && typeof Confetti !== 'undefined') {
                try {
                    await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                    await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                    await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                } catch (err) {
                    console.warn('Confetti animation failed:', err);
                }
            }
        });
    });

    initGame();
});

</script>

</body>
</html>
