<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indizi nel testo</title>

    <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <link href="../stylesheet.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        /* =========================================
            GAME AREA
        ========================================= */

        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            border-radius: 20px;
            background: var(--game-area-background);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* =========================================
            CASELLE DI TESTO
        ========================================= */

        #passage-container,
        #answer-container {
            width: 100%;
        }

        /* Brano da leggere (sola lettura) e casella dove si scrive la risposta */
        #passage-text,
        #text-area {
            width: 100%;
            box-sizing: border-box;
            background: var(--summary-background);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            resize: none;
            min-height: 120px;
            outline: none;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px 1px 1px rgba(0, 0, 0, 0.5);
        }

        /* L'altezza del brano si adatta alla sua lunghezza (vedi showPassage): niente scorrimento interno */
        #passage-text {
            overflow: hidden;
        }

        /* Parola sbagliata: la casella trema e diventa rossa per un istante */
        #text-area.error {
            animation: textAreaErrorShake 0.45s ease;
            border-color: var(--grid-btn-wrong-border-color, #ef4444);
            background-color: rgba(239, 68, 68, 0.2);
        }

        /* Round completato: la casella resta bloccata ma ben leggibile, con lo stile "selezionato" */
        #text-area.selected {
            background-color: var(--grid-btn-selected, #059669);
            border-color: var(--grid-btn-selected-border-color, #ffffff);
            color: var(--grid-btn-selected-color, #ffffff);
        }

        #text-area:disabled {
            opacity: 1;                          /* niente sbiadimento grigio dei campi disabilitati su iOS/Firefox */
            -webkit-text-fill-color: currentColor;
            cursor: default;
        }

        @keyframes textAreaErrorShake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        ::placeholder {
            color: #ffffff;
            opacity: 1;
        }

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }

        /* =========================================
            BOTTONI-INDIZIO (mostrano la soluzione mentre si tiene premuto Help)
        ========================================= */

        .cool-btn-2 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            pointer-events: none;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px 1px 1px rgba(0, 0, 0, 0.5);
        }

        .game-buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 0;
            width: 100%;
            flex-wrap: wrap;
        }

        /* =========================================
            PULSANTE HELP / PROSSIMO ROUND
        ========================================= */

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        /* Il tasto Help si tiene premuto: evita menu contestuale, selezione e zoom al tocco lungo */
        #reveal-btn {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */
        #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px;
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma quando il pulsante è in hover, in focus o premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }

    </style>
</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Indizi nel testo
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Parole Trovate: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
        Instruzion banner.
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Clicca qui per avere un aiuto!</span>
        </button>
    </div>

    <!-- GAME AREA: brano da leggere, indizi e casella di risposta -->
    <div id="game-area">
        <div id="passage-container">
            <textarea id="passage-text" readonly rows="5" aria-label="Testo da leggere"></textarea>
        </div>

        <!-- 3 bottoni-indizio (mostrano la soluzione mentre si tiene premuto Help) -->
        <div class="game-buttons-container">
            <button type="button" class="cool-btn-2" data-index="0" tabindex="-1">Primo Indizio</button>
            <button type="button" class="cool-btn-2" data-index="1" tabindex="-1">Secondo Indizio</button>
            <button type="button" class="cool-btn-2" data-index="2" tabindex="-1">Terzo Indizio</button>
        </div>

        <div id="answer-container">
            <textarea id="text-area" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" rows="5"></textarea>
        </div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

    <script>

document.addEventListener('DOMContentLoaded', () => {

    // =========================================
    // IMPOSTAZIONI
    // =========================================
    const DATA_URL = 'indizi-nel-testo.json';
    const SHUFFLE_ROUNDS = true;      // false = round nell'ordine del file
    const BLOCK_PASTE = false;        // true: impedisce di incollare testo nella textarea
    const STRICT_MODE = true;         // true: una parola completata che non è una soluzione fa tremare la casella
    const IGNORE_ACCENTS = true;      // true: "e" e "è" valgono come la stessa parola; false: sono diverse
    const ALLOWED_FILLER_WORDS = [];  // parole ignorate (mai considerate sbagliate), es. ['e', 'di']

    // Una "parola" è una sequenza di lettere/numeri; tutto il resto (spazi, punteggiatura) è separatore
    const TOKEN_RE = /[\p{L}\p{N}]+/gu;

    // =========================================
    // STATO
    // =========================================
    let exercises = [];            // tutti i round (solo quelli validi)
    let roundIndex = 0;            // round corrente
    let results = [];              // risultato di ogni round completato
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let isGameCompleted = false;   // true = round corrente completato
    let isGameReady = false;       // true solo dopo il caricamento dei dati
    let moveCount = 0;             // parole corrette comparse + parole sbagliate completate
    let mistakeCount = 0;          // parole sbagliate completate (solo modalità strict)
    let prevWrongCount = 0;        // parole sbagliate già completate nel testo (per non contarle due volte)
    let revealCount = 0;
    let currentCategoryTitle = '';
    let currentExercise = null;
    let originalButtonTexts = [];
    let solutions = [];
    let solutionTokens = [];       // ogni soluzione come lista di parole normalizzate
    let expectedWords = [];        // tutte le parole attese (somma delle soluzioni)
    let expectedSet = new Set();
    let presentSolutions = new Set(); // soluzioni presenti ORA nel testo
    let totalCorrectItems = 0;
    let foundCorrectCount = 0;
    let helpActive = false;
    let pressStartedInHelpMode = false; // la pressione sul tasto è iniziata come "aiuto"?
    let isAnimatingCheckmark = false;
    let resizeTimer = null;

    // =========================================
    // ELEMENTI (letti una sola volta)
    // =========================================
    const gameTitle = document.getElementById('game-title');
    const gameArea = document.getElementById('game-area');
    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const textArea = document.getElementById('text-area');
    const passageArea = document.getElementById('passage-text');
    const helpButtons = document.querySelectorAll('.cool-btn-2');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const wordCountEl = document.getElementById('word-count');
    const roundValueEl = document.getElementById('round-value');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const instructionBanner = document.getElementById('instruction-banner');
    const timeValueEl = document.getElementById('time-value');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');
    const gameStats = document.getElementById('game-stats');
    const progressBar = document.querySelector('.progress-bar-container');
    const progressBarTitle = document.getElementById('progress-title');
    const btnIcon = document.getElementById('btn-icon');

    const hiddenOnSummary = [
        gameArea, gameStats, instructionBanner, progressBar,
        progressBarTitle, gameTitle, actionControls
    ];

    originalButtonTexts = Array.from(helpButtons).map(btn => btn.textContent);

    // =========================================
    // BRANO DA LEGGERE
    // =========================================
    // L'altezza si adatta alla lunghezza del brano, così non serve scorrere dentro una casella piccola
    function fitPassageHeight() {
        if (!passageArea) return;
        passageArea.style.height = 'auto';
        const contentHeight = passageArea.scrollHeight;
        if (!contentHeight) return;   // casella nascosta (es. schermata finale): non si tocca
        const borders = passageArea.offsetHeight - passageArea.clientHeight;
        passageArea.style.height = (contentHeight + borders) + 'px';
    }

    function showPassage(text) {
        if (!passageArea) return;
        passageArea.value = typeof text === 'string' ? text : '';
        fitPassageHeight();
    }

    // =========================================
    // PULSANTE: ICONA E TESTO
    // =========================================
    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

    function setButtonIcon(iconClass) {
        if (!btnIcon) return;
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(iconClass);
    }

    // help = in gioco, next = round completato, done = ultimo round completato
    function setButtonState(mode) {
        const texts = {
            help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check',       text: 'Fatto' }
        };
        setButtonIcon(texts[mode].icon);
        const textEl = revealBtn && revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = texts[mode].text;
    }

    // =========================================
    // ANALISI DEL TESTO
    // =========================================
    // Porta una parola in minuscolo e, se IGNORE_ACCENTS è true, senza accenti
    function foldToken(token) {
        let t = token.toLowerCase();
        if (IGNORE_ACCENTS) t = t.normalize('NFD').replace(/\p{M}/gu, '');
        return t;
    }

    function tokenize(s) {
        return (String(s).normalize('NFC').match(TOKEN_RE) || []).map(foldToken);
    }

    const fillerSet = new Set(ALLOWED_FILLER_WORDS.map(w => foldToken(String(w))));

    // Restituisce il motivo per cui un esercizio non è valido, oppure '' se lo è
    function exerciseProblem(exercise) {
        if (!exercise || typeof exercise !== 'object') return 'non è un oggetto';
        if (typeof exercise.instruction !== 'string' || exercise.instruction.trim() === '') {
            return 'manca "instruction" (testo non vuoto)';
        }
        if (typeof exercise.text !== 'string' || exercise.text.trim() === '') {
            return 'manca "text" (brano non vuoto)';
        }
        if (!Array.isArray(exercise.solutions) || exercise.solutions.length === 0) {
            return 'manca "solutions" (lista di soluzioni non vuota)';
        }
        if (exercise.solutions.length > helpButtons.length) {
            return `ci sono ${exercise.solutions.length} soluzioni, ma i bottoni-indizio sono solo ${helpButtons.length}`;
        }
        if (!exercise.solutions.every(s => typeof s === 'string' && tokenize(s).length > 0)) {
            return 'ogni soluzione deve essere un testo con almeno una parola';
        }
        return '';
    }

    // Analizza il testo scritto dal giocatore.
    // Conta solo le parole COMPLETE (seguite da spazio, invio o punteggiatura):
    // la parola ancora in digitazione non viene valutata, così "casa" non passa mentre si scrive "casale".
    // Una parola è corretta solo se coincide ESATTAMENTE con una soluzione.
    function analyzeText(raw) {
        const text = String(raw).normalize('NFC');
        const all = (text.match(TOKEN_RE) || []).map(foldToken);

        // L'ultima parola è "in digitazione" se il testo termina con una lettera/numero
        const hasPendingTail = all.length > 0 && /[\p{L}\p{N}]$/u.test(text);

        const keep = w => expectedSet.has(w) || !fillerSet.has(w);

        // Per le soluzioni contano TUTTE le parole, anche quella ancora in digitazione:
        // una parola esatta viene riconosciuta appena scritta, senza Spazio/Invio.
        // (Si assume che nessuna soluzione sia l'inizio di un'altra parola del brano:
        // lo verifica il compilatore delle domande.)
        const counts = new Map();
        all.filter(keep).forEach(w => counts.set(w, (counts.get(w) || 0) + 1));

        const present = new Set();
        solutionTokens.forEach((st, idx) => {
            const needed = new Map();
            st.forEach(t => needed.set(t, (needed.get(t) || 0) + 1));
            const available = [...needed].every(([t, n]) => (counts.get(t) || 0) >= n);
            if (available) {
                needed.forEach((n, t) => counts.set(t, counts.get(t) - n));
                present.add(idx);
            }
        });

        // Le parole SBAGLIATE si valutano solo quando sono complete (dopo Spazio/Invio/punteggiatura),
        // altrimenti una parola ancora in digitazione farebbe tremare la casella
        const completeWords = (hasPendingTail ? all.slice(0, -1) : all).filter(keep);
        const wrongCount = completeWords.filter(w => !expectedSet.has(w)).length;

        return { present, wrongCount };
    }

    // =========================================
    // RIEPILOGO
    // =========================================
    function computeScore() {
        const raw = 100 - mistakeCount * 5 - revealCount * 10 - Math.floor(elapsedSeconds / 2);
        return Math.max(0, raw);
    }

    function addCell(row, text, bold = false) {
        const td = document.createElement('td');
        if (bold) {
            const strong = document.createElement('strong');
            strong.textContent = text;
            td.appendChild(strong);
        } else {
            td.textContent = text;
        }
        row.appendChild(td);
    }

    function showSummaryScreen() {
        if (summaryScreen.style.display === 'block') return;
        stopElapsedTimer();
        hiddenOnSummary.forEach(el => { if (el) el.style.display = 'none'; });

        summaryTbody.innerHTML = '';
        results.forEach(r => {
            const row = document.createElement('tr');
            addCell(row, r.title, true);
            addCell(row, `${r.seconds}s`);
            addCell(row, String(r.moves));
            addCell(row, String(r.reveals));
            addCell(row, String(r.score), true);
            summaryTbody.appendChild(row);
        });

        const sum = key => results.reduce((t, r) => t + r[key], 0);
        summaryTotals.innerHTML = `
            <div>Tempo Totale: <strong>${sum('seconds')}s</strong></div>
            <div>Mosse Totali: <strong>${sum('moves')}</strong></div>
            <div>Aiuti Totali: <strong>${sum('reveals')}</strong></div>
            ${STRICT_MODE ? `<div>Tentativi errati: <strong>${sum('mistakes')}</strong></div>` : ''}
            <div>Punti: <strong>${sum('score')}</strong></div>
        `;
        summaryScreen.style.display = 'block';
    }

    // =========================================
    // TIMER
    // =========================================
    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) timeValueEl.textContent = elapsedSeconds + 's';
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    // =========================================
    // UI
    // =========================================
    function updateWordCountDisplay() {
        if (wordCountEl) wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
    }

    function setOverallProgress(done) {
        const total = exercises.length;
        if (progressBarFill) progressBarFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    function updateRoundDisplay() {
        if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${exercises.length}`;
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    function resetTextArea(title) {
        if (instructionBanner) instructionBanner.textContent = title;

        if (textArea) {
            textArea.value = '';
            textArea.placeholder = "Scrivi qui le parole, separate da uno spazio...";
            textArea.setAttribute('aria-label', 'Testo da scrivere');
            textArea.classList.remove('selected', 'error', 'help-correct');
            textArea.style.backgroundColor = '';
            textArea.style.color = '';
            textArea.style.borderColor = '';
            textArea.disabled = false;
        }
    }

    function showLoadError(message) {
        isGameReady = false;
        stopElapsedTimer();
        document.body.classList.add('loaded');
        if (instructionBanner) instructionBanner.textContent = message;
        if (textArea) textArea.disabled = true;
    }

    function shakeTextArea() {
        textArea.classList.remove('error');
        void textArea.offsetWidth;
        textArea.classList.add('error');
        setTimeout(() => textArea.classList.remove('error'), 450);
    }

    // =========================================
    // AIUTO
    // =========================================
    function showHelp() {
        if (isGameCompleted || !isGameReady) return;
        revealCount++;
        updateRevealDisplay();

        helpButtons.forEach((btn, index) => {
            if (solutions[index] !== undefined) {
                btn.textContent = solutions[index];
                btn.style.backgroundColor = '#4caf50';
                btn.style.color = '#ffffff';
                btn.classList.add('help-active');
            }
        });
    }

    function hideHelp() {
        helpButtons.forEach((btn, index) => {
            if (originalButtonTexts[index] !== undefined) {
                btn.textContent = originalButtonTexts[index];
            }
            btn.style.backgroundColor = '';
            btn.style.color = '';
            btn.classList.remove('help-active');
        });
    }

    // =========================================
    // ANIMAZIONI (non bloccano mai lo stato di gioco)
    // =========================================
    async function playAnimations(showCheckmark, isFinal) {
        if (showCheckmark && typeof Checkmark !== 'undefined' && !isAnimatingCheckmark) {
            isAnimatingCheckmark = true;
            try {
                await Checkmark.show({ element: textArea, size: 48, rise: 70, duration: 1600 });
            } catch (err) {
                console.warn('Checkmark animation failed:', err);
            } finally {
                isAnimatingCheckmark = false;
            }
        }

        if (isFinal && typeof Confetti !== 'undefined') {
            try {
                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
            } catch (err) {
                console.warn('Confetti animation failed:', err);
            }
        }
    }

    // =========================================
    // ROUND
    // =========================================
    function loadRound(index) {
        roundIndex = index;
        currentExercise = exercises[roundIndex];

        currentCategoryTitle = currentExercise.instruction;
        solutions = [...currentExercise.solutions];
        solutionTokens = solutions.map(tokenize);
        expectedWords = solutionTokens.flat();
        expectedSet = new Set(expectedWords);
        totalCorrectItems = solutions.length;
        presentSolutions = new Set();
        foundCorrectCount = 0;

        isGameCompleted = false;
        moveCount = 0;
        mistakeCount = 0;
        prevWrongCount = 0;
        revealCount = 0;
        helpActive = false;

        hideHelp();
        // I bottoni-indizio senza soluzione (esercizi con meno di 3 soluzioni) non si mostrano
        helpButtons.forEach((btn, i) => {
            btn.style.display = (solutions[i] !== undefined) ? '' : 'none';
        });

        showPassage(currentExercise.text);
        updateRoundDisplay();
        updateMovesDisplay();
        updateRevealDisplay();
        updateWordCountDisplay();
        setOverallProgress(roundIndex);
        resetTextArea(currentCategoryTitle);
        setButtonState('help');
        startElapsedTimer();

        revealBtn.disabled = false;
        isGameReady = true;
    }

    // =========================================
    // INIZIALIZZAZIONE
    // =========================================
    async function initGame() {
        try {
            isGameReady = false;
            stopElapsedTimer();

            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);

            const data = await response.json();
            if (!Array.isArray(data.categories) || data.categories.length === 0) {
                showLoadError('Nessuna categoria disponibile.');
                return;
            }

            // Solo esercizi validi; ogni scarto viene spiegato in console
            exercises = data.categories.filter(c => {
                const problem = exerciseProblem(c);
                if (problem) console.warn(`Esercizio scartato: ${problem}.`, c);
                return !problem;
            });
            if (exercises.length === 0) {
                showLoadError('Nessun esercizio valido.');
                return;
            }

            if (SHUFFLE_ROUNDS) {
                for (let i = exercises.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [exercises[i], exercises[j]] = [exercises[j], exercises[i]];
                }
            }

            results = [];
            if (data.title) {
                document.title = data.title;
                if (gameTitle) gameTitle.textContent = data.title;
            }
            loadRound(0);

            document.body.classList.add('loaded');

            // Ora che la pagina è visibile (e i font sono caricati) si ricalcola l'altezza del brano
            fitPassageHeight();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(fitPassageHeight);
            }
        } catch (err) {
            console.error(`Could not load ${DATA_URL}:`, err);
            showLoadError('Errore nel caricamento del gioco.');
        }
    }

    // Rotazione / ridimensionamento: il brano va a capo in modo diverso, quindi si ricalcola l'altezza
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitPassageHeight, 150);
    });

    // =========================================
    // PULSANTE HELP (tieni premuto) / PROSSIMO ROUND
    // =========================================
    if (revealBtn) {
        const startHelp = (e) => {
            // Con il mouse conta solo il tasto sinistro (non destro / centrale)
            if (e && e.pointerType === 'mouse' && e.button !== 0) return;

            // Se la pressione parte come "aiuto", il click finale non deve far avanzare il round
            pressStartedInHelpMode = !isGameCompleted;

            if (helpActive) return;
            helpActive = true;
            if (e && e.pointerId !== undefined) {
                try { revealBtn.setPointerCapture(e.pointerId); } catch (_) {}
            }
            showHelp();
        };
        const endHelp = (e) => {
            if (!helpActive) return;
            helpActive = false;
            if (e && e.pointerId !== undefined) {
                try { revealBtn.releasePointerCapture(e.pointerId); } catch (_) {}
            }
            hideHelp();
        };

        // Durante il gioco il tasto non toglie il focus alla casella di testo
        revealBtn.addEventListener('mousedown', (e) => { if (!isGameCompleted) e.preventDefault(); });
        revealBtn.addEventListener('touchstart', (e) => { if (!isGameCompleted) e.preventDefault(); }, { passive: false });

        revealBtn.addEventListener('pointerdown', startHelp);
        revealBtn.addEventListener('pointerup', endHelp);
        revealBtn.addEventListener('pointerleave', endHelp);
        revealBtn.addEventListener('pointercancel', endHelp);
        revealBtn.addEventListener('contextmenu', e => e.preventDefault()); // long-press su mobile

        // Tastiera (Spazio / Invio)
        revealBtn.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) startHelp(e);
        });
        revealBtn.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Enter') endHelp(e);
        });
        revealBtn.addEventListener('blur', (e) => endHelp(e));

        // A round completato il tasto porta al round successivo, o al riepilogo se era l'ultimo
        revealBtn.addEventListener('click', () => {
            if (pressStartedInHelpMode) {
                pressStartedInHelpMode = false;
                return;
            }
            if (!isGameCompleted) return;
            if (roundIndex < exercises.length - 1) loadRound(roundIndex + 1);
            else showSummaryScreen();
        });
    }

    // =========================================
    // CASELLA DI RISPOSTA
    // =========================================
    if (textArea) {
        if (BLOCK_PASTE) {
            textArea.addEventListener('paste', e => e.preventDefault());
        }

        textArea.addEventListener('input', () => {
            if (isGameCompleted || !isGameReady) return;

            const analysis = analyzeText(textArea.value);

            // Nuove soluzioni comparse nel testo (ognuna fa partire il segno di spunta)
            let newlyFound = 0;
            analysis.present.forEach(idx => {
                if (!presentSolutions.has(idx)) newlyFound++;
            });
            presentSolutions = analysis.present;
            foundCorrectCount = presentSolutions.size;

            // Nuova parola sbagliata completata (spazio / invio / punteggiatura dopo la parola)
            let newMistake = false;
            if (STRICT_MODE && analysis.wrongCount > prevWrongCount) {
                mistakeCount++;
                newMistake = true;
            }
            prevWrongCount = analysis.wrongCount;

            // Una mossa = nuova parola corretta oppure nuovo errore
            if (newlyFound > 0 || newMistake) moveCount++;

            updateMovesDisplay();
            updateWordCountDisplay();

            // Il round finisce quando tutte le soluzioni sono presenti
            const justCompleted = totalCorrectItems > 0 && foundCorrectCount === totalCorrectItems;
            const isLastRound = roundIndex >= exercises.length - 1;

            if (justCompleted) {
                isGameCompleted = true;
                stopElapsedTimer();
                textArea.classList.add('selected');
                textArea.disabled = true;

                results.push({
                    title: currentCategoryTitle,
                    seconds: elapsedSeconds,
                    moves: moveCount,
                    reveals: revealCount,
                    mistakes: mistakeCount,
                    score: computeScore()
                });

                setOverallProgress(roundIndex + 1);
                setButtonState(isLastRound ? 'done' : 'next');
            } else if (newMistake) {
                shakeTextArea();
            }

            // Segno di spunta a ogni parola corretta; coriandoli solo alla fine dell'ultimo round
            if (newlyFound > 0 || justCompleted) {
                playAnimations(newlyFound > 0, justCompleted && isLastRound);
            }
        });
    }

    initGame();
});

    </script>
