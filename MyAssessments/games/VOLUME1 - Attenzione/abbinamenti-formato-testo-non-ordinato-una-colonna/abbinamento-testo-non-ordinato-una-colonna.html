<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Gioco</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <!-- Main CSS File -->
    <link href="../stylesheet.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */

       #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px; /* spessore del bordo */
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma quando il pulsante è in hover, in focus o premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }

    </style>

<style>

        /* =========================================
           STILI DEL GIOCO (Simmetrici & Allineati)
           ========================================= */

        :root {
            --split-gap: 12px; /* Spazio tra i due container principali */
            --cell-h: 52px;
        }

        /* Il contenitore principale del gioco ora è un Flexbox corretto */
        #game-area {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: flex-start; /* Allinea rigorosamente i due blocchi in alto */
            justify-content: center;
            gap: var(--split-gap); /* Spazio garantito e simmetrico tra i due container */
        }

        /* I due contenitori principali (Sinistra e Destra) */
        .split-side {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Spazio uniforme tra header e griglia sottostante */
        }

        /* ---------- Griglie e Intestazioni Comuni ---------- */

        .col-heads,
        .source-grid,
        .drop-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 10px;
            width: 100%;
        }

        /* La griglia di destra (destinazione) ha le righe ad altezza fissa */
        .drop-grid {
            grid-template-rows: repeat(5, var(--cell-h));
        }

        /* Il contenitore sorgente di sinistra divide le 2 colonne */
        .source-grid {
            align-items: start;
        }

        .source-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        /* Stili generali bottoni e celle */
        .list-btn,
        .drop-cell {
            font-family: inherit;
            font-size: 1.15rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease,
                        color 0.2s ease, opacity 0.3s ease;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }

        .list-btn {
            min-height: var(--cell-h);
            padding: 6px 16px;
            background: var(--default-btn);
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .list-btn:hover:not(:disabled):not(.placed) {
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-2px);
        }

        /* Elemento scelto, in attesa di essere messo nella colonna */
        .list-btn.is-selected {
            border-color: #ffffff;
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
        }

        /* Elemento già messo nella colonna giusta */
        .list-btn.placed {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }

        /* Aiuto: accanto a ogni elemento compare la colonna giusta */
        .list-btn.help-active::after {
            content: '  \2192  ' attr(data-hint);
            font-weight: 700;
        }

        .list-btn.help-active {
            border-color: var(--grid-btn-help-border-color);
            background: var(--grid-btn-help);
            color: var(--grid-btn-help-text);
        }

        /* Intestazione di colonna: solo testo */
        .col-head {
            margin: 0;
            padding: 6px 12px;
            min-height: var(--cell-h);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            box-sizing: border-box;
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }

        .drop-cell {
            padding: 0 10px;
            background: var(--summary-background, rgba(0, 0, 0, 0.25));
            cursor: pointer;
            height: var(--cell-h);
            box-sizing: border-box;
        }

        .drop-cell:hover:not(:disabled):not(.filled) {
            border-color: var(--grid-btn-hovered-border-color);
        }

        /* Cella riempita con l'elemento giusto */
        .drop-cell.filled {
            background: var(--grid-btn-selected);
            color: var(--grid-btn-selected-color);
            border-color: var(--grid-btn-selected-border-color);
            cursor: default;
        }

        /* Scelta sbagliata */
        .list-btn.error,
        .drop-cell.error {
            animation: gameShake 0.4s ease;
            border-color: var(--grid-btn-wrong-border-color);
            background-color: var(--grid-btn-wrong);
            color: var(--grid-btn-wrong-text);
        }

        @keyframes gameShake {
            0%   { transform: translateX(0); }
            20%  { transform: translateX(-8px); }
            40%  { transform: translateX(8px); }
            60%  { transform: translateX(-6px); }
            80%  { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        button:disabled {
            cursor: default;
        }

        @media (max-width: 700px) {
            #game-area { flex-direction: column; align-items: stretch; }
            .list-btn, .drop-cell { font-size: 1rem; }
        }

        .list-btn {
            min-height: var(--cell-h);
            padding: 6px 16px;
            background: var(--default-btn);
            text-align: center; /* ← Cambiato da left a center */
            display: flex;       /* Assicura il centratura perfetta verticale e orizzontale */
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }
     
        .drop-cell.help-preview {
           background: var(--grid-btn-selected);
            color: var(--grid-btn-selected-color);
            border-color: var(--grid-btn-selected-border-color);
            cursor: default;
        }

    </style>

<style>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
       Titolo Gioco
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
       Instruzion banner
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Clicca qui per avere un aiuto!</span>
        </button>
    </div>

   <div id="game-area">
        <!-- Contenitore di Sinistra (Sorgente: 2 colonne di pulsanti) -->
        <div class="split-side" id="left-side-container">
            <div class="col-heads">
                <h2 class="col-head" id="col-left-1-title">Colonna 1</h2>
            </div>
            <!-- Area pulsanti di sinistra divisa in 2 colonne -->
            <div class="source-grid" id="left-source-grid">
                <div class="source-col" id="source-col-1"></div>
                <div class="source-col" id="source-col-2"></div>
            </div>
        </div>

        <!-- Contenitore di Destra (Destinazione: griglia 5x2 di celle) -->
        <div class="split-side" id="right-side-container">
            <div class="col-heads">
                <h2 class="col-head" id="col-right-1-title">Colonna 1</h2>
            </div>
            <!-- Griglia di arrivo 5x2 -->
            <div class="drop-grid" id="right-drop-grid">
                <!-- Le 10 celle di destinazione -->
            </div>
        </div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>


    <script>

    document.addEventListener('DOMContentLoaded', () => {

        const DATA_URL = 'set-1.json';
        const SHUFFLE_ROUNDS = true;

        /* =========================================================
        STATO DEL GIOCO
        ========================================================= */
        let categories = [];
        let roundIndex = 0;
        let currentCategory = null;
        let isGameReady = false;
        let isGameCompleted = false;
        let selectedItem = null; // Pulsante selezionato a sinistra
        let currentRoundItems = []; 
        let isHoldingHelp = false;
        let currentButtonMode = 'help';
        let helpPreviewElements = []; // Traccia le celle riempite temporaneamente dall'aiuto

        // Statistiche e metriche
        let moveCount = 0;
        let revealCount = 0;
        let foundCorrectCount = 0;
        let totalCorrectItems = 0;
        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let results = [];

        /* =========================================================
        SELETTORI DOM
        ========================================================= */
        const gameTitle = document.getElementById('game-title');
        const gameArea = document.getElementById('game-area');
        const actionControls = document.getElementById('action-controls');
        const instructionBanner = document.getElementById('instruction-banner');
        const roundValueEl = document.getElementById('round-value');
        const wordCountEl = document.getElementById('word-count');
        const timeValueEl = document.getElementById('time-value');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const gameStats = document.getElementById('game-stats');
        const progressBar = document.querySelector('.progress-bar-container');
        const progressBarTitle = document.getElementById('progress-title');
        const summaryScreen = document.getElementById('summary-screen');
        const progressBarFill = document.getElementById('progress-bar-fill');
     
        const colLeftTitle = document.getElementById('col-left-1-title');
        const colRightTitle = document.getElementById('col-right-1-title');

        const sourceCol = document.getElementById('source-col-1');
        const rightDropGrid = document.getElementById('right-drop-grid');

        const revealBtn = document.getElementById('reveal-btn');
        const revealBtnBottom = document.getElementById('reveal-btn-bottom');
        const btnIcon = document.getElementById('btn-icon');

        const gameElements = [
            gameArea, gameStats, instructionBanner, progressBar,
            progressBarTitle, gameTitle, actionControls
        ];

        /* =========================================================
        UTILITY: UTILS & VALIDAZIONE
        ========================================================= */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Un round è valido se ha elementi con etichetta (domanda) e risposta valide
        function isValidRound(category) {
            if (!category || !Array.isArray(category.items) || category.items.length === 0) return false;
            return category.items.every(it => 
                it && 
                typeof it.label === 'string' && it.label.trim() !== '' && 
                typeof it.answer === 'string' && it.answer.trim() !== ''
            );
        }

        // Barra generale: aggiorna la percentuale in base al round corrente o al completamento
        function setOverallProgress() {
            const total = categories.length;
            if (progressBarFill && total > 0) {
                if (isGameCompleted && roundIndex >= total - 1) {
                    progressBarFill.style.width = '100%';
                } else {
                    const progressPercent = (roundIndex / total) * 100;
                    progressBarFill.style.width = progressPercent + '%';
                }
            }
        }
        
        /* =========================================================
        TIMER
        ========================================================= */
        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            if (timeValueEl) timeValueEl.textContent = elapsedSeconds + 's';
        }

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        /* =========================================================
        PULSANTE: ICONA E TESTO
        ========================================================= */
        const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

        function setButtonIcon(iconClass) {
            if (!btnIcon) return;
            btnIcon.classList.remove(...BUTTON_ICONS);
            btnIcon.classList.add(iconClass);
        }

        function setButtonState(mode) {
            currentButtonMode = mode;
            const states = {
                help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
                next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
                done: { icon: 'fa-check',      text: 'Fatto' }
            };
            setButtonIcon(states[mode].icon);
            
            [revealBtn, revealBtnBottom].forEach(btn => {
                if (btn) {
                    const textEl = btn.querySelector('.btn-text');
                    if (textEl) textEl.textContent = states[mode].text;
                }
            });
        }

        function setGameVisible(visible) {
            gameElements.forEach(el => {
                if (el) el.style.display = visible ? '' : 'none';
            });
            if (summaryScreen) summaryScreen.style.display = visible ? 'none' : 'block';
        }

        /* =========================================================
        LOGICA DI TRACCIAMENTO ED ERRORI
        ========================================================= */
        function registerMove() {
            if (isGameCompleted || !isGameReady) return;
            moveCount++;
            if (movesValueEl) movesValueEl.textContent = moveCount;
        }

        function registerWrong(element) {
            if (isGameCompleted || !isGameReady || !element) return;
            element.classList.remove('error');
            void element.offsetWidth; 
            element.classList.add('error');
            setTimeout(() => element.classList.remove('error'), 400);
        }

        function registerCorrect(element) {
            if (isGameCompleted || !isGameReady) return;
            foundCorrectCount++;
            if (wordCountEl) wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;

            if (foundCorrectCount >= totalCorrectItems) {
                completeRound();
            }

            if (typeof Checkmark !== 'undefined' && element) {
                try {
                    Checkmark.show({ element, size: 48, rise: 70, duration: 1600 });
                } catch (err) {
                    console.warn('Checkmark error:', err);
                }
            }
        }

        function completeRound() {
            isGameCompleted = true;
            stopElapsedTimer();

            document.querySelectorAll('.list-btn, .drop-cell').forEach(btn => {
                btn.disabled = true;
            });

            const isLastRound = roundIndex >= categories.length - 1;
            setButtonState(isLastRound ? 'done' : 'next');

            // Aggiorna la barra di progresso al 100% se è l'ultimo round
            if (isLastRound) {
                setOverallProgress();
            }

            if (isLastRound && typeof Confetti !== 'undefined') {
                Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
            }
        }

        /* =========================================================
        LOGICA DI SELEZIONE E SPOSTAMENTO (Abbinamento per Risposta)
        ========================================================= */
        function selectItem(itemObj) {
            if (isGameCompleted || !isGameReady || itemObj.placed) return;

            const wasSelected = (selectedItem === itemObj);
            deselectAllItems();

            if (wasSelected) {
                selectedItem = null;
                return;
            }

            selectedItem = itemObj;
            itemObj.button.classList.add('is-selected');
            itemObj.button.setAttribute('aria-pressed', 'true');
        }

        function deselectAllItems() {
            const allButtons = document.querySelectorAll('.list-btn');
            allButtons.forEach(btn => {
                btn.classList.remove('is-selected');
                btn.setAttribute('aria-pressed', 'false');
            });
        }

        // Clic su una cella della griglia di destra (Verifica se la risposta nella cella corrisponde all'elemento selezionato)
        function chooseCell(targetAnswer, clickedCell) {
            if (isGameCompleted || !isGameReady || !selectedItem || clickedCell.classList.contains('filled')) return;

            registerMove();

            // ESITO SBAGLIATO: La risposta della cella non coincide con la risposta corretta dell'elemento
            if (selectedItem.answer !== targetAnswer) {
                registerWrong(clickedCell);
                return;
            }

            // ESITO CORRETTO: Inserisce la risposta nella cella di destra
            clickedCell.textContent = targetAnswer;
            clickedCell.classList.add('filled');

            // Disabilita il pulsante sorgente a sinistra
            selectedItem.placed = true;
            selectedItem.button.classList.remove('is-selected');
            selectedItem.button.classList.add('placed');
            selectedItem.button.setAttribute('aria-pressed', 'false');
            selectedItem.button.disabled = true;

            deselectAllItems();
            registerCorrect(clickedCell);
        }
        
        /* =========================================================
        POPOLAMENTO DELLA UI
        ========================================================= */

        function renderRound(category) {
            currentCategory = category;
            isGameCompleted = false;
            selectedItem = null;
            moveCount = 0;
            revealCount = 0;
            foundCorrectCount = 0;

            // Aggiorna la barra di progresso generale
            setOverallProgress();

            if (instructionBanner) instructionBanner.textContent = category.instruction || '';
            
            const headers = Array.isArray(category.headers) ? category.headers : ['Risposte'];
            if (colRightTitle) colRightTitle.textContent = headers[0];
            if (colLeftTitle) colLeftTitle.textContent = headers[1];

            if (sourceCol) sourceCol.innerHTML = '';
            if (rightDropGrid) rightDropGrid.innerHTML = '';
            currentRoundItems = [];

            // Mappa gli elementi del JSON in oggetti di gioco
            const itemsWithData = category.items.map((data, index) => ({
                label: data.label.trim(),
                answer: data.answer.trim(),
                originalIndex: index,
                placed: false
            }));

            totalCorrectItems = itemsWithData.length;

            // Mescoliamo separatamente le domande a sinistra e le risposte a destra
            const shuffledSource = shuffleArray(itemsWithData);
            const shuffledTargets = shuffleArray(itemsWithData);

            // 1. Popola la colonna di sinistra (Domande)
            shuffledSource.forEach((itemObj) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'list-btn';
                button.textContent = itemObj.label;
                button.setAttribute('aria-pressed', 'false');

                itemObj.button = button;
                currentRoundItems.push(itemObj);
                
                button.addEventListener('click', () => selectItem(itemObj));
                if (sourceCol) sourceCol.appendChild(button);
            });

            // 2. Popola la griglia di destra mostrando SUBITO le risposte
            shuffledTargets.forEach((targetObj, index) => {
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'drop-cell';
                cell.dataset.answer = targetObj.answer; // Memorizza la risposta per la verifica
                cell.setAttribute('aria-label', `Opzione: ${targetObj.answer}`);
                
                // MOSTRA SUBITO LA RISPOSTA NELLA CELLA
                cell.textContent = targetObj.answer; 

                cell.addEventListener('click', () => chooseCell(targetObj.answer, cell));
                if (rightDropGrid) rightDropGrid.appendChild(cell);
            });

            if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${categories.length}`;
            if (wordCountEl) wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
            if (movesValueEl) movesValueEl.textContent = moveCount;
            if (revealsValueEl) revealsValueEl.textContent = revealCount;

            setButtonState('help');
            startElapsedTimer();
            isGameReady = true;
        }

        /* =========================================================
        PULSANTE AIUTO (REVEAL / PREVIEW)
        ========================================================= */
        
        // Attiva l'aiuto alla pressione (evidenzia le celle corrette rimanenti a destra)
        function startHelpReveal(e) {
            if (isGameCompleted || !isGameReady || currentButtonMode !== 'help') return;
            
            revealCount++;
            if (revealsValueEl) revealsValueEl.textContent = revealCount;

            const unplacedItems = currentRoundItems.filter(item => !item.placed);
            const emptyCells = Array.from(rightDropGrid.querySelectorAll('.drop-cell:not(.filled)'));

            // Evidenzia le celle corrette corrispondenti agli elementi non ancora posizionati
            emptyCells.forEach(cell => {
                const targetAns = cell.dataset.answer;
                const matchingItem = unplacedItems.find(item => item.answer === targetAns);
                
                if (matchingItem) {
                    cell.classList.add('help-preview');
                    helpPreviewElements.push({ cell });
                }
            });

            isHoldingHelp = true;
        }

        // Disattiva l'aiuto al rilascio (rimuove solo l'evidenziazione, lasciando le risposte visibili)
        function stopHelpReveal() {
            if (!isHoldingHelp) return;
            helpPreviewElements.forEach(({ cell }) => {
                cell.classList.remove('help-preview'); });
            helpPreviewElements = [];
            isHoldingHelp = false;
        }

        function handleActionButtonClick() {
            if (currentButtonMode === 'next') {
                saveRoundResult();
                roundIndex++;
                if (roundIndex < categories.length) {
                    renderRound(categories[roundIndex]);
                }
            } else if (currentButtonMode === 'done') {
                saveRoundResult();
                showFinalSummary();
            }
        }

        /* =========================================================
        SALVATAGGIO RISULTATI E RIEPILOGO FINALE
        ========================================================= */
        function saveRoundResult() {
            results.push({
                roundNum: roundIndex + 1,
                instruction: currentCategory ? (currentCategory.instruction || `Round ${roundIndex + 1}`) : `Round ${roundIndex + 1}`,
                moves: moveCount,
                reveals: revealCount,
                time: elapsedSeconds
            });
        }

        function showFinalSummary() {
            setGameVisible(false);
            isGameCompleted = true;
            stopElapsedTimer();

            const tbody = document.getElementById('summary-tbody');
            if (tbody) {
                tbody.innerHTML = '';
                results.forEach(res => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${res.instruction}</td>
                        <td>${res.time}s</td>
                        <td>${res.moves}</td>
                        <td>${res.reveals}</td>
                        <td>-</td>
                    `;
                    tbody.appendChild(row);
                });
            }

            const totalMoves = results.reduce((acc, curr) => acc + curr.moves, 0);
            const totalReveals = results.reduce((acc, curr) => acc + curr.reveals, 0);
            const totalTime = results.reduce((acc, curr) => acc + curr.time, 0);

            const totalsContainer = document.getElementById('summary-totals');
            if (totalsContainer) {
                totalsContainer.innerHTML = `
                    <p><strong>Tempo Totale:</strong> ${totalTime}s | <strong>Mosse Totali:</strong> ${totalMoves} | <strong>Aiuti Totali:</strong> ${totalReveals}</p>
                `;
            }
        }

        // ==========================================
        // COLLEGAMENTO EVENTI PULSANTI AIUTO / AZIONE
        // ==========================================
        function setupHelpButton(btn) {
            if (!btn) return;
            btn.addEventListener('pointerdown', startHelpReveal);
            btn.addEventListener('pointerup', stopHelpReveal);
            btn.addEventListener('pointerleave', stopHelpReveal);
            btn.addEventListener('pointercancel', stopHelpReveal);
            btn.addEventListener('click', handleActionButtonClick);
        }

        setupHelpButton(revealBtn);
        setupHelpButton(revealBtnBottom);

        /* =========================================================
        AVVIO DEL GIOCO
        ========================================================= */
        async function initGame() {
            try {
                isGameReady = false;
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
                
                const data = await response.json();
                const allCategories = Array.isArray(data.categories) ? data.categories : [];
                categories = allCategories.filter(isValidRound);

                if (categories.length === 0) {
                    if (instructionBanner) instructionBanner.textContent = 'Nessuna categoria valida trovata nel JSON.';
                    document.body.classList.add('loaded');
                    return;
                }

                if (SHUFFLE_ROUNDS) {
                    categories = shuffleArray(categories);
                }

                if (gameTitle && data.title) {
                    gameTitle.textContent = data.title;
                }

                roundIndex = 0;
                renderRenderRound = renderRound(categories[roundIndex]); // safe call
                document.body.classList.add('loaded');

            } catch (err) {
                console.error('Errore nel caricamento del file JSON:', err);
                if (instructionBanner) instructionBanner.textContent = 'Errore nel caricamento del gioco.';
                document.body.classList.add('loaded');
            }
        }

        initGame();
    });

    </script>
