<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segui il percorso</title>

    <!-- File esterni condivisi (verifica il nome: "celebrazion.js" potrebbe essere "celebrazione.js") -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <link href="../stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        /* ========== GAME AREA ========== */
        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            border-radius: 20px;
            background: var(--game-area-background);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .combo-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .combo-item { width: 100%; padding: 8px; }

        .custom-select-wrapper {
            position: relative;
            width: 100%;
            display: inline-block;
        }

        .game-select {
            width: 100%;
            height: 50px;
            padding: 0 45px 0 14px !important;
            font-size: 1.25rem;
            font-family: inherit;
            color: var(--text);
            background-color: var(--summary-background);
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            box-shadow: var(--shadow-sm);
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease, opacity 0.4s ease;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .game-select:hover {
            border-color: var(--grid-btn-hovered-border-color);
            background: var(--grid-btn-hovered);
            color: var(--grid-btn-hovered-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        .game-select:focus { border-color: var(--grid-btn-hovered-border-color); }

        .game-select:disabled,
        .game-select.selected {
            color: #ffffff !important;
            opacity: 1 !important;
        }

        .game-select.error {
            animation: selectErrorShake 0.45s ease;
            border-color: var(--wrong);
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--wrong);
        }

        @keyframes selectErrorShake {
            0%   { transform: translateX(0); }
            20%  { transform: translateX(-10px); }
            40%  { transform: translateX(10px); }
            60%  { transform: translateX(-8px); }
            80%  { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        ::placeholder { color: #ffffff; opacity: 1; }

        /* ========== CONTROLS & BUTTONS ========== */
        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }

        .cool-btn,
        .cool-btn-2 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            box-shadow: var(--shadow-lg);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn {
            font-size: 1.5rem;
            font-weight: 400;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .cool-btn:hover { transform: translateY(-2px); background-color: #10b981; }
        .cool-btn:active { transform: translateY(1px); }

        /* I pulsanti "tappa" sono solo display: mostrano la soluzione durante l'aiuto */
        .cool-btn-2 {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            pointer-events: none;
        }

        .game-buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* Icona Help: sempre ferma, contorno sottile */
        #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px;
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000;
        }

        #reveal-btn,
        #reveal-btn:hover .fa,
        #reveal-btn:active .fa {
            transform: none;
            animation: none;
        }

        #reveal-btn:hover { transform: translateY(-2px); }
        #reveal-btn:active { transform: translateY(1px); }

        /* ========== SUMMARY ========== */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: var(--game-area-background);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 { margin-top: 0; color: var(--correct); font-size: 2rem; }

        .summary-table { width: 100%; margin: 24px 0; border-collapse: collapse; }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--summary-background);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong { color: var(--accent); }

        /* ========== PASSAGE TEXT ========== */
        #debug-container { width: 100%; }

        #debug-text-area {
            width: 100%;
            background: var(--summary-background);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 1.25rem;
            resize: none;
            min-height: 120px;
            outline: none;
        }

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
            .combo-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <h1 id="game-title">Segui il percorso</h1>

    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <div id="instruction-banner">Caricamento...</div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn" type="button">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Clicca qui per avere un aiuto!</span>
        </button>
    </div>

    <div id="game-area">
        <div id="debug-container">
            <textarea id="debug-text-area" readonly rows="5"></textarea>
        </div>

        <div class="game-buttons-container">
            <button type="button" class="cool-btn-2">Prima Tappa</button>
            <button type="button" class="cool-btn-2">Seconda Tappa</button>
            <button type="button" class="cool-btn-2">Terza Tappa</button>
            <button type="button" class="cool-btn-2">Quarta Tappa</button>
        </div>

        <div class="combo-container">
            <div class="combo-item"><div class="custom-select-wrapper">
                <input type="text" id="select-0" class="game-select" data-index="0" placeholder="Prima tappa..." autocomplete="off" autocapitalize="off" spellcheck="false">
            </div></div>
            <div class="combo-item"><div class="custom-select-wrapper">
                <input type="text" id="select-1" class="game-select" data-index="1" placeholder="Seconda tappa..." autocomplete="off" autocapitalize="off" spellcheck="false">
            </div></div>
            <div class="combo-item"><div class="custom-select-wrapper">
                <input type="text" id="select-2" class="game-select" data-index="2" placeholder="Terza tappa..." autocomplete="off" autocapitalize="off" spellcheck="false">
            </div></div>
            <div class="combo-item"><div class="custom-select-wrapper">
                <input type="text" id="select-3" class="game-select" data-index="3" placeholder="Quarta tappa..." autocomplete="off" autocapitalize="off" spellcheck="false">
            </div></div>
        </div>
    </div>

    <h1 id="progress-title">Progresso</h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Punti</th>
                </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
        </table>
        <div class="summary-totals" id="summary-totals"></div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const DATA_URL = 'segui-il-percorso.json';
    const SHUFFLE_ROUNDS = true;   // false = round nell'ordine del file
    const PLACEHOLDERS = ['Prima tappa...', 'Seconda tappa...', 'Terza tappa...', 'Quarta tappa...'];

    /* ---------- STATE ---------- */
    let exercises = [];
    let roundIndex = 0;
    let results = [];
    let expectedLabels = [];
    let checkedKeys = [];
    let selectFoundState = [];
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 0;
    let foundCorrectCount = 0;
    let isGameCompleted = false;
    let isGameReady = false;
    let moveCount = 0;
    let revealCount = 0;
    let currentCategoryTitle = '';
    let originalButtonTexts = [];
    let isPeeking = false;

    /* ---------- DOM ---------- */
    const $ = id => document.getElementById(id);
    const gameTitle = $('game-title');
    const gameArea = $('game-area');
    const actionControls = $('action-controls');
    const revealBtn = $('reveal-btn');
    const gameSelects = document.querySelectorAll('.game-select');
    const helpButtons = document.querySelectorAll('.cool-btn-2');
    const movesValueEl = $('moves-value');
    const wordCountEl = $('word-count');
    const roundValueEl = $('round-value');
    const revealsValueEl = $('reveals-value');
    const progressBarFill = $('progress-bar-fill');
    const instructionBanner = $('instruction-banner');
    const timeValueEl = $('time-value');
    const summaryScreen = $('summary-screen');
    const summaryTbody = $('summary-tbody');
    const summaryTotals = $('summary-totals');
    const gameStats = $('game-stats');
    const progressBar = document.querySelector('.progress-bar-container');
    const progressBarTitle = $('progress-title');
    const btnIcon = $('btn-icon');
    const passageArea = $('debug-text-area');

    const hiddenOnSummary = [
        gameArea, gameStats, instructionBanner, progressBar,
        progressBarTitle, gameTitle, actionControls
    ];

    originalButtonTexts = Array.from(helpButtons, btn => btn.textContent);

    /* ---------- HELPERS ---------- */
    function showPassage(text) {
        if (passageArea) passageArea.value = typeof text === 'string' ? text : '';
    }

    function normalizeAnswer(s) {
        return String(s)
            .toLowerCase()
            .normalize('NFD')
            .replace(/\p{M}/gu, '')
            .replace(/[’‘`´]/g, "'")
            .replace(/\s+/g, ' ')
            .trim();
    }

    function buildExpectedLabels(exerciseButtons) {
        return Array.from(gameSelects, (_, i) => {
            const match = exerciseButtons.find(b => b && b.value === i + 1 && typeof b.label === 'string' && b.label.trim() !== '');
            return match ? match.label.trim() : null;
        });
    }

    function isValidExercise(exercise) {
        return exercise
            && Array.isArray(exercise.buttons)
            && buildExpectedLabels(exercise.buttons).some(label => label !== null);
    }

    const BUTTON_MODES = {
        help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
        next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
        done: { icon: 'fa-check',       text: 'Fatto' }
    };

    function setRevealButton(mode) {
        const { icon, text } = BUTTON_MODES[mode];
        if (btnIcon) {
            btnIcon.classList.remove(...Object.values(BUTTON_MODES).map(m => m.icon));
            btnIcon.classList.add(icon);
        }
        const textEl = revealBtn && revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = text;
    }

    function computeScore() {
        const mistakes = Math.max(0, moveCount - totalCorrectItems);
        const raw = 100 - mistakes * 5 - revealCount * 10 - Math.floor(elapsedSeconds / 2);
        return Math.max(0, raw);
    }

    function addCell(row, text, bold = false) {
        const td = document.createElement('td');
        if (bold) {
            const strong = document.createElement('strong');
            strong.textContent = text;
            td.appendChild(strong);
        } else {
            td.textContent = text;
        }
        row.appendChild(td);
    }

    /* ---------- TIMER ---------- */
    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) timeValueEl.textContent = elapsedSeconds + 's';
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    /* ---------- DISPLAY ---------- */
    function updateWordCountDisplay() {
        if (wordCountEl) wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
    }

    function setOverallProgress(done) {
        const total = exercises.length;
        if (progressBarFill) progressBarFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    function updateRoundDisplay() {
        if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${exercises.length}`;
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    function updateGridUI(title) {
        if (instructionBanner) instructionBanner.textContent = title;

        gameSelects.forEach((input, position) => {
            const used = expectedLabels[position] !== null;
            input.value = '';
            input.placeholder = PLACEHOLDERS[position] || '';
            input.setAttribute('aria-label', `Tappa ${position + 1}`);
            input.classList.remove('selected', 'error');
            input.style.backgroundColor = '';
            input.style.color = '';
            input.style.borderColor = '';
            input.style.display = used ? '' : 'none';
            input.disabled = !used;
        });
    }

    function showSummaryScreen() {
        stopElapsedTimer();
        hideHelp();
        hiddenOnSummary.forEach(el => { if (el) el.style.display = 'none'; });

        if (summaryTbody) {
            summaryTbody.innerHTML = '';
            results.forEach(r => {
                const row = document.createElement('tr');
                addCell(row, r.title, true);
                addCell(row, `${r.seconds}s`);
                addCell(row, String(r.moves));
                addCell(row, String(r.reveals));
                addCell(row, String(r.score), true);
                summaryTbody.appendChild(row);
            });
        }

        if (summaryTotals) {
            const sum = key => results.reduce((t, r) => t + r[key], 0);
            summaryTotals.innerHTML = `
                <div>Tempo Totale: <strong>${sum('seconds')}s</strong></div>
                <div>Mosse Totali: <strong>${sum('moves')}</strong></div>
                <div>Aiuti Totali: <strong>${sum('reveals')}</strong></div>
                <div>Punti: <strong>${sum('score')}</strong></div>
            `;
        }
        if (summaryScreen) summaryScreen.style.display = 'block';
    }

    function showLoadError(message) {
        isGameReady = false;
        stopElapsedTimer();
        document.body.classList.add('loaded');
        if (instructionBanner) instructionBanner.textContent = message;
        gameSelects.forEach(input => { input.disabled = true; });
    }

    /* ---------- HELP (tieni premuto) ---------- */
    function showHelp(e) {
        if (isGameCompleted || !isGameReady || isPeeking) return;
        // Solo tasto sinistro del mouse: il click destro/centrale non deve contare come aiuto
        if (e && e.pointerType === 'mouse' && e.button !== 0) return;
        isPeeking = true;

        if (e && e.pointerId && revealBtn) {
            try { revealBtn.setPointerCapture(e.pointerId); } catch (_) {}
        }

        revealCount++;
        updateRevealDisplay();

        helpButtons.forEach((btn, index) => {
            if (expectedLabels[index]) {
                btn.textContent = expectedLabels[index];
                btn.style.backgroundColor = '#4caf50';
                btn.style.color = '#ffffff';
            }
        });
    }

    function hideHelp(e) {
        if (!isPeeking) return;
        isPeeking = false;

        if (e && e.pointerId && revealBtn) {
            try { revealBtn.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        helpButtons.forEach((btn, index) => {
            if (originalButtonTexts[index] !== undefined) btn.textContent = originalButtonTexts[index];
            btn.style.backgroundColor = '';
            btn.style.color = '';
        });
    }

    /* ---------- ANIMATIONS ---------- */
    async function playAnimations(element, isFinal) {
        if (typeof Checkmark !== 'undefined') {
            try {
                await Checkmark.show({ element, size: 48, rise: 70, duration: 1600 });
            } catch (err) {
                console.warn('Checkmark animation failed:', err);
            }
        }

        if (isFinal && typeof Confetti !== 'undefined') {
            try {
                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
            } catch (err) {
                console.warn('Confetti animation failed:', err);
            }
        }
    }

    /* ---------- ROUNDS ---------- */
    function loadRound(index) {
        roundIndex = index;
        const exercise = exercises[roundIndex];

        expectedLabels = buildExpectedLabels(exercise.buttons);
        currentCategoryTitle = exercise.instruction || `Round ${roundIndex + 1}`;
        totalCorrectItems = expectedLabels.filter(label => label !== null).length;
        selectFoundState = new Array(gameSelects.length).fill(false);
        checkedKeys = new Array(gameSelects.length).fill('');

        isGameCompleted = false;
        isGameReady = false;
        moveCount = 0;
        revealCount = 0;
        foundCorrectCount = 0;

        hideHelp();
        showPassage(exercise.text || '');
        updateRoundDisplay();
        updateMovesDisplay();
        updateRevealDisplay();
        updateWordCountDisplay();
        setOverallProgress(roundIndex);
        updateGridUI(currentCategoryTitle);
        setRevealButton('help');
        startElapsedTimer();

        isGameReady = true;
    }

    async function initGame() {
        try {
            isGameReady = false;
            stopElapsedTimer();
            setRevealButton('help');

            if (location.protocol === 'file:') {
                showLoadError('Apri la pagina tramite un server locale (non con file://).');
                return;
            }

            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);

            const data = await response.json();
            if (!Array.isArray(data.categories) || data.categories.length === 0) {
                showLoadError('Nessuna categoria disponibile.');
                return;
            }

            exercises = data.categories.filter(isValidExercise);
            if (exercises.length < data.categories.length) {
                console.warn(`${data.categories.length - exercises.length} esercizi scartati: servono pulsanti con "label" e "value" numerico (1, 2, 3, 4).`);
            }
            if (exercises.length === 0) {
                showLoadError('Nessun esercizio valido.');
                return;
            }

            if (SHUFFLE_ROUNDS) {
                for (let i = exercises.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [exercises[i], exercises[j]] = [exercises[j], exercises[i]];
                }
            }

            results = [];
            if (gameTitle && data.title) gameTitle.textContent = data.title;
            loadRound(0);

            document.body.classList.add('loaded');
        } catch (err) {
            console.error(`Could not load ${DATA_URL}:`, err);
            showLoadError('Errore nel caricamento del gioco.');
        }
    }

    /* ---------- REVEAL / NEXT BUTTON ---------- */
    if (revealBtn) {
        revealBtn.addEventListener('mousedown', (e) => { if (!isGameCompleted) e.preventDefault(); });
        revealBtn.addEventListener('touchstart', (e) => { if (!isGameCompleted) e.preventDefault(); }, { passive: false });

        revealBtn.addEventListener('pointerdown', showHelp);
        revealBtn.addEventListener('pointerup', hideHelp);
        revealBtn.addEventListener('pointerleave', hideHelp);
        revealBtn.addEventListener('pointercancel', hideHelp);
        revealBtn.addEventListener('contextmenu', e => e.preventDefault());

        revealBtn.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) showHelp(e);
        });
        revealBtn.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Enter') hideHelp(e);
        });
        revealBtn.addEventListener('blur', hideHelp);

        revealBtn.addEventListener('click', () => {
            if (!isGameCompleted) return;
            if (roundIndex < exercises.length - 1) loadRound(roundIndex + 1);
            else showSummaryScreen();
        });
    }

    /* ---------- ANSWER CHECK ---------- */
    function validateInput(input, inputIndex) {
        if (isGameCompleted || !isGameReady || selectFoundState[inputIndex]) return;

        const userText = input.value.trim();
        if (!userText) return;

        const key = normalizeAnswer(userText);
        if (key === checkedKeys[inputIndex]) return;
        checkedKeys[inputIndex] = key;

        const expected = expectedLabels[inputIndex];
        const isCorrect = expected !== null && expected !== undefined && key === normalizeAnswer(expected);

        moveCount++;
        updateMovesDisplay();

        if (!isCorrect) {
            input.classList.remove('error');
            void input.offsetWidth; // riavvia l'animazione
            input.classList.add('error');
            input.addEventListener('animationend', () => input.classList.remove('error'), { once: true });
            return;
        }

        selectFoundState[inputIndex] = true;
        input.disabled = true;
        input.classList.add('selected');
        input.style.backgroundColor = '#10b981';
        input.style.color = '#ffffff';
        input.style.borderColor = '#ffffff';
        foundCorrectCount++;
        updateWordCountDisplay();

        const justCompleted = foundCorrectCount === totalCorrectItems;
        const isLastRound = roundIndex >= exercises.length - 1;

        if (justCompleted) {
            isGameCompleted = true;
            stopElapsedTimer();
            hideHelp();
            gameSelects.forEach(el => { el.disabled = true; });

            results.push({
                title: currentCategoryTitle,
                seconds: elapsedSeconds,
                moves: moveCount,
                reveals: revealCount,
                score: computeScore()
            });

            setOverallProgress(roundIndex + 1);
            setRevealButton(isLastRound ? 'done' : 'next');
        }

        playAnimations(input, justCompleted && isLastRound);
    }

    gameSelects.forEach((input, position) => {
        const inputIndex = input.dataset.index !== undefined ? Number(input.dataset.index) : position;

        input.addEventListener('blur', () => validateInput(input, inputIndex));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                validateInput(input, inputIndex);
                input.blur();
            }
        });
    });

    initGame();
});
</script>
