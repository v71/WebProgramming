<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frasi quasi uguali</title>

     <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>
    
    <style>

        :root {
            --bg-0: #2a113d;
            --bg-1: #4a1d6e;
            --bg-2: #553d94;
            --accent: #ff9800;
            --accent-2: #06b6d4;
            --correct: #ffffff;
            --wrong: #ef4444;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --border: #000205;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -5px rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at center, rgba(99, 102, 241, 0.06), transparent 40%),
                radial-gradient(circle at center, rgba(6, 182, 212, 0.06), transparent 40%),
                var(--bg-0);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* =========================================
           GAME TITLE
        ========================================= */

        h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           COUNTERS
        ========================================= */

        #game-stats {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
            flex-wrap: wrap;
        }

        #game-stats strong {
            color: var(--text);
            font-weight: 700;
        }

        /* =========================================
           INFORMATION BOX
        ========================================= */
        
        #instruction-banner {
            margin: 0 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-1);
            padding: 10px 20px;
            border-radius: 99px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* =========================================
           EMPTY GAME AREA
        ========================================= */

        #game-area {
            width: 100%;
            max-width: 1100px;
            min-height: 300px;
            margin: 0 auto 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: var(--bg-1);
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* This is intentionally empty.
           Future game content goes here. */

        /* =========================================
           PROGRESS TITLE
        ========================================= */

        #progress-title {
            margin: 0 0 10px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-align: center;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           PROGRESS BAR
        ========================================= */

        .progress-bar-container {
            width: 100%;
            max-width: 1100px;
            height: 12px;
            margin-bottom: 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 99px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 135deg,#6366f1 0%,#a855f7 100%);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }
    </style>

    <style>

        #game-area {
            padding: 24px;
        }

        .button-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Changed from 3 to 2 */
            grid-template-rows: repeat(3, 1fr);    /* Changed from 5 to 3 */
            gap: 14px;
        }

        .grid-button {
            min-height: 70px;
            border: 2px solid #000205;
            border-radius: 14px;
            background: #7931b4;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        .grid-button:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            background: #ffffff;
            color: var(--accent);
            z-index: 5;
        }

        .grid-button.selected {
            background: #ff9800;
            border-color: #000205;
            color: #ffffff;
        }

        @media (max-width: 700px) { .button-grid { gap: 10px; }
        .grid-button {
            min-height: 60px;
            font-size: 1rem;
        }
        }

    </style>

    <style>

    .grid-button.error { 
        animation: buttonErrorShake 0.45s ease; 
        border-color: var(--wrong);
        background-color: rgba(239, 68, 68, 0.05);
        color: var(--wrong);
    } 
    
    @keyframes buttonErrorShake { 
        0% { transform: translateX(0); }
        20% { transform: translateX(-10px); } 
        40% { transform: translateX(10px); } 
        60% { transform: translateX(-8px); } 
        80% { transform: translateX(8px); } 
        100% { transform: translateX(0); } 
    }

    </style>

<style>

        .controls {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            position: relative;
            min-height: 52px;
        }
        
            .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .cool-btn.smooth-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
            position: absolute;
        }

        .cool-btn i {
            font-size: 1.1rem;
            -webkit-text-stroke: 1px currentColor;
            transition: transform 0.25s ease;
        }

        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #10b981;
        }

        .cool-btn:hover i {
            transform: translateX(3px);
        }

        .cool-btn:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #4f46e5;
        }

        #next-btn:hover {
            background-color: #10b981;
        }

        .cool-btn.wrong-btn {
            background-color: var(--wrong);
            cursor: default;
            pointer-events: none;
            box-shadow: 0 10px 25px -3px rgba(239, 68, 68, 0.25);
            opacity: 1 !important; /* <-- Mantiene il colore pieno senza trasparenza */
        }

        .grid-button.help-correct {
            background: #4caf50;
            border-color: #ffffff;
        }

        #reveal-btn * {
            pointer-events: none;
        }

</style>

<style>

        /* Results Summary Screen */
        #summary-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        #summary-screen h2 {
            margin-top: 0;
            color: var(--correct);
            font-size: 2rem;
        }

        .summary-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-totals {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-2);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 1rem;
            font-weight: 600;
        }

        .summary-totals strong {
            color: var(--accent);
        }
    
</style>

</head>

<body>

    <!-- TITLE -->

    <h1 id="game-title">
        Frasi quasi uguali
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Frasi Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->

    <div id="instruction-banner">
       Instruzion banner.
    </div>

    <div class="controls" id="action-controls">
        <button id="next-btn" class="cool-btn smooth-hidden">
            <span>Caricamento...</span>
        </button>

        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- EMPTY GAME AREA -->
    <div id="game-area">
        <div class="button-grid">
            <button class="grid-button" data-index="0"></button>
            <button class="grid-button" data-index="1"></button>
            <button class="grid-button" data-index="2"></button>
            <button class="grid-button" data-index="3"></button>
            <button class="grid-button" data-index="4"></button>
            <button class="grid-button" data-index="5"></button>
        </div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

<script>

document.addEventListener('DOMContentLoaded', () => {
    let buttons = []; 
    let buttonFoundState = [];
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 0; 
    let foundCorrectCount = 0; 
    let isGameCompleted = false;
    let isGameLoading = true;
    let moveCount = 0;
    let revealCount = 0;
    let currentCategoryTitle = ''; // Stores the current instruction/phrase

    const gameArea = document.getElementById('game-area');
    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const gridButtons = document.querySelectorAll('.grid-button');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const wordCountEl = document.getElementById('word-count');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const instructionBanner = document.getElementById('instruction-banner');
    const timeValueEl = document.getElementById('time-value');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');

    function showSummaryScreen() {
        gameArea.style.display = 'none';
        instructionBanner.style.display = 'none';
        document.getElementById('game-stats').style.display = 'none';
        document.querySelector('.progress-bar-container').style.display = 'none';
        document.getElementById('progress-title').style.display = 'none';
        document.getElementById('game-title').style.display = 'none';
        actionControls.style.display = 'none';
        
        summaryTbody.innerHTML = '';
        
        // Calculate a simple metric (e.g., efficiency based on moves and time)
        const metricValue = Math.max(0, 100 - (moveCount * 2) - elapsedSeconds);

        const row = document.createElement('tr');
        row.innerHTML = `
            <td><strong>${currentCategoryTitle}</strong></td>
            <td>${elapsedSeconds}s</td>
            <td>${moveCount}</td>
            <td>${revealCount}</td>
            <td><strong>${metricValue.toFixed(2)}</strong></td>
        `;
        summaryTbody.appendChild(row);
        
        summaryTotals.innerHTML = `
            <div>Tempo Totale: <strong>${elapsedSeconds}s</strong></div>
            <div>Mosse Totali: <strong>${moveCount}</strong></div>
            <div>Aiuti Totali: <strong>${revealCount}</strong></div>
        `;
        summaryScreen.style.display = 'block';
    }

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) {
            timeValueEl.textContent = elapsedSeconds + 's';
        }
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateGridUI(title) {
        if (instructionBanner) {
            instructionBanner.textContent = title;
        }
        gridButtons.forEach(button => {
            const index = Number(button.dataset.index);
            if (buttons[index]) {
                button.textContent = buttons[index].label;
                button.classList.remove('selected', 'error', 'help-correct');
                button.disabled = false;
            }
        });
    }

    function updateWordCountDisplay() {
        if (wordCountEl) {
            wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
        }
    }

    function updateProgressBar(value) {
        if (progressBarFill) {
            progressBarFill.style.width = (Math.min(Math.max(value, 0), 1) * 100) + '%';
        }
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    async function initGame() {
        try {
            isGameLoading = true;
            
            // Reset Reveal Button back to original state for a new game
            if (revealBtn) {
                revealBtn.innerHTML = "<span>💡 Help</span>";
            }

            const response = await fetch('frasi-quasi-uguali.json');
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status}`);
            }

            const data = await response.json();
            if (!data.categories || data.categories.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * data.categories.length);
            const currentCategoryData = data.categories[randomIndex];

            buttons = [...currentCategoryData.buttons];
            currentCategoryTitle = currentCategoryData.instruction; // Save phrase
            buttonFoundState = new Array(buttons.length).fill(false);
            totalCorrectItems = buttons.filter(b => b.value === true).length;

            isGameCompleted = false;
            isGameLoading = false;
            moveCount = 0;
            revealCount = 0;
            foundCorrectCount = 0;

            updateMovesDisplay();
            updateRevealDisplay();
            updateWordCountDisplay();
            updateProgressBar(0);
            updateGridUI(currentCategoryTitle);
            startElapsedTimer();

        } catch (err) {
            isGameLoading = false;
            console.error('Could not load categories.json:', err);
        }
    }

    // Standard Reveal / Help button events
    if (revealBtn) {
        const showHelp = () => {
            if (isGameCompleted || isGameLoading) return;
            revealCount++;
            updateRevealDisplay();
            
            gridButtons.forEach(button => {
                const index = Number(button.dataset.index);
                if (buttons[index] && buttons[index].value === true) {
                    button.classList.add('help-correct');
                }
            });
        };

        const hideHelp = () => {
            if (isGameCompleted || isGameLoading) return;
            gridButtons.forEach(button => {
                button.classList.remove('help-correct');
            });
        };

        revealBtn.addEventListener('mousedown', showHelp);
        revealBtn.addEventListener('mouseup', hideHelp);
        revealBtn.addEventListener('mouseleave', hideHelp);
        revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showHelp(); }, { passive: false });
        revealBtn.addEventListener('touchend', hideHelp);
        revealBtn.addEventListener('touchcancel', hideHelp);

        // Click handler to trigger summary screen when game is completed
        revealBtn.addEventListener('click', () => {
            if (isGameCompleted) {
                showSummaryScreen();
            }
        });
    }

    // Grid buttons click events
    gridButtons.forEach(button => {
        button.addEventListener('click', async () => {
            if (isGameCompleted || isGameLoading) return;
            
            const index = Number(button.dataset.index);
            if (!buttons[index] || buttonFoundState[index]) return;

            const isCorrect = buttons[index].value === true;
            moveCount++;
            updateMovesDisplay();

            if (isCorrect) {
                buttonFoundState[index] = true;
                button.disabled = true;
                button.classList.add('selected');
                foundCorrectCount++;

                updateWordCountDisplay();

                if (typeof Checkmark !== 'undefined') {
                    try {
                        await Checkmark.show({
                            element: button,
                            size: 48,
                            rise: 70,
                            duration: 1600
                        });
                    } catch (err) {
                        console.warn('Checkmark animation failed:', err);
                    }
                }

                updateProgressBar(foundCorrectCount / totalCorrectItems);

                if ((foundCorrectCount === totalCorrectItems) && !isGameCompleted) {
                    isGameCompleted = true;
                    stopElapsedTimer();

                    if (typeof Confetti !== 'undefined') {
                        try {
                            await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                            await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                            await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                        } catch (err) {
                            console.warn('Confetti animation failed:', err);
                        }
                    }

                    // Turn the Help button into "Fatto"
                    if (revealBtn) {
                        revealBtn.innerHTML = "<span>✓ Fatto</span>";
                    }
                }

            } else {
                button.classList.remove('error');
                void button.offsetWidth; // Force reflow for shake animation
                button.classList.add('error');
                setTimeout(() => {
                    button.classList.remove('error');
                }, 400);
            }
        });
    });

    initGame();
});

</script>

</body>
</html>
