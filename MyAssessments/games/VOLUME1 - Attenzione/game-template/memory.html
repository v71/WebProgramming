<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>

    <!-- 1. Includi qui il file esterno condiviso -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>

    <!-- Main CSS File -->
    <link href="../stylesheet.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        /* =========================================
           STILI DEL GIOCO: MEMORY
        ========================================= */

        /* --- Interfaccia compatta, per evitare lo scroll della pagina --- */
        /*
        #game-title {
            font-size: clamp(1.1rem, 3.4vh, 1.6rem) !important;
            margin: 4px 0 !important;
            padding: 0 !important;
            line-height: 1.2 !important;
        }
        */
        #game-stats {
            font-size: 0.85rem !important;
            margin: 2px 0 !important;
            padding: 2px 8px !important;
            line-height: 1.3 !important;
        }

        #instruction-banner {
            font-size: 0.95rem !important;
            margin: 4px auto !important;
            padding: 5px 12px !important;
            line-height: 1.25 !important;
        }

        #action-controls {
            margin: 4px 0 !important;
            padding: 0 !important;
        }
        /*
        #progress-title {
            font-size: 0.85rem !important;
            margin: 4px 0 2px !important;
            padding: 0 !important;
            line-height: 1.2 !important;
        }
        */
        .progress-bar-container {
            height: 10px !important;
            margin-top: 0 !important;
            margin-bottom: 6px !important;
        }

        /* Il game-area racchiude il tabellone: bordo visibile e 16px sopra e sotto */
        #game-area {
            box-sizing: border-box !important;
            width: fit-content !important;
            max-width: 100% !important;
            margin: 0 auto !important;
            padding: 16px 16px !important;
            border: 2px solid var(--border, #c7d2fe) !important;
            border-radius: 16px !important;
            background: var(--game-area-background) !important;
        }

        /* --- Tabellone --- */
        .memory-board {
            --card: 96px;   /* aggiornate da fitBoard() */
            --cols: 4;
            --gap: 6px;
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--card));
            grid-auto-rows: var(--card);
            gap: var(--gap);
            justify-content: center;
            margin: 0 auto;
            perspective: 900px;
            user-select: none;
            -webkit-user-select: none;
        }

        .memory-board.locked,
        .memory-board.peek {
            pointer-events: none;
        }

        /* --- Carta --- */
        .card {
            width: var(--card);
            height: var(--card);
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        

        /*
        .card.matched {
            cursor: default;
        }

        .card-face {
            transition: border-color 0.15s ease-out;
        }

        @media (hover: hover) {
            .card:not(.flipped):not(.matched):hover .card-back {
                --back-a: #f59e0b;
                --back-b: #fbbf24;
                border-color: #ff0101;
            }
        }
        */
        
        .card-face {
            transition: border-color 0.15s ease-out, background-color 0.15s ease-out;
        }

        @media (hover: hover) {
            .card:not(.flipped):not(.matched):hover .card-back {
                --back-color: var(--grid-btn-hovered);
                border-color:var(--text);
            }
        }

        /* Hover: la carta si solleva leggermente (solo traslazione) */
        .card {
            transition: transform 0.15s ease-out;
        }

        @media (hover: hover) {
            .card:not(.flipped):not(.matched):hover {
                transform: translateY(-4px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { transition: none; }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.flipped .card-inner,
        .memory-board.peek .card .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12%;
            border: 2px solid var(--border);
            overflow: hidden;
            box-sizing: border-box;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Dorso di default (se il JSON non indica "cardBack") */
        /*
        .card-back {
            background: repeating-linear-gradient(45deg, #4f46e5 0 8px, #6366f1 8px 16px);
            
            --back-a: #4f46e5;
            --back-b: #6366f1;

            color: #ffffff;
            font-weight: 700;
            font-size: calc(var(--card) * 0.45);
            background-size: cover;
            background-position: center;
            background-color: var(--text);
        }
        */
        .card-back {
            --back-color: var(--default-btn);
            background-color: var(--back-color);
            /* striping used only when no cardBack image is set (the image replaces it) */
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.15) 0 8px, transparent 8px 16px);
            background-size: cover;
            background-position: center;
            color: var(--text);
            font-weight: 700;
            font-size: calc(var(--card) * 0.45);
        }

        .card-front {
            background: #ffffff;
            transform: rotateY(180deg);
            padding: 6%;
        }
        /*
        .card-front img {
            width: 100%;
            height: 100%;
            padding: 6%;
            box-sizing: border-box;
            object-fit: contain;
            pointer-events: none;
        }
        */
        .card-front img {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            object-fit: contain;
            border-radius: 12%;
            pointer-events: none;
        }

        /*
        .card.matched .card-front {
            box-shadow: inset 0 0 0 3px #22c55e;
            border: 2px solid var(--text);
        }
        */

        .card.matched .card-front {
            background: #22c55e;
            border-color: #ffffff;
        }

        /*
        .card:focus-visible .card-face {
            outline: 3px solid #f59e0b;
            outline-offset: 2px;
        }
*/
        /* Scossa per la coppia sbagliata (applicata da registerWrong) */
        .card.error {
            animation: memory-shake 0.4s;
        }

        @keyframes memory-shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-4px); }
            40%      { transform: translateX(4px); }
            60%      { transform: translateX(-3px); }
            80%      { transform: translateX(3px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card-inner { transition-duration: 0.01s; }
            .card.error { animation: none; }
        }

    </style>

    <style>

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 20px;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        /* Pulsante Help non utilizzabile mentre le carte si girano */
        #reveal-btn.is-busy {
            opacity: 0.55;
        }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */

       #reveal-btn .fa {
            font-size: 18px;
            line-height: 1;
            color: #ffffff;
            --w: 1px; /* spessore del bordo */
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma quando il pulsante è in hover, in focus o premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }

    </style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
       Memory
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Coppie trovate: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
       Trova le coppie di immagini uguali!
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Tieni premuto per avere un aiuto!</span>
        </button>
    </div>

    <!-- GAME AREA: il contenuto lo costruisce renderRound() nello script -->
    <div id="game-area"></div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Punti</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    /* =========================================================
       CONFIGURAZIONE
       ========================================================= */

    const DATA_URL = 'memory.json';   // { "title": "...", "categories": [ { "instruction": "...", "images": [...] } ] }
    const SHUFFLE_ROUNDS = false;     // false = i round restano in ordine di difficoltà crescente (4x4 → 6x6)

    // Parametri del tabellone
    const MIN_CARD = 64;              // lato minimo di una carta (px)
    const MAX_CARD = 120;             // lato massimo di una carta (px)
    const CARD_GAP = 6;               // spazio tra le carte (px)
    const DEFAULT_FLIP_BACK_MS = 900; // quanto restano visibili due carte diverse

    /* =========================================================
       STATO
       ========================================================= */

    let categories = [];           // tutti i round (solo quelli validi)
    let roundIndex = 0;            // round corrente
    let results = [];              // risultato di ogni round completato
    let currentCategory = null;    // dati JSON del round corrente
    let currentCategoryTitle = '';
    let elapsedSeconds = 0;
    let elapsedTimerInterval = null;
    let totalCorrectItems = 0;     // quante risposte giuste servono per completare il round
    let foundCorrectCount = 0;
    let isGameCompleted = false;   // true = round corrente completato
    let isGameReady = false;       // true solo quando i dati sono caricati
    let moveCount = 0;
    let revealCount = 0;

    // Stato specifico del Memory
    let board = null;              // elemento .memory-board
    let cards = [];                // elementi .card del round
    let firstCard = null;          // prima carta girata in attesa della seconda
    let busy = false;              // true mentre due carte vengono confrontate
    let flipBackTimer = null;
    let fixedColumns = 0;          // colonne imposte dal JSON (0 = automatico)

    /* =========================================================
       ELEMENTI
       ========================================================= */

    const gameTitle = document.getElementById('game-title');
    const gameArea = document.getElementById('game-area');
    const actionControls = document.getElementById('action-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const btnIcon = document.getElementById('btn-icon');
    const movesValueEl = document.getElementById('moves-value');
    const revealsValueEl = document.getElementById('reveals-value');
    const wordCountEl = document.getElementById('word-count');
    const roundValueEl = document.getElementById('round-value'); // può essere null
    const progressBarFill = document.getElementById('progress-bar-fill');
    const instructionBanner = document.getElementById('instruction-banner');
    const timeValueEl = document.getElementById('time-value');
    const summaryScreen = document.getElementById('summary-screen');
    const summaryTbody = document.getElementById('summary-tbody');
    const summaryTotals = document.getElementById('summary-totals');
    const gameStats = document.getElementById('game-stats');
    const progressBar = document.querySelector('.progress-bar-container');
    const progressBarTitle = document.getElementById('progress-title');

    // Elementi nascosti durante il riepilogo
    const gameElements = [
        gameArea, gameStats, instructionBanner, progressBar,
        progressBarTitle, gameTitle, actionControls
    ];

    /* =========================================================
       ★ PUNTI DA PERSONALIZZARE PER OGNI GIOCO ★
       MEMORY: ogni immagine dell'elenco "images" diventa 2 carte.
       ========================================================= */

    // 1. Un round è valido se ha almeno 2 immagini, tutte stringhe non vuote.
    function isValidRound(category) {
        return !!category
            && Array.isArray(category.images)
            && category.images.length >= 2
            && category.images.every(src => typeof src === 'string' && src.trim() !== '');
    }

    // 2. Costruisce il tabellone dentro #game-area.
    function renderRound(category) {
        clearTimeout(flipBackTimer);
        flipBackTimer = null;
        firstCard = null;
        busy = false;

        gameArea.innerHTML = '';
        cards = [];

        const images = category.images;
        totalCorrectItems = images.length;     // una coppia = una risposta corretta
        fixedColumns = parseInt(category.columns, 10) || 0;

        // Due carte per ogni immagine; l'accoppiamento si basa sulla posizione (pairId), non sul percorso
        const deck = [];
        images.forEach((src, pairId) => {
            deck.push({ src, pairId });
            deck.push({ src, pairId });
        });
        shuffle(deck);

        board = document.createElement('div');
        board.className = 'memory-board';

        deck.forEach(item => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'card';
            card.dataset.pair = String(item.pairId);
            card.setAttribute('aria-label', 'Carta coperta');

            const inner = document.createElement('div');
            inner.className = 'card-inner';

            const back = document.createElement('div');
            back.className = 'card-face card-back';
            if (category.cardBack) {
                back.style.backgroundImage = 'url("' + String(category.cardBack).replace(/"/g, '%22') + '")';
            } else {
                back.textContent = '?';
            }

            const front = document.createElement('div');
            front.className = 'card-face card-front';
            const img = document.createElement('img');
            img.src = item.src;           // il browser mette in cache: la seconda carta non ricarica
            img.alt = '';
            img.draggable = false;
            front.appendChild(img);

            inner.appendChild(back);
            inner.appendChild(front);
            card.appendChild(inner);
            board.appendChild(card);
            cards.push(card);
        });

        // Un solo listener per tutte le carte
        board.addEventListener('click', e => {
            const card = e.target.closest('.card');
            if (card) onCardClick(card);
        });

        gameArea.appendChild(board);
        fitBoard();
        requestAnimationFrame(fitBoard);   // ricalcola dopo che il layout si è assestato
    }

    // 3. Help premuto: tutte le carte si scoprono.
    function onHelpStart() {
        if (board) board.classList.add('peek');
    }

    // 4. Help rilasciato: le carte tornano come prima (le coppie trovate restano scoperte).
    function onHelpEnd() {
        if (board) board.classList.remove('peek');
    }

    // Round completato: blocca i click.
    function lockRound() {
        if (board) board.classList.add('locked');
    }

    /* =========================================================
       LOGICA DEL MEMORY
       ========================================================= */

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function onCardClick(card) {
        if (isGameCompleted || !isGameReady || busy) return;
        if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

        card.classList.add('flipped');

        // Prima carta del tentativo: aspetta la seconda
        if (!firstCard) {
            firstCard = card;
            return;
        }

        // Seconda carta: un tentativo = una mossa
        const a = firstCard;
        const b = card;
        firstCard = null;
        busy = true;
        registerMove();

        if (a.dataset.pair === b.dataset.pair) {
            a.classList.add('matched');
            b.classList.add('matched');
            busy = false;
            registerCorrect(b);
        } else {
            registerWrong(a);
            registerWrong(b);
            const delay = parseInt(currentCategory && currentCategory.flipBackDelay, 10) || DEFAULT_FLIP_BACK_MS;
            flipBackTimer = setTimeout(() => {
                a.classList.remove('flipped');
                b.classList.remove('flipped');
                busy = false;
                flipBackTimer = null;
            }, delay);
        }
    }

    /* =========================================================
       DIMENSIONE DEL TABELLONE (nessuno scroll della pagina)
       ========================================================= */

    // Altezza occupata da tutto ciò che sta nella pagina tranne il tabellone
    function heightOutsideBoard() {
        let total = 0;
        Array.from(document.body.children).forEach(el => {
            if (el === gameArea) return;
            if (['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName)) return;
            const cs = getComputedStyle(el);
            if (cs.display === 'none' || cs.position === 'fixed' || cs.position === 'absolute') return;
            total += el.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
        });
        const bs = getComputedStyle(document.body);
        total += parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom)
               + parseFloat(bs.marginTop) + parseFloat(bs.marginBottom);
        const gs = getComputedStyle(gameArea);
        total += parseFloat(gs.paddingTop) + parseFloat(gs.paddingBottom)
               + parseFloat(gs.marginTop) + parseFloat(gs.marginBottom)
               + parseFloat(gs.borderTopWidth) + parseFloat(gs.borderBottomWidth);
        return total;
    }

    function fitBoard() {
        if (!board || cards.length === 0) return;

        const total = cards.length;
        const gs = getComputedStyle(gameArea);
        const areaExtraW = parseFloat(gs.paddingLeft) + parseFloat(gs.paddingRight)
                         + parseFloat(gs.borderLeftWidth) + parseFloat(gs.borderRightWidth);
        const availW = document.documentElement.clientWidth - 24 - areaExtraW;
        const availH = window.innerHeight - heightOutsideBoard() - 12;

        // Colonne possibili: quelle imposte dal JSON, oppure tutti i divisori del numero di carte
        let options = [];
        if (fixedColumns > 0 && total % fixedColumns === 0) {
            options = [fixedColumns];
        } else {
            for (let c = 2; c <= total / 2; c++) if (total % c === 0) options.push(c);
            if (options.length === 0) options.push(total);
        }

        // Si sceglie la disposizione che permette le carte più grandi (a parità, la più quadrata)
        let best = null;
        options.forEach(cols => {
            const rows = total / cols;
            const size = Math.min(
                (availW - CARD_GAP * (cols - 1)) / cols,
                (availH - CARD_GAP * (rows - 1)) / rows,
                MAX_CARD
            );
            const score = Math.floor(size);
            if (!best || score > best.score || (score === best.score && Math.abs(cols - rows) < Math.abs(best.cols - best.rows))) {
                best = { cols, rows, score };
            }
        });

        const side = Math.max(MIN_CARD, Math.min(MAX_CARD, best.score));
        board.style.setProperty('--cols', best.cols);
        board.style.setProperty('--card', side + 'px');
        board.style.setProperty('--gap', CARD_GAP + 'px');
    }

    window.addEventListener('resize', fitBoard);
    window.addEventListener('load', fitBoard);

    /* =========================================================
       PULSANTE: ICONA E TESTO
       ========================================================= */

    const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

    function setButtonIcon(iconClass) {
        if (!btnIcon) return;
        btnIcon.classList.remove(...BUTTON_ICONS);
        btnIcon.classList.add(iconClass);
    }

    // help = in gioco, next = round completato, done = ultimo round completato
    function setButtonState(mode) {
        const states = {
            help: { icon: 'fa-lightbulb-o', text: 'Tieni premuto per avere un aiuto!' },
            next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
            done: { icon: 'fa-check',       text: 'Fatto' }
        };
        setButtonIcon(states[mode].icon);
        const textEl = revealBtn && revealBtn.querySelector('.btn-text');
        if (textEl) textEl.textContent = states[mode].text;
    }

    /* =========================================================
       RIEPILOGO
       ========================================================= */

    function setGameVisible(visible) {
        gameElements.forEach(el => {
            if (el) el.style.display = visible ? '' : 'none';
        });
        if (summaryScreen) summaryScreen.style.display = visible ? 'none' : 'block';
    }

    function computeScore() {
        const mistakes = Math.max(0, moveCount - totalCorrectItems);
        const raw = 100 - mistakes * 5 - revealCount * 10 - Math.floor(elapsedSeconds / 2);
        return Math.max(0, raw);
    }

    function addCell(row, text, bold = false) {
        const td = document.createElement('td');
        if (bold) {
            const strong = document.createElement('strong');
            strong.textContent = text;
            td.appendChild(strong);
        } else {
            td.textContent = text;
        }
        row.appendChild(td);
    }

    function showSummaryScreen() {
        stopElapsedTimer();
        setGameVisible(false);
        summaryTbody.innerHTML = '';

        results.forEach(r => {
            const row = document.createElement('tr');
            addCell(row, r.title, true);
            addCell(row, `${r.seconds}s`);
            addCell(row, String(r.moves));
            addCell(row, String(r.reveals));
            addCell(row, String(r.score), true);
            summaryTbody.appendChild(row);
        });

        const sum = key => results.reduce((t, r) => t + r[key], 0);
        summaryTotals.innerHTML = `
            <div>Tempo Totale: <strong>${sum('seconds')}s</strong></div>
            <div>Mosse Totali: <strong>${sum('moves')}</strong></div>
            <div>Aiuti Totali: <strong>${sum('reveals')}</strong></div>
            <div>Punti: <strong>${sum('score')}</strong></div>
        `;
    }

    /* =========================================================
       TIMER
       ========================================================= */

    function stopElapsedTimer() {
        if (elapsedTimerInterval) {
            clearInterval(elapsedTimerInterval);
            elapsedTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        if (timeValueEl) timeValueEl.textContent = elapsedSeconds + 's';
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();
        elapsedTimerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    /* =========================================================
       CONTATORI E BARRA DI PROGRESSO
       ========================================================= */

    function updateWordCountDisplay() {
        if (wordCountEl) wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
    }

    // Barra generale: round completati / round totali
    function setOverallProgress(done) {
        const total = categories.length;
        if (progressBarFill) progressBarFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    function updateRoundDisplay() {
        if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${categories.length}`;
    }

    function updateMovesDisplay() {
        if (movesValueEl) movesValueEl.textContent = moveCount;
    }

    function updateRevealDisplay() {
        if (revealsValueEl) revealsValueEl.textContent = revealCount;
    }

    function showLoadError(message) {
        isGameReady = false;
        stopElapsedTimer();
        document.body.classList.add('loaded'); // senza questa classe la pagina resta invisibile e l'errore non si vede
        if (instructionBanner) instructionBanner.textContent = message;
    }

    /* =========================================================
       ANIMAZIONI (non bloccano mai lo stato di gioco)
       ========================================================= */

    function playCheckmark(element) {
        if (!element || typeof Checkmark === 'undefined') return;
        try {
            Promise.resolve(Checkmark.show({ element, size: 48, rise: 70, duration: 1600 }))
                .catch(err => console.warn('Checkmark animation failed:', err));
        } catch (err) {
            console.warn('Checkmark animation failed:', err);
        }
    }

    async function playConfetti() {
        if (typeof Confetti === 'undefined') return;
        try {
            await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
            await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
            await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
        } catch (err) {
            console.warn('Confetti animation failed:', err);
        }
    }

    /* =========================================================
       LOGICA DI GIOCO (da chiamare dal codice del gioco)
       ========================================================= */

    // Ogni azione dell'utente conta come una mossa
    function registerMove() {
        if (isGameCompleted || !isGameReady) return;
        moveCount++;
        updateMovesDisplay();
    }

    // Risposta corretta: aggiorna lo stato, poi mostra il checkmark sull'elemento indicato (facoltativo)
    function registerCorrect(element) {
        if (isGameCompleted || !isGameReady) return;
        foundCorrectCount++;
        updateWordCountDisplay();

        // Prima lo stato (completamento, timer, pulsante), poi l'animazione
        if (foundCorrectCount >= totalCorrectItems) completeRound();
        playCheckmark(element);
    }

    // Risposta sbagliata: qui puoi aggiungere uno shake o altro sull'elemento
    function registerWrong(element) {
        if (isGameCompleted || !isGameReady) return;
        if (!element) return;
        element.classList.remove('error');
        void element.offsetWidth; // riavvia l'animazione di shake
        element.classList.add('error');
        setTimeout(() => element.classList.remove('error'), 400);
    }

    function completeRound() {
        isGameCompleted = true;
        stopElapsedTimer(); // il tempo si ferma all'ultima risposta, non dopo le animazioni
        lockRound();

        const isLastRound = roundIndex >= categories.length - 1;

        results.push({
            title: currentCategoryTitle,
            seconds: elapsedSeconds,
            moves: moveCount,
            reveals: revealCount,
            score: computeScore()
        });

        setOverallProgress(roundIndex + 1);          // la barra avanza di un round
        setButtonState(isLastRound ? 'done' : 'next');

        // Coriandoli solo alla fine del gioco (per averli a ogni round togli "isLastRound")
        if (isLastRound) playConfetti();
    }

    /* =========================================================
       ROUND
       ========================================================= */

    function loadRound(index) {
        roundIndex = index;
        currentCategory = categories[roundIndex];
        currentCategoryTitle = currentCategory.instruction || '';

        isGameCompleted = false;
        moveCount = 0;
        revealCount = 0;
        foundCorrectCount = 0;

        if (instructionBanner && currentCategoryTitle) instructionBanner.textContent = currentCategoryTitle;

        renderRound(currentCategory);   // ← costruisce il contenuto del gioco

        updateRoundDisplay();
        updateMovesDisplay();
        updateRevealDisplay();
        updateWordCountDisplay();
        setOverallProgress(roundIndex);   // la barra mostra i round già completati
        setButtonState('help');
        startElapsedTimer();
        isGameReady = true;
        fitBoard();                       // i contatori sono cambiati: ricalcola lo spazio
    }

    /* =========================================================
       AVVIO
       ========================================================= */

    async function initGame() {
        try {
            isGameReady = false;
            stopElapsedTimer();

            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
            const data = await response.json();

            // Si usano solo i round validi (secondo isValidRound)
            categories = (Array.isArray(data.categories) ? data.categories : []).filter(isValidRound);

            if (categories.length === 0) {
                showLoadError('Nessuna categoria valida disponibile.');
                return;
            }

            if (SHUFFLE_ROUNDS) {
                for (let i = categories.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [categories[i], categories[j]] = [categories[j], categories[i]];
                }
            }

            results = [];
            if (gameTitle && data.title) gameTitle.textContent = data.title;
            loadRound(0);

            document.body.classList.add('loaded');
            fitBoard();
        } catch (err) {
            console.error(`Could not load ${DATA_URL}:`, err);
            showLoadError('Errore nel caricamento del gioco.');
        }
    }

    /* =========================================================
       PULSANTE HELP (tieni premuto)
       ========================================================= */

    if (revealBtn) {
        // Stati dell'aiuto: idle → showing (carte che si girano) → shown (carte scoperte)
        //                   → hiding (carte che si rigirano) → idle
        // Il pulsante è utilizzabile solo in "idle" ed è visivamente disattivato durante le animazioni.
        let helpState = 'idle';
        let helpHeld = false;          // il pulsante è ancora premuto?
        const FLIP_MARGIN_MS = 60;     // piccolo margine oltre la durata della transizione CSS

        const setHelpBusy = (isBusy) => {
            revealBtn.classList.toggle('is-busy', isBusy);
            revealBtn.setAttribute('aria-disabled', isBusy ? 'true' : 'false');
        };

        // Durata dell'animazione di flip, letta dal CSS (così resta allineata se la cambi)
        const flipDuration = () => {
            const inner = board && board.querySelector('.card-inner');
            const seconds = inner ? parseFloat(getComputedStyle(inner).transitionDuration) : 0.45;
            return (isNaN(seconds) ? 0.45 : seconds) * 1000 + FLIP_MARGIN_MS;
        };

        const beginHide = () => {
            helpState = 'hiding';
            setHelpBusy(true);
            onHelpEnd();
            setTimeout(() => {
                helpState = 'idle';
                setHelpBusy(false);
            }, flipDuration());
        };

        // Pointer events: gestiscono mouse, touch e penna senza doppi conteggi
        const startHelp = () => {
            helpHeld = true;
            if (helpState !== 'idle' || isGameCompleted || !isGameReady) return;

            helpState = 'showing';
            setHelpBusy(true);
            onHelpStart();

            // L'aiuto si conta solo quando le carte sono completamente scoperte
            setTimeout(() => {
                helpState = 'shown';
                revealCount++;
                updateRevealDisplay();
                if (helpHeld) setHelpBusy(false);   // ancora premuto: le carte restano visibili
                else beginHide();                   // rilasciato durante l'animazione: si richiudono
            }, flipDuration());
        };

        const endHelp = () => {
            helpHeld = false;
            if (helpState === 'shown') beginHide();
            // se è in "showing" la chiusura parte appena le carte sono scoperte (vedi sopra)
        };

        revealBtn.addEventListener('pointerdown', startHelp);
        revealBtn.addEventListener('pointerup', endHelp);
        revealBtn.addEventListener('pointerleave', endHelp);
        revealBtn.addEventListener('pointercancel', endHelp);
        revealBtn.addEventListener('contextmenu', e => e.preventDefault()); // long-press su mobile

        // Tastiera (Spazio / Invio)
        revealBtn.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) startHelp();
        });
        revealBtn.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Enter') endHelp();
        });
        revealBtn.addEventListener('blur', endHelp);

        // A round completato il tasto porta al round successivo, o al riepilogo se era l'ultimo
        revealBtn.addEventListener('click', () => {
            if (!isGameCompleted) return;
            if (roundIndex < categories.length - 1) loadRound(roundIndex + 1);
            else showSummaryScreen();
        });
    }

    initGame();
});

</script>
