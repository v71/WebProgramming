<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Due compiti nello stesso testo</title>

     <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>
    
    <!-- Main CSS File -->
    <link href="../stylesheet.css" rel="stylesheet">

    <style>

         :root {
            /* Added: needed by the game (disabled / wrongly placed cards) */
            --disabled-btn : #622791;
            --target-background : #37275e;
        }

        @keyframes selectErrorShake { 
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); } 
            40% { transform: translateX(10px); } 
            60% { transform: translateX(-8px); } 
            80% { transform: translateX(8px); } 
            100% { transform: translateX(0); } 
        }

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }
        
    </style>

    <style>

        /* Make the text larger and readable */
        #clickable-text-container {
            font-family: sans-serif, system-ui, -apple-system, sans-serif;
            font-size: 1.5rem; 
            line-height: 1.5rem;
            padding: 16px;
        }

        /* Text area locked after the round is completed */
        #clickable-text-container.disabled {
            pointer-events: none;
            user-select: none;
        }

        #clickable-text-container.disabled .word-span {
            cursor: default;
        }

        /* Keep the correct words highlighted, but remove the hover effect on the others */
        #clickable-text-container.disabled .word-span:not(.help-correct):hover {
            background-color: transparent;
            border-color: transparent;
        }

        /* Style each word so it acts like an interactive button/chip */
        .word-span {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px 1px;
            border-radius: 6px;
            border: 2px solid transparent; /* Increased thickness while keeping layout stable */
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            font-weight: 400; /* change to the value you want */
        }

        /* Hover effect with your requested style */
        .word-span:hover {
            background-color:var(--grid-btn-hovered);
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Correctly found state */
        .word-span.help-correct {
            background-color:var(--grid-btn-selected);
            border-color:#ffffff;
            color: #ffffff;
        }

        /* Help / Reveal state (forced with !important so it always overrides selected/correct states) */
        .word-span.help-active {
            background-color: var(--grid-btn-selected) !important;
            border-color:  #ffffff !important;
            color: #ffffff !important;
        }

</style>

<style>

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-4px); }
        40%, 80% { transform: translateX(4px); }
    }

    .word-span.error-word {
        animation: shake 0.4s ease;
        border-color: #dc3545 !important;
        color: #dc3545 !important;
        background-color: rgba(220, 53, 69, 0.1);
    }

</style>

<style>

    /* Smooth transitions when the area gets disabled */
    #game-area {
        transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .word-span {
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.4s ease;
    }

    /* Game area locked after the round is completed */
    #game-area.disabled {
        pointer-events: none;
        user-select: none;
        /* background dimmed by 50% (same color as --game-area-background, 50% alpha) */
        background-color: rgba(74, 29, 110, 0.5);
        border-color: rgba(0, 0, 0, 0.5);
        box-shadow: none;
    }

    #game-area.disabled .word-span {
        cursor: default;
    }

    /* Dim only the words that are NOT correct; green ones stay fully visible */
    #game-area.disabled .word-span:not(.help-correct) {
        opacity: 0.5;
    }

    /* No hover effect on the non-highlighted words */
    #game-area.disabled .word-span:not(.help-correct):hover {
        background-color: transparent;
        border-color: transparent;
    }

</style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Titolo gioco
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
        Instruction banner.
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <span>💡 Help!</span>
        </button>
    </div>

    <!-- GAME AREA WITH TEXT INPUT -->
    <div id="game-area">
        <div id="clickable-text-container" class="clickable-text-container"></div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let isGameCompleted = false;
        let isGameLoading = true;
        let moveCount = 0;
        let revealCount = 0;
        let currentCategoryTitle = '';
        let currentExercise = null;
        let connectors = [];
        let solutions = [];
        let totalCorrectItems = 0;
        let foundCorrectCount = 0;

        const gameTitle = document.getElementById('game-title');
        const gameArea = document.getElementById('game-area');
        const actionControls = document.getElementById('action-controls');
        const revealBtn = document.getElementById('reveal-btn');
        const clickableTextContainer = document.getElementById('clickable-text-container');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const wordCountEl = document.getElementById('word-count');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const instructionBanner = document.getElementById('instruction-banner');
        const timeValueEl = document.getElementById('time-value');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');

        function showSummaryScreen() {
            gameArea.style.display = 'none';
            instructionBanner.style.display = 'none';
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            document.getElementById('progress-title').style.display = 'none';
            document.getElementById('game-title').style.display = 'none';
            actionControls.style.display = 'none';
            
            summaryTbody.innerHTML = '';
            
            const metricValue = Math.max(0, 100 - (moveCount * 2) - elapsedSeconds);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${currentCategoryTitle}</strong></td>
                <td>${elapsedSeconds}s</td>
                <td>${moveCount}</td>
                <td>${revealCount}</td>
                <td><strong>${metricValue.toFixed(2)}</strong></td>
            `;
            summaryTbody.appendChild(row);
            
            summaryTotals.innerHTML = `
                <div>Tempo Totale: <strong>${elapsedSeconds}s</strong></div>
                <div>Mosse Totali: <strong>${moveCount}</strong></div>
                <div>Aiuti Totali: <strong>${revealCount}</strong></div>
            `;
            summaryScreen.style.display = 'block';
        }

        function updateWordCountDisplay() {
            if (wordCountEl) {
                wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
            }
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            if (timeValueEl) {
                timeValueEl.textContent = elapsedSeconds + 's';
            }
        }

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function renderClickableText(text, instruction) {
            if (instructionBanner) {
                instructionBanner.textContent = instruction;
            }

            if (clickableTextContainer) {
                clickableTextContainer.innerHTML = '';
                
                const tokens = text.split(/(\s+)/);

                tokens.forEach(token => {
                    if (!token) return;
                    
                    if (/^\s+$/.test(token)) {
                        clickableTextContainer.appendChild(document.createTextNode(token));
                        return;
                    }

                    const span = document.createElement('span');
                    span.textContent = token;
                    span.className = 'word-span';
                    // Clean punctuation to map correctly against solutions/connectors
                    span.dataset.word = token.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?«»]/g, "").trim().toLowerCase();


                   span.addEventListener('click', () => {
                    if (isGameCompleted || isGameLoading) return;

                    const cleanWord = span.dataset.word;
                    const isConnector = connectors.some(c => c.toLowerCase() === cleanWord);
                    const isSolution = solutions.some(s => s.toLowerCase() === cleanWord);

                    moveCount++;
                    updateMovesDisplay();

                    if (isConnector || isSolution) {
                        // Check if this specific word is being selected for the first time right now
                        const isNewSelection = !span.classList.contains('selected');
                        
                        span.classList.remove('error-word');
                        span.classList.toggle('selected');
                        
                        if (isNewSelection && span.classList.contains('selected')) {
                            span.classList.add('help-correct');

                            // Trigger checkmark ON THIS SPAN ONLY
                            if (typeof Checkmark !== 'undefined') {
                                try {
                                    Checkmark.show({
                                        element: span, // Target only the clicked span
                                        size: 48,
                                        rise: 70,
                                        duration: 1600
                                    });
                                } catch (err) {
                                    console.warn('Checkmark animation failed:', err);
                                }
                            }
                        } else {
                            span.classList.remove('help-correct');
                        }

                        evaluateSelections();
                    } else {
                        // Wrong word: shake and red style, then go back to normal
                        span.classList.remove('selected', 'help-correct');
                        span.classList.remove('error-word');
                        void span.offsetWidth; // Reflow to reset animation
                        span.classList.add('error-word');

                        // Remove the error state when the shake is over
                        clearTimeout(span._errorTimeout);
                        span._errorTimeout = setTimeout(() => {
                            span.classList.remove('error-word');
                        }, 400); // same duration as the shake animation (0.4s)

                        evaluateSelections();
                    }
                });
                    
                    clickableTextContainer.appendChild(span);
                });
            }
        }

        function evaluateSelections() {
            const selectedSpans = clickableTextContainer.querySelectorAll('.word-span.selected');
            let correctFoundCount = 0;

            selectedSpans.forEach(span => {
                const cleanWord = span.dataset.word;
                const isConnector = connectors.some(c => c.toLowerCase() === cleanWord);
                const isSolution = solutions.some(s => s.toLowerCase() === cleanWord);

                if (isConnector || isSolution) {
                    correctFoundCount++;
                    span.classList.add('help-correct');
                } else {
                    // Optional: mark wrong selections if desired, or let them just stay selected
                }
            });

            foundCorrectCount = Math.min(correctFoundCount, totalCorrectItems);
            updateProgressBar(foundCorrectCount / totalCorrectItems);
            updateWordCountDisplay();

            if (foundCorrectCount === totalCorrectItems && !isGameCompleted) {
                isGameCompleted = true;
                stopElapsedTimer();

                // Lock the text area so no more clicks are possible
                clickableTextContainer.classList.add('disabled');
                // Lock and dim the whole game area
                gameArea.classList.add('disabled');
                        
                if (typeof Confetti !== 'undefined') {
                    try {
                        Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                        Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                        Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
                    } catch (err) {
                        console.warn('Confetti animation failed:', err);
                    }
                }

                if (revealBtn) {
                    revealBtn.innerHTML = "<span>✓ Fatto</span>";
                }
            }
        }

        function updateProgressBar(value) {
            if (progressBarFill) {
                progressBarFill.style.width = (Math.min(Math.max(value, 0), 1) * 100) + '%';
            }
        }

        function updateMovesDisplay() {
            if (movesValueEl) movesValueEl.textContent = moveCount;
        }

        function updateRevealDisplay() {
            if (revealsValueEl) revealsValueEl.textContent = revealCount;
        }

        async function initGame() {
            try {
                isGameLoading = true;
                
                if (revealBtn) {
                    revealBtn.innerHTML = "<span>💡 Help!</span>";
                }

                const response = await fetch('due-compiti-nello-stesso-testo.json');
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }

                const data = await response.json();
                if (!data.categories || data.categories.length === 0) return;
                
                const randomIndex = Math.floor(Math.random() * data.categories.length);
                currentExercise = data.categories[randomIndex];

                currentCategoryTitle = currentExercise.instruction;
                connectors = currentExercise.connectors || [];
                solutions = currentExercise.solutions || [];
                
                // Total targets = all occurrences of connectors + all occurrences of solutions in text
                // Alternatively, let's count total valid items based on array matching or unique counts.
                // Let's count how many targets exist in the text tokens:
                const textTokens = currentExercise.text.split(/(\s+)/).map(t => t.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?«»]/g, "").trim().toLowerCase());
                
                totalCorrectItems = textTokens.filter(token => 
                    connectors.some(c => c.toLowerCase() === token) || 
                    solutions.some(s => s.toLowerCase() === token)
                ).length;

                foundCorrectCount = 0;
                isGameCompleted = false;
                isGameLoading = false;
                moveCount = 0;
                revealCount = 0;

                clickableTextContainer.classList.remove('disabled');
                gameArea.classList.remove('disabled');

                updateMovesDisplay();
                updateRevealDisplay();
                updateWordCountDisplay();
                updateProgressBar(0);
                renderClickableText(currentExercise.text, currentCategoryTitle);
                startElapsedTimer();

                document.body.classList.add('loaded');
                gameTitle.textContent=data.title;
                
            } catch (err) {
                isGameLoading = false;
                console.error('Could not load JSON:', err);
            }
        }

        if (revealBtn) {
            const handleShowHelp = () => {
                if (isGameCompleted || isGameLoading) return;
                revealCount++;
                updateRevealDisplay();
                
                const spans = clickableTextContainer.querySelectorAll('.word-span');
                spans.forEach(span => {
                    const cleanWord = span.dataset.word;
                    if (connectors.some(c => c.toLowerCase() === cleanWord) || solutions.some(s => s.toLowerCase() === cleanWord)) {
                        span.classList.add('help-active');
                    }
                });
            };

            const handleHideHelp = () => {
                if (isGameCompleted || isGameLoading) return;
                const spans = clickableTextContainer.querySelectorAll('.word-span');
                spans.forEach(span => span.classList.remove('help-active'));
            };

            revealBtn.addEventListener('mousedown', handleShowHelp);
            revealBtn.addEventListener('mouseup', handleHideHelp);
            revealBtn.addEventListener('mouseleave', handleHideHelp);
            revealBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleShowHelp(); }, { passive: false });
            revealBtn.addEventListener('touchend', handleHideHelp);
            revealBtn.addEventListener('touchcancel', handleHideHelp);

            revealBtn.addEventListener('click', () => {
                if (isGameCompleted) {
                    showSummaryScreen();
                }
            });
        }

        initGame();
    });
</script>

</body>

</html>
