<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Due compiti nello stesso testo</title>

     <!-- File esterni condivisi -->
    <script src="../../js/checkmark.js"></script>
    <script src="../../js/celebrazion.js"></script>
    
    <!-- Main CSS File -->
    <link href="../stylesheet.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

         :root {
            /* Added: needed by the game (disabled / wrongly placed cards) */
            --disabled-btn : #622791;
            --target-background : #37275e;
        }

        @media (max-width: 700px) {
            body { padding: 16px 12px 30px; }
            h1, #progress-title { font-size: 1.9rem; }
            #game-stats { gap: 12px; font-size: 0.95rem; padding: 9px 14px; }
            #instruction-banner { border-radius: 18px; font-size: 0.95rem; padding: 12px 16px; }
            #game-area { min-height: 260px; padding: 16px; }
        }
        
    </style>

    <style>

        /* Make the text larger and readable */
        #clickable-text-container {
            font-family: sans-serif, system-ui, -apple-system, sans-serif;
            font-size: 1.5rem; 
            line-height: 1.5rem;
            padding: 16px;
            white-space: pre-wrap;   /* mantiene gli a capo del testo nel JSON */
        }

        /* Text area locked after the round is completed */
        #clickable-text-container.disabled {
            pointer-events: none;
            user-select: none;
        }

        #clickable-text-container.disabled .word-span {
            cursor: default;
        }

        /* Keep the correct words highlighted, but remove the hover effect on the others */
        #clickable-text-container.disabled .word-span:not(.help-correct):hover {
            background-color: transparent;
            border-color: transparent;
        }

        /* Style each word so it acts like an interactive button/chip */
        .word-span {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px 1px;
            border-radius: 6px;
            border: 2px solid transparent; /* Increased thickness while keeping layout stable */
            cursor: pointer;
            user-select: none;               /* il doppio clic non evidenzia il testo */
            -webkit-user-select: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            font-weight: 400; /* change to the value you want */

               text-shadow:
            -1px -1px 0 #000,
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
        }

        /* Hover effect with your requested style */
        .word-span:hover {
            background-color:var(--grid-btn-hovered);
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Navigazione da tastiera */
        .word-span:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }

        /* Correctly found state */
        .word-span.help-correct {
            background-color:var(--grid-btn-selected);
            border-color:#ffffff;
            color: #ffffff;
        }

        /* Help / Reveal state (forced with !important so it always overrides selected/correct states) */
        .word-span.help-active {
            background-color: var(--grid-btn-selected) !important;
            border-color:  #ffffff !important;
            color: #ffffff !important;
        }

</style>

<style>

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-4px); }
        40%, 80% { transform: translateX(4px); }
    }

    .word-span.error-word {
        animation: shake 0.4s ease;
        border-color: #dc3545 !important;
        color: #dc3545 !important;
        background-color: rgba(220, 53, 69, 0.1);
    }

</style>

<style>

    /* Smooth transitions when the area gets disabled */
    #game-area {
        transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .word-span {
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.4s ease;
    }

    /* Game area locked after the round is completed */
    #game-area.disabled {
        pointer-events: none;
        user-select: none;
        /* background dimmed by 50% (same color as --game-area-background, 50% alpha) */
        background-color: rgba(74, 29, 110, 0.5);
        border-color: rgba(0, 0, 0, 0.5);
        box-shadow: none;
    }

    #game-area.disabled .word-span {
        cursor: default;
    }

    /* Dim only the words that are NOT correct; green ones stay fully visible */
    #game-area.disabled .word-span:not(.help-correct) {
        opacity: 0.5;
    }

    /* No hover effect on the non-highlighted words */
    #game-area.disabled .word-span:not(.help-correct):hover {
        background-color: transparent;
        border-color: transparent;
    }

</style>

    <style>

        .cool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            background-color: #4f46e5;
            border: 2px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        /* Il tasto Help si tiene premuto: evita menu contestuale, selezione e zoom al tocco lungo */
        #reveal-btn {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Icona del pulsante Help: niente contorno ereditato, tratto più sottile */

        #reveal-btn .fa {
            font-size: 25px;
            line-height: 1;
            color: #ffffff;
            --w: 1px; /* spessore del bordo */
            text-shadow:
                calc(var(--w) * -1) calc(var(--w) * -1) 0 #000,
                0 calc(var(--w) * -1) 0 #000,
                var(--w) calc(var(--w) * -1) 0 #000,
                calc(var(--w) * -1) 0 0 #000,
                var(--w) 0 0 #000,
                calc(var(--w) * -1) var(--w) 0 #000,
                0 var(--w) 0 #000,
                var(--w) var(--w) 0 #000 !important;
            -webkit-text-stroke: 0 !important;
            filter: none !important;
        }

        /* L'icona resta ferma quando il pulsante è in hover, in focus o premuto */
        #reveal-btn .fa,
        #reveal-btn:hover .fa,
        #reveal-btn:focus .fa,
        #reveal-btn:active .fa,
        #reveal-btn:hover #btn-icon,
        #reveal-btn:hover .btn-icon,
        #reveal-btn:hover i {
            transform: none !important;
            animation: none !important;
            transition: none !important;
        }

    </style>

</head>

<body>

    <!-- TITLE -->
    <h1 id="game-title">
        Titolo gioco
    </h1>

    <!-- COUNTERS -->
    <div id="game-stats">
        <span>Round: <strong id="round-value">1 / 1</strong></span>
        <span>Parole Corrette: <strong id="word-count">0</strong></span>
        <span>Tempo: <strong id="time-value">0s</strong></span>
        <span>Mosse: <strong id="moves-value">0</strong></span>
        <span>Aiuti: <strong id="reveals-value">0</strong></span>
    </div>

    <!-- INFORMATION / INSTRUCTION BOX -->
    <div id="instruction-banner">
        Instruction banner.
    </div>

    <div class="controls" id="action-controls">
        <button id="reveal-btn" class="cool-btn">
            <i id="btn-icon" class="fa fa-lightbulb-o"></i>
            <span class="btn-text">Clicca qui per avere un aiuto!</span>
        </button>
    </div>

    <!-- GAME AREA WITH TEXT INPUT -->
    <div id="game-area">
        <div id="clickable-text-container" class="clickable-text-container"></div>
    </div>

    <!-- PROGRESS -->
    <h1 id="progress-title">
        Progresso
    </h1>

    <div class="progress-bar-container">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"> </div>
    </div>

    <div id="summary-screen">
        <h2>Hai completato tutto! 🎉</h2>
        <p>Ecco il riepilogo delle tue prestazioni:</p>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Frase</th>
                    <th>Tempo</th>
                    <th>Mosse</th>
                    <th>Aiuti</th>
                    <th>Metric</th>
                </tr>
            </thead>
            <tbody id="summary-tbody">
            </tbody>
        </table>
        <div class="summary-totals" id="summary-totals">
        </div>
    </div>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        const DATA_URL = 'due-compiti-nello-stesso-testo.json';
        const SHUFFLE_ROUNDS = true;   // false = round nell'ordine del file

        let categories = [];           // tutti i round (solo quelli validi, già preparati)
        let roundIndex = 0;            // round corrente
        let results = [];              // risultato di ogni round completato
        let elapsedSeconds = 0;
        let elapsedTimerInterval = null;
        let isGameCompleted = false;   // true = round corrente completato
        let isGameLoading = true;
        let moveCount = 0;
        let revealCount = 0;
        let currentCategoryTitle = '';
        let targets = new Set();       // parole da trovare (connettivi + soluzioni), minuscole e senza punteggiatura ai bordi
        let totalCorrectItems = 0;
        let foundCorrectCount = 0;
        let isHoldingHelp = false;
        let pressStartedInHelpMode = false; // la pressione sul tasto è iniziata come "aiuto"?

        const gameTitle = document.getElementById('game-title');
        const gameArea = document.getElementById('game-area');
        const actionControls = document.getElementById('action-controls');
        const revealBtn = document.getElementById('reveal-btn');
        const clickableTextContainer = document.getElementById('clickable-text-container');
        const movesValueEl = document.getElementById('moves-value');
        const revealsValueEl = document.getElementById('reveals-value');
        const wordCountEl = document.getElementById('word-count');
        const roundValueEl = document.getElementById('round-value'); // può essere null
        const progressBarFill = document.getElementById('progress-bar-fill');
        const instructionBanner = document.getElementById('instruction-banner');
        const timeValueEl = document.getElementById('time-value');
        const summaryScreen = document.getElementById('summary-screen');
        const summaryTbody = document.getElementById('summary-tbody');
        const summaryTotals = document.getElementById('summary-totals');
        const btnIcon = document.getElementById('btn-icon');

        // --- Pulsante: icona e testo ---
        const BUTTON_ICONS = ['fa-lightbulb-o', 'fa-arrow-right', 'fa-check'];

        function setButtonIcon(iconClass) {
            if (!btnIcon) return;
            btnIcon.classList.remove(...BUTTON_ICONS);
            btnIcon.classList.add(iconClass);
        }

        // help = in gioco, next = round completato, done = ultimo round completato
        function setButtonState(mode) {
            const states = {
                help: { icon: 'fa-lightbulb-o', text: 'Clicca qui per avere un aiuto!' },
                next: { icon: 'fa-arrow-right', text: 'Prossimo round' },
                done: { icon: 'fa-check',       text: 'Fatto' }
            };
            setButtonIcon(states[mode].icon);
            const textEl = revealBtn && revealBtn.querySelector('.btn-text');
            if (textEl) textEl.textContent = states[mode].text;
        }

        // --- Utilità sulle parole ---
        // Toglie la punteggiatura (anche tipografica: “ ” ‘ ’ … – —) solo ai bordi della parola,
        // così "e/o" o "l'amico" restano intatte, e porta tutto in minuscolo
        const cleanToken = (token) =>
            token.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '').toLowerCase();

        // Una parola è un bersaglio se è un connettivo o una soluzione
        const isTarget = (cleanWord) => targets.has(cleanWord);

        // Pulisce una lista del JSON (connectors / solutions): solo testi con una parola sola
        function normalizeList(list, label, category) {
            if (list === undefined || list === null) return [];
            if (!Array.isArray(list)) {
                console.warn(`"${label}" deve essere una lista di parole (array): ignorato.`, category);
                return [];
            }
            const result = [];
            list.forEach(entry => {
                if (typeof entry !== 'string') {
                    console.warn(`Voce di "${label}" ignorata: non è un testo.`, entry);
                    return;
                }
                const clean = cleanToken(entry.trim());
                if (!clean) {
                    console.warn(`Voce di "${label}" ignorata: vuota o fatta solo di punteggiatura.`, entry);
                    return;
                }
                if (/\s/.test(clean)) {
                    console.warn(`Voce di "${label}" ignorata: contiene più parole (ne serve una sola).`, entry);
                    return;
                }
                result.push(clean);
            });
            return result;
        }

        // Prepara un round: testo, istruzione, insieme dei bersagli e loro numero totale (tutte le occorrenze nel testo).
        // Restituisce null se il round non è valido (testo mancante o nessun bersaglio nel testo).
        function prepareRound(category) {
            if (!category || typeof category.text !== 'string' || category.text.trim() === '') {
                console.warn('Round scartato: serve "text" (testo non vuoto).', category);
                return null;
            }
            const roundTargets = new Set([
                ...normalizeList(category.connectors, 'connectors', category),
                ...normalizeList(category.solutions, 'solutions', category)
            ]);
            const total = category.text.split(/\s+/)
                .map(cleanToken)
                .filter(t => t && roundTargets.has(t))
                .length;
            if (total === 0) {
                console.warn('Round scartato: nel testo non compare nessuna parola di "connectors" o "solutions".', category);
                return null;
            }
            return {
                text: category.text,
                instruction: (typeof category.instruction === 'string' && category.instruction.trim() !== '')
                    ? category.instruction.trim() : '',
                targets: roundTargets,
                totalTargets: total
            };
        }

        // --- Riepilogo ---
        // Mosse sbagliate = mosse totali - parole da trovare (ogni parola giusta richiede una mossa)
        function computeScore() {
            const wrongMoves = Math.max(0, moveCount - totalCorrectItems);
            const raw = 100 - wrongMoves * 5 - revealCount * 10 - Math.floor(elapsedSeconds / 2);
            return Math.max(0, raw);
        }

        function addCell(row, text, bold = false) {
            const td = document.createElement('td');
            if (bold) {
                const strong = document.createElement('strong');
                strong.textContent = text;
                td.appendChild(strong);
            } else {
                td.textContent = text;
            }
            row.appendChild(td);
        }

        function showSummaryScreen() {
            stopElapsedTimer();
            gameArea.style.display = 'none';
            instructionBanner.style.display = 'none';
            document.getElementById('game-stats').style.display = 'none';
            document.querySelector('.progress-bar-container').style.display = 'none';
            document.getElementById('progress-title').style.display = 'none';
            document.getElementById('game-title').style.display = 'none';
            actionControls.style.display = 'none';
            
            summaryTbody.innerHTML = '';
            results.forEach(r => {
                const row = document.createElement('tr');
                addCell(row, r.title, true);
                addCell(row, `${r.seconds}s`);
                addCell(row, String(r.moves));
                addCell(row, String(r.reveals));
                addCell(row, String(r.score), true);
                summaryTbody.appendChild(row);
            });

            const sum = key => results.reduce((t, r) => t + r[key], 0);
            summaryTotals.innerHTML = `
                <div>Tempo Totale: <strong>${sum('seconds')}s</strong></div>
                <div>Mosse Totali: <strong>${sum('moves')}</strong></div>
                <div>Aiuti Totali: <strong>${sum('reveals')}</strong></div>
                <div>Punti: <strong>${sum('score')}</strong></div>
            `;
            summaryScreen.style.display = 'block';
        }

        function updateWordCountDisplay() {
            if (wordCountEl) {
                wordCountEl.textContent = `${foundCorrectCount} / ${totalCorrectItems}`;
            }
        }

        // Barra generale: round completati / round totali
        function setOverallProgress(done) {
            const total = categories.length;
            if (progressBarFill) progressBarFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
        }

        function updateRoundDisplay() {
            if (roundValueEl) roundValueEl.textContent = `${roundIndex + 1} / ${categories.length}`;
        }

        function stopElapsedTimer() {
            if (elapsedTimerInterval) {
                clearInterval(elapsedTimerInterval);
                elapsedTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            if (timeValueEl) {
                timeValueEl.textContent = elapsedSeconds + 's';
            }
        }

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedSeconds = 0;
            updateTimerDisplay();
            elapsedTimerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateMovesDisplay() {
            if (movesValueEl) movesValueEl.textContent = moveCount;
        }

        function updateRevealDisplay() {
            if (revealsValueEl) revealsValueEl.textContent = revealCount;
        }

        function showLoadError(message) {
            isGameLoading = false;
            document.body.classList.add('loaded'); // senza questa classe la pagina resta invisibile e l'errore non si vede
            if (instructionBanner) instructionBanner.textContent = message;
        }

        // --- Animazioni (non bloccano mai lo stato di gioco) ---
        function playCheckmark(element) {
            if (typeof Checkmark === 'undefined') return;
            try {
                Promise.resolve(Checkmark.show({ element, size: 48, rise: 70, duration: 1600 }))
                    .catch(err => console.warn('Checkmark animation failed:', err));
            } catch (err) {
                console.warn('Checkmark animation failed:', err);
            }
        }

        // Coriandoli solo alla fine del gioco (per averli a ogni round togli il controllo "isLastRound")
        async function playFinalConfetti() {
            if (typeof Confetti === 'undefined') return;
            try {
                await Confetti.burst({ origin: { x: 0.15, y: 0.5 }, angle: 60, spread: 60, count: 90 });
                await Confetti.burst({ origin: { x: 0.85, y: 0.5 }, angle: 120, spread: 60, count: 90 });
                await Confetti.burst({ origin: { x: 0.5, y: 0.5 }, angle: 90, spread: 60, count: 90 });
            } catch (err) {
                console.warn('Confetti animation failed:', err);
            }
        }

        // --- Click (o tastiera) su una parola ---
        function handleWordActivation(span) {
            if (isGameCompleted || isGameLoading) return;

            const cleanWord = span.dataset.word;

            moveCount++;
            updateMovesDisplay();

            if (isTarget(cleanWord)) {
                // La parola viene selezionata o deselezionata
                const isNewSelection = !span.classList.contains('selected');

                span.classList.remove('error-word');
                span.classList.toggle('selected');
                span.setAttribute('aria-pressed', String(span.classList.contains('selected')));

                if (isNewSelection) {
                    span.classList.add('help-correct');
                    playCheckmark(span); // il segno di spunta compare solo su questa parola
                } else {
                    span.classList.remove('help-correct');
                }

                evaluateSelections();
            } else {
                // Parola sbagliata: shake e stile rosso, poi torna normale
                span.classList.remove('selected', 'help-correct');
                span.setAttribute('aria-pressed', 'false');
                span.classList.remove('error-word');
                void span.offsetWidth; // reflow per riavviare l'animazione
                span.classList.add('error-word');

                // Toglie lo stato di errore a fine animazione (0.4s, come lo shake)
                clearTimeout(span._errorTimeout);
                span._errorTimeout = setTimeout(() => {
                    span.classList.remove('error-word');
                }, 400);
            }
        }

        function renderClickableText(text, instruction) {
            if (instructionBanner) {
                instructionBanner.textContent = instruction;
            }

            if (clickableTextContainer) {
                clickableTextContainer.innerHTML = '';
                
                const tokens = text.split(/(\s+)/);

                tokens.forEach(token => {
                    if (!token) return;
                    
                    if (/^\s+$/.test(token)) {
                        clickableTextContainer.appendChild(document.createTextNode(token));
                        return;
                    }

                    const span = document.createElement('span');
                    span.textContent = token;
                    span.className = 'word-span';
                    // Parola pulita dalla punteggiatura, per confrontarla con connettivi e soluzioni
                    span.dataset.word = cleanToken(token);

                    // Accessibilità: ogni parola si raggiunge e si attiva anche da tastiera
                    span.setAttribute('role', 'button');
                    span.setAttribute('aria-pressed', 'false');
                    span.tabIndex = 0;

                    span.addEventListener('click', () => handleWordActivation(span));
                    span.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleWordActivation(span);
                        }
                    });
                    
                    clickableTextContainer.appendChild(span);
                });
            }
        }

        function evaluateSelections() {
            const selectedSpans = clickableTextContainer.querySelectorAll('.word-span.selected');
            let correctFoundCount = 0;

            selectedSpans.forEach(span => {
                if (isTarget(span.dataset.word)) {
                    correctFoundCount++;
                    span.classList.add('help-correct');
                }
            });

            foundCorrectCount = Math.min(correctFoundCount, totalCorrectItems);
            updateWordCountDisplay();

            if (foundCorrectCount === totalCorrectItems && !isGameCompleted) {
                isGameCompleted = true;
                stopElapsedTimer();

                // Blocca il testo: niente più click né tabulazione sulle parole
                clickableTextContainer.classList.add('disabled');
                clickableTextContainer.querySelectorAll('.word-span').forEach(s => { s.tabIndex = -1; });
                // Blocca e attenua tutta l'area di gioco
                gameArea.classList.add('disabled');

                const isLastRound = roundIndex >= categories.length - 1;

                results.push({
                    title: currentCategoryTitle,
                    seconds: elapsedSeconds,
                    moves: moveCount,
                    reveals: revealCount,
                    score: computeScore()
                });

                setOverallProgress(roundIndex + 1);          // la barra avanza di un round
                setButtonState(isLastRound ? 'done' : 'next');

                if (isLastRound) playFinalConfetti();
            }
        }

        // --- Round ---
        function loadRound(index) {
            endHelp(); // toglie eventuali evidenziazioni dell'aiuto rimaste

            roundIndex = index;
            const round = categories[roundIndex];

            currentCategoryTitle = round.instruction || `Round ${roundIndex + 1}`;
            targets = round.targets;
            totalCorrectItems = round.totalTargets;

            foundCorrectCount = 0;
            isGameCompleted = false;
            isGameLoading = false;
            moveCount = 0;
            revealCount = 0;

            clickableTextContainer.classList.remove('disabled');
            gameArea.classList.remove('disabled');

            revealBtn.disabled = false;

            updateRoundDisplay();
            updateMovesDisplay();
            updateRevealDisplay();
            updateWordCountDisplay();
            setOverallProgress(roundIndex);   // la barra mostra i round già completati
            renderClickableText(round.text, currentCategoryTitle);
            setButtonState('help');
            startElapsedTimer();
        }

        async function initGame() {
            try {
                isGameLoading = true;
                stopElapsedTimer();

                const response = await fetch(DATA_URL);
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }

                const data = await response.json();

                // Solo round con un testo e almeno un bersaglio nel testo (altrimenti non si completerebbero mai)
                categories = (Array.isArray(data.categories) ? data.categories : [])
                    .map(prepareRound)
                    .filter(Boolean);

                if (categories.length === 0) {
                    showLoadError('Nessuna categoria valida disponibile.');
                    return;
                }

                if (SHUFFLE_ROUNDS) {
                    for (let i = categories.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [categories[i], categories[j]] = [categories[j], categories[i]];
                    }
                }

                results = [];
                if (data.title) {
                    document.title = data.title;
                    if (gameTitle) gameTitle.textContent = data.title;
                }
                loadRound(0);

                document.body.classList.add('loaded');
                
            } catch (err) {
                console.error(`Could not load ${DATA_URL}:`, err);
                showLoadError('Errore nel caricamento del gioco.');
            }
        }

        // --- Pulsante Help (tieni premuto) ---
        function startHelp(e) {
            // Con il mouse conta solo il tasto sinistro (non destro / centrale)
            if (e && e.pointerType === 'mouse' && e.button !== 0) return;

            // Se la pressione parte come "aiuto", il click finale non deve far avanzare il round
            // (succede se il round si completa mentre il tasto è ancora premuto)
            pressStartedInHelpMode = !isGameCompleted;

            // isHoldingHelp evita di contare più aiuti con più dita / tasti contemporanei
            if (isHoldingHelp || isGameCompleted || isGameLoading) return;
            isHoldingHelp = true;

            revealCount++;
            updateRevealDisplay();

            clickableTextContainer.querySelectorAll('.word-span').forEach(span => {
                if (isTarget(span.dataset.word)) {
                    span.classList.add('help-active');
                }
            });
        }

        function endHelp() {
            isHoldingHelp = false;
            clickableTextContainer.querySelectorAll('.word-span.help-active')
                .forEach(span => span.classList.remove('help-active'));
        }

        if (revealBtn) {
            // Pointer events: mouse, touch e penna con un solo gestore
            revealBtn.addEventListener('pointerdown', startHelp);
            revealBtn.addEventListener('pointerup', endHelp);
            revealBtn.addEventListener('pointerleave', endHelp);
            revealBtn.addEventListener('pointercancel', endHelp);

            // Tocco lungo su mobile: niente menu contestuale (che annullerebbe l'aiuto)
            revealBtn.addEventListener('contextmenu', e => e.preventDefault());

            // Tastiera: Spazio / Invio tenuti premuti mostrano l'aiuto
            revealBtn.addEventListener('keydown', (e) => {
                if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) startHelp();
            });
            revealBtn.addEventListener('keyup', (e) => {
                if (e.key === ' ' || e.key === 'Enter') endHelp();
            });
            revealBtn.addEventListener('blur', endHelp);

            // A round completato il tasto porta al round successivo, o al riepilogo se era l'ultimo
            revealBtn.addEventListener('click', () => {
                if (pressStartedInHelpMode) {
                    pressStartedInHelpMode = false;
                    return;
                }
                if (!isGameCompleted) return;
                if (roundIndex < categories.length - 1) loadRound(roundIndex + 1);
                else showSummaryScreen();
            });
        }

        initGame();
    });
</script>
