            // Updates the age status badge of a patient with unified center alignments.
            function updateAgeBadge(badgeElement, status) {
                if (!badgeElement) return;

                // d-inline-flex lets the container size itself strictly to the content string length
                badgeElement.className = "badge text-white d-inline-flex align-items-center justify-content-center";
                
                // Design styles
                badgeElement.style.borderRadius = "50px";
                badgeElement.style.fontSize = "0.75rem";
                badgeElement.style.padding = "4px 10px"; // Your precise custom padding
                badgeElement.style.fontWeight = "600";
                
                // Safety boundaries (allows adapting to length, but caps at container edge)
                badgeElement.style.maxWidth = "100%";

                if (status === 1) {
                    // --- ADULT STATE (Green) ---
                    badgeElement.style.backgroundColor = "#4edf97";
                    badgeElement.innerHTML = `
                        <i class="fas fa-user mr-1 flex-shrink-0" style="font-size: 0.75rem;"></i> 
                        <span class="text-truncate flex-grow-1" style="min-width: 0; line-height: 1;">Maggiorenne</span>
                    `;
                } else {
                    // --- MINOR STATE (Red) ---
                    badgeElement.style.backgroundColor = "#ff4d4d";
                    badgeElement.innerHTML = `
                        <i class="fas fa-child mr-1 flex-shrink-0" style="font-size: 0.75rem;"></i> 
                        <span class="text-truncate flex-grow-1" style="min-width: 0; line-height: 1;">Minorenne</span>
                    `;
                }
            }
        
            // Updates the subscription date label with proper Italian gender agreement.
            function updateSubscriptionDate(target, date, gender) {
                const element = typeof target === "string" ? document.getElementById(target) : target;
                if (!element) return;
                const formattedDate = date;
                const label = (gender === "Femminile") ? "Iscritta il" : "Iscritto il";
                element.textContent = `${label} ${formattedDate}`;
            }
