<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Rounded Button with Solid Color</title>
    <!-- Include Bootstrap Icons CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .cool-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #6c5ce7; /* Changed to a single solid color */
            border: none;
            border-radius: 50px; /* Fully rounded pill shape */
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .cool-btn i {
            font-size: 1.1rem;
            /* Makes the icon font look bold/thicker */
            -webkit-text-stroke: 1px currentColor; 
            transition: transform 0.25s ease;
        }

        /* Hover & Active Effects */
        .cool-btn:hover {
            transform: translateY(-2px);
            background-color: #5b4cdb; /* Slightly darker shade on hover for solid buttons */
            box-shadow: 0 12px 24px rgba(108, 92, 231, 0.4);
        }

        .cool-btn:hover i {
            transform: translateX(3px); /* Subtle slide effect on the icon */
        }

        .cool-btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }
    </style>
    
</head>
<body>

    <button class="cool-btn">
        <span>Get Started</span>
        <!-- Bootstrap Right Arrow Icon -->
        <i class="bi bi-arrow-right"></i>
    </button>

</body>
</html>
